 Themen\n Themen-Triage: Systematische Liste aller relevanten Themen erstellen und\npriorisieren (was weiß ich bereits, was muss ich noch wiederholen?)\n Tipp: Wenn man etwas nicht weiß: klar und ehrlich sagen „Ich weiß es nicht“ –\nspart Zeit und hinterlässt einen professionellen Eindruck\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nWichtige Prüfungshinweise und Zusammenfassung\nAllgemeiner Hinweis: Die Prüfer waren geduldig und wohlwollend. Ehrlichkeit\nbei Wissenslücken („Ich weiß es nicht“) ist ausdrücklich empfohlen – es\nverhindert Zeitverlust und ist professionell.\nKlinische Untersuchung\n Reihenfolge: Bei Patienten mit Herzinsuffizienz/pAVK nach der\nAbdominaluntersuchung zuerst Thorax und Herzuntersuchung, nicht Kopf-Hals.\n Mundinspektion: Immer auch sublinguale Inspektion auf Malignome\n(Mundbodenkarzinom).\n Murphy-Zeichen: Schmerzhafter Atemstillstand bei Palpation im rechten\nOberbauch während tiefer Inspiration → Hinweis auf Cholezystitis.\n Erythema ab igne: Netzförmige Hautrötung durch chronische Wärmeexposition\n(Wärmflasche bei Bauchschmerzen) → klinischer Hinweis auf chronischen\nSchmerz (z. B. chronische Pankreatitis).\nSTEMI-Management\n Ziel: Door-to-Balloon < 90 min\n Notarzt: Sofortige Voranmeldung im nächsten HKL-Zentrum\n Rhythmusgefahr: Kammerflimmern durch VES (R-auf-T-Phänomen)\nPseudoaneurysma nach Herzkatheter\n Häufige Komplikation nach transfemoraler Punktion\n Goldstandard Diagnostik: Duplexsonographie\n Therapie: Thrombin-Injektion oder chirurgisch (je nach Größe)\nClostridien – Merksatz\nChirurgisch relevante Clostridien: Gasbrand – Difficile – Tetanus (G-D-T)\nNicht-chirurgisch: Botulinum\nAntidiabetika – Ozempic/Semaglutid\n Mechanismus: GLP-1-Agonist → verzögerte Magenentleerung, zentrale\nAppetithemmung\n Risiko: Aspirationsgefahr bei Narkose → präoperative Nüchternheit verlängern!\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nFall 27\nPrüfungsprotokoll – Kenntnisstandprüfung (KP)\nPrüfungsdatum: 05.05.2026 Datum der Nachricht: 10.05.2026\nAllgemeine Informationen\nDie Kenntnisstandprüfung (KP) wurde am 05.05.2026 zum ersten Mal abgelegt und\nbestanden.\nFall: Divertikulitis\nTeil 1 – Anamnese\nDie Patientin stellte sich wegen seit vorgestern bestehender, kolikartiger und dumpfer\nSchmerzen im linken Unterbauch vor.\n Die Anamnese dauerte ca. 15 Minuten und erfolgte nach dem standardisierten\nFSP-Schema.\nTeil 2 – Körperliche Untersuchung\n Die körperliche Untersuchung dauerte ebenfalls ca. 15 Minuten.\n Der Prüfer erwartete eine gezielte Untersuchung; es wurde jedoch eine\nvollständige Untersuchung einschließlich eines kurzen Neuro-Checks\ndurchgeführt.\n Hinweis: Teil 2 wurde im Vorfeld weniger intensiv geübt, weshalb die Zeit knapp\nwurde. Die verbleibenden Dokumentationspunkte wurden mit „N“ (= normal)\nabgezeichnet – dies wurde akzeptiert.\nTeil 3 – Mündliche Prüfung", "clinical_case": "**Hauptsymptom:** Fall 26\n\n**Status:** Keine Fragen verfügbar."}, "Fall_27": {"case_info": "Fall 27\nPrüfungsprotokoll – Kenntnisstandprüfung (KP)\nPrüfungsdatum: 05.05.2026 Datum der Nachricht: 10.05.2026\n\nAllgemeine Informationen\nDie Kenntnisstandprüfung (KP) wurde am 05.05.2026 zum ersten Mal abgelegt und\nbestanden.\n\nFall: Divertikulitis", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 27\n\n**Status:** Keine Fragen verfügbar."}, "Fall_28": {"case_info": "Fall 28\nKenntnisprüfung – Protokoll\nDatum der Nachricht: 06.05.2026 Datum der Prüfung: 05.05.2026, 13:15 Uhr\nErgebnis: Bestanden (zweiter Versuch) Prüfungskommission: Zwei Professoren und\neine junge Ärztin mit osteuropäischem Akzent\n\nHauptfall: Cholezystitis, Herzinsuffizienz, pAVK\nAnamnese\nDie Anamnese verlief ohne Besonderheiten.\n\nKörperliche Untersuchung\n\n\n\n\n\nDie Blutdruckmessung war nicht möglich, da die Manschette vermutlich defekt\nwar. Die Patientin gab an, dass die Messung zuvor noch funktioniert habe. Der\nPrüfer entschied, die Messung wegzulassen, da sonst die Zeit nicht ausreichen\nwürde.\nAbdominelle Untersuchung: Positives Murphy-Zeichen festgestellt.\nNach der Abdominaluntersuchung begann der Kandidat mit der Untersuchung am\nKopf. Der Prüfer korrigierte dies und wies darauf hin, dass bei einer solchen\nPatientin als nächstes Thorax- und Kardialuntersuchung durchgeführt werden\nmüssen.\n⚠️ Wichtiger Hinweis des Prüfers: Bei der Munduntersuchung muss auch\nunter der Zunge inspiziert werden, um eine mögliche Malignität (z. B.\nMundbodenkarzinom) zu erkennen!\n\n\n\nFür weitere Untersuchungen war keine Zeit mehr übrig.\n\n1. Runde – Fragen und Antworten\nVerdachtsdiagnose (VD) und Differenzialdiagnosen (DD)\nFrage: Was ist Ihre Verdachtsdiagnose? Akute Cholezystitis (positives MurphyZeichen, typische Klinik).\nFrage: Welche Differenzialdiagnosen gibt es?\n\n\n\n\n\n\nCholedocholithiasis\nAkute Pankreatitis\nPeptisches Ulkus / Ulkusperforation\nAppendizitis (atypische Lage möglich)\nHerzinfarkt (bes. Hinterwandinfarkt mit epigastrischen Schmerzen)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nPleuritis / basale Pneumonie\nNierenkolik (rechts)\nLeberpathologie (z. B. Leberabszess)\n\nFrage: Welche Differenzialdiagnosen gibt es speziell bei Frauen?\n\n\n\n\n\nExtrauteringravidität (Eileiterschwangerschaft)\nOvarialzyste / Zystenruptur / Stieldrehung\nAdnexitis / Pelvic Inflammatory Disease (PID)\nEndometriose\n\nUntersuchungen\nFrage: Welche Untersuchungen sind indiziert?\n\n\n\n\n\nLabor: BB, CRP, Leber- und Gallenenzyme (GOT, GPT, GGT, AP, Bilirubin),\nLipase, Amylase, Kreatinin, Gerinnung, Urinstatus, β-HCG (bei Frauen im\ngebärfähigen Alter)\nSonographie Abdomen (erste Wahl bei V. a. Cholezystitis)\nEKG (DD Herzinfarkt)\nGgf. CT Abdomen (bei unklarem Befund oder Komplikationsverdacht)\n\nERCP\nFrage: Was ist die ERCP? Die ERCP (Endoskopisch Retrograde\nCholangiopankreatikographie) ist ein endoskopisches Verfahren, bei dem ein Endoskop\ndurch den Mund bis zur Papilla Vateri vorgeführt wird. Über einen Katheter kann\nKontrastmittel in die Gallengänge und den Pankreasgang injiziert werden (diagnostisch),\nund gleichzeitig können therapeutische Maßnahmen durchgeführt werden (z. B.\nPapillotomie, Steinextraktion, Stenteinlage).\nFrage: Was ist eine Post-ERCP-Pankreatitis? Eine häufige Komplikation der ERCP:\nDurch mechanische oder thermische Reizung der Papille kommt es zur Entzündung des\nPankreas. Inzidenz ca. 3–5 %. Risikofaktoren: schwieriger Zugang, multiple Versuche,\njunge Frauen, sphinkter-of-Oddi-Dysfunktion. Klinisch: Anstieg der Lipase auf das ≥ 3Fache der Norm + abdominelle Schmerzen nach dem Eingriff.\n\nAkute Pankreatitis\nFrage: Was sind die Ursachen der akuten Pankreatitis?\n\n\n\n\nHäufigste Ursachen (ca. 80 %):\no Gallensteine / Choledocholithiasis (~40–50 %)\no Alkohol (~30–40 %)\nWeitere Ursachen (GETSMASHED-Eselsbrücke):\n\n\fNeue Fälle finden Sie auf dem Kanal:\no\no\no\no\no\no\no\no\no\no\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nGallensteine\nEthanol\nTrauma\nSteroids\nMumps / andere Infektionen\nAutoimmun\nSkorpionstich (Toxine)\nHyperlipidämie / Hyperkalzämie\nERCP\nDrugs (Medikamente)\n\nFrage: Welche Komplikationen gibt es bei akuter Pankreatitis?\n\n\n\n\nLokal: Pseudozysten, Abszess, Nekrose (nekrotisierende Pankreatitis), Blutung\nSystemisch: SIRS, Sepsis, Multiorganversagen (MOV), ARDS, akutes\nNierenversagen\nPleuraerguss, Peritonitis\n\nFrage: Welche klinischen Befunde gibt es?\n\n\n\n\n\n\n\nGürtelförmige Oberbauchschmerzen mit Ausstrahlung in den Rücken\nÜbelkeit, Erbrechen\nDruckschmerz Epigastrium\nFieber (bei Infektion)\nCullen-Zeichen (periumbilikale Blaufärbung) und Grey-Turner-Zeichen\n(Flankenhämatom) bei hämorrhagischer Pankreatitis\nErythema ab igne (dies war der gesuchte Begriff des Prüfers): Netzförmige,\nbräunlich-rote Hautverfärbung durch chronische Wärmeexposition (Wärmflasche).\nPatienten mit chronischen Bauchschmerzen (z. B. Pankreatitis) benutzen häufig\nWärmeflaschen zur Schmerzlinderung, schlafen dabei ein, und es kommt zu\ndieser charakteristischen Verbrennungsmarke.\n\nAntidiabetische Medikamente\nFrage: Welche antidiabetischen Medikamente werden am häufigsten eingesetzt?\n(Mit Beispielnamen, z. B. Ozempic)\nKlasse\nBiguanide\nGLP-1-Agonisten\n\nBeispiele\nMetformin (1. Wahl)\nSemaglutid (Ozempic®, Wegovy®), Liraglutid (Victoza®), Dulaglutid\n(Trulicity®)\nSGLT-2-Hemmer Empagliflozin (Jardiance®), Dapagliflozin (Forxiga®)\nDPP-4-Hemmer\nSitagliptin (Januvia®), Saxagliptin\nSulfonylharnstoffe Glibenclamid, Glimepirid\n\n\fNeue Fälle finden Sie auf dem Kanal:\nKlasse\nInsulin\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nBeispiele\nVerschiedene Präparate\n\nFrage: Wofür wird Ozempic (Semaglutid) sonst noch eingesetzt?\n\n\n\n\nGewichtsreduktion / Adipositas-Behandlung (in höherer Dosierung als Wegovy®\nzugelassen)\nKardiovaskuläre Risikoreduktion (Reduktion von MACE bei Typ-2-Diabetikern mit\nkardiovaskulären Erkrankungen)\nChronische Nierenerkrankung (neuere Daten)\n\nFrage: Wie führt Ozempic zur Gewichtsabnahme? (Verzögerte Magenentleerung)\nSemaglutid ist ein GLP-1-Rezeptoragonist. Es:\n1. Verlangsamt die Magenentleerung → längeres Sättigungsgefühl\n2. Wirkt zentral im Hypothalamus → reduziert Appetit\n3. Steigert Insulinsekretion glukoseabhängig\n4. Hemmt Glukagonsekretion\nFrage: Was ist die Gefahr der verzögerten Magenentleerung? Aspirationsgefahr –\nbesonders relevant bei:\n\n\n\nNarkose / Vollnarkose: Der Magen ist trotz präoperativer Nüchternheit\nmöglicherweise nicht leer → Aspirationsrisiko erhöht\nErbrechen mit Aspiration → Patienten unter GLP-1-Agonisten sollen präoperativ\nlängere Nüchternheitsintervalle einhalten (aktuelle Empfehlungen: ggf. Pausieren\ndes Medikaments vor elektiven Eingriffen).\n\nVitamin-B12-Mangel und Neurologie\nFrage: Was ist die neurologische Erkrankung bei B12-Mangel? Funikuläre\nMyelose (Subakute kombinierte Degeneration des Rückenmarks): Demyelinisierung der\nHinterstränge und Pyramidenbahnen → Sensibilitätsstörungen (Pallhypästhesie, Ataxie),\nspastische Paraparese, kognitive Einschränkungen.\nFrage: Welche Medikamente verursachen B12-Mangel?\n\n\n\n\nMetformin: Hemmt die intestinale Aufnahme von B12 durch Hemmung des\nKalziumabhängigen Intrinsic-Faktor-B12-Komplexes\nPPI (Protonenpumpeninhibitoren): Reduzieren Magensäure → gestörte B12Freisetzung aus der Nahrung → verminderte Absorption\nWeitere: H2-Blocker, Colchicin, Cholestyramin, bestimmte Antibiotika (Neomycin)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n2. Runde – EKG und Kardiologie\nEKG mit Vorderwandinfarkt\nFrage: Was zeigt das EKG bei Vorderwandinfarkt?\n\n\n\n\n\nST-Hebungen in V1–V4 (ggf. bis V5/V6)\nEvtl. reciproke ST-Senkungen (II, III, aVF)\nSpäter: Q-Zacken (Pardee-Q), T-Negativierungen\nBetroffenes Gefäß: RIVA (LAD – Left Anterior Descending Artery)\n\nBehandlung von STEMI, ACS, NSTEMI\nFrage: Was ist der Unterschied zwischen STEMI und NSTEMI?\nMerkmal\nEKG\n\nSTEMI\nST-Hebung ≥ 1 mm in ≥ 2\nAbleitungen\nTroponin\nErhöht\nPathophysiologie Kompletter\nKoronarverschluss\nTherapiestrategie Sofortige Reperfusion\n(PCI)\nZeitfenster PCI\n„Door-to-balloon“ ≤ 90 min\n\nNSTEMI\nKeine persistente ST-Hebung (STSenkung, T-Neg. oder normal)\nErhöht\nPartieller Verschluss / Mikroembolien\nRisikostratefizierung, ggf. frühe\ninvasive Strategie\nInnerhalb 24–72 h je nach Risiko\n\nFrage: Was ist eine Thrombose, was ist eine Embolie?\n\n\n\nThrombose: Intravasale Blutgerinnung in situ – Gerinnsel entsteht an Ort und\nStelle (z. B. in einem Koronargefäß durch Plaqueruptur).\nEmbolie: Verschleppung eines Gerinnsels (oder anderer Partikel) durch den\nBlutstrom von einem anderen Ort, mit Verlegung eines Gefäßes (z. B.\nLungenembolie durch tiefe Beinvenenthrombose).\n\nMedikamentöse Therapie des ACS\nFrage: Warum Beta-Blocker?\n\n\n\n\n\nReduzieren Herzfrequenz → verlängern Diastole → verbessern Koronarperfusion\nSenken myokardialen Sauerstoffbedarf\nAntiarrhythmisch\nReduzieren Infarktgröße und Mortalität\n\nFrage: Warum Morphin?\n\n\nPotente Analgesie → Schmerzreduktion → Senkung der Sympathikusaktivierung\n→ RR- und HF-Senkung → Reduktion des myokardialen O₂ -Bedarfs\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nVenodilation → Vorlastsenkung → Herzentlastung\nAnxiolyse\n\nFrage: Warum werden keine anderen starken Opioide statt Morphin verwendet?\nMorphin hat spezifische kardioprotektive Zusatzwirkungen: Direkte Vasodilatation\n(venös und arteriell), Vorlastsenkung und günstige hämodynamische Effekte auf das\nischämische Herz. Andere Opioide (z. B. Fentanyl, Pethidin) haben dieses Profil nicht in\ngleicher Weise. Zudem ist Morphin beim ACS seit Jahrzehnten etabliert und gut\nuntersucht. (Anmerkung: Neuere Studien zeigen jedoch, dass Morphin die Absorption\nvon P2Y12-Hemmern verlangsamen kann – dies ist eine aktuelle Diskussion in der\nKardiologie.)\nFrage: Was muss der Notarzt tun, wenn er das EKG mit STEMI gesehen hat?\n\n\n\n\n\nSofortige Voranmeldung im nächsten Herzkatheterlabor (PCI-Zentrum)\nTransport dorthin innerhalb von maximal 60–90 Minuten (First-Medical-Contactto-balloon ≤ 90 min)\nParallel: Aspirin 250–500 mg i.v., P2Y12-Hemmer (z. B. Ticagrelor 180 mg),\nHeparin i.v., Sauerstoff nur bei SpO₂ < 90 %, i.v.-Zugang, EKG-Monitoring,\nSchmerztherapie (Morphin i.v. titriert)\nFalls PCI nicht innerhalb von 120 min erreichbar: Thrombolyse erwägen\n\nFrage: Was sind die lebensbedrohlichen Herzrhythmusstörungen bei\nMyokardinfarkt?\n\n\n\n\n\n\nKammerflimmern (VF) – häufigste Todesursache in der Frühphase\nVentrikuläre Tachykardie (VT)\nAV-Block III° (bes. bei Hinterwandinfarkt)\nAsystolie\nElektromechanische Entkopplung (PEA)\n\nFrage: Wie kommt es zu diesen Rhythmusstörungen? Durch ventrikuläre\nExtrasystolen (VES) – ischämisches Myokard hat ein verändert elektrisches Potenzial\n→ Reentry-Mechanismen → Triggern von Kammertachykardien / Kammerflimmern. Das\nischämische Gewebe hat eine heterogene Refraktärzeit → elektrische Instabilität.\n\nÄrztekammer und Kassenärztliche Vereinigung\nFrage: Was macht die Ärztekammer? Die Ärztekammer ist eine Körperschaft des\nöffentlichen Rechts und die berufsständische Selbstverwaltung der Ärzte. Aufgaben:\n\n\n\n\n\n\nBerufsaufsicht und Wahrung der ärztlichen Berufsethik (Berufsordnung)\nWeiterbildungsordnung und Anerkennung von Facharzttiteln\nAusstellung der Approbation (in Zusammenarbeit mit Behörden)\nFort- und Weiterbildungspflicht überwachen\nSchlichtungsstellen bei Behandlungsfehlern\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nInteressenvertretung der Ärzteschaft\n\nFrage: Was ist die Kassenärztliche Vereinigung (KV)? Die Kassenärztliche\nVereinigung ist ebenfalls eine Körperschaft des öffentlichen Rechts. Sie organisiert die\nvertragsärztliche Versorgung (GKV-Patienten) im ambulanten Bereich. Aufgaben:\n\n\n\n\n\n\nSicherstellung der ambulanten ärztlichen Versorgung für gesetzlich\nKrankenversicherte\nHonorarabrechnung zwischen niedergelassenen Ärzten und Krankenkassen\nZulassung zur vertragsärztlichen Tätigkeit (Kassenzulassung)\nQualitätssicherung im ambulanten Bereich\nMerke: Alle niedergelassenen Ärzte mit Kassenzulassung sind Pflichtmitglieder\nder KV.\n\n3. Runde – Chirurgie und Infektiologie\nFall: 77-jährige Patientin mit Leistensch wellung nach Koronarangiographie\nKlinik: 77-jährige Patientin, seit 2 Wochen nach einer Koronarangiographie (Coro)\nbestehende Schwellung in der Leiste.\nFrage: Was machen Sie (erste Schritte)? Erweiterte Anamnese:\n\n\n\n\n\nWann genau begann die Schwellung? Schmerzen? Pulsierend?\nWelcher Zugang bei der Coro? (A. femoralis → Punktionsstelle)\nAntikoagulation? Gerinnungsstörungen?\nGrößenzunahme? Dann: körperliche Untersuchung (Palpation: pulsierend?\nSchwirren? Strömungsgeräusch bei Auskultation?)\n\nDiagnose: Aneurysma spurium (Pseudoaneurysma)\nDefinition: Kein echtes Aneurysma (keine echte Gefäßwandausdehnung), sondern ein\nparavasales Hämatom mit persistierender Verbindung zum Gefäßlumen durch einen\nKanal (Hals). Häufige Komplikation nach arterieller Punktion (A. femoralis bei\nHerzkatheter).\nFrage: Welche Diagnostik?\n\n\n\nDuplex-Sonographie (Farbdoppler) – Methode der Wahl: zeigt Blutfluss im\nPseudoaneurysma, typisches „Yin-Yang-Zeichen“, Hals zur Arterie\nGgf. CT-Angiographie bei unklarem Befund oder präoperativ\n\nFrage: Wie wird behandelt?\n\n\n\nKonservativ (kleine Pseudoaneurysmen < 2 cm): Spontanverschluss möglich,\nggf. Kompression unter Ultraschallkontrolle\nUltraschallgesteuerte Kompressionstherapie: Manuelle oder mechanische\nKompression des Halses bis zum Verschluss\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nUltraschallgesteuerte Thrombininjektion: Injektion von Thrombin in den\nPseudoaneurysmasack → Thrombosierung (Methode der Wahl bei geeigneter\nMorphologie)\nChirurgisch: Bei Versagen der konservativen Therapie, Größenzunahme,\nRuptur, Ischämiezeichen oder Infektion\n\nFrage: Was sind die Differenzialdiagnosen der Leistenschwellung?\n\n\n\n\n\n\n\n\n\nHämatom (ohne Verbindung zum Gefäß)\nLeistenhernie (inguinal oder femoral)\nLymphknoten-Schwellung (reaktiv, Lymphom)\nLipom\nAV-Fistel (nach Punktion)\nAbszess / Infektion\nVarizen (Saphena-magna-Insuffizienz)\nFemurhernie\n\nFrage: Was sind die anatomischen Unterschiede zwischen Venen und Arterien?\nMerkmal\nArterien\nWandaufbau Dicker, 3 Schichten (Intima, Media,\nAdventitia), starke Muskelschicht\nDruck\nHochdrucksystem\nKlappen\nKeine (Ausnahme: Aortenklappen,\nPulmonalklappen)\nBlutfluss\nPulsatil, vom Herz weg\nLumen\n\nRund, engeres Lumen\n\nLage\nBlutfarbe\n\nTiefer, geschützt\nSauerstoffreich (rot)\n\nVenen\nDünner, weniger Muskulatur\nNiederdrucksystem\nTaschenklappen (verhindern\nRückfluss)\nKontinuier
