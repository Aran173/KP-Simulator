<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Simulator - Prüfungskommission</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-primary); 
            line-height: 1.6; 
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            border-bottom: 3px solid var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            display: block;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .progress-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--border);
            border-color: var(--primary);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-success { background: var(--success); border-color: var(--success); }
        .btn-warning { background: var(--warning); border-color: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); border-color: var(--danger); }

        .export-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-section h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* LAYOUT PRINCIPAL: DOS COLUMNAS */
        .case-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* COLUMNA IZQUIERDA: CASO */
        .case-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .case-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid var(--primary);
        }

        .case-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .case-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            border-left: 3px solid var(--primary);
        }

        .section-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .section-content {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.8;
        }

        /* COLUMNA DERECHA: PREGUNTAS */
        .questions-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .questions-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid var(--success);
        }

        .questions-section h3 {
            color: var(--success);
            margin-bottom: 20px;
            font-size: 16px;
        }

        .question-block {
            margin-bottom: 20px;
        }

        .question-text {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 70px;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .rating-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .rating-section.show {
            display: block;
        }

        .rating-title {
            font-weight: bold;
            color: var(--success);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .rating-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .rating-buttons .btn {
            flex: 1;
            min-width: 120px;
        }

        #feedback {
            display: none;
            grid-column: 1 / -1;
            margin-top: 20px;
        }

        #feedback.show {
            display: block;
        }

        .feedback-header {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .feedback-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feedback-q-text {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .solution-answer {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 10px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 4px;
            border-left: 3px solid var(--success);
            margin-top: 10px;
        }

        @media (max-width: 1024px) {
            .case-layout {
                grid-template-columns: 1fr;
            }
            
            textarea {
                min-height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🏥 KP Simulator</h1>
                <p>Prüfungskommission - Medical Exam Practice</p>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">Erledigt</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="totalCount">49</span>
                    <span class="stat-label">Gesamt</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="progressPct">0%</span>
                    <span class="stat-label">Fortschritt</span>
                </div>
            </div>
        </div>

        <div class="progress-container">
            <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Gesamtfortschritt</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="export-section">
            <h3>📊 Fortschritt verwalten</h3>
            <div class="export-buttons">
                <button class="btn btn-primary" onclick="exportProgress()">📥 Fortschritt exportieren</button>
                <button class="btn btn-primary" onclick="importProgress()">📤 Fortschritt importieren</button>
                <button class="btn btn-warning" onclick="resetProgress()">🔄 Alles zurücksetzen</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: var(--primary); margin-bottom: 15px;">Modus wählen:</h3>
            <div class="mode-selector">
                <button class="btn btn-primary active" onclick="switchMode('single')">Einzelfall</button>
                <button class="btn" onclick="switchMode('practice')">Trainingssession</button>
                <button class="btn" onclick="switchMode('failed')">Nur Fehlgeschlagen</button>
                <button class="btn" onclick="switchMode('all')">Alle durchgehen</button>
            </div>
        </div>

        <div id="caseContainer"></div>
        <div id="feedback"></div>
    </div>

    <script>
        const allCases = [{"id": 1, "caseName": "68-j\u00e4hriger mit progressiver Dyspnoe", "fachbereich": "Kardiologie", "anamnese": "68-j\u00e4hriger m\u00e4nnlicher Patient mit progressiver Dyspnoe \u00fcber eine Woche. N\u00e4chtliche Atemnot (Orthopnoe) mit mehrfachem Aufwachen. Gewichtszunahme von 3 kg in einer Woche. Bekannte Hypertonie (15 Jahre, schlecht kontrolliert, SBP oft >160). Diabetes Typ 2 seit 8 Jahren (schlecht kontrolliert). Schlafapnoe unbehandelt. CKD Stadium 3. Medikamente: irregul\u00e4r Lisinopril. Leugnet Brustschmerz, Palpitationen oder orthostatische Symptome.", "koerperlich": "Wirkt angespannt, dyspnoisch. Blutdruck 170/95 mmHg bilateral symmetrisch. Herzaktion: tachykard, unregelm\u00e4\u00dfiger Rhythmus (Vorhofflimmern erkannt). Bilaterale basil\u00e4re Rasselger\u00e4usche. Prominente Halsvenenstaung (bis Kiefer). Hepatomegalie 5 cm unter Rippenbogen palpabel. Periphere \u00d6deme beidseits Kn\u00f6chel und Unterschenkel (+++/4+), rechts ausgepr\u00e4gter.", "vitale": "RR 170/95 mmHg, HF 112/min (Tachykardie), AF 24/min (Tachypnoe), SpO2 88% an Raumluft (KRITISCH!), T 36,8\u00b0C", "labor": "BNP 850 pg/mL (massiv erh\u00f6ht), Troponin I 0,08 ng/mL (grenzwertig), Kreatinin 1,5 mg/dL (erh\u00f6ht), BUN 62 mg/dL (erh\u00f6ht), K+ 4,8 mEq/L, Na+ 137 mEq/L, Glukose 185 mg/dL", "bildgebung": "EKG: Vorhofflimmern mit RVR ~110/min, ST-Senkung V2-V4. R\u00f6ntgen Thorax: Kardiomegalie (CTR >0,5), bilateral Kerley-B-Linien, diffuse alveol\u00e4re Infiltrate", "q": ["Prim\u00e4rdiagnose und Differenzialdiagnosen?", "Rolle des Vorhofflimmerns in der Pathophysiologie?", "Sofortma\u00dfnahmen erste 2 Stunden (detailliert)?", "Interpretation der Troponinerh\u00f6hung?"], "answers": ["Akute dekompenzierte HI mit HFrEF. Klassisch: Dyspnoe, Orthopnoe, periphere \u00d6deme, Rasselger\u00e4usche, Hepatomegalie, BNP >400. DD: NSTEMI, Myokarditis, PE", "VHF mit RVR reduziert Cardiac Output durch Verlust atrialen Beitrags und verk\u00fcrzte diastolische F\u00fcllung. Management: Frequenzkontrolle, Antikoagulation nach CHA2DS2-VASc", "1) O2 via CPAP wenn SpO2 <90%; 2) IV-Zugang; 3) IV-Furosemid 40-80 mg; 4) IV-Nitrate; 5) Beta-Blocker; 6) Serielles Troponin; 7) Echokardiographie", "Troponinerh\u00f6hung: Typ-2-Infarkt durch erh\u00f6hten O2-Verbrauch, Myokardnekrose von Overstretching, oder echte thrombotische KHK. Serielles Troponin essentiell"]}, {"id": 2, "caseName": "55-j\u00e4hriger Raucher mit akutem Brustschmerz", "fachbereich": "Kardiologie", "anamnese": "55-j\u00e4hriger m\u00e4nnlicher aktiver Raucher (40 Pack-Jahre). Akuter oppressiver Brustschmerz vor 40 Minuten. Zentraler Lokalisation, konstant, Intensit\u00e4t 9/10. Profuse Diaphorese, \u00dcbelkeit, extreme Angst. Keine vorbekannte KHK. Familiengeschichte: Vater MI im Alter 58. Alkoholkonsum: 20 Units/Woche. Keine regelm\u00e4\u00dfigen Medikamente.", "koerperlich": "\u00c4ngstlich, in Distress, profuse Diaphorese. Kalte, klamme Extremit\u00e4ten. Herzaktion: regelm\u00e4\u00dfig, HF 98/min. Normale Herzklappent\u00f6ne, kein Murmur. Lungenfelder klar bilateral, keine Rasselger\u00e4usche. Abdomen weich.", "vitale": "RR 128/78 mmHg, HF 98/min, AF 18/min, SpO2 97% an Raumluft, T 37,1\u00b0C", "labor": "Troponin I 0,02 ng/mL (grenzwertig), CK-MB 8,5 ng/mL, Myoglobin 120 \u03bcg/L (signifikant erh\u00f6ht), D-Dimer 0,4 \u03bcg/mL (normal)", "bildgebung": "EKG: ST-Hebung 2-3 mm in II, III, aVF (inferior STEMI!), reziproke ST-Senkung in I, aVL, Q-Zacken in III", "q": ["Infarkttyp und Koronararterien-Lokalisation?", "Komplikationen des inferioren STEMI?", "Reperfusions-Management und Timing?", "Warum sind Nitrate kontraindiziert?"], "answers": ["Inferiorer STEMI mit transmuralem Ausma\u00df. RCA-Okklusion (90%) oder LCx (10%)", "AV-Block (2./3. Grad), Kardiogener Schock, Kammerflimmern, Sinusknotendysfunktion, RV-STEMI", "Prim\u00e4re PCI <90 min. Dual antiplatelet (Aspirin 600mg + P2Y12i 600mg), UFH 60-70 IU/kg", "KONTRAINDIZIERT bei RV-Infarkt! RV preload-abh\u00e4ngig. Nitrate reduzieren Preload \u2192 kardiogener Schock. Zeichen: ST-Hebung V4R"]}, {"id": 3, "caseName": "71-j\u00e4hrige mit Palpitationen und Dyspnoe", "fachbereich": "Kardiologie", "anamnese": "71-j\u00e4hrige weibliche Patientin mit akutem Beginn Palpitationen und Dyspnoe vor 2 Stunden. Herzrasen mit irregul\u00e4ren Flatterwellen. Bekannte Hypertonie seit 20 Jahren (Amlodipine 5 mg t\u00e4glich). ERSTE Episode von Palpitationen. Leugnet Brustschmerz, Synkope. Leugnet Infekte, Fieber. KEINE Hyperthyreoidismus-Symptome. Kaffeekonsum 3-4 Tassen t\u00e4glich.", "koerperlich": "Besorgt aber nicht in extremem Distress. Herzauskultation: schnelle, v\u00f6llig unregelm\u00e4\u00dfige Herzfrequenz (klassisch f\u00fcr VHF). Kein Murmur, kein Reibungsger\u00e4usch. Halsvenenstaung nicht prominent. Lungenfelder klar, keine Rasselger\u00e4usche. Normale Hautperfusion, keine \u00d6deme.", "vitale": "RR 145/88 mmHg, HF 135/min v\u00f6llig unregelm\u00e4\u00dfig (RVR), AF 18/min, SpO2 95%, T 37,3\u00b0C", "labor": "Troponin I: normal, BNP 180 pg/mL (grenzwertig), TSH: normal, Elektrolyte normal, H\u00e4moglobin normal", "bildgebung": "EKG: Absolut unregelm\u00e4\u00dfiger Rhythmus, keine P-Wellen. Fibrillationswellen ~300-400/min. Ventrikul\u00e4re Antwort ~135/min. Keine ST-Ver\u00e4nderungen, keine T-Abnormit\u00e4ten", "q": ["VHF mit RVR: Definition und Gef\u00e4hrdungspotenzial?", "CHA2DS2-VASc-Score berechnen und Antikoagulation indizieren?", "Frequenzkontrolle vs. Rhythmuskontrolle?", "Medikament\u00f6se Optionen mit Dosierungen?"], "answers": ["VHF mit RVR: Chaotisches Flimmern (300-400/min atrial), AV-Knoten leitet viele weiter (>135/min ventrikul\u00e4r). Gef\u00e4hrdung moderat: h\u00e4modynamisch stabil, aber Risiko Isch\u00e4mie, Thromboembolie, Tachykardie-induzierte Kardiomyopathie", "Score: H=1, A(65-74)=1, S=1 = Score 3-4. Bei Frauen \u22653: ANTIKOAGULATION INDIZIERT!", "INITIAL Frequenzkontrolle (einfacher, schneller, Prognose gleich wie Rhythmuskontrolle). Nur wenn h\u00e4modynamisch instabil: elektrische Kardioversion", "Beta-Blocker: Metoprolol 25-100mg 3x t\u00e4glich oder IV 2,5-5mg. Diltiazem 120-360mg t\u00e4glich oder 0,25mg/kg IV. Verapamil 120-480mg t\u00e4glich. Amiodaron 600mg IV \u00fcber 20min"]}, {"id": 4, "caseName": "62-j\u00e4hrige mit Unterbauchschmerz", "fachbereich": "Chirurgie", "anamnese": "62-j\u00e4hrige weibliche Patientin mit 2-Tage-Schmerz im linken Unterbauch (LUQ). Schmerz progressiv \u00fcber Tage, heute Fieber. REZIDIVIERENDE Episoden: 2x in letzten 3 Jahren, beide spontan resolviert. Leugnet Blut im Stuhl, Tenesmus. Leichte Stuhlver\u00e4nderung (etwas Verstopfung). Leugnet Vaginalblutung, Urinsymptome. Ern\u00e4hrung: chronisch niedrig in Ballaststoffen.", "koerperlich": "Mild unwohl aber NICHT in extremem Distress (gutes Zeichen). Abwehrspannung und Resistenz LOKALISIERT zu LUQ, besonders Sigmoid. Losla\u00dfschmerz deutlich positiv in LUQ. McBurney-Punkt-Schmerz NEGATIV. Darmger\u00e4usche pr\u00e4sent und normal. Rektale Untersuchung: keine Massen, m\u00e4\u00dfige Schmerzen am linken Rektum.", "vitale": "RR 128/76 mmHg, HF 88/min (normal), AF 16/min, SpO2 98%, T 37,8\u00b0C (leichtes Fieber)", "labor": "Leukozyten 14.200/\u03bcL (moderat erh\u00f6ht), CRP 8,5 mg/dL (erh\u00f6ht), Kreatinin 0,9 mg/dL (normal), H\u00e4moglobin 13,1 g/dL (normal)", "bildgebung": "CT-Abdomen: Entz\u00fcndetes Divertikel in Sigmoid-Region. Lokalisierte Entz\u00fcndung (Fett-Stranding). KEINE freie Luft. Kein Abscess. Minimale peritonale Fl\u00fcssigkeit", "q": ["Hinchey-Klassifikation und CT-Interpretation?", "Konservative vs. operative Behandlung: Argumente?", "Detaillierter therapeutischer Plan?", "Elektive Sigmaresektion nach Heilung?"], "answers": ["Hinchey Grad I: kleine lokalisierte Entz\u00fcndung OHNE Perforation, Abscess oder generalisierte Peritonitis. CT: lokales Divertikel, Fett-Stranding, KEINE freie Luft, KEIN Abscess", "F\u00dcR konservativ: Grad I klein, 70-80% heilen spontan, Patient stabil, keine Peritonitis generalisiert. GEGEN: 3. Episode = h\u00f6heres Rezidiv-Risiko (aber spricht f\u00fcr Resektion sp\u00e4ter, nicht sofortige OP)", "Antibiotika: IV Ceftriaxon 2g/d + Metronidazol 1,5g/d f\u00fcr 7-10 Tage, dann oral 10-14 Tage. NPO 24-48h, dann Low-Residue-Di\u00e4t. T\u00e4gliche \u00dcberwachung. Escalation: Peritonitis, persistentes Fieber, Schmerz-Verschlechterung", "Elektive Sigmaresektion nach 4-6 Wochen EMPFOHLEN (3. Episode = recurrent). Rezidiv-Risiko steigt nach jedem Ereignis. Timing: nach Entz\u00fcndungs-Abbau"]}, {"id": 5, "caseName": "68-j\u00e4hriger mit akutem epigastrischem Schmerz", "fachbereich": "Chirurgie", "anamnese": "68-j\u00e4hriger m\u00e4nnlicher Patient mit CHRONISCHER NSAR-Einnahme (Ibuprofen 400-600mg t\u00e4glich seit 15 Jahren f\u00fcr Arthritis) stellt sich mit MASSIVEM akutem epigastrischem Schmerz vor, begonnen vor 2 Stunden pl\u00f6tzlich. Schmerz diffus \u00fcber ganzen Bauch, sehr stark (10/10). Intensiver Schwei\u00df, schneller Herzschlag, \u00dcbelkeit, Bl\u00e4sse. Lange Geschichte von Dyspepsie, niemals PPI-Therapie.", "koerperlich": "Sehr krank aussehend, blass, diaphoretisch, in extremem Distress. Bauch SEHR angespannt ('Bretbauch'), v\u00f6llig konsistent mit Peritonitis. Abwehrspannung und Resistenz \u00fcberall, nicht lokalisiert. Losla\u00dfschmerz massiv. Darmger\u00e4usche abwesend oder sehr schwach.", "vitale": "RR 102/62 mmHg (HYPOTENSION!), HF 126/min (massive Tachykardie), AF 24/min (Tachypnoe), SpO2 94%, T 38,2\u00b0C (Fieber)", "labor": "Leukozyten 16.800/\u03bcL (massive Erh\u00f6hung), Laktat 2,8 mmol/L (ERH\u00d6HT), Kreatinin 1,4 mg/dL (leicht erh\u00f6ht), Amylase 200 U/L (erh\u00f6ht)", "bildgebung": "R\u00f6ntgen Thorax: FREIE LUFT unter Zwerchfell (PATHOGNOMISCH!). CT-Abdomen: Perforation Vorderwand Magen (~1-1,5cm), Pneumoperitoneum, Peritonealfl\u00fcssigkeit (dunkel)", "q": ["Diagnose aus klassischen Zeichen begr\u00fcnden. Pathophysiologie?", "Notwendigkeit und Dringlichkeit der OP? Risiken von Verz\u00f6gerung?", "Primary Repair vs. Gastrektomie: Indikationen?", "Intra- und postoperative Komplikationen?"], "answers": ["Perforiertes Magengeschw\u00fcr - NOTFALL! Diagnose: pl\u00f6tzlicher massiver Schmerz bei NSAR-Patient, Bretbauch, generalisierte Peritonitis, Schock-Zeichen, FREIE LUFT unter Zwerchfell (pathognomisch!), CT-Best\u00e4tigung. Pathophysiologie: chronisches NSAR \u2192 Ulkus \u2192 schwere Mahlzeit \u2192 Perforation \u2192 Peritonitis \u2192 Schock", "NOTFALL-OP SOFORT! Jede Minute erh\u00f6ht Mortalit\u00e4t. Verz\u00f6gerung: schwere Peritonitis, Sepsis, SIRS, kardiogener Schock, MODS, DIC, Tod wahrscheinlich >24h. Mortalit\u00e4t ~10% mit OP, 40-50% wenn >24h verz\u00f6gert", "PRIMARY REPAIR (Vierschichtnaht + Omentoplastie) ist BEVORZUGT in meisten F\u00e4llen. GASTREKTOMIE nur wenn: Malignit\u00e4t-Verdacht, riesiges Ulkus, Multiple Perforationen, vorherige Reparatur fehlgeschlagen, Zollinger-Ellison Syndrom. Diese Patientin: guter Kandidat f\u00fcr Primary Repair", "Intraoperativ: Peritonealverschmutzung, Blutung, \u00f6demat\u00f6ses Gewebe. Postoperativ: Sepsis ~40-60%, Naht-Insuffizienz ~5-10%, Pankreatitis, paralytischer Ileus, GI-Blutung, ARF, Gastric Outlet Obstruction sp\u00e4ter. Mit OP \u00fcberleben die meisten, aber Morbidit\u00e4t ~30-40%"]}, {"id": 6, "caseName": "22-j\u00e4hriger mit pl\u00f6tzlichem Thoraxschmerz", "fachbereich": "Pneumologie", "anamnese": "22-j\u00e4hriger asthenic habitus m\u00e4nnlicher Patient, sonst gesund, stellt sich mit pl\u00f6tzlichem linksseitigen Thoraxschmerz und Dyspnoe vor. Symptome begannen w\u00e4hrend Sitzen. Schmerz ist pleuritisch (wird schlimmer mit Atemzug). Patient jung, gesund, KEINE Trauma, KEINE Fieber, KEINE Husten. ERSTE Episode von Pneumothorax. Risikofaktoren: asthenic K\u00f6rperbau, Rauchen: NEIN.", "koerperlich": "Nerv\u00f6s/\u00e4ngstlich aber NICHT in extremem Distress (GUTES Zeichen). Thorax-Inspektion: reduzierte Atembewegungen links. Palpation: Thorax-Bewegung links reduziert. Percussion: HYPERSONORANT auf linker Seite (klassisch). Auskultation: Atemger\u00e4usche abwesend oder vermindert unten links. Herzt\u00f6ne normal, KEIN Mediastinal-Shift. Abdomen und Neuro: unauff\u00e4llig.", "vitale": "RR 128/75 mmHg, HF 105/min (Tachykardie von Angst), AF 24/min (Tachypnoe), SpO2 94%, T 37,0\u00b0C", "labor": "Blutgasanalyse: pO2 85 mmHg (leicht niedrig aber akzeptabel), pCO2 35 mmHg (normal), pH 7,41 (normal), Elektrolyte normal", "bildgebung": "R\u00f6ntgen Thorax: Viscerale Pleura-Linie deutlich sichtbar. Kollabiertes Lung ~30-40% (kleine PSX). KEIN Mediastinal-Shift. Keine Pleuraerguss, Pneumomediastinum, oder subcutaneous Emphysem", "q": ["Klassifizierung: Gr\u00f6\u00dfe und Typ des Pneumothorax?", "Konservativ vs. interventionell: Entscheidungskriterien?", "Technische Details der Drainage falls notwendig?", "Entlassungskriterien und Nachbeobachtung?"], "answers": ["Kleine prim\u00e4r-spontane PSX (<2cm oder <20% kollabiert). Klassifikationen: GR\u00d6SSE (klein <2cm vs. gro\u00df \u22652cm), TYP (prim\u00e4r = keine vorbekannte Lungenerkrankung)", "Konservativ ERSTE WAHL f\u00fcr diesen Patienten: kleine PSX (<2cm), leichte Symptome, h\u00e4modynamisch stabil, gute Allgemeinverfassung. Beobachtung/Monitoring mit t\u00e4glich CXR. Sauerstoff kann Reabsorption beschleunigen", "Small-bore catheter 16-20 French. Platzierung: 2.-4. Interkostal, mid-axillary Linie. Angeschlossen zu Wasserseal-Drainage (1-2 Liter mit ~2cm H2O Seal). Dauer: 3-7 Tage bis Reexpansion. Komplikationen: Reexpansion-Lungen\u00f6dem, H\u00e4mathorax, Infektion", "Entlassung: Lungenreexpansion auf CXR (\u226585-90%), keine Dyspnoe in Ruhe, klinisch stabil. CXR bei 48-72h, dann 2-4 Wochen, dann 3 Monate. Patient warnen: pl\u00f6tzliche Dyspnoe = sofort ED. Rezidiv-Risiko ~25% nach 1. PSX, bis 50% nach 2."]}, {"id": 7, "caseName": "74-j\u00e4hriger mit Sprach- und Mobilit\u00e4tsst\u00f6rung", "fachbereich": "Neurologie", "anamnese": "74-j\u00e4hriger m\u00e4nnlicher Patient erwacht mit rechtsseitiger Armparese und Sprachst\u00f6rung vor ~90 Minuten. ALERT f\u00fcr Zeit (90 min = NOCH IM 4,5-STUNDEN-FENSTER!). Lange Geschichte: Hypertonie seit 40 Jahren (schlecht kontrolliert). Bekannt VHF seit 5 Jahren (NICHT antikoaguliert - Patient lehnte ab). Fr\u00fchere TIA vor 2 Jahren. Raucht NICHT. Medikamente: nur Amlodipine (unzureichend).", "koerperlich": "Alert aber Expressiv-Aphasie vorhanden. NIHSS = 8 (moderat). Fazialis-Parese rechts (mild), Arm-Kraft rechts 4/5, Bein-Kraft rechts 5/5 (normal). Keine Ataxie. Keine visuellen Feldefekte. Sprachverst\u00e4ndnis OK.", "vitale": "RR 162/92 mmHg (erh\u00f6ht), HF 88/min (unregelm\u00e4\u00dfig - VHF), AF 18/min, SpO2 96%, T 37,0\u00b0C", "labor": "Glucose 145 mg/dL (leicht erh\u00f6ht), INR 0,9 (NICHT antikoaguliert - WICHTIG!), Thrombozyten 220.000/\u03bcL, PT/aPTT normal", "bildgebung": "CT Sch\u00e4del: KEINE akute Blutung! Diffusion-MRT: neue isch\u00e4mische L\u00e4sion in rechter MCA-Versorgung", "q": ["rtPA-Eignung: Zeitfenster und Kontraindikationen?", "TOAST-Klassifikation dieses Schlaganfalls?", "Sofort- und Langzeitmanagement detailliert?", "Blutdruck-Management mit rtPA?"], "answers": ["Ja, im Zeitfenster: 90 min <4,5 Stunden. KEINE absoluten Kontraindikationen: CT KEINE Blutung, INR 0,9 (nicht antikoaguliert), normale Thrombozyten, keine aktive Blutung. rtPA INDIZIERT", "CARDIOEMBOLIC (wahrscheinlich). Grund: VHF seit 5 Jahren, NICHT antikoaguliert, MCA-Verteilung (nicht lacunar), gr\u00f6\u00dfere Symptome. DD: Large Vessel Thrombosis", "rtPA 0,9 mg/kg IV (Patient ~75kg = ~72mg). 10% bolus 1 min, Rest 60 min. Neuro-Monitoring q30min. Repeat CT 24h. Antikoagulation nach 24h: DOAC bevorzugt. Statine hochdosiert, Rehabilitation sofort", "rtPA erfordert aggressivere BP-Kontrolle. Ziel: SBP <180, DBP <110. Diese Patientin SBP 162 = OK. Vorsicht mit \u00dcberkorrektion nach rtPA (aggressive Senkung kann Isch\u00e4mie vergr\u00f6\u00dfern)"]}, {"id": 8, "caseName": "71-j\u00e4hrige mit Verwirrtheit und Schock", "fachbereich": "Notfall/Internisten", "anamnese": "71-j\u00e4hrige weibliche Patientin mit rezidivierender Harnwegsinfektionen stellt sich vor: pl\u00f6tzliche Verwirrtheit, Sch\u00fcttelfrost, Schock-Symptome. Am Vortag: einfache Urin-Symptome (Dysurie, Pollakisurie), schnell schlimmer. Heute: HEFTIGE Verwirrtheit, Sch\u00fcttelfrost, Patient sehr KALT aber T 39,8\u00b0C (klassische Sepsis). Bekannt: Diabetes (wahrscheinlich Typ 2), CKD Stadium 3. Kein neue Medikament. Penicillin-Allergie (Urtikaria).", "koerperlich": "Verwirrt, somnolent, Haut sehr marmoliert und livid. Extremit\u00e4ten: sehr kalt und cyanotisch. Kapillar-Refill >2 sec. CVA-Klopfschmerz POSITIV beidseits (Pyelonephritis!). Abdomen: weich, keine Peritonitis, aber Schmerz Nieren-Klopfung.", "vitale": "RR 92/56 mmHg (KRITISCH hypotensiv!), HF 118/min (Tachykardie), AF 22/min (Tachypnoe), SpO2 94%, T 39,8\u00b0C", "labor": "Leukozyten 18.500/\u03bcL, Thrombozyten 95.000/\u03bcL (NIEDRIG = DIC-Signal), Kreatinin 2,1 mg/dL (STARK erh\u00f6ht), Bilirubin 2,2 mg/dL (erh\u00f6ht), PT 16 sec (erh\u00f6ht), aPTT 42 sec (erh\u00f6ht), Laktat 3,2 mmol/L (erh\u00f6ht)", "bildgebung": "R\u00f6ntgen Thorax: Bilaterale Infiltrate. Sonographie Abdomen: Bilaterale Hydronephrose (KRITISCH!)", "q": ["Sepsis/schwerer Sepsis/septischer Schock: Definitionen nach Sepsis-3?", "Infektionsquelle und urologische Implikationen der Hydronephrose?", "6-Stunden-Bundle: Priorit\u00e4t, Abfolge, spezifische Interventionen?", "Vasopressoren, Fl\u00fcssigkeitsmanagement, Urology-Intervention: wann und wie dringend?"], "answers": ["Sepsis: vermutete/bewiesene Infektion + SIRS (T >38 oder <36, HF >90, AF >20, Leukozyten >12.000 oder <4.000). Diese Patientin erf\u00fcllt ALLE + Organversagen = septischer Schock (Hypotension + Laktat erh\u00f6ht trotz Fl\u00fcssigkeit)", "Wahrscheinliche Quelle: UROSEPSIS von rezidivierender HWI. KRITISCH: Bilaterale Hydronephrose = Urin obstruiert oberhalb Obstruction! Diese Stase mit Infektion = MASSIVE Gef\u00e4hrdung und erh\u00f6ht Bakteri\u00e4mie-Risiko MASSIV", "6h-Bundle: (1) Blutkultur vor AB; (2) Breites Spektrum AB innerhalb 1h: Ceftriaxon 2g + Gentamicin 3-5 mg/kg + Vancomycin; (3) IV-Fl\u00fcssigkeit: LR 30 mL/kg (~2,1L) \u00fcber 3h; (4) Vasopressor wenn Hypotension persistiert (Norepinephrin, Ziel MAP \u226565); (5) CT Abdomen mit Kontrast; (6) Kontinuierliche \u00dcberwachung", "Vasopressoren INDIZIERT wenn Hypotension persistiert trotz Fl\u00fcssigkeit: Norepinephrin 0,05-2 \u03bcg/kg/min, Ziel MAP \u226565. Fl\u00fcssigkeit: 30 mL/kg Bolus. KRITISCH: Infected obstructed urinary system erfordert DRINGENDE Urology-Intervention (Ureteral Stents oder perkutane Nephrostomie) innerhalb FEW STUNDEN! Nicht tagelang warten. Mit drainage: Mortalit\u00e4t 20-50% ohne schnelle Drainage!"]}, {"id": 9, "caseName": "45-j\u00e4hriger mit Bauchschmerz und Blutungen", "fachbereich": "Gastroenterologie", "anamnese": "45-j\u00e4hriger m\u00e4nnlicher Patient mit langer Geschichte schwerer Alkoholabh\u00e4ngigkeit (40+ Trinkeinheiten/Woche, t\u00e4glich seit 20 Jahren) stellt sich vor mit akutem epigastrischem Schmerz und H\u00e4moptyse (Blut spucken). Bekannt: zirrhose diagnosed vor 3 Jahren (ChildPugh C). Aktuelle Symptome: heftiger oberer GI-Blutung (Patient hat dunkelrotes Blut erbrochen, \u00abKaffeesatz\u00bb Material). Letztes Endoskopie vor 6 Monaten zeigte \u00d6sophagus-Varizen. Keine aktuelle Propranolol-Therapie oder Endoskopische Varizenligation (EVL). Vitale: instabil.", "koerperlich": "Blass, anxi\u00f6s, in Distress. Abdomen: weich, Milzpalpable (chronische Zirrhose-Zeichen). Asterixis vorhanden (Flapping tremor = Hepatische Enzephalopathie!). Sclera: icteric (Gelbsucht von Leberversagen). Ascites: moderat. Keine Peritonialszeichen.", "vitale": "RR 88/52 mmHg (HYPOTENSIV!), HF 130/min (Tachykardie), AF 26/min, SpO2 90%, T 37,2\u00b0C", "labor": "Hemoglobin 6,8 g/dL (MASSIVE An\u00e4mie von Blutung), INR 2,8 (prolongierte Koagulation = hepatische Synthese-Fehler), Thrombozyten 45.000/\u03bcL (niedrig), Kreatinin 2,2 mg/dL (Nieren-Fehler), Albumin 2,1 g/dL (niedrig), Gesamtbilirubin 8,5 mg/dL", "bildgebung": "Endoskopie (sofort): \u00d6sophagus-Varizen mit aktive Blutung erkannt. Mulitple Varizen-B\u00e4nder mit oozing Blutung", "q": ["Varizen-Blutung-Management: antibiotisch, h\u00e4modynamisch, endoskopisch?", "Rolle von Vasokonstraktoren und Antibiotika?", "Management von Koagulopathie und Thrombozytopenie?", "Vorbeugende Ma\u00dfnahmen und Langzeit-Prognose?"], "answers": ["Management: (1) Zwei gro\u00dflumige IVs, Type&Cross; (2) Massive Transfusion: PRBC 2U stat, FFP und Platelets wenn INR >2 oder Plt <50.000; (3) Vasokonstriktor: Terlipressin oder Octreotide (reduziert portaler Druck); (4) Antibiotika: Ceftriaxon (verhindert spontan-bacteria peritonitis); (5) Endoskopische Varizenligation (EVL) = DEFINITIV", "Vasokonstriktor: Terlipressin 2mg IV q4-6h oder Octreotide 50 \u03bcg bolus dann 50 \u03bcg/h Infusion. Reduziert portal pressure durch Splanchnic vasoconstriction. Antibiotika: Ceftriaxon 1-2g t\u00e4glich hat Beweis reduziert Mortalit\u00e4t in Varizien-Blutung", "Koagulopathie: Geben FFP wenn INR >2 oder aktive Blutung. Thrombozytopenie: Transfuse wenn Plt <50.000 oder aktive Blutung. Ziel: H\u00e4moglobin >7 g/dL (RESTRIKTIV Transfusion - liberal Transfusion erh\u00f6ht portal pressure!). DIC-Screening laufend", "Vorbeugende Ma\u00dfnahmen: EVL oder Propranolol reduziert Rezidiv. Prognose: 5-Jahres \u00dcberlebensrate in Zirrhose ~50%. Nach Varizien-Blutung: Mortalit\u00e4t in Hospital ~15-20%, dann Rezidiv-Risiko ~30-50% ohne prophylaxe"]}, {"id": 10, "caseName": "38-j\u00e4hrige Schwangere mit Kopfschmerz und \u00d6dem", "fachbereich": "Geburtshilfe", "anamnese": "38-j\u00e4hrige Primigravida (erste Schwangerschaft!) in 34. Schwangerschaftswoche stellt sich vor mit progressivem Kopfschmerz und Gesichts-\u00d6dem. Bekannt: Hypertonie seit 10 Jahren (meist gut kontrolliert mit Methyldopa). HEUTE: pl\u00f6tzlich RR 170/110, Kopfschmerz, visuelles Verschwommenheit (\"floaters\"), epigastrischer Schmerz. Urintest zeigt Proteinurie (3+). Letzte Pr\u00e4-Blutungs-Messung vor 1 Woche: normal. Dies ist SCHNELLE Progression = VERDACHT auf Pr\u00e4eklampsie oder sogar Eklampsie!", "koerperlich": "Angespannt, Kopfschmerz vorhanden. Blutdruck 170/110 (erh\u00f6ht von Baseline). Faciale \u00d6deme prominent. Reflexe: Kniesehnen-Reflex hyperaktiv (2+), Bizeps-Reflex 2+, Fu\u00df-Klonus POSITIV (2 beats = wichtiges Zeichen von Eklampsie-Risiko!). Abdomen: epigastrischer Schmerz mit Palpation. Uterus: gro\u00dfenteils konsistent mit 34 Wochen Schwangerschaft. Kein Vaginal-Blutung erkannt.", "vitale": "RR 170/110 mmHg (SEHR erh\u00f6ht!), HF 92/min (moderat), AF 16/min, SpO2 96%, T 37,5\u00b0C", "labor": "Urinprotein: 3+ (Protein >5 g/24h = schwer). Thrombozyten 85.000/\u03bcL (niedrig = m\u00f6glicherweise HELLP), Kreatinin 1,4 mg/dL (leicht erh\u00f6ht in Schwangerschaft), AST 95 U/L (erh\u00f6ht = m\u00f6glicherweise Leber-Beteiligung), LDH 800 IU/L (erh\u00f6ht = h\u00e4molyse?)", "bildgebung": "Ultraschall Geb\u00e4rmutter: Fetus beweglich, Fruchtwassermenge normal, keine Abl\u00f6sung. CTG: reaktiv, normale Herzfrequenz ~145", "q": ["Diagnose Pr\u00e4eklampsie vs. Eklampsie: Kriterien und Differenzial?", "HELLP-Syndrom: Verdacht und Laborinterpretation?", "Antihypertensiva-Management in Schwangerschaft?", "Timing der Entbindung: konservativ oder emergent?"], "answers": ["Pr\u00e4eklampsie: Hypertonie (>140/90) + Proteinurie (>0,3g/24h) nach 20 Wochen Gravidit\u00e4t. Schwere: Blutdruck \u2265160/110 UND/ODER Symptome (Kopfschmerz, visuell, epigastrischer Schmerz). Diese Patientin erf\u00fcllt SCHWERE Pr\u00e4eklampsie Kriterien. Eklampsie: Pr\u00e4eklampsie + Anf\u00e4lle/Koma. Diese Patientin hat NICHT konvulsiv, aber Fu\u00df-Klonus = HOHES RISIKO f\u00fcr Eklampsie (imminent eclampsia)", "HELLP (Hemolysis, Elevated Liver enzymes, Low Platelets): Plt 85.000 (niedrig), AST 95 (erh\u00f6ht), LDH 800 (sehr erh\u00f6ht = h\u00e4molyse). Diese Patientin erf\u00fcllt m\u00f6glich HELLP-Kriterien. HELLP ist severe complication von Pr\u00e4eklampsie mit Mortalit\u00e4t bis 30% wenn unbehandelt", "Beta-Blocker: Labetalol (sicher in Schwangerschaft, erste Wahl), IV 10mg, dann 20-80mg q10min bis BP kontrolliert (Ziel <150-160 systolisch). Dihhydropyridine (Nifedipine sofortwirkende): 10-20mg sublingual q20min. KONTRAINDIZIERT: ACE-Inhibitors und Angiotensin Receptor Blockers (teratogen)", "TIMING: Diese Patientin braucht EMERGENT Entbindung. Begr\u00fcndung: Schwere Pr\u00e4eklampsie + Zeichen von imminent eclampsia (Fu\u00df-Klonus) + m\u00f6glich HELLP = hohes Risiko f\u00fcr Anf\u00e4lle, Schlaganfall, Organversagen (Mutter und Fetus). Obwohl 34 Wochen (nicht bei Term), Risiko intrauterine Fetal Demise oder Abl\u00f6sung > Risiko Fr\u00fchgeborenen-Komplikationen. Plan: Magnesium-Sulfat f\u00fcr Neuroprotection (4g IV loading, dann 1g/h), dann Lieferung via Kaiserschnitt (safest f\u00fcr mutter in dieser situation)"]}, {"id": 11, "caseName": "Fall 11 - Klinischer Fall", "fachbereich": "Innere Medizin", "anamnese": "Patient mit Symptomen [Fall 11]. Anamnese mit relevanten medizinischen Details...", "koerperlich": "K\u00f6rperliche Befunde f\u00fcr Fall 11: normale klinische Untersuchung mit relevanten Details...", "vitale": "RR 120/80 mmHg, HF 80/min, AF 16/min, SpO2 98%, T 37,0\u00b0C", "labor": "Laborergebnisse Fall 11: normale Parameter...", "bildgebung": "Bildgebung/EKG Fall 11: Normale Befunde...", "q": ["Diagnose?", "Pathophysiologie?", "Management?", "Prognose?"], "answers": ["M\u00f6gliche Diagnose beschrieben...", "Pathophysiologische Erkl\u00e4rung...", "Therapeutisches Vorgehen...", "Langzeitprognose..."]}, {"id": 12, "caseName": "Fall 12 - Klinischer Fall", "fachbereich": "Innere Medizin", "anamnese": "Patient mit Symptomen [Fall 12]. Anamnese mi         let currentMode = 'single';

        function displayCase() {
            if (allCases.length === 0) return;
            
            const caseIndex = currentMode === 'single' ? currentCaseIndex : Math.floor(Math.random() * allCases.length);
            const caseData = allCases[caseIndex];
            
            let html = `
                <div class="case-layout">

                    <div class="case-column">
                        <div class="case-header">
                            <div class="case-title">${caseData.caseName}</div>
                            <div class="case-meta">Fall ${caseData.id} | ${caseData.fachbereich}</div>
                        </div>

                        <div class="section">
                            <div class="section-title">📋 Anamnese</div>
                            <div class="section-content">${caseData.anamnese}</div>
                        </div>

                        <div class="section">

                            <div class="section-content">${caseData.koerperlich}</div>
                        </div>

                            <div class="section-content">${caseData.vitale}</div>
                        </div>

                            <div class="section-title">🧪 Laborergebnisse</div>
                            <div class="section-content">${caseData.labor}</div>

                            <div class="section-content">${caseData.bildgebung}</div>

                                    <textarea id="answer_${idx}" placeholder="Hier antworte..."></textarea>
                                </div>
                            `).join('')}

                            </div>

                            <div id="ratingSection_${caseData.id}" class="rating-section">

                                <div class="rating-buttons">

        function submitAnswers(caseId) {
            const ratingSection = document.getElementById(`ratingSection_${caseId}`);
            if (ratingSection) ratingSection.classList.add('show');
        }

        function rateAnswers(caseId, rating) {
            progress[caseId] = rating;
            saveProgress();
            updateStats();
            showFeedback(caseId);
            setTimeout(nextCase, 2000);
        }

        function showFeedback(caseId) {
            const caseData = allCases.find(c => c.id === caseId);
            if (!caseData) return;

            let feedbackHTML = `<div class="feedback-header">💡 Musterlösungen</div>`;
            caseData.q.forEach((q, idx) => {
                feedbackHTML += `
                    <div class="feedback-item">
                        <div class="feedback-q-text">Frage ${idx + 1}: ${q}</div>
                        <div class="solution-answer">${caseData.answers[idx]}</div>
                    </div>
                `;
            });

            const feedbackContainer = document.getElementById('feedback');
            feedbackContainer.innerHTML = feedbackHTML;
            feedbackContainer.classList.add('show');
            feedbackContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextCase() {
            currentCaseIndex = (currentCaseIndex + 1) % allCases.length;
            document.getElementById('feedback').classList.remove('show');
            displayCase();
        }

        function switchMode(mode) {
            currentMode = mode;
            currentCaseIndex = 0;
            document.querySelectorAll('.mode-selector .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            displayCase();
        }

        function updateStats() {
            const completed = Object.keys(progress).length;
            const total = allCases.length;
            const percentage = Math.round((completed / total) * 100);
            
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressPct').textContent = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        function saveProgress() {
            localStorage.setItem('kp_progress', JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('kp_progress');
            progress = saved ? JSON.parse(saved) : {};
        }

        function exportProgress() {
            const dataStr = JSON.stringify(progress, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'kp_progress_' + new Date().getTime() + '.json';
            link.click();
        }

        function importProgress() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        progress = JSON.parse(event.target.result);
                        saveProgress();
                        updateStats();
                        alert('Fortschritt importiert!');
                    } catch (err) {
                        alert('Fehler beim Importieren');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function resetProgress() {
            if (confirm('Sicher? Alle Fortschritte werden gelöscht!')) {
                progress = {};
                localStorage.removeItem('kp_progress');
                updateStats();
                displayCase();
            }
        }

        initApp();
    </script>
