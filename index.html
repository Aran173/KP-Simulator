 (rectouteriner/rectovesikaler Raum, Becken) 4. Perikardialer Raum (perikardiale Flüssigkeit/Tamponade)"}, {"q": "Unterschied zwischen Unruhe, Psychose und Delir; Vorgehen und Neuroleptika?", "a": "Merkmal Bewusstsein Orientierung Beginn Halluzinationen Ursache"}, {"q": "Unterschied Deutschland vs. England; praktisches Vorgehen?", "a": "Deutschland (nach Richtlinien der BÄK): Vollständiger und irreversibler Ausfall von:   "}], "title": "Rechter Unterbauch – Appendizitis", "header": "Fall 8\nKenntnisprüfung – Prüfungsprotokoll\nPrüfungsdatum: 19.05.2026 (KP 2/3) Datum der Nachricht: 27.05.2026\nAblauf der Prüfung\nAnamnese und körperliche Untersuchung (KU)\n Verlief normal und ohne Unterbrechung.\n Beim Kollegen wurden zusätzlich eine Traumauntersuchung sowie die\nUntersuchung der Kreuzbänder des Knies verlangt.\nErste Runde\nHerzinsuffizienz – Medikamente\nFrage: Welche Medikamente werden bei Herzinsuffizienz eingesetzt?\nAntwort:\n ACE-Hemmer / AT1-Blocker (ARNIs): z. B. Ramipril, ", "clinical_case": "**Hauptsymptom:** Akuter Bauchschmerz im rechten Unterbauch mit charakteristischem Verlauf\n\n**Anamnese:** Ein 32-jähriger Patient stellt sich mit peri-umbilikalem Schmerz vor, der in den letzten 6 Stunden nach rechts unten gewandert ist. Der Patient berichtet von Anorexie, Übelkeit und leichtem Erbrechen. Die Symptomatik verschlimmerte sich progressiv. Keine bedeutsamen Vorerkrankungen, keine allergischen Reaktionen bekannt.\n\n**Klinische Befunde:** Allgemeinzustand: beeinträchtigt. Vitale Parameter: RR 128/82, HR 95/min, Temperatur 38,2°C. Abdominell: Schmerz und Abwehrspannung im McBurney-Punkt (rechter Unterbauch), positives Rebound-Phänomen, Psoas-Zeichen positiv. Darmgeräusche leise.\n\n**Diagnostische Kriterien:**\n• Blutbild mit CRP (Erhöhung von Leukozyten und CRP)\n• Abdominale Sonographie oder CT\n• Ausschluss gynäkologischer Ursachen bei Frauen\n• Klinische Beurteilung: typische Schmerzmigration\n\n**Therapie:**\n• Chirurgische Intervention (laparoskopische oder offene Appendektomie)\n• Präoperativ: i.v. Antibiotika, Volumengabe, Magensonde\n• Postoperativ: Antibiotika bis zur klinischen Besserung\n• Frühe Mobilisierung und Ernährungsaufbau\n"}, "Fall_9": {"case_info": "Fall 9\nKenntnisprüfung – Protokoll\nPrüfungsdatum: 19.05.2026, 09:45 Uhr Nachrichtendatum: 22.05.2026 Ergebnis: ✅\nBestanden (3. Versuch)\n\nPrüfungskommission\n\n\n\n1 Chefarzt der Unfallchirurgie\n2 Gastroenterologen (einer davon wenig strukturiert und fordernd, einer sehr nett\nund strukturiert)\n\nVorgestellter Fall (Ausgangsfall)\nPatient: Frau, Frührente wegen schwer krankem Sohn (lebt zu Hause und pflegt ihn)\nVorstellung wegen: Linksseitige Oberbauchschmerzen, verstärkt nach dem Essen\nAnamnese:\n\n\n\n\n\n\nRegelmäßige NSAR-Einnahme ohne PPI-Schutz\nTäglicher Alkoholkonsum am Abend\nKeine relevanten Vorerkrankungen\nKeine regelmäßige Dauermedikation\nVoroperationen: Z. n. Cholezystektomie, Appendektomie, Leistenhernien-OP\nbeidseits\n\nKörperliche Untersuchung (KU)\nDurchgeführt in folgender Reihenfolge:\n1. Vitalparameter\n2. Inspektion (inkl. Operationsnarben)\n3. Abdomen\n4. Herz\n5. Lunge\n6. Pulse aller Extremitäten (Palpation)\n7. Grobe neurologische Untersuchung: Hirnnerven, Sensibilität, Motorik, AtaxieAusschluss\n⚠️ Vergessen / zu ergänzen: Lymphknotenstatus und digital-rektale\nUntersuchung (DRU)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nProcedere / Diagnostik (vom Kandidaten vorgeschlagen)\n\n\n\n\nLabor\nSonografie Abdomen\nGgf. Gastroskopie\nPatientenfrage: „Muss ich operiert werden?“ Antwort: Zunächst abhängig\nvom Befund; primär konservative Therapie; Ausschluss von\nDifferenzialdiagnosen, insbesondere Magenkarzinom.", "runde_1": [{"q": "Welche Indikationen gibt es für eine Cholezystektomie?", "a": "   "}, {"q": "Welche Laborwerte sind bei Oberbauchschmerzen relevant?", "a": "        "}, {"q": "Welche Laborwerte können auch bei Muskelerkrankungen erhöht sein?", "a": "AST (GOT) – sie ist nicht leberspezifisch und kann bei Myopathien, Myokardinfarkt oder intensivem Sport erhöht sein. ⚠️ Ergänzung: CK (Kreatinkinase) und LDH sind ebenfalls muskulären Ursprungs und für die Differenzierung wichtig. Die GPT (ALT) ist deutlich leberspezifischer als die AST."}, {"q": "Welche chronische Erkrankung führt zur Erhöhung der Gammaglobuline?", "a": "Multiples Myelom (monoklonale Gammopathie → „M-Gradient“ in der Elektrophorese) ⚠️ Ergänzung: Auch chronische Infektionen (z. B. HIV, Hepatitis), Autoimmunerkrankungen (z. B. SLE) und Leberzirrhose können zu einer polyklonalen Erhöhung der Gammaglobuline führen."}, {"q": "Was ist die Lauren-Klassifikation beim Magenkarzinom?", "a": "Typ"}, {"q": "Was bedeuten R0, R1 und R2?", "a": "Antwort (korrigiert und vollständig):   "}, {"q": "Was ist das Dumping-Syndrom nach Gastrektomie?", "a": "Frühes Dumping (ca. 15–30 min nach dem Essen):  "}, {"q": "Welche Indikationen gibt es für eine Cholezystektomie?", "a": "   "}, {"q": "Welche Laborwerte sind bei Oberbauchschmerzen relevant?", "a": "        "}, {"q": "Welche Laborwerte können auch bei Muskelerkrankungen erhöht sein?", "a": "AST (GOT) – sie ist nicht leberspezifisch und kann bei Myopathien, Myokardinfarkt oder intensivem Sport erhöht sein. ⚠️ Ergänzung: CK (Kreatinkinase) und LDH sind ebenfalls muskulären Ursprungs und für die Differenzierung wichtig. Die GPT (ALT) ist deutlich leberspezifischer als die AST."}, {"q": "Erklären Sie die Serumprotein-Elektrophorese.", "a": "Die Serumprotein-Elektrophorese trennt Plasmaproteine nach Ladung und Größe in folgende Fraktionen: Fraktion Hauptproteine Albumin Albumin Alpha-1"}, {"q": "Welche chronische Erkrankung führt zur Erhöhung der Gammaglobuline?", "a": "Multiples Myelom (monoklonale Gammopathie → „M-Gradient“ in der Elektrophorese) ⚠️ Ergänzung: Auch chronische Infektionen (z. B. HIV, Hepatitis), Autoimmunerkrankungen (z. B. SLE) und Leberzirrhose können zu einer polyklonalen Erhöhung der Gammaglobuline führen."}, {"q": "Was bedeuten R0, R1 und R2? Antwort (korrigiert und vollständig):   ", "a": "Frühes Dumping (ca. 15–30 min nach dem Essen):  "}], "runde_2": [{"q": "Wie viele Lappen hat die rechte Lunge?", "a": "3 Lappen (Ober-, Mittel-, Unterlappen); die linke Lunge hat 2 Lappen (Ober-, Unterlappen)"}, {"q": "Was ist der CRB-65-Score?", "a": "Klinischer Score zur Schweregradbeurteilung der ambulant erworbenen Pneumonie (CAP): Kriterium C R B 65"}, {"q": "Was ist der Unterschied zwischen typischer und atypischer Pneumonie?", "a": "Merkmal Erreger"}, {"q": "Unterschied und Therapie?", "a": ""}, {"q": "Welche weiteren diagnostischen Schritte?", "a": " "}, {"q": "Was, wenn kein CT möglich?", "a": "Echokardiografie (transthorakal) zum Nachweis/Ausschluss einer Rechtsherzbelastung (Rechtsherzdilatation, D-Zeichen, Trikuspidalinsuffizienz, erhöhter PAP) ⚠️ Ergänzung: Alternativ kann eine Ventilations-Perfusions-Szintigrafie (V/Q-Scan) eingesetzt werden, v. a. bei Kontrastmittelallergie oder Niereninsuffizienz. Bei hämodynamisch instabiler LAE → sofortige systemische Thrombolyse oder interventionelle Therapie."}, {"q": "Was ist der Unterschied zwischen Sachkunde und Fachkunde im Strahlenschutz?", "a": " "}, {"q": "Wie viele Lappen hat die rechte Lunge?", "a": "3 Lappen (Ober-, Mittel-, Unterlappen); die linke Lunge hat 2 Lappen (Ober-, Unterlappen)"}, {"q": "Was ist der CRB-65-Score?", "a": "Klinischer Score zur Schweregradbeurteilung der ambulant erworbenen Pneumonie (CAP): Kriterium C R B 65"}, {"q": "Was, wenn kein CT möglich?", "a": "Echokardiografie (transthorakal) zum Nachweis/Ausschluss einer Rechtsherzbelastung (Rechtsherzdilatation, D-Zeichen, Trikuspidalinsuffizienz, erhöhter PAP) ⚠️ Ergänzung: Alternativ kann eine Ventilations-Perfusions-Szintigrafie (V/Q-Scan) eingesetzt werden, v. a. bei Kontrastmittelallergie oder Niereninsuffizienz. Bei hämodynamisch instabiler LAE → sofortige systemische Thrombolyse oder interventionelle Therapie."}], "runde_3": [{"q": "Was fällt noch auf?", "a": "Viel Luft im Darm sichtbar"}, {"q": "Wie schließt man einen Ileus aus?", "a": "Fehlende Spiegelbildung (Luft-Flüssigkeitsspiegel) spricht gegen einen mechanischen Ileus. Das Bild zeigt eher physiologische Gasfüllung. ⚠️ Ergänzung: Bei Verdacht auf Ileus weitere Diagnostik: CT-Abdomen (Mittel der Wahl), klinische Untersuchung (Peristaltik, Distension), Laborkontrolle. Ursachen mechanischer Ileus: Adhäsionen, Hernien, Tumor. Paralytischer Ileus: postoperativ, Peritonitis, Elektrolytentgleisung."}, {"q": "Was ist das Pankreas?", "a": "Retroperitoneales, gemischt exokrin/endokrin sezerniertes Drüsenorgan Exokriner Anteil:  "}, {"q": "Wie weist man eine Extrauteringravidität nach?", "a": "β-HCG im Blut oder Urin (zunächst quantitativ im Serum), kombiniert mit transvaginalem Ultraschall (kein intrauteriner Fruchtsack bei erhöhtem β-HCG → V. a. EUG) ⚠️ Ergänzung: Bei β-HCG > 1500–2000 IE/l sollte mittels TVS ein intrauteriner Fruchtsack sichtbar sein. Ist das nicht der Fall → hochgradiger Verdacht auf EUG. Therapie: medikamentös (Methotrexat bei stabilen Patientinnen) oder operativ (laparoskopische Salpingotomie/-ektomie)."}, {"q": "Welche Erkrankungen des Sigmas kennen Sie?", "a": "    "}, {"q": "Unterschied der operativen Therapie – Divertikulitis vs. Karzinom?", "a": " "}, {"q": "Warum sind Divertikel so häufig im Sigma?", "a": "Das Sigma hat den kleinsten Durchmesser des Kolons und erzeugt damit den höchsten intraluminalen Druck (Laplace-Gesetz: Druck = Wandspannung / Radius). Dies begünstigt das Durchpressen der Mukosa durch Schwachstellen in der Darmwand (falsche Divertikel = Pseudodivertikel)."}, {"q": "Was ist ein Apoplex?", "a": "Akutes zerebrovaskuläres Ereignis mit plötzlichem Ausfall neurologischer Funktionen durch:  "}, {"q": "Häufige Ursachen?", "a": "    "}, {"q": "Häufigste Lokalisation?", "a": "A. cerebri media (Mediainfarkt) – versorgt ca. 2/3 des Großhirns; Symptome: kontralaterale Hemiparese (armbetonter), Hemihypästhesie, ggf. Aphasie (bei linkem Infarkt), Neglect (bei rechtem Infarkt) ⚠️ Ergänzung: Therapie beim ischämischen Insult: Thrombolyse (i.v. rt-PA) innerhalb von 4,5 h nach Symptombeginn oder mechanische Thrombektomie (bis 24 h bei großen Gefäßverschlüssen). Sekundärprophylaxe: Antikoagulation bei Vorhofflimmern (NOAK), Thrombozytenaggregationshemmung, Karotisendarterektomie bei hochgradiger Stenose."}, {"q": "Wie verhält sich die Strahlendosis bei Vervierfachung des Abstands?", "a": "Die Strahlendosis nimmt mit dem Quadrat der Entfernung ab (Abstandsquadratgesetz): Dosis ∝ 1 / Abstand² → Bei 4-fachem Abstand: Dosis = 1 / 4² = 1/16 der ursprünglichen Dosis ✅"}, {"q": "Wie berechnet sich das Herzzeitvolumen?", "a": "HZV = Herzfrequenz (HF) × Schlagvolumen (SV)    "}, {"q": "Was fällt noch auf?", "a": "Viel Luft im Darm sichtbar"}, {"q": "Wie schließt man einen Ileus aus?", "a": "Fehlende Spiegelbildung (Luft-Flüssigkeitsspiegel) spricht gegen einen mechanischen Ileus. Das Bild zeigt eher physiologische Gasfüllung. ⚠️ Ergänzung: Bei Verdacht auf Ileus weitere Diagnostik: CT-Abdomen (Mittel der Wahl), klinische Untersuchung (Peristaltik, Distension), Laborkontrolle. Ursachen mechanischer Ileus: Adhäsionen, Hernien, Tumor. Paralytischer Ileus: postoperativ, Peritonitis, Elektrolytentgleisung."}, {"q": "Was ist das Pankreas?", "a": "Retroperitoneales, gemischt exokrin/endokrin sezerniertes Drüsenorgan Exokriner Anteil:  "}, {"q": "Wie weist man eine Extrauteringravidität nach?", "a": "β-HCG im Blut oder Urin (zunächst quantitativ im Serum), kombiniert mit transvaginalem Ultraschall (kein intrauteriner Fruchtsack bei erhöhtem β-HCG → V. a. EUG) ⚠️ Ergänzung: Bei β-HCG > 1500–2000 IE/l sollte mittels TVS ein intrauteriner Fruchtsack sichtbar sein. Ist das nicht der Fall → hochgradiger Verdacht auf EUG. Therapie: medikamentös (Methotrexat bei stabilen Patientinnen) oder operativ (laparoskopische Salpingotomie/-ektomie)."}, {"q": "Welche Erkrankungen des Sigmas kennen Sie?", "a": "    "}, {"q": "Warum sind Divertikel so häufig im Sigma?", "a": "Das Sigma hat den kleinsten Durchmesser des Kolons und erzeugt damit den höchsten intraluminalen Druck (Laplace-Gesetz: Druck = Wandspannung / Radius). Dies begünstigt das Durchpressen der Mukosa durch Schwachstellen in der Darmwand (falsche Divertikel = Pseudodivertikel)."}, {"q": "Was ist ein Apoplex?", "a": "Akutes zerebrovaskuläres Ereignis mit plötzlichem Ausfall neurologischer Funktionen durch:  "}, {"q": "Häufige Ursachen?", "a": "    "}, {"q": "Häufigste Lokalisation?", "a": "A. cerebri media (Mediainfarkt) – versorgt ca. 2/3 des Großhirns; Symptome: kontralaterale Hemiparese (armbetonter), Hemihypästhesie, ggf. Aphasie (bei linkem Infarkt), Neglect (bei rechtem Infarkt) ⚠️ Ergänzung: Therapie beim ischämischen Insult: Thrombolyse (i.v. rt-PA) innerhalb von 4,5 h nach Symptombeginn oder mechanische Thrombektomie (bis 24 h bei großen Gefäßverschlüssen). Sekundärprophylaxe: Antikoagulation bei Vorhofflimmern (NOAK), Thrombozytenaggregationshemmung, Karotisendarterektomie bei hochgradiger Stenose."}, {"q": "Wie verhält sich die Strahlendosis bei Vervierfachung des Abstands?", "a": "Die Strahlendosis nimmt mit dem Quadrat der Entfernung ab (Abstandsquadratgesetz): Dosis ∝ 1 / Abstand² → Bei 4-fachem Abstand: Dosis = 1 / 4² = 1/16 der ursprünglichen Dosis ✅"}, {"q": "Wie berechnet sich das Herzzeitvolumen?", "a": "HZV = Herzfrequenz (HF) × Schlagvolumen (SV)    "}], "title": "Fall 9", "header": "Fall 9\nKenntnisprüfung – Protokoll\nPrüfungsdatum: 19.05.2026, 09:45 Uhr Nachrichtendatum: 22.05.2026 Ergebnis: ✅\nBestanden (3. Versuch)\nPrüfungskommission\n 1 Chefarzt der Unfallchirurgie\n 2 Gastroenterologen (einer davon wenig strukturiert und fordernd, einer sehr nett\nund strukturiert)\nVorgestellter Fall (Ausgangsfall)\nPatient: Frau, Frührente wegen schwer krankem Sohn (lebt zu Hause und pflegt ihn)\nVorstellung wegen: Linksseitige Oberbauchschmerzen, verstärkt nach dem Essen\nAnamnese:\n Regelmäßige NSAR-Einnahme ohne PPI-Schutz\n Täglicher Alkoholkonsum am Abend\n Keine relevanten Vorerkrankungen\n Keine regelmäßige Dauermedikation\n Voroperationen: Z. n. Cholezystektomie, Appendektomie, Leistenhernien-OP\nbeidseits\nKörperliche Untersuchung (KU)\nDurchgeführt in folgender Reihenfolge:\n1. Vitalparameter\n2. Inspektion (inkl. Operationsnarben)\n3. Abdomen\n4. Herz\n5. Lunge\n6. Pulse aller Extremitäten (Palpation)\n7. Grobe neurologische Untersuchung: Hirnnerven, Sensibilität, Motorik, Ataxie-\nAusschluss\n⚠️ Vergessen / zu ergänzen: Lymphknotenstatus und digital-rektale\nUntersuchung (DRU)\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nProcedere / Diagnostik (vom Kandidaten vorgeschlagen)\n Labor\n Sonografie Abdomen\n Ggf. Gastroskopie\nPatientenfrage: „Muss ich operiert werden?“ Antwort: Zunächst abhängig\nvom Befund; primär konservative Therapie; Ausschluss von\nDifferenzialdiagnosen, insbesondere Magenkarzinom.", "clinical_case": "**Hauptsymptom:** Plötzlich auftretender retrosternaler Brustschmerz mit Ausstrahlung\n\n**Anamnese:** Ein 67-jähriger Mann mit bekannter Hypertonie, Diabetes mellitus Typ 2 und aktuellem Rauchen (20 py) stellt sich mit akutem retrosternalem Brustschmerz vor. Der Schmerz begann plötzlich vor 2 Stunden während der Arbeit, ist dumpf-drängend und strahlt in den linken Arm aus. Der Patient ist schwitzend und ängstlich. Seine Frau hat ihn sofort in die Notaufnahme gebracht.\n\n**Klinische Befunde:** Allgemeinzustand: akut erkrankt, ängstlich, diaphoretisch. RR 165/98, HR 102/min, Atemfrequenz 20/min. Auskultation: unauffällige Herzgeräusche, Lungen belüftet. Körperliche Untersuchung zeigt keine Ödeme. Patient blass und schweißnass.\n\n**Diagnostische Kriterien:**\n• 12-Kanal-EKG sofort (ST-Elevationen oder T-Wellen-Inversionen)\n• Troponin T/I (hochsensitiv, mehrfach)\n• Blutbild, Nierenfunktion, Elektrolyte\n• Thorax-Röntgen zum Ausschluss anderer Pathologie\n\n**Therapie:**\n• Notfall-Reperfusionstherapie: perkutane Koronarintervention (PCI) oder Thrombolyse\n• Duale Thrombozytenaggregation (Aspirin + P2Y12-Inhibitor)\n• Antikoagulation mit Heparin\n• ß-Blocker, ACE-Hemmer, Statine, Rehabilitation\n"}, "Fall_10": {"case_info": "Fall 10\nPrüfungsprotokoll – Fallbericht\nDatum der Nachricht 22.05.2026\nDatum der Prüfung\n19.05.2026\n\nPatientenvorstellung\nPatient: 72 Jahre, männlich, Rentner (früher Angestellter)\nVorstellungsgrund: Leistungsminderung sowie belastungsabhängige Dyspnoe seit 4\nWochen, beidseitige Beinödeme und Orthopnoe.\n\nAnamnese\nVorerkrankungen\n\n\n\n\nArterielle Hypertonie\nDyslipidämie\nVorhofflimmern (seit 2 Jahren)\n\nOperationen\n\n\n\nZustand nach biologischem Klappenersatz\nZustand nach Prostatektomie\n\nMedikation\n\n\n\n\nAmlodipin 5 mg\nAtorvastatin 40 mg\nApixaban (Eliquis®) 5 mg\n\nFamilienanamnese\n\n\n\n\nVater: Apoplex\nMutter: Multiorganversagen\nGeschwister: Hautkrebs, Mammakarzinom, Kolonkarzinom\n\nKörperliche Untersuchung\nDer Prüfer legte besonderen Wert auf gezielte Untersuchungsschritte. Nicht\ndurchgeführte Untersuchungen wurden durch gezielte Fragen ergänzt:\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n\n\nWo auskultiert man die Herzklappen?\n\n\n\no Aortenklappe: 2. ICR rechts parasternal\no Pulmonalklappe: 2. ICR links parasternal\no Trikuspidalklappe: 4./5. ICR links parasternal (Erb-Punkt)\no Mitralklappe: 5. ICR medioklavikulär links (Herzspitze)\nUnterschied zwischen Systolikum und Diastolikum:\n\n\n\no Systolikum: Geräusch zwischen 1. und 2. Herzton (während der Systole), z.\nB. bei Aortenklappenstenose oder Mitralinsuffizienz.\no Diastolikum: Geräusch zwischen 2. und 1. Herzton (während der Diastole),\nz. B. bei Aortenklappeninsuffizienz oder Mitralstenose.\nNamen der Lymphknotenstationen:\no Zervikal (oberflächlich und tief), submandibulär, submental, axillär, inguinal,\nparaaortal, mesenterikal u. a.", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 10\n\n**Status:** Keine Fragen verfügbar."}, "Fall_11": {"case_info": "Fall 11\nPrüfungsbericht – Ärztliche Kenntnisprüfung\nDatum der Prüfung: 18.05.2026, 13:15 Uhr Datum der Nachricht: 19.05.2026\nErgebnis: Bestanden (1/3)", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 11\n\n**Status:** Keine Fragen verfügbar."}, "Fall_12": {"case_info": "Fall 12\nPrüfungsprotokoll\nDatum der Nachricht: 19.05.2026 Prüfungsdatum: 18.05.2026\n\nHauptfall: Divertikulitis\nPatientenvorstellung\nPatientin: 72 Jahre, weiblich Vorstellungsgrund: Linksseitige Unterbauchschmerzen\nseit drei Tagen, begleitet von Übelkeit und Obstipation Temperatur: 38 °C (oral, selbst\ngemessen)\n\nAnamnese\nVorerkrankungen:\n\n\n\n\n\nHypothyreose\nHypercholesterinämie\nDiabetes mellitus Typ 2\nZustand nach Appendektomie\n\nMedikamente:\n\n\n\n\n\nL-Thyroxin 75 µg\nMetformin\nSimvastatin\nIbuprofen bei Bedarf ⚠️ (Hinweis: NSAR wie Ibuprofen können DivertikulitisKomplikationen begünstigen und sollten bei dieser Diagnose vermieden werden)\n\nFamilienanamnese:\n\n\n\nMutter: Diabetes mellitus Typ 2\nVater: Schlaganfall\n\nGynäkologische Vorsorge: Letzter Frauenarztbesuch vor drei Monaten, unauffällig\nAllergien: Pollenallergie\n\nKörperliche Untersuchung\nBefund: Druckschmerz im linken Unterbauch; restlicher Befund unauffällig\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nDurchgeführte Untersuchungen (laut Prüfer erforderlich):\n\n\n\n\n\nBauchuntersuchung\nThoraxuntersuchung\nNeurologische Untersuchung\nBeweglichkeitsprüfung der Gelenke: Schulter-, Hüft- und Kniegelenke beidseits", "runde_1": [{"q": "Patientenvorstellung mit Differentialdiagnosen", "a": "Wahrscheinlichkeitsdiagnose: Akute Divertikulitis (linksseitiger Unterbauchschmerz, Fieber, Obstipation, Übelkeit, Alter) Differentialdiagnosen: 1. Kolorektales Karzinom (wichtigste DD laut Prüfer – immer nach ungewolltem Gewichtsverlust fragen!) 2. Kolonischämie 3. Reizdarmsyndrom (RDS) 4. Gynäkologische Ursachen: Adnexitis, Ovarialzyste, Extrauteringravidität (hier weniger wahrscheinlich, da Z. n. Appendektomie und unauffällige gynäkologische Vorsorge) 5. Harnwegsinfekt / Urolithiasis 6. Morbus Crohn Wichtiger Hinweis des Prüfers: Bei V. a. kolorektales Karzinom muss gezielt nach ungewolltem Gewichtsverlust gefragt werden (B-Symptomatik: Gewichtsverlust > 10 % in 6 Monaten, Nachtschweiß, Fieber)."}, {"q": "Therapie des Rektumkarzinoms (kurze Antwort)", "a": "   "}, {"q": "Komplikationen der Divertikulitis", "a": "    "}], "runde_2": [{"q": "ist?", "a": "Der Hirntod ist definiert als der irreversible Ausfall der Gesamtfunktion des Großhirns, des Kleinhirns und des Hirnstamms. Voraussetzungen:  "}, {"q": "MRSA – Müssen alle Patienten mit MRSA isoliert werden?", "a": "Nein – nicht alle Patienten mit MRSA müssen isoliert werden. Der Prüfer hat dies ausdrücklich betont. Differenzierung:    "}, {"q": "Zeichen des Hirntods – Wie stellt man klinisch fest, dass ein Patient hirntot ist?", "a": "Der Hirntod ist definiert als der irreversible Ausfall der Gesamtfunktion des Großhirns, des Kleinhirns und des Hirnstamms. Voraussetzungen:  "}, {"q": "Neuroleptika – Fragen zu Medikamenten (nicht beantwortet) Antwort (ergänzt): Typische Neuroleptika (1. Generation):   ", "a": "Nein – nicht alle Patienten mit MRSA müssen isoliert werden. Der Prüfer hat dies ausdrücklich betont. Differenzierung:    "}], "runde_3": [{"q": "Was macht man zuerst?", "a": "EKG (12-Kanal-EKG sofort ableiten, um kardiale Ursache auszuschließen)"}, {"q": "Diagnose?", "a": "ST-Hebungsmyokardinfarkt (STEMI)"}, {"q": "Warum wird beim Herzkatheter der radiale Zugang bevorzugt?", "a": "Antwort (bereits angegeben – ergänzt):     "}, {"q": "Was macht man zuerst?", "a": "EKG (12-Kanal-EKG sofort ableiten, um kardiale Ursache auszuschließen)"}, {"q": "Diagnose?", "a": "ST-Hebungsmyokardinfarkt (STEMI)"}, {"q": "Therapie des STEMI – von Anfang bis zu den Empfehlungen nach der Entlassung", "a": "Präklinisch / Sofortmaßnahmen: "}, {"q": "Warum wird beim Herzkatheter der radiale Zugang bevorzugt? Antwort (bereits angegeben – ergänzt):     ", "a": "Grad AV-Block I°"}], "clinical_case": "**Hauptsymptom:** Akuter Bauchschmerz im linken Unterbauch mit Übelkeit und Fieber\n\n**Anamnese:** Ein 58-jähriger männlicher Patient präsentiert sich mit plötzlich einsetzenden, starken Bauchschmerzen im linken Unterbauch, die vor 12 Stunden begannen. Der Schmerz ist konstant, wird begleitet von Übelkeit und leichtem Fieber (37,8°C). Der Patient hat in der Vergangenheit mehrere ähnliche, aber mildere Episoden gehabt. Er ist übergewichtig (BMI 28), raucht gelegentlich und hat eine unauffällige Vormedikation.\n\n**Klinische Befunde:** Allgemeinzustand: mäßig beeinträchtigt. Vitale Parameter: RR 145/88, HR 88/min, Temperatur 37,8°C. Abdominell: lokalisierter Druckschmerz und Abwehrspannung im linken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_13": {"case_info": "Fall 13\nKenntnisprüfung – Fallbericht\nDatum der Prüfung: 13.05.2026, 09:00 Uhr Datum der Nachricht: 14.05.2026, 12:42\nUhr", "runde_1": [], "runde_2": [], "runde_3": [], "title": "Fall 13", "header": "Fall 13\nKenntnisprüfung – Fallbericht\nDatum der Prüfung: 13.05.2026, 09:00 Uhr Datum der Nachricht: 14.05.2026, 12:42\nUhr\nTeil 1 – Anamnese\nPatientin: Frau Erika S., 66 Jahre\nAktuelle Beschwerden\n Erschöpfung und Müdigkeit seit einigen Wochen\n Nykturie (nächtlicher Harndrang, mehrmals pro Nacht)\n Belastungsdyspnoe: Die Patientin kann ihre Wohnung im 2. Obergeschoss nicht\nmehr ohne Pausen erreichen\n Orthopnoe (Atemnot im Liegen) → hat sich deswegen zwei neue Kissen gekauft\n Beinödeme beidsei", "clinical_case": "**Hauptsymptom:** Fall 13\n\n**Status:** Keine Fragen verfügbar."}, "Fall_14": {"case_info": "Fall 14\nKenntnisprüfung – Erfahrungsbericht\nDatum der Nachricht: 12.05.2026 Datum der Prüfung: 12.05.2026, 09:45 Uhr\nErgebnis: Bestanden (1. Versuch)\n\nAllgemeines\nDie Prüfung war weniger kompliziert als erwartet. Die Atmosphäre war angenehm und\nfreundlich; die Prüfer halfen gelegentlich weiter. Der Unfallchirurg war etwas strenger\nund erwartete präzise Antworten. Der Kandidat arbeitet seit August (Jahr nicht\nangegeben, vermutlich 2025) in der Unfallchirurgie in Deutschland.\n\n\n\nEigener Fall: Divertikulitis\nWeitere Fälle der Gruppe: Diabetes mellitus (DM), Herzinsuffizienz (HI)\n\nAblauf der Prüfung\nPraktischer Teil (Teil 1)\nDer erste Teil verlief gut. Aus Zeitmangel konnten die neurologische Untersuchung und\nder Gefäßstatus nicht vollständig durchgeführt werden. Daraufhin stellte der Prüfer\n(Unfallchirurg) gezielte Fragen zu diesen Untersuchungen.\nFrage des Prüfers: Wie würden Sie den Gefäßstatus kontrollieren?\nAntwort: Der Gefäßstatus wird klinisch durch Auskultation (Strömungsgeräusche über\nGefäßen, z. B. A. carotis, A. renalis, Aorta abdominalis) und Palpation (Pulse an\ndefinierten Punkten: A. radialis, A. femoralis, A. poplitea, A. dorsalis pedis, A. tibialis\nposterior) erhoben. Ergänzend: Inspektion (Hautfarbe, Trophik, Ulzera),\nKapillarfüllungszeit, ggf. Knöchel-Arm-Index (ABI) sowie bei Bedarf Duplexsonografie\noder CT-Angiografie.\n\nSchriftlicher Teil\nUnauffällig, ohne besondere Vorkommnisse.\n\nFallvorstellungen und Fragen", "runde_1": [{"q": "Frage 1: Welche Differenzialdiagnosen kommen in Betracht?", "a": "Chronisch-entzündliche Darmerkrankungen (CED): Morbus Crohn, Colitis ulcerosa. Kolonkarzinom. Weitere DD: Appendizitis (insbesondere Sigmoiditis kann ähnlich imponieren), Reizdarmsyndrom, Adnexitis/Ovarialzyste (bei Frauen), Ischämische Kolitis."}, {"q": "Frage 2: Welche Diagnostik ist indiziert?", "a": "Labor (BB, CRP, PCT, Leber-/Nierenwerte, Urinstatus). Sonografie Abdomen (Mittel der 1. Wahl: verdickte Darmwand, perikolische Entzündung, Abszess). CT Abdomen/Becken mit KM (Goldstandard bei Komplikationsverdacht, Staging). Koloskopie: erst nach Abklingen der akuten Entzündung (ca. 6–8 Wochen), um Karzinom auszuschließen."}, {"q": "Frage 3: Welche Behandlung ist vorgesehen?", "a": "Unkomplizierte Divertikulitis (Stadium I nach CDD): ambulant, ggf. orale Antibiotika (z. B. Ciprofloxacin + Metronidazol) oder bei mildem Verlauf ohne Antibiotika, Schonung, schlackenarme Kost. Komplizierte Divertikulitis (Abszess, Perforation, Peritonitis, Fistel, Obstruktion – Stadien II–IV): stationäre Aufnahme, i.v. Antibiotika (z. B. Piperacillin/Tazobactam), bei Abszess ≥ 4 cm CT-gesteuerte Drainage, OP bei freier Perforation oder ausbleibender Besserung."}, {"q": "Frage 4: Welche OP-Indikationen bestehen bei der Divertikulitis?", "a": "Absolute OP-Indikationen: freie Perforation mit Peritonitis (Hinchey III/IV), konservativ nicht beherrschbarer Abszess, Fistelbildung (z. B. kolovesikal), Obstruktion. Relative OP-Indikationen: rezidivierende Divertikulitis (≥ 2 Schübe), komplizierter Verlauf, Immunsuppression, junges Alter (individuell)."}, {"q": "Frage 5: Was bedeutet pT4NxMx?", "a": "TNM-Klassifikation beim Kolonkarzinom: pT4 = Tumor infiltriert direkt in benachbarte Organe oder Strukturen (T4a: Tumor perforiert das viszerale Peritoneum; T4b: Tumor infiltriert direkt andere Organe/Strukturen). Nx = Regionäre Lymphknoten können nicht beurteilt werden. Mx = Fernmetastasen können nicht beurteilt werden (in der Praxis wenig verwendet; meist M0 oder M1)."}, {"q": "Frage 6: Wie ist das Vorgehen beim Kolonkarzinom?", "a": "Diagnose: Koloskopie mit Biopsie, CT Thorax/Abdomen/Becken zum Staging, ggf. MRT (Rektum), CEA-Bestimmung. Operation: onkologische Resektion mit Entfernung des tumortragenden Kolonsegments und des zugehörigen Lymphabflussgebiets (z. B. Hemikolektomie rechts/links, Sigmaresektion). Adjuvante Chemotherapie: ab Stadium III (nodal positiv) empfohlen (FOLFOX oder CAPOX). Nachsorge: klinisch, CEA, Koloskopie, Bildgebung."}, {"q": "Frage 7: Warum müssen mindestens 12–14 Lymphknoten entfernt werden?", "a": "Die Entfernung von mindestens 12 Lymphknoten (Mindeststandard nach UICC/S3-Leitlinie, in der Prüfung wurden 14 genannt) ist notwendig, um eine valide"}, {"q": "Frage 1: Wie gehen Sie in der Notaufnahme vor?", "a": "Anamnese (Unfallhergang, Zeitpunkt, Tetanusimpfstatus). Inspektion und klinische Untersuchung: Wundtiefe, Verschmutzung, Durchblutung, Motorik, Sensibilität distal der Wunde. Röntgen der Hand (Fremdkörper, Fraktur ausschließen). Wundreinigung und sterile Abdeckung. Entscheidung: primäre Wundversorgung vs. operative Exploration."}, {"q": "Frage 2: Wie erkennt man eine Läsion der Flexor-digitorum-Sehnen?", "a": "Klinische Prüfung: FDP (M. flexor digitorum profundus): fehlende Beugung im DIP-Gelenk bei fixiertem PIP-Gelenk → Läsion des FDP. FDS (M. flexor digitorum superficialis): fehlende Beugung im PIP-Gelenk bei gestreckten Nachbarfingern → Läsion des FDS. Beide Sehnen: vollständige Beugeunfähigkeit aller Fingergelenke."}, {"q": "Frage 3: Wann besteht eine OP-Indikation?", "a": "OP-Indikation bei: vollständiger oder partieller (> 50 %) Sehnendurchtrennung (primäre Sehnennaht, idealerweise innerhalb von 6–12 Stunden), Nervenverletzung (digitale Nerven), Gefäßverletzung mit Ischämie, Fraktur oder Gelenkbeteiligung."}, {"q": "Frage 4: Wie wird der Tetanusschutz gehandhabt?", "a": "Impfstatus prüfen: Vollständig geimpft und Auffrischung ≤ 5 Jahre: kein Handlungsbedarf. Vollständig geimpft, Auffrischung > 5–10 Jahre: Auffrischimpfung mit Tetanol 0,5 ml i.m. Unvollständig geimpft oder Impfstatus unbekannt: Simultanimpfung: Tetanol 0,5 ml i.m. (aktive Immunisierung) + Tetanus-Immunglobulin (TIG, z. B. Tetagam) 250 IE i.m. an anderer Injektionsstelle (passive Immunisierung mit Antikörpern). Nie zuvor geimpft: wie oben (Simultanimpfung) + Vervollständigung des Grundimmunisierungsschemas (3 Dosen)."}, {"q": "Frage 5: Was ist Tetanol?", "a": "Tetanol ist ein Tetanus-Adsorbat-Impfstoff (Toxoid-Impfstoff) zur aktiven Immunisierung gegen Tetanus. Dosierung: 0,5 ml i.m. (z. B. in den M. deltoideus)."}, {"q": "Frage 6: Was gibt man, wenn keine vorherige Impfung stattgefunden hat?", "a": "Bei fehlender Vorimpfung wird zusätzlich zum aktiven Impfstoff (Tetanol 0,5 ml i.m.) das Tetanus-Immunglobulin (TIG) verabreicht. Das TIG enthält humane Antikörper"}], "runde_2": [{"q": "Frage 1: Wie behandeln Sie den AV-Block III. Grades?", "a": "Sofortmaßnahmen: Monitoring, i.v.-Zugang, Reanimationsbereitschaft. Medikamentös (überbrückend): Atropin 0,5–1 mg i.v. (Mittel der 1. Wahl bei hämodynamischer Instabilität). Bei Versagen: Orciprenalin (Alupent) 0,5 mg langsam i.v. oder als Infusion, alternativ Adrenalin. Temporärer Schrittmacher: transkütan (extern) als Notfallmaßnahme, dann transvenöser Schrittmacher. Definitiv: Implantation eines permanenten Herzschrittmachers (Indikation bei symptomatischem AV-Block III)."}, {"q": "Frage 2: Was ist das Adams-Stokes-Syndrom?", "a": "Das Adams-Stokes-Syndrom (auch Morgagni-Adams-Stokes-Syndrom) bezeichnet rezidivierende, kurze Bewusstlosigkeiten (Synkopen) durch einen plötzlichen Herzstillstand oder eine extreme Bradykardie infolge eines AV-Blocks (meist III. Grades) oder anderer Rhythmusstörungen. Klinisch: abrupter Bewusstseinsverlust, Blässe, ggf. Krämpfe, spontane Erholung nach wenigen Sekunden bis Minuten. Ursache: zerebrale Minderperfusion durch Asystolie oder hochgradige Bradykardie."}, {"q": "Frage 3: Welche anderen Ursachen einer Synkope gibt es (Differenzialdiagnosen)?", "a": "Kardiogene Synkope: Arrhythmien (Tachykardie, Bradykardie, AV-Block), strukturelle Herzerkrankungen (Aortenstenose, HCM, Myokardinfarkt), Perikardtamponade. Vasovagale Synkope (neurokardiogen): häufigste Ursache, ausgelöst durch Schmerz, Aufregung, langes Stehen. Orthostatische Hypotonie: Volumenmangel, Medikamente (Antihypertensiva, Diuretika), autonome Neuropathie. Zerebrovaskulär: TIA, Basilarisinsuffizienz (eher Präsynkope). Metabolisch: Hypoglykämie, Hypoxie. Situationssynkope: Miktion, Defäkation, Husten."}, {"q": "Frage 4: Wie ist die Pathogenese des AV-Blocks III.?", "a": "Beim AV-Block III. Grades (totaler AV-Block) besteht eine vollständige Unterbrechung der Reizüberleitung vom Sinusknoten über den AV-Knoten auf die Ventrikel. Vorhöfe und Kammern schlagen vollkommen unabhängig voneinander (AVDissoziation): Die Vorhöfe werden vom Sinusknoten mit normaler Frequenz depolarisiert (P-Wellen im EKG normal). Die Kammern werden durch einen Ersatzrhythmus aktiviert: junktionaler Ersatzrhythmus (AV-Knoten, 40–60/min, schmal) oder ventrikulärer Ersatzrhythmus (His-Purkinje, < 40/min, breit). Ursachen: koronare Herzerkrankung (Myokardinfarkt), degenerativ (Lenegre, Lev), Myokarditis, iatrogen (nach Herzoperation, Ablation), Medikamente (Digitalis, Betablocker, Verapamil), infiltrative Erkrankungen (Sarkoidose, Amyloidose)."}], "runde_3": [{"q": "Frage 1: Welche Differenzialdiagnosen kommen in Betracht?", "a": "Chronisch-thromboembolische pulmonale Hypertonie (CTEPH): durch rezidivierende, nicht vollständig resorbierte Lungenembolien; Risikofaktoren: Nikotinabusus + Pille (Thrombophilie). Pulmonale Hypertonie anderer Ursache. Akute Lungenembolie (bei schubweisem Verlauf). Asthma bronchiale / COPD (Nikotinabusus). Anämie. Frage 2: Was ist die Differenzialdiagnose zum Vorhofseptumdefekt und was ist die"}, {"q": "Bubble-Study?", "a": "Ein Vorhofseptumdefekt (ASD) kann ebenfalls zu Dyspnoe und pulmonaler Hypertonie führen. Bei längerem Bestehen kann es zur Eisenmenger-Reaktion kommen (Shuntumkehr). Bubble-Study (Kontrastmittelechokardiografie): i.v. Injektion von agitierter NaCl (erzeugt Mikrobläschen). Normalerweise werden die Bläschen in der Lunge herausgefiltert. Bei einem Rechts-Links-Shunt (z. B. ASD, PFO) erscheinen die Bläschen im linken Herzen → positiver Befund beweist den Shunt."}, {"q": "Frage 1: Welche Diagnose stellen Sie?", "a": "Antwort (Kandidat): Conn-Syndrom (primärer Hyperaldosteronismus). Anmerkung des Prüfers: Der Prüfer zeigte anschließend das Bild eines typischen Cushing-Syndroms (Vollmondgesicht, Stammfettsucht, Striae)."}, {"q": "Frage 2: Warum passt das Cushing-Syndrom besser?", "a": "Beim Cushing-Syndrom führt ein Kortisol-Exzess zu: Hypertonie (durch mineralokortikoide Wirkung von Kortisol und Aktivierung des RAAS). Hyperglykämie (diabetogene Wirkung von Kortisol: Glukoneogenese ↑, Insulinresistenz ↑). Hypokaliämie (mineralokortikoide Wirkung). Hypernatriämie (Natriumretention). Klinisch: Vollmondgesicht, Büffelnacken, Stammfettsucht, Striae rubrae, Muskelschwäche, Osteoporose, Akne. Abgrenzung zum Conn-Syndrom: Beim Conn-Syndrom (primärer Hyperaldosteronismus) bestehen ebenfalls Hypertonie, Hypokaliämie und Hypernatriämie, jedoch keine Hyperglykämie als Leitsymptom. Das klinische Bild (Cushing-Habitus) und die Hyperglykämie sprechen hier für Cushing. Diagnose des"}, {"q": "Frage 1: Welche Diagnostik führen Sie durch?", "a": "Klinisch: klassisch betroffenes Gelenk (Großzehengrundgelenk = Podagra), Rötung, Schwellung, Überwärmung, starke Schmerzen. Labor: Harnsäure im Serum (kann im Anfall normal oder erniedrigt sein – siehe unten), BB, CRP, BSG, Kreatinin, Urinstatus. Gelenkpunktion (Goldstandard): polarisationsmikroskopischer Nachweis von negativ doppelbrechenden Natriumuratkristallen in der Synovialflüssigkeit. Röntgen: im frühen Stadium oft unauffällig, bei chronischer Gicht: Usuren, Tophi. Sonografie: Doppelkonturzeichen (Uratkristallablagerungen auf dem Knorpel), Tophi."}, {"q": "Frage 2: Welche Differenzialdiagnosen gibt es?", "a": "Septische Arthritis (bakterielle Gelenkinfektion – immer ausschließen!). Pseudogicht (Chondrokalzinose, CPPD): Kalziumpyrophosphatkristalle, positiv doppelbrechend. Reaktive Arthritis. Rheumatoide Arthritis (bei jungem Patient eher untypisch für monoartikulären akuten Verlauf). Traumatische Arthritis / Hämatarthros. Palindromer Rheumatismus. Frage 3: Warum sieht man im akuten Gichtanfall häufig keine Hyperurikämie (erhöhte"}, {"q": "Harnsäure im Serum)?", "a": "Im akuten Gichtanfall fallen die Serum-Harnsäurewerte häufig vorübergehend ab oder normalisieren sich, weil: Die Harnsäure massiv in das entzündete Gelenk einwandert (Kristallpräzipitation), wodurch der Serumpool sinkt. Akute-Phase-Reaktion: Entzündungsmediatoren (IL-6, IL-1β) fördern die renale Harnsäureausscheidung. Stressreaktion: ACTH-Ausschüttung → urikosurische Wirkung. Praktische Konsequenz: Ein normaler Harnsäurewert im Anfall schließt Gicht nicht aus. Die Harnsäure sollte 2–4 Wochen nach dem Anfall kontrolliert werden."}], "title": "Fall 14", "header": "Fall 14\nKenntnisprüfung – Erfahrungsbericht\nDatum der Nachricht: 12.05.2026 Datum der Prüfung: 12.05.2026, 09:45 Uhr\nErgebnis: Bestanden (1. Versuch)\nAllgemeines\nDie Prüfung war weniger kompliziert als erwartet. Die Atmosphäre war angenehm und\nfreundlich; die Prüfer halfen gelegentlich weiter. Der Unfallchirurg war etwas strenger\nund erwartete präzise Antworten. Der Kandidat arbeitet seit August (Jahr nicht\nangegeben, vermutlich 2025) in der Unfallchirurgie in Deutschland.\n Eigener Fall: Divertikulitis\n Weitere Fälle der Gruppe: Diabetes mellitus (DM), Herzinsuffizienz (HI)\nAblauf der Prüfung\nPraktischer Teil (Teil 1)\nDer erste Teil verlief gut. Aus Zeitmangel konnten die neurologische Untersuchung und\nder Gefäßstatus nicht vollständig durchgeführt werden. Daraufhin stellte der Prüfer\n(Unfallchirurg) gezielte Fragen zu diesen Untersuchungen.\nFrage des Prüfers: Wie würden Sie den Gefäßstatus kontrollieren?\nAntwort: Der Gefäßstatus wird klinisch durch Auskultation (Strömungsgeräusche über\nGefäßen, z. B. A. carotis, A. renalis, Aorta abdominalis) und Palpation (Pulse an\ndefinierten Punkten: A. radialis, A. femoralis, A. poplitea, A. dorsalis pedis, A. tibialis\nposterior) erhoben. Ergänzend: Inspektion (Hautfarbe, Trophik, Ulzera),\nKapillarfüllungszeit, ggf. Knöchel-Arm-Index (ABI) sowie bei Bedarf Duplexsonografie\noder CT-Angiografie.\nSchriftlicher Teil\nUnauffällig, ohne besondere Vorkommnisse.\nFallvorstellungen und Fragen", "clinical_case": "**Hauptsymptom:** Akuter Bauchschmerz im linken Unterbauch mit Übelkeit und Fieber\n\n**Anamnese:** Ein 58-jähriger männlicher Patient präsentiert sich mit plötzlich einsetzenden, starken Bauchschmerzen im linken Unterbauch, die vor 12 Stunden begannen. Der Schmerz ist konstant, wird begleitet von Übelkeit und leichtem Fieber (37,8°C). Der Patient hat in der Vergangenheit mehrere ähnliche, aber mildere Episoden gehabt. Er ist übergewichtig (BMI 28), raucht gelegentlich und hat eine unauffällige Vormedikation.\n\n**Klinische Befunde:** Allgemeinzustand: mäßig beeinträchtigt. Vitale Parameter: RR 145/88, HR 88/min, Temperatur 37,8°C. Abdominell: lokalisierter Druckschmerz und Abwehrspannung im linken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_15": {"case_info": "Fall 15\nPrüfungsbericht – Klinisch-Praktische Prüfung (KP)\nDatum der Prüfung: 12.05.2026, 09:00 Uhr Datum der Nachricht: 12.05.2026, 19:41\nUhr Ergebnis: Bestanden (1. Versuch) Prüfungsfall: Pyelonephritis", "runde_1": [{"q": "Welche Verdachtsdiagnose stellen Sie?", "a": "Pyelonephritis (akute bakterielle Entzündung des Nierenparenchyms und des Nierenbeckens). Typische Trias: Flankenschmerz, Fieber, Klopfschmerz über den Nierenlagern. Häufigster Erreger: Escherichia coli."}, {"q": "Wie behandeln Sie die Pyelonephritis?", "a": ""}, {"q": "Wie lange dauert die Antibiotikatherapie?", "a": "  "}, {"q": "Welche Komplikationen können auftreten?", "a": ""}, {"q": "Ist das Hantavirus in Deutschland relevant?", "a": "Ja, Hantavirus ist in Deutschland klinisch relevant. Deutschland gehört zu den Ländern mit den höchsten Hantavirus-Fallzahlen in Europa. Wichtige Punkte:   "}, {"q": "Welche Verdachtsdiagnose stellen Sie?", "a": "Pyelonephritis (akute bakterielle Entzündung des Nierenparenchyms und des Nierenbeckens). Typische Trias: Flankenschmerz, Fieber, Klopfschmerz über den Nierenlagern. Häufigster Erreger: Escherichia coli."}, {"q": "Wie lange dauert die Antibiotikatherapie?", "a": "  "}, {"q": "Erklären Sie die Pathophysiologie der renalen Anämie.", "a": "Die renale Anämie entsteht durch die verminderte Produktion von Erythropoetin (EPO) infolge chronischer Niereninsuffizienz: 1. Bei chronischer Nierenerkrankung nimmt die Masse funktionstüchtiger Nierenzellen ab. 2. Die peritubulären Fibroblasten der Niere produzieren weniger EPO. 3. EPO ist der wichtigste Wachstumsfaktor für die erythroide Vorläuferzellreifung im Knochenmark. 4. Mangelndes EPO → verminderte Erythropoese → normozytäre, normochrome Anämie. 5. Zusätzliche Faktoren: verkürzte Erythrozytenlebensdauer, Eisenmangel (durch Hämodialyse-Blutverluste, eingeschränkte Resorption), chronische Entzündung (Hepcidin-Anstieg → funktioneller Eisenmangel). Therapie: Erythropoetin-stimulierende Agenzien (ESA, z. B. Darbepoetin alfa) + Eisensubstitution."}, {"q": "Ist das Hantavirus in Deutschland relevant?", "a": "Ja, Hantavirus ist in Deutschland klinisch relevant. Deutschland gehört zu den Ländern mit den höchsten Hantavirus-Fallzahlen in Europa. Wichtige Punkte:   "}], "runde_2": [{"q": "im Schockraum sind erforderlich?", "a": "Sofortmaßnahmen am Unfallort (ABCDE-Schema) A – Airway (Atemweg):    "}, {"q": "Welches Vorgehen, welche Diagnostik und Therapie sowie welche Maßnahmen im Schockraum sind erforderlich?", "a": "Sofortmaßnahmen am Unfallort (ABCDE-Schema) A – Airway (Atemweg):    "}], "runde_3": [{"q": "beachten?", "a": "    "}, {"q": "Welche Grundprinzipien des Strahlenschutzes gelten in der Medizin?", "a": "Der Strahlenschutz basiert in Deutschland auf dem Strahlenschutzgesetz (StrlSchG) und der Strahlenschutzverordnung (StrlSchV), die die EU-Richtlinie 2013/59/Euratom umsetzen. Drei Grundprinzipien: 1. Rechtfertigung: Jede Strahlenanwendung muss medizinisch gerechtfertigt sein (Nutzen > Risiko). Indikationsstellung durch einen ermächtigten Arzt. 2. Optimierung (ALARA-Prinzip): Die Strahlenexposition ist so gering wie vernünftigerweise erreichbar zu halten (As Low As Reasonably Achievable) – niedrigste effektive Dosis für diagnostischen/therapeutischen Zweck. 3. Dosisbegrenzung: Einhaltung gesetzlicher Grenzwerte für beruflich strahlenexponierte Personen (z. B. effektive Jahresdosis: 20 mSv für beruflich Exponierte; 1 mSv für die Bevölkerung). Praktische Maßnahmen:      "}, {"q": "Was ist die Berufsgenossenschaft (BG) und was ist bei einem BG-Fall zu beachten?", "a": "    "}, {"q": "Welche Grundprinzipien des Strahlenschutzes gelten in der Medizin?", "a": "Der Strahlenschutz basiert in Deutschland auf dem Strahlenschutzgesetz (StrlSchG) und der Strahlenschutzverordnung (StrlSchV), die die EU-Richtlinie 2013/59/Euratom umsetzen. Drei Grundprinzipien: 1. Rechtfertigung: Jede Strahlenanwendung muss medizinisch gerechtfertigt sein (Nutzen > Risiko). Indikationsstellung durch einen ermächtigten Arzt. 2. Optimierung (ALARA-Prinzip): Die Strahlenexposition ist so gering wie vernünftigerweise erreichbar zu halten (As Low As Reasonably Achievable) – niedrigste effektive Dosis für diagnostischen/therapeutischen Zweck. 3. Dosisbegrenzung: Einhaltung gesetzlicher Grenzwerte für beruflich strahlenexponierte Personen (z. B. effektive Jahresdosis: 20 mSv für beruflich Exponierte; 1 mSv für die Bevölkerung). Praktische Maßnahmen:      "}], "clinical_case": "**Hauptsymptom:** Fall 15\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 15. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_16": {"case_info": "Fall 16\nKenntnisprüfung – Erfahrungsbericht\nDatum der Nachricht: 12.05.2026 Datum der Prüfung: 12.05.2026, 09:45 Uhr\nErgebnis: Bestanden (3/3)\n\nÜbersicht der Fälle\nRunde\nHauptfall (1. Runde)\nWeitere Fälle\n(Erwähnung)\n2. Runde\n3. Runde\n\nThema\nDiabetes mellitus Typ 2\nDivertikulitis, Herzinsuffizienz\nSeptische Arthritis, Pertrochantäre Femurfraktur,\nStrahlenschutz\nTachyarrhythmia absoluta (TAA) bei Vorhofflattern,\nPolymyalgia rheumatica\n\nHauptfall: Diabetes mellitus Typ 2\nPatientin: 76 Jahre alt Ablauf: Anamnese, körperliche Untersuchung und\nGesamtuntersuchung verliefen problemlos.\n\nFrage während der körperlichen Untersuchung:\nF: Mit welchen zwei Methoden kann man die Lebergröße bestimmen?\nA:\n1. Perkussion: Durch Beklopfen des Abdomens wird die Lebergröße anhand der\nDämpfungszone bestimmt (Normalwert in der Medioklavikularlinie: 8–12 cm).\n2. Auskultatorische Perkussion (Kratzmethode): Ein Stethoskop wird auf die\nLeber gesetzt, während mit dem Finger über das Abdomen gekratzt wird –\nKlangveränderung zeigt die Lebergrenze an.\nAlternativ: Sonographie – gilt als genaueste Methode, wird aber seltener als\nklassische klinische Methode bei Prüfungen erwartet.\n\n1. Runde – Ausführliche Fallbesprechung\nF: Was ist die Pathogenese des Diabetes mellitus Typ 2?\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nA: Kombination aus Insulinresistenz der peripheren Gewebe (Muskel, Leber,\nFettgewebe) und einem relativen Insulinmangel durch zunehmende Erschöpfung der\npankreatischen Beta-Zellen. Begünstigende Faktoren: Adipositas, Bewegungsmangel,\ngenetische Prädisposition, chronische Entzündung.\n\nF: Wie wird die Diagnose des Diabetes mellitus Typ 2 gestellt?\nA: Diagnosekriterien (eines der folgenden genügt, bei Beschwerdefreiheit Bestätigung\ndurch zweiten Test):\n\n\n\n\n\nNüchternblutzucker ≥ 7,0 mmol/l (≥ 126 mg/dl)\n2-Stunden-Wert im oralen Glukosetoleranztest (oGTT) ≥ 11,1 mmol/l (≥ 200 mg/dl)\nHbA1c ≥ 6,5 % (≥ 48 mmol/mol)\nZufallsblutzucker ≥ 11,1 mmol/l + typische Symptome\n\nF: Was versteht man unter Nierenbeteiligung beim Diabetes mellitus Typ 2?\nA: Diabetische Nephropathie – eine der häufigsten Komplikationen des Diabetes. Sie\nentsteht durch chronische Hyperglykämie, die zu Verdickung der glomerulären\nBasalmembran, mesangialer Expansion und schließlich zur glomerulären Sklerose\n(Kimmelstiel-Wilson-Läsionen) führt. Klinisch zeigt sie sich durch Albuminurie und\nprogressive Abnahme der GFR.\n\nF: Was ist Albuminurie und welche Bedeutung hat sie?\nA: Albuminurie bezeichnet die Ausscheidung von Albumin im Urin über den Normalwert\n(< 30 mg/g Kreatinin). Einteilung:\n\n\n\nMikroalbuminurie (A2): 30–300 mg/g Kreatinin → Frühzeichen der diabetischen\nNephropathie\nMakroalbuminurie (A3): > 300 mg/g Kreatinin → fortgeschrittene\nNierenschädigung Sie gilt als wichtiger Marker für kardiovaskuläres Risiko und\nNierenprogression.\n\nF: Was ist die GFR und wie wird sie gemessen?\nA: Die glomeruläre Filtrationsrate (GFR) gibt an, wie viel Blutplasma pro Minute durch\ndie Glomeruli gefiltert wird. Normalwert: ≥ 90 ml/min/1,73 m².\nMessung:\n\n\nKlinisch (geschätzte GFR = eGFR): Berechnung mittels Serumkreatinin und\nFormeln (CKD-EPI oder MDRD), unter Berücksichtigung von Alter, Geschlecht\nund ggf. Körpergewicht.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nExakt: Inulin-Clearance (Goldstandard, nur in Forschung) oder Cystatin-Cbasierte Schätzung.\n\nF: Welche Kriterien bestätigen eine diabetische Nephropathie?\nA: Die diabetische Nephropathie wird klinisch (ohne Biopsie) bestätigt durch:\n1. Persistierende Albuminurie (Mikroalbuminurie oder Makroalbuminurie) in mind. 2\nvon 3 Messungen über 3–6 Monate\n2. Abnehmende GFR über die Zeit\n3. Lange Diabetesdauer (meist > 10 Jahre)\n4. Begleitende diabetische Retinopathie (erhöht die Wahrscheinlichkeit erheblich)\n5. Ausschluss anderer Ursachen einer Nierenerkrankung\nNierenbiopsie nur bei atypischem Verlauf (z. B. kein Retinopathie-Befund,\nrasche Progression, Hämaturie).\n\n2. Runde\nSeptische Arthritis nach Zahnbehandlung\nF: Was ist eine septische Arthritis und wie entsteht sie nach Zahnbehandlung?\nA: Bakterielle Infektion eines Gelenks, meist durch hämatogene Streuung (Bakteriämie).\nNach Zahnbehandlung können Erreger (v. a. Streptokokken, Staphylokokken) in die\nBlutbahn gelangen und sich in einem vorgeschädigten oder gesunden Gelenk absiedeln.\nKlinik: Akut entzündetes, schmerzhaftes, überwärmtes, geschwollenes Gelenk; Fieber,\neingeschränkte Beweglichkeit; erhöhte Entzündungsparameter (CRP, BSG, Leukozyten).\nDiagnose: Gelenkpunktion mit Synovialanalyse (Leukozyten > 50.000/µl, GramFärbung, Kultur), Bildgebung (Röntgen, Sonographie, MRT).\nTherapie: Sofortige empirische Antibiotikatherapie (z. B. Staphylokokken-wirksam:\nFlucloxacillin oder Vancomycin bei MRSA-Verdacht), chirurgische Gelenkdrainage\n(Arthroskopie oder offene Spülung), Ruhigstellung, dann Mobilisation.\n\nF: Was ist eine Arthroskopie?\nA: Minimal-invasives Verfahren zur Diagnostik und Therapie von Gelenkerkrankungen.\nEin Arthroskop (Kamera) wird über kleine Inzisionen in das Gelenk eingeführt. Bei\nseptischer Arthritis dient sie der Gelenkspülung und Drainage.\n\nF: Wie wird die körperliche Untersuchung des Kniegelenks durchgeführt und wie\nerkennt man einen Gelenkerguss?\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nA: KU des Kniegelenks:\n\n\n\n\n\n\nInspektion: Schwellung, Rötung, Achsabweichung\nPalpation: Überwärmung, Druckschmerz (medialer/lateraler Gelenkspalt, Patella)\nBewegungsmaß: Beugung/Streckung (Neutral-Null-Methode)\nStabilitätstests: Vorderes/hinteres Kreuzband (Lachman, Schubladentest),\nKollateralbänder (Valgus-/Varusstress)\nMeniskustests: McMurray, Steinmann I+II\n\nGelenkerguss-Nachweis:\n\n\n\nTanzende Patella (Patellabalottement): Flüssigkeit wird aus dem Recessus\nsuprapatellaris nach unten gedrückt und die Patella von der Gelenkfläche\nabgehoben – bei Druck auf die Patella ist ein federndes Zurückschnellen spürbar.\nWische-Test (Stroke-Test): Bei kleinen Ergüssen – Flüssigkeit wird auf eine\nSeite gewischt, dann von der Gegenseite zurückgewischt → sichtbare Welle.\n\nF: Wie wird eine Kniepunktion (Arthrozentese) durchgeführt?\nA: Vorgehen:\n1. Aufklärung und Einwilligung des Patienten\n2. Lagerung: Rückenlage, Knie leicht gebeugt (ca. 20–30°) oder gestreckt\n3. Sterile Vorbereitung: Hautdesinfektion, sterile Handschuhe, steriles Abdecktuch\n4. Lokalanästhesie der Einstichstelle\n5. Zugang: Lateral oder medial der Patella (superolateral häufigster Zugang), Nadel\nzwischen Patella und Femurkondyle in den Gelenkspalt einführen\n6. Aspiration der Synovialflüssigkeit (Menge, Farbe, Trübung dokumentieren)\n7. Probenentnahme für Mikrobiologie (Kultur, Gram), Zytologie (Zellzahl), Biochemie\n(Glukose, Protein, Harnsäurekristalle)\n8. Steriler Verband, Kompression\n9. Dokumentation und Nachbeobachtung\n\nPertrochantäre Femurfraktur\nF: Was ist eine pertrochantäre Femurfraktur? Wie lautet die Diagnose, Klinik und\nTherapie?\nA: Definition: Fraktur des proximalen Femurs im Bereich zwischen Trochanter major\nund minor, außerhalb der Gelenkkapsel (extrakapsulär).\nKlinik:\n\n\n\n\nSturzereignis (typisch: ältere Patientin, Osteoporose)\nSchmerzen in Hüfte und Leiste\nBeinverkürzung und Außenrotation des betroffenen Beins\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nBelastungsunfähigkeit\n\nDiagnose: Röntgen Becken a.p. + Hüfte axial; ggf. CT bei unklarem Befund.\nKlassifikation: AO/OTA-Klassifikation (31-A1 bis A3)\nTherapie: Operativ (innerhalb 24–48 h):\n\n\n\n\nStabile Frakturen (A1, A2.1): Dynamische Hüftschraube (DHS) – eine\nGleitschraube im Schenkelhals, verbunden mit einer Platte am Femurschaft →\nkontrollierte Kompression\nInstabile/mehrteilige Frakturen (A2.2–A3): Proximaler Femurnagel (PFN) /\nGammanagel (Marknagel) – intramedulläre Stabilisierung, biomechanisch\ngünstiger bei instabilen Mustern\nBei sehr alten Patienten mit schwerer Osteoporose: Hüft-Totalendoprothese\n(Hüft-TEP) oder Duokopfprothese möglich\n\nF: Was ist der Unterschied zwischen DHS und Marknagel?\nA:\nDHS (Dynamische\nMerkmal Hüftschraube)\nTyp\nExtramedullär (Platte +\nSchraube)\nIndikation Stabile per-/intertrochantäre\nFrakturen\nVorteil\nEinfach, günstig, bewährt\nNachteil\nSchlechtere Biomechanik bei\nInstabilität\n\nMarknagel (PFN/Gamma-Nagel)\nIntramedullär (Nagel im Markraum)\nInstabile, subtrochantäre,\nmehrfragmentäre Frakturen\nKürzerer Hebelarm, höhere Stabilität\nTechnisch anspruchsvoller\n\nF: Welche Fragen wurden zum Strahlenschutz gestellt?\nA: Konkrete Fragen wurden nicht dokumentiert. Wichtige Grundprinzipien des\nStrahlenschutzes:\n\n\n\n\n\n\n\nALARA-Prinzip: „As Low As Reasonably Achievable“ – Strahlenexposition so\ngering wie möglich halten\nRechtfertigung: Jede Strahlenanwendung muss medizinisch gerechtfertigt sein\nOptimierung: Dosisreduktion durch Kollimation, Abstand, Bleiabschirmung,\nkurze Expositionszeit\nGrenzwerte: Für Berufsexponierte und Bevölkerung gesetzlich festgelegt\n(Strahlenschutzgesetz, StrlSchG)\nSchwangere: Besondere Schutzmaßnahmen; Untersuchungen wenn möglich\nvermeiden oder Bauchschutz verwenden\nPatientenschutz: Bleiabdeckung, minimale Strahlenfelder, Distanz\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n3. Runde\nTachyarrhythmia absoluta (TAA) bei Vorhofflattern\nF: Wie erkennt man im EKG ein Vorhofflattern und was ist das Vorgehen?\nA: EKG-Befund bei Vorhofflattern:\n\n\n\n\n\nTypische Sägezahn-P-Wellen (Flutter-Wellen, F-Wellen) mit Frequenz 250–\n350/min\nMeist regelmäßige Überleitung mit fixem Block (2:1, 3:1, 4:1)\nBei variabler Überleitung → unregelmäßige Ventrikelfrequenz → TAA-Bild\nSchmale QRS-Komplexe (sofern keine aberrante Leitung)\n\nVorgehen:\n1. Klinische Stabilität prüfen (Blutdruck, Bewusstsein, Symptome)\n2. Monitoring, i.v.-Zugang, Sauerstoff\n3. Frequenzkontrolle (bei stabiler Hämodynamik): Betablocker,\nKalziumantagonisten (Verapamil, Diltiazem) oder Digitalis\n4. Rhythmuskontrolle: Elektrische Kardioversion (Mittel der Wahl bei Vorhofflattern,\nsehr effektiv) oder Antiarrhythmika (Amiodaron)\n5. Antikoagulation: Thromboembolieprophylaxe (NOAC/Heparin) – wie bei\nVorhofflimmern\nF: Was ist Adenosin, wie wirkt es und warum wird es eingesetzt?\nA: Adenosin ist ein endogenes Nukleosid mit kurzer Halbwertszeit (< 10 Sekunden).\nWirkung:\n\n\n\nBindet an A1-Rezeptoren am AV-Knoten → kurzfristige Hemmung der AVÜberleitung (negative Dromotropie)\nVerlangsamt den Sinusknoten transienter (negative Chronotropie)\n\nEinsatz:\n\n\n\nDiagnostisch: Demaskierung von Vorhofaktivität bei schneller Ventrikelfrequenz\n– durch vorübergehenden AV-Block werden Vorhofflatternwellen sichtbar\nTherapeutisch: Akute Behandlung von AV-Knoten-abhängigen Tachykardien (z.\nB. AV-Reentry-Tachykardie, AVNRT) – Adenosin terminiert diese Tachykardien\ndurch Unterbrechung des Reentry-Kreises\nWichtig: Adenosin ist bei Vorhofflattern nicht kurativ, kann aber diagnostisch\nhilfreich sein.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nF: Welche weitere Therapie gibt es bei Vorhofflattern?\nA:\n\n\n\n\n\nElektrische Kardioversion (Therapie der Wahl, hohe Erfolgsrate > 95 %)\nKatheterablation (kurativ): Ablation des kavotrikuspidalen Isthmus –\nDauerheilung möglich, Mittel der Wahl bei rezidivierendem Vorhofflattern\nAntiarrhythmika: Amiodaron, Flecainid (nur bei strukturell gesundem Herzen),\nPropafenon\nLangfristig: Antikoagulation (CHA₂ DS₂ -VASc-Score), Therapie der\nGrunderkrankung\n\nPolymyalgia rheumatica (PMR)\nF: Was sind die Symptome und die Klinik der Polymyalgia rheumatica?\nA:\n\n\n\n\n\n\n\nSchmerzen und Morgensteifigkeit (> 45 Minuten) in Schulter-, Nacken- und\nBeckengürtelregion\nTypisch: beidseitig, symmetrisch\nBeginn meist nach dem 50. Lebensjahr (Median 72 Jahre), häufiger bei Frauen\nAllgemeinsymptome: Abgeschlagenheit, Gewichtsverlust, subfebrile\nTemperaturen, Nachtschweiß\nKeine eigentliche Muskelschwäche (im Gegensatz zu Myositis)\nEingeschränkte Schulter- und Hüftbeweglichkeit durch Schmerzen\n\nF: Welcher Zusammenhang besteht zwischen Polymyalgia rheumatica und\nRiesenzellarteriitis?\nA:\n\n\n\n\n\n\nBeide Erkrankungen gehören zum gleichen Krankheitsspektrum (granulomatöse\nVaskulitis großer Gefäße).\nCa. 15–30 % der PMR-Patienten entwickeln eine Riesenzellarteriitis (RZA).\nCa. 40–60 % der RZA-Patienten haben eine PMR.\nDie RZA (Arteriitis temporalis) kann zur Erblindung führen (Ischämie des N.\nopticus) → Notfall!\nBei PMR-Patienten immer auf RZA-Symptome achten: Kopfschmerzen,\nSchläfenarterienschmerz, Kieferschmerzen beim Kauen (Claudicatio\nmasticatoria), Sehstörungen.\n\nF: Wie wird die Polymyalgia rheumatica diagnostiziert?\nA: Diagnosekriterien (ACR/EULAR 2012):\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nAlter ≥ 50 Jahre\nBilaterale Schulterschmerzen\nErhöhte BSG oder CRP\nMorgensteifigkeit > 45 min, Hüftschmerzen/-bewegungseinschränkung, kein\nRF/Anti-CCP, Ultraschallbefund (Bursitis subdeltoidea, Tenosynovitis)\n\nLabor:\n\n\n\n\n\n\nBSG stark erhöht (oft > 50 mm/h, klassisch > 100 mm/h)\nCRP erhöht\nNormochrome normozytäre Anämie möglich\nAlkalische Phosphatase leicht erhöht\nRF, Anti-CCP negativ (zur Abgrenzung von rheumatoider Arthritis)\n\nBildgebung: Sonographie (Bursitis), MRT, PET-CT bei Verdacht auf RZA mit\nAortenbeteiligung.\n\nF: Wie wird die Polymyalgia rheumatica behandelt?\nA:\n\n\n\n\n\n\nKortikosteroide sind die Therapie der Wahl:\no Initialdosis: Prednisolon 15–25 mg/Tag (bei unkomplizierter PMR ohne\nRZA)\no Bei gleichzeitiger RZA: 40–60 mg/Tag (bei Augenbeteiligung sofort 500–\n1000 mg i.v.)\no Schnelles Ansprechen innerhalb von 24–72 h ist diagnostisch wegweisend\no Langsame Dosisreduktion über Monate bis Jahre (Gesamttherapiedauer\n1–2 Jahre)\nMagenschutz: Protonenpumpenhemmer (PPI) begleitend\nOsteoporoseprophylaxe: Kalzium, Vitamin D, ggf. Bisphosphonate\nSteroidsparende Therapie bei Rezidiven oder Steroidnebenwirkungen:\nTocilizumab (IL-6-Inhibitor), Methotrexat\n\nErklärung und wichtige Hinweise\nAllgemeine Hinweise zur Prüfung\n\n\n\nDie Prüfung umfasste drei Runden mit unterschiedlichen thematischen\nSchwerpunkten: Innere Medizin (Diabetes mellitus, Kardiologie, Rheumatologie),\nChir tellt.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nAnmerkung: Das PsychKG ist länderspezifisch – die Voraussetzungen können\nje nach Bundesland variieren. Voraussetzung ist in der Regel eine psychische\nErkrankung + Gefährdung.\nNeuer Fall – Fieber und Halsschmerzen nach Schmerzmitteleinnahme\nPatient: Junger Patient, Fieber + Halsschmerzen, 2 Tage nach Einnahme von\nNovaminsulfon (Metamizol / Novalgin)\nF: Diagnose?\nAgranulozytose – schwere, potenziell lebensbedrohliche Nebenwirkung von Metamizol\n(Novalgin).\nVorgehen:\n1. Metamizol sofort absetzen\n2. Notfalllabor: Differenzialblutbild (Granulozytopenie: Neutrophile <500/µl)\n3. Isolation des Patienten (Umkehrisolation)\n4. Breitbandantibiotika empirisch bei Fieber/Infektzeichen\n5. Ggf. G-CSF (Granulozyten-Kolonie-stimulierender Faktor) zur Stimulation der\nGranulopoese\n6. Engmaschige Laborkontrollen\nWichtig: Metamizol ist in vielen Ländern (z. B. USA, UK) wegen dieses Risikos\nnicht zugelassen. In Deutschland ist es verschreibungspflichtig. Patienten\nmüssen über das Agranulozytose-Risiko aufgeklärt werden.\nDritte Runde – Lungenfunktion, Thorax, Frakturen\nLungenfunktionstest\nF: Unterschied Obstruktion vs. Restriktion?\nMerkmal Obstruktion Restriktion\nFEV1/FVC (Tiffeneau) < 70 % (erniedrigt) Normal oder erhöht\nFVC Normal oder leicht erniedrigt Erniedrigt\nTLC Normal oder erhöht Erniedrigt\nFluss-Volumen-Kurve Konkaver Abfall Proportional verkleinert\nHäufigste Erkrankungen:\n Obstruktion: COPD (chronische Bronchitis + Emphysem), Asthma bronchiale\no Pathophysiologie: Verengung der Atemwege durch Entzündung,\nSchleimhyperplasie, Bronchospasmus → erhöhter Atemwegswiderstand\n→ verlängerte Ausatmung, Luftfalle (Air trapping)\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Restriktion: Lungenfibrose, Pleuraerguss, Thoraxdeformität, neuromuskuläre\nErkrankungen\no Pathophysiologie: Verminderung der Lungendehnbarkeit (Compliance) →\nreduziertes L nter Punkt, siehe Erste Runde).\nArztbrief: Wurde verfasst und enthielt die dokumentierten Untersuchungsbefunde und\ndurchgeführten Maßnahmen.\nErste Runde\nFallpräsentation\nVorstellung des Falls einschließlich Familienanamnese.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nFragen zur körperlichen Untersuchung\nF: Was versteht man unter Sensibilitätsstörungen bei Diabetes mellitus Typ 2?\nDiabetische Polyneuropathie führt zu gestörter Oberflächensensibilität\n(Berührung, Schmerz, Temperatur) und Tiefensensibilität (Vibration,\nLageempfinden). Typisch ist ein symmetrisches, strumpf- und\nhandschuhförmiges Verteilungsmuster mit Beginn an den Füßen (Parästhesien,\nTaubheitsgefühl, Brennschmerz).\nF: Wie untersucht man die Sensibilität?\n Berührungssensibilität: Wattebausch oder Fingerkuppe auf der Haut\n Schmerzempfinden: Nadelstich (Einmalnadel)\n Temperaturempfinden: Warm-kalt-Röhrchen (Thermotest)\n Vibrationssinn: Stimmgabel (128 Hz) an knöchernen Prominenzen (z. B.\nInnenknöchel, Großzehe) → Graduierung nach Rydel-Seiffer-Skala (0–8)\n Lageempfinden (Propriozeption): Passive Zehenstellung mit geschlossenen\nAugen benennen lassen\n Zweipunktdiskrimination: Zirkel mit zwei Spitzen\nF: Was wurde bei der körperlichen Untersuchung vergessen?\nDie Reflexprüfung im Rahmen der neurologischen Untersuchung (z. B.\nAchillessehnenreflex, Patellarsehnenreflex). Bei Diabetes mellitus Typ 2 sind\nabgeschwächte oder fehlende Muskeleigenreflexe ein Frühzeichen der\ndiabetischen Polyneuropathie.\nEKG mit Schrittmacher\nF: Wie erkennt man einen Schrittmacherrhythmus im EKG?\nTypische Merkmale:\n Schrittmacher-Spike: Schmale, senkrechte Linie (Artefakt) vor dem stimulierten\nKomplex\n Ventrikulär stimuliert (VVI): Breiter QRS-Komplex (Linksschenkelblock-ähnlich)\nnach dem Spike\n Atrial stimuliert (AAI): Spike vor der P-Welle, normaler QRS\n Dual-chamber (DDD): Ggf. zwei Spikes (atrial + ventrikulär)\n Herzfrequenz entspricht der programmierten Schrittmacherfrequenz (häufig\n60/min)\nRöntgen-Thorax mit Verdacht auf Bronchialkarzinom\nF: Welche radiologischen Befunde können auf ein Bronchialkarzinom hinweisen?\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Rundherd oder raumfordernde Masse (homogen oder inhomogen)\n Unregelmäßige, spiculierte Begrenzung (Spicula)\n Hiläre oder mediastinale Lymphadenopathie\n Atelektase (durch Bronchusokklusion)\n Pleuraerguss\n Zwerchfellhochstand (durch N.-phrenicus-Infiltration)\n Knochendestruktionen (Metastasen)\nF: Wie ist das weitere Vorgehen bei Verdacht auf Bronchialkarzinom?\n1. CT-Thorax/Abdomen mit Kontrastmittel zur Ausdehnung und Staging\n2. Bronchoskopie mit Biopsie zur histologischen Sicherung\n3. PET-CT bei kurativem Therapieanspruch (Fernmetastasenausschluss)\n4. Interdisziplinäres Tumorboard\nTherapie des Diabetes mellitus Typ 2\nF: Welche Medikamentengruppen werden eingesetzt?\nWichtige\nMedikamentengruppe Beispiel Wirkmechanismus Nebenwirkungen\nBiguanide Metformin Hemmung der Laktatazidose\nhepatischen (selten), GI-\nGlukoneogenese, Beschwerden, kein\nVerbesserung der Gewichtsanstieg\nInsulinsensitivität\nSGLT-2-Inhibitoren Empagliflozin, Hemmung der renalen Genitale Mykosen,\nDapagliflozin Glukosereabsorption → Ketoazidose,\nGlukosurie Polyurie; kardio-\nund nephroprotektiv\nGLP-1- Semaglutid, Inkretinwirkung: Übelkeit, Erbrechen,\nRezeptoragonisten Liraglutid Insulinsekretion↑, Gewichtsverlust;\nGlukagonsekretion↓, kardioprotektiv\nMagenentleerung↓,\nSättigungsgefühl↑\nDPP-4-Inhibitoren Sitagliptin, Hemmung des GLP-1- Nasopharyngitis,\n(Gliptine) Saxagliptin Abbaus → verlängerte selten Pankreatitis;\nInkretinwirkung gewichtsneutral\nSulfonylharnstoffe Glibenclamid, Stimulation der Hypoglykämie,\nGlimepirid Insulinsekretion Gewichtszunahme\n(glucoseunabhängig)\nInsulintherapie Diverse Ersatz des Hypoglykämie,\nfehlenden/insuffizienten Gewichtszunahme,\nInsulins Lipohypertrophie\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nWichtige\nMedikamentengruppe Beispiel Wirkmechanismus Nebenwirkungen\nAlpha- Acarbose Verzögerung der Meteorismus,\nGlucosidasehemmer intestinalen Flatulenz, Diarrhö\nKohlenhydratresorption\nTherapiealgorithmus (vereinfacht):\n1. Lebensstiländerung (Ernährung, Bewegung, Gewichtsreduktion) + Metformin\n(Mittel der 1. Wahl, falls keine KI)\n2. Bei unzureichender Kontrolle: Kombination mit SGLT-2-Inhibitor oder GLP-1-RA\n(bevorzugt bei kardiovaskulären Risikofaktoren, Herzinsuffizienz oder chronischer\nNierenerkrankung)\n3. Eskalation bis zur Insulintherapie bei Versagen oraler/s.c. Antidiabetika\nZweite Runde\nKomplikationen des Diabetes mellitus\nF: Welche Komplikationen können auftreten?\nMikrovaskuläre Komplikationen:\n Diabetische Retinopathie (häufigste Erblindungsursache im Erwachsenenalter)\n Diabetische Nephropathie (häufigste Ursache der terminalen Niereninsuffizienz)\n Diabetische Polyneuropathie (peripher und autonom)\nMakrovaskuläre Komplikationen:\n Koronare Herzkrankheit (KHK)\n Zerebrovaskuläre Erkrankungen (Schlaganfall)\n Periphere arterielle Verschlusskrankheit (pAVK)\nWeitere:\n Diabetisches Fußsyndrom\n Erhöhte Infektanfälligkeit\n Erektile Dysfunktion (autonome Neuropathie)\n Hypo- und hyperglykäme Krisen (Ketoazidose, hyperosmolares Koma)\npAVK und Fontaine-Stadien\nF: Was sind die Fontaine-Stadien der pAVK?\nStadium Beschreibung\nI Asymptomatisch; Gefäßverschluss ohne klinische Symptome\nIIa Schmerzfreie Gehstrecke > 200 m (Claudicatio intermittens)\nIIb Schmerzfreie Gehstrecke < 200 m\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nStadium Beschreibung\nIII Ruheschmerz (besonders nachts, im Liegen)\nIV Nekrose, Gangrän, Ulzeration (kritische Ischämie)\nF: Therapie der pAVK?\n Konservativ (alle Stadien): Risikofaktoren eliminieren (Raucherentwöhnung,\nBZ-Einstellung, Blutdruckkontrolle, Statine), Thrombozytenaggregationshemmung\n(ASS 100 mg oder Clopidogrel), str cher: Glykogen, Vitamine (A, D, B12), Eisen (Ferritin), Kupfer\n Immunfunktion: Kupffer-Zellen (Makrophagen)\nF: Welche Leberparameter werden im Labor bestimmt?\nParameter Aussage\nGOT (AST) Leberzellschaden (auch Herzmuskel,\nSkelettmuskel)\nGPT (ALT) Leberspezifischer Zellschaden\nGGT Cholestase, Alkoholkonsum\nAP (Alkalische Phosphatase) Cholestase, Knochen\nBilirubin (gesamt, direkt, Leberfunktion, Hämolyse, Cholestase\nindirekt)\nAlbumin Synthesefunktion (erniedrigt bei Zirrhose)\nQuick / INR Synthesefunktion der Gerinnungsfaktoren\nAmmoniak Hepatische Enzephalopathie\nCHE (Cholinesterase) Synthesefunktion\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nF: Was ist der Child-Pugh-Score?\nKlassifikation der Leberzirrhose nach Schweregrad anhand von 5 Parametern\n(je 1–3 Punkte):\nParameter 1 Punkt 2 Punkte 3 Punkte\nBilirubin (µmol/l) < 34 34–51 > 51\nAlbumin (g/l) > 35 28–35 < 28\nQuick (%) > 70 40–70 < 40\nAszites Keiner Gering/behandelbar Therapierefraktär\nEnzephalopathie Keine Grad I–II Grad III–IV\nAuswertung:\n Child A (5–6 Punkte): Kompensierte Zirrhose, 1-Jahres-Überlebensrate > 95 %\n Child B (7–9 Punkte): Mäßig dekompensiert, ca. 80 %\n Child C (10–15 Punkte): Dekompensiert, ca. 45 %\nEKG mit ST-Hebungen in V2–V5\nF: Diagnose und Maßnahmen?\nDiagnose: Anteroseptaler/Vorderwand-STEMI (ST-Hebungsinfarkt) –\nVerschluss des Ramus interventricularis anterior (RIVA / LAD)\nSofortmaßnahmen (Zeit = Myokard):\n1. Notruf, stationäre Aufnahme, kontinuierliches Monitoring\n2. Venöser Zugang, Blutabnahme (Troponin I/T, CK-MB, BB, Elektrolyte, Gerinnung)\n3. Reperfusion innerhalb von 90 min: Primäre PCI (perkutane\nKoronarintervention) = Goldstandard\n4. Medikamentös: Duale Thrombozytenaggregationshemmung (ASS 250–500 mg\n+ P2Y12-Inhibitor: Ticagrelor oder Prasugrel), Heparin i.v. (unfraktioniert), ggf.\nBetablocker, Nitrate (bei fehlenden Kontraindikationen)\n5. Lyse (Thrombolyse) nur wenn PCI nicht innerhalb von 120 min möglich\nLe  ventriculi und Ulcus duodeni?\nKlinisch nicht zu 100 % trennbar, aber klassisch:\n\n\n\nUlcus ventriculi: Schmerz tritt direkt nach dem Essen auf (Nahrungsaufnahme\nverstärkt den Schmerz)\nUlcus duodeni: Schmerz bessert sich durch Essen (Nahrung puffert die Säure);\nNüchternschmerz und Nachtschmerz typisch\n\nF: Weiteres diagnostisches Vorgehen?\n1. Labor (BB, CRP, Leberwerte, Lipase, Kreatinin, Elektrolyte, Gerinnung)\n2. EKG (zum Ausschluss kardialer Ursache)\n3. Abdomensonographie\n4. Röntgen-Abdomen (ggf. in Linksseitenlage oder im Stehen – zum Ausschluss\nfreier Luft bei Perforation)\n5. Ösophagogastroduodenoskopie (ÖGD) mit Biopsie\nF: Histologie zeigt Helicobacter-pylori-Infektion – was tun?\nEradikationstherapie:\nHeutzutage wird bevorzugt die Pylera-basierte Vierfachtherapie eingesetzt (Bismutbasiert), da Clarithromycin-Resistenzen zunehmen und die klassische Triple-Therapie\n(Clarithromycin + Amoxicillin + PPI) an Wirksamkeit verloren hat.\nPylera-Schema:\n\n\nPylera (enthält: Bismutsubcitrat-Kalium + Metronidazol + Tetracyclin) 3×3\nKapseln täglich zu den Mahlzeiten und 1× zur Nacht\n\n\n\n\no Omeprazol 20 mg 2×/Tag\nDauer: 10 Tage\n\nF: Hb-Wert beträgt 5 g/dl – wie vorgehen?\n1. Venöser Zugang + Infusion\n2. Pantoprazol 80 mg i.v. als Bolus, dann 8 mg/h als Dauerinfusion (auch ohne\nsichtbare aktive Blutung)\n3. Transfusion: Bei Hb < 7 g/dl ist eine Erythrozytenkonzentrat-Transfusion\nindiziert\n4. Vor Transfusion: Eisenstatus bestimmen (Eisen, Ferritin, Transferrin), außerdem\nVitamin B12 und Folsäure\n5. ÖGD zur Blutungsquellensuche und ggf. endoskopische Blutstillung planen (Clips,\nUnterspritzung mit Adrenalin)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nAnmerkung: Pantoprazol i.v. hemmt die Magensäuresekretion und verbessert\ndas Milieu für die Thrombusbildung im Ulkus – daher ist der frühzeitige Einsatz\nsinnvoll, auch ohne aktiv sichtbare Blutung.\n\nFall 2 (Zweite Runde) – Bildgebung, EKG und weiter
