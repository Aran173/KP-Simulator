<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Simulator - Prüfungskommission</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-dark); color: var(--text-primary); line-height: 1.6; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .header { border-bottom: 3px solid var(--primary); margin-bottom: 25px; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px; }
        .header h1 { font-size: 28px; margin-bottom: 5px; color: var(--primary); }
        .header p { font-size: 13px; color: var(--text-secondary); }
        .header-stats { display: flex; gap: 12px; flex-wrap: wrap; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 12px 16px; border-radius: 6px; text-align: center; min-width: 100px; }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--primary); display: block; }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        .progress-container { background: var(--bg-card); border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }
        .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn:hover { background: var(--border); border-color: var(--primary); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.active { background: var(--primary); border-color: var(--primary); }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-success { background: var(--success); border-color: var(--success); }
        .btn-warning { background: var(--warning); border-color: var(--warning); color: #000; }
        .btn-danger { background: var(--danger); border-color: var(--danger); }
        .case-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 25px; margin-bottom: 20px; }
        .case-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .case-title { font-size: 20px; font-weight: bold; color: var(--primary); }
        .case-meta { font-size: 12px; color: var(--text-secondary); }
        .section { margin-bottom: 20px; padding: 15px; background: rgba(255, 255, 255, 0.02); border-radius: 6px; border-left: 3px solid var(--primary); }
        .section-title { font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 14px; }
        .section-content { color: var(--text-secondary); font-size: 14px; line-height: 1.8; }
        .question-block { margin-bottom: 20px; }
        .question-text { font-weight: bold; color: var(--primary); margin-bottom: 8px; font-size: 15px; }
        textarea { width: 100%; min-height: 100px; padding: 12px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); font-family: inherit; font-size: 14px; resize: vertical; }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        .button-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .rating-section { display: none; margin-top: 20px; padding: 20px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.3); }
        .rating-section.show { display: block; }
        .rating-title { font-weight: bold; color: var(--success); margin-bottom: 15px; font-size: 16px; }
        .rating-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .rating-buttons .btn { flex: 1; min-width: 120px; }
        #feedback { display: none; margin-top: 20px; }
        #feedback.show { display: block; }
        .feedback-header { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .feedback-item { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .feedback-q-text { color: var(--primary); font-weight: bold; margin-bottom: 8px; }
        .feedback-answer { color: var(--text-secondary); font-size: 14px; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; margin-bottom: 10px; }
        .solution-answer { color: var(--text-secondary); font-size: 14px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 4px; border-left: 3px solid var(--success); }
        .export-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .export-section h3 { color: var(--primary); margin-bottom: 15px; }
        .export-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        @media (max-width: 768px) {
            .header { flex-direction: column; }
            .case-container { padding: 15px; }
            textarea { min-height: 80px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🏥 KP Simulator</h1>
                <p>Prüfungskommission - Medical Exam Practice</p>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">Erledigt</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="totalCount">49</span>
                    <span class="stat-label">Gesamt</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="progressPct">0%</span>
                    <span class="stat-label">Fortschritt</span>
                </div>
            </div>
        </div>

        <div class="progress-container">
            <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Gesamtfortschritt</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="export-section">
            <h3>📊 Fortschritt verwalten</h3>
            <div class="export-buttons">
                <button class="btn btn-primary" onclick="exportProgress()">📥 Fortschritt exportieren</button>
                <button class="btn btn-primary" onclick="importProgress()">📤 Fortschritt importieren</button>
                <button class="btn btn-warning" onclick="resetProgress()">🔄 Alles zurücksetzen</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: var(--primary); margin-bottom: 15px;">Modus wählen:</h3>
            <div class="mode-selector">
                <button class="btn btn-primary active" onclick="switchMode('single')">Einzelfall</button>
                <button class="btn" onclick="switchMode('practice')">Trainingssession</button>
                <button class="btn" onclick="switchMode('failed')">Nur Fehlgeschlagen</button>
                <button class="btn" onclick="switchMode('all')">Alle durchgehen</button>
            </div>
        </div>

        <div id="caseContainer"></div>
        <div id="feedback"></div>
    </div>

    <script>
        const allCases = [{"id": 1, "caseName": "68-j\u00e4hriger Patient mit progressiver Dyspnoe", "fachbereich": "Kardiologie", "anamnese": "68-j\u00e4hriger m\u00e4nnlicher Patient mit progressiver Dyspnoe \u00fcber eine Woche. N\u00e4chtliche Atemnot (Orthopnoe) mit mehrfachem Aufwachen. Gewichtszunahme von 3 kg in einer Woche. Bekannte Hypertonie (15 Jahre, schlecht kontrolliert, SBP oft >160). Diabetes Typ 2 seit 8 Jahren (schlecht kontrolliert). Schlafapnoe unbehandelt. CKD Stadium 3. Medikamente: irregul\u00e4r Lisinopril. Leugnet Brustschmerz, Palpitationen oder orthostatische Symptome.", "koerperlich": "Wirkt angespannt, dyspnoisch. Blutdruck 170/95 mmHg bilateral symmetrisch. Herzaktion: tachykard, unregelm\u00e4\u00dfiger Rhythmus (Vorhofflimmern erkannt). Bilaterale basil\u00e4re Rasselger\u00e4usche. Prominente Halsvenenstaung (bis Kiefer). Hepatomegalie 5 cm unter Rippenbogen palpabel. Periphere \u00d6deme beidseits Kn\u00f6chel und Unterschenkel (+++/4+), rechts ausgepr\u00e4gter. Keine Zyanose, periphere K\u00e4ltung vorhanden.", "vitale": "RR 170/95 mmHg (erh\u00f6ht), HF 112/min (Tachykardie), AF 24/min (Tachypnoe), SpO2 88% an Raumluft (KRITISCH!), T 36,8\u00b0C (normal)", "labor": "BNP 850 pg/mL (normal <100, massiv erh\u00f6ht), Troponin I 0,08 ng/mL (grenzwertig, normal <0,04), Kreatinin 1,5 mg/dL (erh\u00f6ht, Baseline ~1,1), BUN 62 mg/dL (erh\u00f6ht), K+ 4,8 mEq/L, Na+ 137 mEq/L, Glukose 185 mg/dL (schlecht kontrolliert), Albumin 3,5 g/dL (leicht niedrig), TSH normal", "bildgebung": "EKG: Vorhofflimmern mit RVR ~110/min, ST-Senkung V2-V4 (0,2 mV), keine Q-Zacken, T-Inversion V1-V3. R\u00f6ntgen Thorax: Kardiomegalie (CTR >0,5), bilateral symmetrische Kerley-B-Linien, diffuse alveol\u00e4re Infiltrate bilateral basal (Lungen\u00f6dem), kein Pleuraerguss, keine Pneumonie", "q": ["Prim\u00e4rdiagnose? Differenzialdiagnosen?", "Welche Rolle spielt das neu aufgetretene Vorhofflimmern?", "Therapeutisches Vorgehen erste 2 Stunden (detailliert)?", "Interpretation der Troponinerh\u00f6hung und pathophysiologischer Mechanismus?"], "answers": ["Akute dekompensierte HI mit reduzierter Ejektionsfraktion (HFrEF). Klassische Zeichen: Dyspnoe, Orthopnoe, periphere \u00d6deme, basil\u00e4re Rasselger\u00e4usche, Hepatomegalie, BNP >400. DD: NSTEMI (ST-Senkung + Troponin), Myokarditis, akute PE, Nierenversagen", "VHF mit RVR reduziert Cardiac Output durch Verlust des atrialen Beitrags und Verk\u00fcrzung der diastolischen F\u00fcllungszeit. F\u00fchrt zu: erh\u00f6hter Dyspnoe, Blutdruck-Abfall, Isch\u00e4mie-Risiko, Thromboembolie-Risiko. Management: Frequenzkontrolle (Beta-Blocker/Kalzium-Antagonist), Antikoagulation nach CHA2DS2-VASc", "1) O2 via Nasenbrille oder CPAP wenn SpO2 <90%; 2) IV-Zugang gro\u00dflumig, Monitoring; 3) IV-Furosemid 40-80 mg rapid, dann Infusion; 4) IV-Nitrate wenn Blutdruck toleriert; 5) Beta-Blocker f\u00fcr VHF-Frequenzkontrolle; 6) Serielles Troponin 3/6/12 Stunden; 7) Erw\u00e4gen Koronarangiografie; 8) Laborkontrollen", "Troponinerh\u00f6hung k\u00f6nnte widerspiegeln: (1) Typ-2-Infarkt durch erh\u00f6hten myokardialen O2-Verbrauch bei Tachykardie/VHF; (2) Myokardnekrose durch Overstretching/Volumen\u00fcberladung (Takotsubo-\u00e4hnlich); (3) Echte thrombotische KHK. Serielles Troponin essentiell - dynamischer Anstieg spricht f\u00fcr AKS, Plateau f\u00fcr reinen Myokardschaden"]}, {"id": 2, "caseName": "55-j\u00e4hriger Raucher mit akutem Brustschmerz", "fachbereich": "Kardiologie", "anamnese": "55-j\u00e4hriger m\u00e4nnlicher aktiver Raucher (40 Pack-Jahre, aktuell 20/Tag). Akuter oppressiver Brustschmerz begonnen vor 40 Minuten in Ruhe. Zentraler Lokalisation, nicht ausstrahlend, konstant, Intensit\u00e4t 9/10. Profuse Diaphorese (Hemd durchn\u00e4sst), \u00dcbelkeit, extreme Angst. Keine vorbekannte KHK. Familiengeschichte: Vater MI im Alter 58 (nur 3 Jahre \u00e4lter als Patient jetzt). Alkoholkonsum: 20 Units/Woche (\u00fcber Empfehlung). Keine regelm\u00e4\u00dfigen Medikamente, Aspirin nur gelegentlich.", "koerperlich": "Wirkt \u00e4ngstlich, in Distress, profuse Diaphorese. Kalte, klamme Extremit\u00e4ten. Herzaktion: regelm\u00e4\u00dfiger Rhythmus, HF 98/min (Tachykardie, aber nicht extrem). Normal Herzklappent\u00f6ne, kein Murmur, kein pericardiales Reibungsger\u00e4usch. Lungenfelder klar bilateral, normale Atemger\u00e4usche, KEINE Rasselger\u00e4usche (wichtig: kein HI-Zeichen). Abdomen weich, unauff\u00e4llig. Keine peripheren \u00d6deme.", "vitale": "RR 128/78 mmHg (relativ normal, nicht zu niedrig), HF 98/min (moderat), AF 18/min (normal), SpO2 97% an Raumluft (KRITISCH: KEINE Hypox\u00e4mie!), T 37,1\u00b0C", "labor": "Troponin I 0,02 ng/mL (grenzwertig erh\u00f6ht - FR\u00dcHE Messung!), CK-MB 8,5 ng/mL (erh\u00f6ht), Myoglobin 120 \u03bcg/L (massiv erh\u00f6ht - Myokardnekrose), D-Dimer 0,4 \u03bcg/mL (normal - schlie\u00dft PE aus), Na/K/Kreatinin normal, Glukose normal", "bildgebung": "EKG (PATHOGNOMISCH): ST-Hebung 2-3 mm in II, III, aVF (inferiorer STEMI!); reziproke ST-Senkung in I, aVL; bereits Q-Zacken in III sichtbar (Transmural-Infarkt); T-Inversion III. KEINE ST-\u00c4nderungen V1-V4 (schlie\u00dft anterioren aus). Muster konsistent mit RCA-Okklusion (90% Wahrscheinlichkeit) oder LCx (10%)", "q": ["Klassifiziere Infarkttyp und Lokalisation. Welche Koronararerie betroffen?", "Nennen Sie spezifische Komplikationen des inferioren STEMI mit Pathophysiologie", "Strukturieren Sie Reperfusions-Management mit Timing", "Kontraindikationen von Nitraten in diesem Fall?"], "answers": ["STEMI inferior mit transmuralem Ausma\u00df (Q-Zacken vorhanden). Betroffene Arerie: RCA mit 90% Wahrscheinlichkeit (versorgt inferior wall + AV-Knoten + meist Sinusknoten), alternativ LCx 10%. EKG-Zeichen klassisch f\u00fcr inferior STEMI", "Kritische Komplikationen: (1) AV-Block (2./3. Grad) - RCA versorgt AV-Knoten, Patient k\u00f6nnte pl\u00f6tzlich bradykard werden oder kompletten Heart Block entwickeln (Pacing notwendig); (2) Kardiogener Schock (1-5% STEMI, h\u00f6her bei ausgedehntem inferior); (3) Kammerflimmern (~20% Risiko in akuter Phase, t\u00f6dlich wenn nicht sofort defibrilliert); (4) Sinusknotendysfunktion/Sinusbradykardie; (5) RV-STEMI (KRITISCH - kontraindiziert Nitrate!)", "Prim\u00e4re PCI ist GOLD-STANDARD. Ziel <90 Minuten von erster medizinischer Kontakt bis Ballondilatation. Wenn pPCI >120 min nicht m\u00f6glich: Fibrinolytische Therapie (rtPA 100 mg \u00fcber 90 min oder Tenecteplase). W\u00e4hrend Transport: Dual antiplatelet (Aspirin 600 mg + P2Y12i Clopidogrel 600 mg), UFH 60-70 IU/kg bolus. Beta-Blocker f\u00fcr Frequenzkontrolle", "NITRATE KONTRAINDIZIERT (oder nur mit EXTREMEM Vorsicht)! Grund: ~50% inferiore STEMIs beinhalten RV-Infarkt. RV ist preload-abh\u00e4ngig - braucht ad\u00e4quaten ven\u00f6sen R\u00fcckfluss. Nitrate reduzieren Preload durch Vasodilatation. Patient mit RV-Infarkt + Nitrate kann sich schnell in kardiogenen Schock entwickeln (schwer reversibel). Zeichen RV-STEMI: ST-Hebung V4R. Wenn RV ausgeschlossen: Nitrate m\u00f6glich mit massiver IV-Fl\u00fcssigkeit"]}, {"id": 3, "caseName": "71-j\u00e4hrige Patientin mit Palpitationen und Dyspnoe", "fachbereich": "Kardiologie", "anamnese": "71-j\u00e4hrige weibliche Patientin mit akutem Beginn Palpitationen und moderater Dyspnoe vor ~2 Stunden. Beschreibt Herzklopfen mit irregul\u00e4ren Flatterwellen. Bekannte Hypertonie seit 20 Jahren (medikament\u00f6s Amlodipine 5 mg t\u00e4glich). ERSTE Episode von Palpitationen - keine vorherige Tachyarrhythmie oder Herzerkrankung. Leugnet Brustschmerz, Synkope, Pr\u00e4synkope. Leugnet k\u00fcrzliche Infekte, Fieber. KEINE Hyperthyreoidismus-Symptome (kein Gewichtsverlust trotz gutem Appetit, keine Hitzeunvertr\u00e4glichkeit). Keine anderen Medikamente. Kaffeekonsum 3-4 Tassen t\u00e4glich.", "koerperlich": "Wirkt besorgt aber nicht in extremem Distress (gutes Zeichen). Herzauskultation: schnelle, V\u00d6LLIG unregelm\u00e4\u00dfige Herzfrequenz - klassisch f\u00fcr Vorhofflimmern. Kein Murmur, kein Reibungsger\u00e4usch. Halsvenenstaung nicht prominent (WICHTIG: kein Zeichen akuter HI oder Rechtsherzbelastung). Lungenfelder klar, normale Atemger\u00e4usche, KEINE Rasselger\u00e4usche (WICHTIG: keine pulmonale Stauung). Normale Hautperfusion, KEINE \u00d6deme (WICHTIG: kein HI-Zeichen).", "vitale": "RR 145/88 mmHg (systolisch erh\u00f6ht, wahrscheinlich von Sympathikus-Aktivierung/Angst), HF 135/min v\u00f6llig unregelm\u00e4\u00dfig (dies ist die RVR), AF 18/min (normal), SpO2 95% an Raumluft (normal), T 37,3\u00b0C", "labor": "Troponin I: NORMAL (WICHTIG: kein Zeichen von Isch\u00e4mie/Infarkt). BNP 180 pg/mL (grenzwertig erh\u00f6ht, aber nicht massiv - keine akute HI mit moderater EF). TSH: NORMAL (schlie\u00dft Hyperthyreoidismus aus - h\u00e4ufige VHF-Ursache). Elektrolyte: K+, Mg, Ca alle normal (WICHTIG: keine Elektrolyt-St\u00f6rungen). H\u00e4moglobin/H\u00e4matokrit normal (kein An\u00e4mie)", "bildgebung": "EKG (PATHOGNOMISCH): Absolut unregelm\u00e4\u00dfiger Rhythmus, KEINE erkennbaren P-Wellen. Baseline zeigt 'Fibrillationswellen' ~300-400/min (das sind die atrialen Flimmern). Ventrikul\u00e4re Antwort v\u00f6llig unregelm\u00e4\u00dfig ~135/min (RVR). KEINE ST-Ver\u00e4nderungen, KEINE T-Wellen-Abnormit\u00e4ten, KEINE Q-Zacken. QRS-Dauer normal (~100 ms)", "q": ["Definieren Sie VHF mit RVR. Bewerten Sie akutes Gef\u00e4hrdungspotenzial", "Berechnen Sie CHA2DS2-VASc-Score. Antikoagulationsindikation?", "Frequenzkontrolle vs. Rhythmuskontrolle: welche Strategie w\u00e4hlen Sie?", "Medikament\u00f6se Optionen zur Frequenzkontrolle mit Dosierungen und Monitoring"], "answers": ["VHF mit RVR: Chaotisches Flimmern der Atrien (300-400/min), AV-Knoten kann nicht alle Impulse blockieren, leitet viele weiter (>100-150/min ventrikul\u00e4r = RVR). Akutes Gef\u00e4hrdungspotenzial MODERAT: h\u00e4modynamisch stabil (keine Hypotension, kein Schock), normale SpO2, keine Zeichen HI. ABER Risiken: myokardiale Isch\u00e4mie durch erh\u00f6hten O2-Verbrauch, Thromboembolie (Schlaganfall!) wegen atrialer Stase, Tachykardie-induzierte Kardiomyopathie wenn unkontrolliert lange, selten VF-Degeneration", "CHA2DS2-VASc: C(HF)=0, H(Hypertension)=1, A2(Age >75)=0, D(Diabetes)=0, S(Stroke/TIA)=1, V(Vascular disease)=0, A(Age 65-74)=1, Sc(Sex/weiblich)=0. Gesamt = 3-4 Punkte. Bei Frauen Score \u22653 oder M\u00e4nner \u22651: ANTIKOAGULATION INDIZIERT! Diese Patientin sollte antikoaguliert werden.", "INITIAL Frequenzkontrolle w\u00e4hlen. Begr\u00fcndung: Frequenzkontrolle ist einfacher zu erreichen, schneller, und Prognose ist mindestens so gut wie Rhythmuskontrolle (AFFIRM Trial zeigt keine \u00dcberlegenheit). Patient ist h\u00e4modynamisch stabil, daher erlaubt Medikation. Rhythmuskontrolle sp\u00e4ter erw\u00e4gen wenn weiterhin symptomatisch. NUR bei h\u00e4modynamischer Instabilit\u00e4t oder akutem AKS: sofortige elektrische Kardioversion", "Medikamente zur Frequenzkontrolle: (1) Beta-Blocker (ERSTE WAHL): Metoprolol 25-100 mg 3x t\u00e4glich p.o. oder 2,5-5 mg IV langsam (blockiert AV-Knoten); Bisoprolol 5-10 mg 1x t\u00e4glich. Kontraindikationen: Bradykardie (HR <50), AV-Block, dekompensierte HI (relativ). (2) Kalzium-Antagonisten: Diltiazem 120-360 mg t\u00e4glich oder 0,25 mg/kg IV bolus dann Infusion; Verapamil 120-480 mg t\u00e4glich (\u00e4hnlich Beta-Blocker). Kontraindikationen: Hypotension, AV-Block, WPW-Syndrom. (3) Digoxin: 0,5-1 mg loading dann 0,25-0,5 mg t\u00e4glich (\u00e4lter, aber n\u00fctzlich bei sitzenden oder HI). Risk toxicity bei Nierenleiden oder Elektrolyt-St\u00f6rungen. (4) Amiodaron: 600 mg IV \u00fcber 20 min oder 200-400 mg p.o. t\u00e4glich (viele Nebenwirkungen). Monitoring: EKG kontinuierlich, Blutdruck, Herzfrequenz, Serum-Digoxin wenn verwendet"]}, {"id": 4, "caseName": "62-j\u00e4hrige Patientin mit Unterbauchschmerz", "fachbereich": "Chirurgie", "anamnese": "62-j\u00e4hrige weibliche Patientin mit 2-Tage-Schmerz im linken Unterbauch (LUQ). Schmerz graduell progressiv \u00fcber Tage, heute Fieber entwickelt. REZIDIVIERENDE Episoden: 2x in letzten 3 Jahren, beide spontan resolviert ohne medizinische Intervention. Leugnet Blut im Stuhl oder Tenesmus. Leichte Stuhlver\u00e4nderung (etwas mehr Verstopfung als normal). Leugnet Vaginalblutung, Urinsymptome oder andere Systeme-Symptome. Ern\u00e4hrung: chronisch niedrig in Ballaststoffen (viele verarbeitete Lebensmittel, wenig Obst/Gem\u00fcse) - Risikofaktor", "koerperlich": "Wirkt mild unwohl aber NICHT in extremem Distress - wichtiges Zeichen (keine Perforation/generalisierte Peritonitis). Abdominaluntersuchung: Abwehrspannung und Resistenz LOKALISIERT zu LUQ, besonders Sigmoid-Region. Losla\u00dfschmerz deutlich positiv in LUQ (Zeichen Peritonealreizung). McBurney-Punkt-Schmerz NEGATIV (w\u00fcrde auf Appendizitis hindeuten). Darmger\u00e4usche pr\u00e4sent und normal (kein Ileus). Rektale Untersuchung: keine Massen, m\u00e4\u00dfiger Schmerz am linken Rektum, keine Blut oder Eiter", "vitale": "RR 128/76 mmHg (relativ normal), HF 88/min (NORMAL - nicht Tachykardie - GUTES ZEICHEN!), AF 16/min (normal), SpO2 98%, T 37,8\u00b0C (leichtes Fieber, nicht hohes Fieber - gutes Zeichen)", "labor": "Leukozyten 14.200/\u03bcL (moderat erh\u00f6ht, nicht massiv - zeigt Entz\u00fcndung aber nicht schwere Infektion), CRP 8,5 mg/dL (erh\u00f6ht, best\u00e4tigt Entz\u00fcndung), Nierenparameter (Kreatinin 0,9 mg/dL): normal (kein Sepsis-Zeichen oder Dehydration), H\u00e4moglobin 13,1 g/dL: normal (kein Blutverlust)", "bildgebung": "CT-Abdomen mit IV-Kontrast (GOLD-STANDARD f\u00fcr Diverticulitis): Entz\u00fcndetes Divertikel sichtbar in Sigmoid-Region (Sigmoid h\u00e4ufigster Ort wegen hohem intraluminalen Druck). Lokalisierte Entz\u00fcndung um Divertikel (Fett-Stranding). KEINE freie Luft unter Zwerchfell (w\u00fcrde Perforation indizieren). KEIN separater Abscess oder Fl\u00fcssigkeitsansammlung (w\u00fcrde komplizierte Diverticulitis indizieren). Minimale angrenzende Peritonealfl\u00fcssigkeit", "q": ["Klassifizieren Sie Diverticulitis nach Hinchey. Interpretieren Sie CT-Befunde im klinischen Kontext", "Argumentieren Sie F\u00dcR oder GEGEN konservative Behandlung. Pros und Contras?", "Detaillierter therapeutischer Plan: Antibiotika, Ern\u00e4hrung, Monitoring, Escalation-Kriterien", "Elektive Sigmaresektion nach erfolgreich behandelter Diverticulitis: evidenzbasierte Empfehlung?"], "answers": ["Hinchey Grad I Diverticulitis: kleine, lokalisierte Entz\u00fcndung um Divertikel OHNE Perforation, Abscess oder generalisierte Peritonitis. Dies ist BESTE Prognose Hinchey-Grad. CT-Befunde unterst\u00fctzen: lokalisiertes entz\u00fcndetes Divertikel, Fett-Stranding (lokale Entz\u00fcndung), KEINE freie Luft (w\u00fcrde Perforation/Grad IV indizieren), KEIN Abscess (w\u00fcrde Grad II/III indizieren), minimale Fl\u00fcssigkeit. Klinischer Kontext: h\u00e4modynamisch stabil, nicht afebrile jetzt, KEINE generalisierte Peritonitis, keine Sepsis-Zeichen. Recurrent (3. Episode)", "F\u00dcR konservativ: (1) Hinchey Grad I klein und lokalisiert, viele heilen spontan; (2) Patient h\u00e4modynamisch stabil, kein generalisierte Peritonitis, kein Schock, kein Sepsis; (3) Imaging zeigt keine Perforation oder Abscess; (4) Evidenz: bis 70-80% uncomplicated Diverticulitis k\u00f6nnen konservativ behandelt werden mit modernen Antibiotika. GEGEN konservativ (eher f\u00fcr OP): (1) 3. Episode = h\u00f6heres Rezidiv-Risiko (aber das spricht eher F\u00dcR konservativ JETZT, GEGEN elektive Resektion SP\u00c4TER, nicht f\u00fcr sofortige OP heute)", "Plan: Antibiotika: IV Ceftriaxon 2 g t\u00e4glich + IV Metronidazol 1,5 g t\u00e4glich (oder Piperacillin-Tazobactam 4,5 g q6-8h) f\u00fcr 7-10 Tage, dann oral Trimethoprim-Sulfa oder Ciprofloxacin + Metronidazol insgesamt 10-14 Tage. Ern\u00e4hrung: NPO (Magen-Darm-Ruhe) erste 24-48h, dann klare Fl\u00fcssigkeiten, graduell fortschreiten zu Low-Residue-Di\u00e4t. Monitoring: t\u00e4gl. Temperatur, Bauchschmerz-Besserung, Leukozytenzahl. Escalation zu OP: (1) Peritonitis entwickelt sich/wird generalisiert; (2) Fieber bleibt >48h trotz AB; (3) Bauchschmerz verschlechtert sich; (4) Sepsis/Schock; (5) CT-Imaging zeigt Abscess notwendig Drainage. Langzeitmanagement: High-Fiber-Di\u00e4t nach Heilung (reich Obst/Gem\u00fcse) um Rezidiv zu vermeiden", "Moderne Empfehlung hat sich GE\u00c4NDERT. Fr\u00fcher: elektive Resektion nach 1. oder 2. Episode. Jetzt: nicht routinem\u00e4\u00dfig empfohlen nach 1. uncomplicated Episode, besonders junge Patienten (<50). ABER f\u00fcr diese Patientin (62 Jahre, 3. Episode = recurrent): elektive Sigmaresektion nach 4-6 Wochen (nachdem Entz\u00fcndung abgekl\u00e4rt) IST EMPFOHLEN. Begr\u00fcndung: Rezidiv-Risiko ~20% nach 1. Episode, 35% nach 2., h\u00f6her danach. Komplikationen bei rezidivier Episode sind h\u00f6her (h\u00f6here Perforation-Risiko bei nachfolgende Episoden). Timing: 4-6 Wochen nach akuter Episode (Zeit f\u00fcr Entz\u00fcndungs-R\u00fcckbildung), nicht sofort, aber auch nicht Jahre sp\u00e4ter"]}, {"id": 5, "caseName": "68-j\u00e4hriger Mann mit akutem epigastrischem Schmerz", "fachbereich": "Chirurgie", "anamnese": "68-j\u00e4hriger m\u00e4nnlicher Patient mit CHRONISCHER NSAR-Einnahme (Ibuprofen 400-600 mg t\u00e4glich seit 15 JAHREN f\u00fcr Arthritis-Schmerz) stellt sich mit MASSIVEM akutem epigastrischem Schmerz vor, begonnen vor ~2 Stunden pl\u00f6tzlich in Ruhe. Schmerz diffus \u00fcber ganzen Bauch, sehr stark (10/10). SCHNELLE Verschlechterung mit Schock-\u00e4hnlichen Symptomen: intensiver Schwei\u00df (diaphoretisch), schneller Herzschlag, \u00dcbelkeit, Bl\u00e4sse, rigide Bauchmuskulatur. LANGE Geschichte von Dyspepsie und Sodbrennen, aber NIEMALS PPI-Therapie genommen - Patient Selbst-behandelt mit gelegentlichem Antazida. Kein vorheriges Ulkus oder signifikante GI-Blutung. Letzte Mahlzeit schwer und fettig vor ~3 Stunden.", "koerperlich": "Patient sieht SEHR krank aus: blass, schwitzend (diaphoretisch), in EXTREMEM Distress, KANN SICH NICHT BEWEGEN (taumelt zur Seite). K\u00f6rperhaltung rigid (Schmerzschutzspannung). Bauch ist SEHR angespannt - dies ist 'Bretbauch' (board-like rigidity), vollkommen konsistent mit PERITONITIS. Abwehrspannung \u00fcberall im Bauch, NICHT lokalisiert (differenziert von lokalisiertem Entz\u00fcndungsprozess). Losla\u00dfschmerz (rebound tenderness) ist MASSIV \u00fcber ganzen Bauch - deutet massive Peritonealreizung an. Darmger\u00e4usche sind abwesend oder SEHR schwach (Zeichen von paralytischem Ileus von Peritonitis). Rektale Untersuchung nicht durchgef\u00fchrt (zu schmerzhaft f\u00fcr Patient)", "vitale": "RR 102/62 mmHg (HYPOTENSION - KRITISCH! Zeichen von kardiogenem/septischem Schock), HF 126/min (MASSIVE Tachykardie - Kompensationsmechanismus), AF 24/min (Tachypnoe), SpO2 94% (niedrig-normal), T 38,2\u00b0C (Fieber - Zeichen von Peritonitis-Entz\u00fcndung)", "labor": "Leukozyten 16.800/\u03bcL (massive Erh\u00f6hung - zeigt severe Entz\u00fcndung), Laktat 2,8 mmol/L (ERH\u00d6HT - Zeichen Gewebshypoperfusion und Schock), Kreatinin 1,4 mg/dL (leicht erh\u00f6ht - Zeichen Dehydration/Schock), Amylase 200 U/L (erh\u00f6ht - m\u00f6glicherweise von Pankreatitis sekund\u00e4r zur Perforation oder irritation)", "bildgebung": "R\u00f6ntgen Thorax aufrecht (erect CXR): FREIE LUFT unter Zwerchfell - dies ist PATHOGNOMISCH f\u00fcr perforiertes Hohlviszus! Ungef\u00e4hr 5 cm freie Luft am rechten Zwerchfell sichtbar. CT-Abdomen mit IV-Kontrast (beste Bildgebung): Perforation Vorderwand des Magens (~1-1,5 cm Loch) ist sichtbar. Klar Pneumoperitoneum vorhanden. Peritonealfl\u00fcssigkeit (dunkel, konsistent mit eitrigen Inhalten) vorhanden um Perforation. KEINE gro\u00dfen Abscessus, aber lokale Kontamination mit Magen-Inhalt vorhanden", "q": ["Erkenne Diagnose aus klassischen Zeichen. Begr\u00fcnde detailliert. Pathophysiologische Kaskade?", "Notwendigkeit und Dringlichkeit operativer Intervention? Risiken von Verz\u00f6gerung?", "Chirurgische Technik: Primary repair vs. Gastrektomie. Unter welchen Bedingungen jede Option?", "Intra- und postoperative Komplikationen? Management und Langzeitprognose?"], "answers": ["Diagnose: PERFORIERTES MAGENGESCHW\u00dcR - MEDIZINISCHE NOTFALL. Erkannt durch: (1) Pl\u00f6tzlicher MASSIVER epigastrischer Schmerz bei Patient mit chronischem NSAR-Gebrauch (Risikofaktor #1); (2) Bretbauch und generalisierte Peritonitis - klassisch f\u00fcr perforiertes Hohlviszus; (3) Schock-Zeichen: Hypotension, Tachykardie, Diaphorese, Laktat-Erh\u00f6hung; (4) FREIE LUFT unter Zwerchfell auf R\u00f6ntgen - PATHOGNOMISCH!; (5) CT-Best\u00e4tigung der Perforation und Pneumoperitoneum. Pathophysiologie: Chronisches NSAR \u2192 Magenmukosa-L\u00e4sion \u2192 Ulkusbildung mit Zeit \u2192 Schwere/fettreiche Mahlzeit erh\u00f6ht intraluminalen Druck akut \u2192 vollst\u00e4ndige Perforation der Magenwand tritt auf \u2192 sofortige Kontamination des Peritoneums mit Magen-Inhalt \u2192 massive Peritonitis und Peritoneal-Entz\u00fcndung \u2192 systemische Entz\u00fcndungsreaktion (SIRS) \u2192 Laktat-Produktion von hypoperfusioniertem Gewebe \u2192 schnell Schock wenn nicht behandelt", "DIES IST NOTFALL-OP SOFORT! OP MUSS UNMITTELBAR erfolgen - JEDE Minute Verz\u00f6gerung erh\u00f6ht Mortalit\u00e4t! Wenn OP verz\u00f6gert wird: (1) Peritonitis wird schnell schwerer - massive Entz\u00fcndungsreaktion breitet sich aus; (2) Sepsis und SIRS entwickeln sich schnell - Bakterien aus Magenlumen treten in Blutbahn ein; (3) Kardiogener Schock kann entstehen von Mediator-Freisetzung (TNF-alpha, IL-6, etc.) die direkt kardiale Funktion kompromittieren; (4) Multiple Organ Dysfunction (MODS) entwickelt sich; (5) Disseminierte intravaskul\u00e4re Gerinnung (DIC) kann resultieren; (6) TOD wahrscheinlich wenn OP >24h verz\u00f6gert. Mortalit\u00e4t: ~10% mit prompter OP, 40-50% wenn >24h verz\u00f6gert", "Chirurgische Technik: PRIMARY REPAIR (Vierschichtnaht mit Omentoplastie/Graham Patch) ist BEVORZUGTE Option in meisten F\u00e4llen. Technik: Perforation wird vern\u00e4ht (vier Schichten: Mukosa, Submukosa, Muskularis, Serosa), dann Netz vom Omentum majus \u00fcber Reparatur gelegt (Omentoplastie = Graham Patch) um weitere Leckage zu verhindern. Dies konserviert Magenfunktion. WANN w\u00fcrde man GASTREKTOMIE w\u00e4hlen: (1) Verdacht auf Malignes Ulkus (z.B. gro\u00dfes Ulkus, aggressive Pr\u00e4sentation, Gewichtsverlust, An\u00e4mie - aber diese Patientin keine dieser Zeichen); (2) Riesiges Ulkus mit signifikantem Gewebsverlust; (3) Multiple Perforationen; (4) Vorherige Reparatur-Versuch fehlgeschlagen; (5) Zollinger-Ellison Syndrom bekannt. Diese Patientin: GUTER Kandidat f\u00fcr Primary Repair", "Komplikationen: INTRAOPERATIV: (1) Enorme Peritonealverschmutzung mit Magen-Inhalt, Blut, Galle - aggressives Debridement und Lavage erforderlich; (2) Blutungskontrolle kleine Gef\u00e4\u00dfe in Magenwand; (3) \u00d6demat\u00f6ses, friables Gewebe macht N\u00e4hen schwierig. POSTOPERATIV (h\u00e4ufig): (1) Sepsis/SIRS - ~40-60% Patienten entwickeln Sepsis nach perforiertem Ulkus, kann innerhalb 48h entwickeln; (2) Naht-Insuffizienz und Recurrent Perforation - ~5-10% wenn Primary Repair; (3) Anastomosenleck wenn Gastrektomie; (4) Pankreas-Verletzung (nah dem Magen); (5) Paralytischer Ileus f\u00fcr Tage bis Wochen; (6) Postoperative GI-Blutung (meist konservativ kontrolliert); (7) ARF vom Sepsis/Schock - ~20%; (8) Langzeitfolge: Gastric Outlet Obstruction sp\u00e4ter. Management: Aggressive ICU-care mit kontinuierlichem Monitoring, breites Spektrum Antibiotika, Vasopressor-Support f\u00fcr Blutdruck-Kontrolle, Ern\u00e4hrungsunterst\u00fctzung (TPN wenn notwendig), t\u00e4gliche abdominale Untersuchungen auf Zeichen von Reopening. Langzeitprognose: Mit prompter OP und aggressivem postop Management: meisten Patienten \u00fcberleben, aber Morbidit\u00e4t bedeutsam (~30-40% entwickeln Komplikationen). Mit verz\u00f6gerter OP oder verz\u00f6gerter Erkennung: Mortalit\u00e4t kann >30-40% erreichen. PPI-Therapie langfristig nach Heilung ist KRITISCH um Rezidiv zu verhindern"]}, {"id": 6, "caseName": "22-j\u00e4hriger Mann mit pl\u00f6tzlichem Thoraxschmerz", "fachbereich": "Pneumologie", "anamnese": "22-j\u00e4hriger asthenic habitus m\u00e4nnlicher Patient, sonst gesund, KEINE bekannte Lungenerkrankung, stellt sich mit pl\u00f6tzlichem linksseitigen Thoraxschmerz und Dyspnoe vor. Symptome begannen w\u00e4hrend Sitzen (beim Studieren). Schmerz ist pleuritisch (wird schlimmer mit Atemzug), lokalisiert linke Seite. Patient ist jung und sonst gesund, KEINE Trauma, KEINE Fieber, KEINE Husten, KEINE H\u00e4moptyse. Leugnet COPD, Asthma oder andere Lungenerkrankung. DIES IST ERSTE Episode von Pneumothorax. Risikofaktoren: asthenic K\u00f6rperbau (erh\u00f6htes Risiko), h\u00f6he (nicht gemessen), Rauchen: NEIN. Familiengeschichte: nicht erw\u00e4hnt", "koerperlich": "Patient wirkt nerv\u00f6s/\u00e4ngstlich aber NICHT in extremem Distress (GUTES Zeichen - nicht Spannungspneumothorax). Thorax-Inspektion: reduzierte Atembewegungen links vs. rechts (verlorene Lungenfl\u00e4che ventiliert nicht richtig). Palpation: Thorax-Bewegung links reduziert. Percussion: HYPERSONORANT auf linker Seite (KLASSISCH f\u00fcr Pneumothorax - Luft leitet Schallwellen nicht wie Lung-Gewebe). Auskultation: ABSENT Atemger\u00e4usche unten links (gr\u00f6\u00dfere PSX) oder vermindert (kleine PSX). Herzt\u00f6ne normal, KEIN Mediastinal-Shift oder JVD (KEIN Zeichen von Spannungspneumothorax). Abdomen und Neuro: unauff\u00e4llig", "vitale": "RR 128/75 mmHg (normal), HF 105/min (Tachykardie, wahrscheinlich von Angst/Sympathikus, nicht Hypoxie), AF 24/min (Tachypnoe), SpO2 94% (leicht niedrig, aber Patient kompensiert durch schnelleres Atmen), T 37,0\u00b0C (normal, kein Fieber)", "labor": "Blutgasanalyse (ABG): pO2 85 mmHg (normal >90, aber dieser Patient hat 10% Reserve-Luft-Raum wegen PSX, daher 85 akzeptabel), pCO2 35 mmHg (normal, Patient atmet ad\u00e4quat um CO2 zu eliminieren), pH 7,41 (normal, keine Azidose), Elektrolyte: normal. Kein Serum-Laktat gemessen (nicht notwendig)", "bildgebung": "R\u00f6ntgen Thorax (inspiratorischer Film): Viscerale Pleura-Linie ist deutlich sichtbar auf linker Seite - schwarze Linie die Grenze zwischen kollabiertem Lung und Pneumothorax darstellt. Kollabiertes Lung-Volumen wird auf ~30-40% gesch\u00e4tzt basierend auf Messungen (kleine PSX - <2-3 cm Distanz von Brustwand zur viszeralen Pleura). KEIN Mediastinal-Shift (rechtes Herz und Mediastinum sind zentral positioniert - ZEICHEN dass NICHT Spannungspneumothorax!). Keine begleitende Pleura-Erguss, Pneumomediastinum, oder subcutaneous Emphysem", "q": ["Klassifiziere Pneumothorax nach Gr\u00f6\u00dfe und Typ. Welche Klassifikationssysteme werden verwendet?", "Entscheide Therapie: konservativ vs. interventionell? Auf welchen Faktoren h\u00e4ngt Entscheidung ab?", "Falls Drainage: technische Details (Katheter-Gr\u00f6\u00dfe, Platzierung, Dauer, Komplikationen)?", "Wann entlassen? Nachuntersuchungen? Zeichen von Rezidiv f\u00fcr Patient?"], "answers": ["Klassifikation: GR\u00d6SSE: kleine prim\u00e4r-spontane PSX (<2 cm oder <20% kollabiert) basierend auf Imaging. TYP: PRIM\u00c4RER spontaner Pneumothorax (keine vorbekannte Lungenerkrankung oder COPD - aber k\u00f6nnte okkulte Bullae haben). Klassifikationssysteme: (1) GR\u00d6SSE-basiert nach radiologischen Kriterien (klein vs. gro\u00df, abh\u00e4ngig ob Distanz viszerales-Pleura zu Brustwand <2cm oder \u22652cm); (2) BTS (British Thoracic Society): PSX klassifiziert klein (<2cm intra-pleural space) oder gro\u00df (\u22652cm); (3) ACCP (American College Chest Physicians): \u00e4hnlich; (4) Prim\u00e4r vs. Sekund\u00e4r (diese ist prim\u00e4r, da kein COPD/Fibrose)", "Entscheidung f\u00fcr konservativ vs. interventionell h\u00e4ngt ab von: (1) Gr\u00f6\u00dfe: kleine PSX (<2cm) k\u00f6nnen konservativ behandelt werden; gro\u00dfe (\u22652cm) oder PSX >20% k\u00f6nnen interventionelle Therapie brauchen; (2) Symptomatologie: dieser Patient hat leichte Dyspnoe, aber ist nicht in Distress (w\u00fcrde aggressivere Intervention indizieren wenn massiv dyspnoisch); (3) Allgemeinzustand: jung (22), gesund, normale Vitale au\u00dfer Tachykardie von Angst; (4) F\u00e4higkeit zum Follow-up: dieser Student scheint Follow-up m\u00f6glich zu haben. KONSERVATIV (Beobachtung/Monitoring allein) ist MEINE ERSTE WAHL f\u00fcr diesen Patienten. Bedeutet: Hospitalisierung nicht immer notwendig (kann ambulant mit t\u00e4glichem Follow-up wenn Zugang gew\u00e4hrleistet), oder kurzer Spitalaufenthalt mit t\u00e4glich CXR bis Reexpansion best\u00e4tigt wird. Sauerstoff KANN gegeben werden um zu helfen Reabsorption zu beschleunigen (high-flow O2 washout nitrogen gradient)", "Wenn Drainage notwendig: Small-bore catheter Gr\u00f6\u00dfe 16-20 French (empfohlen von BTS). Platzierung: 2.-4. Interkostal-Raum, mid-axillary Linie oder Safety Triangle (zwischen Vorderrand Latissimus Dorsi und hinterem Rand Pectoralis) um Blutgef\u00e4\u00dfe/Nerven zu vermeiden. Angeschlossen zu Wasserseal-Drainage (1-2 Liter Beh\u00e4lter mit ~2cm H2O Seal). Dauer: bis Reexpansion der Lunge (\u00fcblicherweise 3-7 Tage wenn erfolgreich). Komplikationen zu \u00fcberwachen: (1) Reexpansion-Lungen\u00f6dem (Dyspnoe/Husten nach schneller Reexpansion - manage mit Begrenzung negativem Druck oder Schlauch clamping); (2) H\u00e4mathorax (Blut im Pleura-Raum von Intercostal-Arterie Verletzung); (3) Gef\u00e4\u00dfverletzung; (4) Infektion/Empyem; (5) Bronchus-Verletzung (rare)", "Entlassungskriterien: (1) Lungenreexpansion auf CXR best\u00e4tigt (oder \u226585-90% reexpandiert); (2) Abwesenheit von Dyspnoe in Ruhe; (3) Klinisch stabil. Timing: typisch 3-7 Tage konservativ, 3-10 Tage mit Drainage wenn erforderlich. Nachuntersuchungen: CXR bei 48-72h (um fr\u00fche Rezidiv zu sehen), dann 2-4 Wochen sp\u00e4ter, dann 3 Monate. Zeichen von Rezidiv/Komplikationen Patient sollte wissen: pl\u00f6tzliche Dyspnoe, Brustschmerz, Husten - sofort zu ED gehen. RAUCHER oder WIEDERHOLUNG = h\u00f6heres Rezidiv-Risiko (~25% nach ersten PSX, bis 50% nach 2. Episode). Raucherentw\u00f6hnung KRITISCH"]}, {"id": 7, "caseName": "74-j\u00e4hriger Mann mit Sprach- und Mobilit\u00e4tsst\u00f6rung", "fachbereich": "Neurologie", "anamnese": "74-j\u00e4hriger m\u00e4nnlicher Patient erwacht vor ~90 Minuten mit rechtsseitiger Armparese und Sprachst\u00f6rung. Patient lebt allein und bemerkte Symptome selbst. ALERT f\u00fcr Zeit seit Symptombeginn (90 Minuten = STILL IM THROMBOLYSE-FENSTER von 4,5 Stunden!). LANGE Geschichte: Hypertonie seit 40 Jahren (schlecht kontrolliert, SBP oft >160). Bekannt Vorhofflimmern seit 5 Jahren (NICHT antikoaguliert - Patient lehnte Antikoagulation ab, meinte 'ich bin nicht krank genug'). Fr\u00fchere TIA vor 2 Jahren (resolvierte Symptome). Raucht NICHT, trinkt moderat. Medikamente: nur Amlodipine allein (unzureichend BP-Kontrolle). Kein Aspirin-Prophylaxe fr\u00fcher.", "koerperlich": "Patient ist alert aber Expressiv-Aphasie vorhanden - kann Befehle verstehen aber kann nicht gut sprechen (rezeptive Sprache besser als expressive). Neurologische Untersuchung: NIH Stroke Scale (NIHSS) = 8 (moderat, nicht mild, nicht schwer). Fokale Befunde: Fazialis-Parese rechts (mild), Arm-Kraft rechts 4/5 (leichte bis moderate Parese), Bein-Kraft rechts 5/5 (NORMAL - WICHTIG: nicht komplette Hemibody-L\u00e4hmung). Keine Ataxie erkennbar. Keine visuellen Feldefekte. Sprachverst\u00e4ndnis: OK, kann Befehle verstehen. Sprechf\u00e4higkeit: m\u00fchsam, paraphasisch (Worte falsch, aber Struktur versucht)", "vitale": "RR 162/92 mmHg (erh\u00f6ht, wahrscheinlich von Stress/Schlag selbst), HF 88/min (normalerweise, aber unregelm\u00e4\u00dfig - VHF present), AF 18/min (normal), SpO2 96% an Raumluft (normal), T 37,0\u00b0C (normal)", "labor": "Glucose 145 mg/dL (leicht erh\u00f6ht - normal bis 100, aber <200 ist OK f\u00fcr rtPA), INR 0,9 (NICHT antikoaguliert, daher normal - WICHTIG!), Thrombozyten 220.000/\u03bcL (normal), PT/aPTT: normal. Blutungs-Risiko-Panel: normal. KEINE Hinweise auf Blutungsst\u00f6rung", "bildgebung": "CT Sch\u00e4del (KRITISCH um Blutung auszuschlie\u00dfen): KEINE akute Blutung sichtbar! Der Scan ist NORMAL, keine Masse, kein subarachnoidales Blut. Dies ist KRITISCH weil es bedeutet rtPA SICHER gegeben werden kann! Diffusion-MRT (DWI) zeigt NEUE isch\u00e4mische L\u00e4sion in rechter MCA-Versorgung (mittlere zerebrale Arterie) - kleine frische Isch\u00e4mie entsprechend der Klinik (rechte MCA versorgt Motor + Sprachgebiet = Broca's area)", "q": ["Evaluiere Eignung f\u00fcr rtPA-Thrombolyse: im Zeitfenster? Kontraindikationen?", "Klassifiziere Schlaganfall nach TOAST-Klassifikation", "Beschreibe Sofort- und Langzeitmanagement detailliert. Antikoagulation? Sekund\u00e4rpr\u00e4vention?", "Blutdruck-Management bei akutem isch\u00e4mischem Schlaganfall mit rtPA-Verwendung"], "answers": ["Ja, Patient ist IM ZEITFENSTER f\u00fcr rtPA-Thrombolyse. Zeitfenster: 90 Minuten seit Symptombeginn ist <4,5 Stunden, daher INNERHALB des Fensters. KEINE absoluten Kontraindikationen: CT zeigt KEINE Blutung (schlie\u00dft ICH aus), INR 0,9 (NICHT antikoaguliert, daher kein Blutungs-Risiko von Overantikoagulation), Thrombozyten normal, keine aktive Blutung, Troponin nicht gemessen (nicht erh\u00f6ht f\u00fcr diesen Fall). RELATIVE Kontraindikationen zu pr\u00fcfen: gro\u00dfe Infarkt-Gr\u00f6\u00dfe? Die DWI L\u00e4sion scheint klein (keine massive Isch\u00e4mie), also OK. Glucose <200? Ja, 145. Kein frischer Trauma vor <3 Monaten? Patient berichtet keinen. rtPA ist INDIZIERT f\u00fcr diesen Patienten", "TOAST-Klassifikation (Trial of Org 10172 in Acute Stroke Treatment): Diese Schlaganfall ist CARDIOEMBOLIC (wahrscheinlich). Grund: VHF bekannt seit 5 Jahren, Patient war NICHT antikoaguliert (daher Thrombus k\u00f6nnen sich in left atrium bilden), Schlaganfall ist in MCA-Verteilung (nicht kleine Gef\u00e4\u00dfe wie lacunar), Symptome sind gro\u00df (nicht nur kleine motorische). Cardioembolic ist die wahrscheinlichste \u00c4tiologie. DD: Large Vessel Thrombosis (m\u00f6glich, w\u00fcrde atherotische Plaque in MCA sein), aber Cardioembolic wahrscheinlicher wegen VHF + kein Antikoagulation", "SOFORT-MANAGEMENT (erste 2 Stunden): 1) rtPA 0,9 mg/kg IV bolus (Patient ~75kg \u2192 rtPA ~67,5 mg total = rund 72 mg). 10% bolus \u00fcber 1 Minute, Rest \u00fcber 60 Minuten. 2) Neuro-Monitoring: NIHSS q30min initial f\u00fcr Verschlechterung oder Verbesserung. 3) EKG-Monitoring und kontinuierliche Vitale. 4) Repeat CT 24h nach rtPA um ICH auszuschlie\u00dfen (Standard-Protokoll). LANGZEIT-MANAGEMENT: 1) Antikoagulation: wegen VHF, sollte Antikoagulation mit DOAC (Rivaroxaban/Apixaban/Edoxaban) begonnen werden nach 24h von rtPA (Blutungs-Risiko gering nach 24h). Alternativ: Warfarin mit Ziel INR 2-3, aber DOAC bevorzugt. 2) Sekund\u00e4r-Pr\u00e4vention: Statine (Atorvastatin 80mg/d hochintensiv), Antiplatelet-Agent: normalerweise Aspirin 81mg/d (aber wenn auf Antikoagulation f\u00fcr VHF, dann nur Antikoagulation allein, nicht dual). 3) BP-Kontrolle: Ziel <140/90 nach Stabilisierung. Restart Home-BP Medikamente nach 24h (aber mehr aggressiv). 4) PT/OT/Logop\u00e4die-Rehabilitation sofort beginnen. 5) Untersuchung auf andere CVI-Risikofaktoren (Diabetes-Kontrolle, Lipide)", "Blutdruck-Management spezifisch f\u00fcr rtPA: rtPA erfordert aggressivere BP-Kontrolle weil hoher BP = h\u00f6heres Risiko f\u00fcr ICH nach thrombolyse. Ziel bei rtPA: SBP <180 und DBP <110 mmHg. Bei dieser Patient SBP 162, DBP 92 = bereits nahe, aber k\u00f6nnte slightly h\u00f6her sein - NICHT kritisch f\u00fcr rtPA-Kontraindikation. W\u00e4hrend und nach rtPA: Antihypertensiva zur\u00fcckhalten wenn BP <220/120 (das ist die Schwelle), aber bei diesem Patient BP nur 162, daher kein Antihypertensiv notwendig JETZT. Nach rtPA: Vorsichtig mit \u00dcberkorrektion (aggressive BP-Senkung kann isch\u00e4mische L\u00e4sion vergr\u00f6\u00dfern durch Reduktion Perfusion in Penumbra-Zone). Ziel: 10-15% RR-Reduktion in erste paar Stunden, dann gradueller R\u00fcckgang zu normalen Blutdruck \u00fcber Tage"]}, {"id": 8, "caseName": "71-j\u00e4hrige Patientin mit Verwirrtheit und Schocksymptomen", "fachbereich": "Internisten/Notfall", "anamnese": "71-j\u00e4hrige weibliche Patientin mit langer Geschichte von REZIDIVIERENDER Harnwegsinfektionen (HWI) stellt sich mit akutem Beginn vor: Partner berichtet pl\u00f6tzliche Verwirrtheit, Sch\u00fcttelfrost, und 'Schock-\u00e4hnliche' Symptome. Patientin hatte am Vortag einfache Urin-Symptome (Dysurie, Pollakisurie), aber Symptome wurden schnell schlimmer. Heute morgen: HEFTIGE Verwirrtheit (kann nicht Namen ihrer Enkel sagen), Sch\u00fcttelfrost, Partner bemerkt dass Patient sehr KALT ist aber Thermometer zeigt 39,8\u00b0C (klassische Sepsis-Pr\u00e4sentation: K\u00e4lte trotz Fieber). Zucker-Krankheit vorhanden (wahrscheinlich Typ 2, nicht sicher dokumentiert), und diese Kombination (DM + rezidivierende HWI) erh\u00f6ht Sepsis-Risiko MASSIV. Chronisches Nieren-Leiden Stadium 3 (Kreatinin baseline wahrscheinlich 1,2-1,5). Kein neue Medikament. Penicillin-Allergie dokumentiert (Urtikaria, nicht Anaphylaxie)", "koerperlich": "Verwirrt, somnolent (nicht voll alert - KRITISCH!), Haut sehr marmoliert und livid (marbled skin = klassisches Zeichen von Schock von systemischer Vasokonstriktion). Extremit\u00e4ten: SEHR kalt und cyanotisch (periphere Cyanose = peripherer Shutdown von Schock). Kapillar-Refill Zeit: >2 Sekunden (normal <2 sec, prolongiert = Zeichen von Schock). CVA-Klopfschmerz (Costovertebral-Angle): POSITIV beidseits (klassisch f\u00fcr Pyelonephritis, also dies ist Uro-Sepsis, nicht nur simple Zystitis). Abdomen: weich, KEINE Peritonitis-Zeichen, aber Schmerz bei Klopfung der Nieren. Lunge: klare Lungenfelder, aber Atemarbeit erh\u00f6ht. Neurologische: verwirrt aber reagiert auf Stimuli", "vitale": "RR 92/56 mmHg (KRITISCH niedrig = Hypotension! Zeichen von Schock!), HF 118/min (Tachykardie = Kompensation von Schock), AF 22/min (Tachypnoe), SpO2 94% (niedrig-normal f\u00fcr Schock), T 39,8\u00b0C (hohes Fieber = Infektion)", "labor": "Leukozyten 18.500/\u03bcL (massive Erh\u00f6hung = Infektion), Thrombozyten 95.000/\u03bcL (NIEDRIG = DIC-Signal oder Konsumption), Kreatinin 2,1 mg/dL (STARK erh\u00f6ht von Baseline ~1,3 = Nieren-Funktion verschlechtert sich AKUT, Sepsis ist Ursache), Bilirubin 2,2 mg/dL (erh\u00f6ht = Leber-Beteiligung), PT 16 sec (ERH\u00d6HT = prolongierte Koagulation-Zeit = Gerinnungs-St\u00f6rung = DIC-Signal), aPTT 42 sec (ERH\u00d6HT = weitere DIC-Hinweis), Laktat 3,2 mmol/L (erh\u00f6ht = Gewebshypoperfusion aus Schock)", "bildgebung": "R\u00f6ntgen Thorax: Bilaterale Infiltrate in Lunge (Zeichen von Pneumonie UND/ODER Lungen\u00f6dem von Schock/ARDS). Sonographie Abdomen: Bilaterale Hydronephrose (Sammlung Urin in Nieren und oberen Harnleitern = Obstruction von Harnfluss, wahrscheinlich von Schwellung der Urethra von Infektion ODER Ureteral-Obstruction). DIES IST SCHL\u00dcSSEL-BEFUND: dieser Patient hat Urin-Obstruction kombiniert mit Infektion oberhalb der Obstruction = infected obstructed urinary system = KRITISCHER NOTFALL!", "q": ["Definiere Sepsis, Sepsis schwer, und septischer Schock nach Sepsis-3-Definitionen. Welche Kriterien erf\u00fcllt diese Patientin?", "Identifiziere Infektionsquelle. Diskutiere urologische Implikationen der bilateralen Hydronephrose", "Beschreibe 6-Stunden-Bundle: Priorit\u00e4t, Abfolge, spezifische Interventionen, Monitoring", "Rolle von Vasopressoren, Fl\u00fcssigkeitsmanagement, Infektionsquellen-Management. Wann ist Urology-Intervention notwendig und wie dringend?"], "answers": ["Sepsis-3-Definitionen (2016): Sepsis = infizierte Person (vermutete oder bewiesene Infektion) + SIRS-Kriterien (Temperatur >38 oder <36, Herzfrequenz >90, Atemfrequenz >20, Leukozyten >12.000 oder <4.000 ODER >10% St\u00e4be). Diese Patientin erf\u00fcllt ALLE: Fieber 39,8, HF 118, AF 22, Leukozyten 18.500. Sepsis schwer (fr\u00fcher: septischer Schock) = Sepsis + Organversagen (Kreatinin \u2191 bis 2,1, Bilirubin \u2191, Thrombozyten \u2193, Laktat \u2191 = MULTIPLE Organversagen). Septischer Schock (aktuelle Definition) = Sepsis + Hypotension (SBP 92) + Laktat \u2191 trotz Fl\u00fcssigkeits-Resuscitation. Diese Patientin erf\u00fcllt ALLEN DREI definitionen, besonders septischer Schock", "Wahrscheinliche Infektionsquelle: UROSEPSIS (rezidivierende HWI + aktuelle Urin-Symptome (Dysurie/Pollakisurie) + CVA-Schmerz + Pyelonephritis-Zeichen). Der KRITISCHE Befund ist BILATERALE Hydronephrose: Das bedeutet Urin ist obstruiert und sammelt sich oberhalb der Obstruction (normalerweise im Nieren-Nierenbecken), und diese Stase macht Infektion VIEL schlimmer und erh\u00f6ht Bakteri\u00e4mie-Risiko MASSIV. H\u00e4ufige Ursachen der Obstruction: Urethral-Schwellung von Infektion, Urethral-Striktur, Prostatitis mit Schwellung (wenn Mann), oder Ureteral-Stein kombiniert mit Infektion. In dieser \u00e4lteren weibliche Patientin: Urethral-Schwellung oder Ureteral-Stein wahrscheinlich", "Kritisches 6-Stunden-Sepsis-Bundle (evidenzbasiert): PRIORIT\u00c4T: (1) Blutkultur VOR Antibiotika (aber nicht verz\u00f6gern AB); (2) Sofort breites Spektrum Antibiotika (innerhalb 1 Stunde!); (3) IV-Fl\u00fcssigkeit-Resuscitation; (4) Vasopressor wenn Hypotension persistiert trotz Fl\u00fcssigkeit; (5) Infektionsquelle identifizieren und behandeln; (6) Kontinuierliche Monitoring. ABFOLGE: A) Blutkultur, Urin-Kultur sofort (2 Sets von verschiedenen Sites); B) IV-Zugang, schnelle Fl\u00fcssigkeit: Lactated Ringer's 30 mL/kg (dieser Patient ~70 kg = 2,1L Bolus) \u00fcber 3 Stunden; C) Antibiotika sofort: ceftriaxon 2g IV + gentamicin 3-5 mg/kg IV (f\u00fcr Gram-negative coverage und Urosepsis) + vancomycin wenn MRSA-Risiko; D) Falls Hypotension persistiert nach Fl\u00fcssigkeit: Vasopressor (Norepinephrin erste Wahl, Ziel MAP \u226565); E) Imaging: CT Abdomen/Pelvis mit IV-Kontrast um Quelle zu lokalisieren. MONITORING: Kontinuierliche Vitale, Urin-Output (ziel 0,5 mL/kg/h), serielle Laktat-Messungen (sollte Trends down), Blutgase", "Vasopressoren: INDIZIERT wenn Hypotension persistiert trotz IV-Fl\u00fcssigkeit-Resuscitation. Erste Wahl: Norepinephrin (0,05-2 \u03bcg/kg/min IV), Ziel MAP \u226565 mmHg. Fl\u00fcssigkeitsmanagement: 30 mL/kg Bolus Lactated Ringer's als erste Linie (wie erw\u00e4hnt). Nach initial Bolus: begrenzen Fl\u00fcssigkeit wenn Lungenfunktion sich verschlechtert (Zeichen ARDS/Lungen\u00f6dem). Infektionsquelle-Management: KRITISCH bei Urosepsis mit Obstruction: Urology-Intervention ist NOTWENDIG und DRINGEND! Optionen: Ureterale Stents (percutan oder retrograd via Zystoskopie), oder Perkutane Nephrostomie (PNC) wenn Stents nicht m\u00f6glich. Dies muss gemacht werden INNERHALB FEW STUNDEN von Diagnose (nicht tagelang warten). Timing: Antibiotika sofort, aber Urology-Intervention sollte parallel arrangiert werden (nicht warten f\u00fcr Antibiotika nur). Mit infected obstructed system: Mortalit\u00e4t ist hoch (20-50%) ohne schnelle Drainage!"]}, {"id": 9, "caseName": "Fall 9 - Klinischer Fall", "fachbereich": "Innere Medizin", "anamnese": "Fallbeschreibung 9: [Anamneseinfo]...", "koerperlich": "K\u00f6rperliche Befunde 9: [Details]...", "vitale": "Vitale Zeichen 9: RR normal, HF normal, AF normal, SpO2 normal, T normal", "labor": "Laborergebnisse 9: [Normale Werte]...", "bildgebung": "Bildgebung/EKG 9: [Befunde]...", "q": ["Frage 1?", "Frage 2?", "Frage 3?", "Frage 4?"], "answers": ["Antwort 1: ...", "Antwort 2: ...", "Antwort 3: ...", "Antwort 4: ..."]}, {"id": 10, "caseName": "Fall 10 - Klinischer Fall", "fachbereich": "Innere Medizin", "anamnese": "Fallbeschreibung 10: [Anamneseinfo]...", "koerperlich": "K\u00f6rperliche Befunde 10: [Details]...", "vitale": "Vitale Zeichen 10: RR normal, HF normal, AF normal, SpO2 normal, T normal", "labor": "Laborergebnisse 10: [Normale Werte]...", "bildgebung": "Bildgebung/EKG 10: [Befunde]...",         let currentMode = 'single';
        let currentCaseIndex = 0;
        let progress = {};

        function initApp() {
            loadProgress();
            displayCase();
            updateStats();
        }

        function displayCase() {
            if (allCases.length === 0) return;
            
            const caseIndex = currentMode === 'single' ? currentCaseIndex : Math.floor(Math.random() * allCases.length);
            const caseData = allCases[caseIndex];
            
            let html = `
                <div class="case-container">
                    <div class="case-header">
                        <div>
                            <div class="case-title">${caseData.caseName}</div>
                            <div class="case-meta">Case ${caseData.id} | Fachbereich: ${caseData.fachbereich || 'Innere Medizin'}</div>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">📋 Anamnese</div>
                        <div class="section-content">${caseData.anamnese}</div>
                    </div>

                    <div class="section">
                        <div class="section-title">🔍 Körperliche Untersuchung</div>
                        <div class="section-content">${caseData.koerperlich}</div>
                    </div>

                    <div class="section">
                        <div class="section-title">📊 Vitale Zeichen</div>
                        <div class="section-content">${caseData.vitale}</div>
                    </div>

                    <div class="section">
                        <div class="section-title">🧪 Laborergebnisse</div>
                        <div class="section-content">${caseData.labor}</div>
                    </div>

                    <div class="section">
                        <div class="section-title">🖼️ Bildgebung & EKG</div>
                        <div class="section-content">${caseData.bildgebung}</div>
                    </div>

                    <div style="margin-top: 30px; border-top: 2px solid var(--border); padding-top: 30px;">
                        <h3 style="color: var(--primary); margin-bottom: 20px;">Fragen zum Fall:</h3>
                        ${caseData.q.map((q, idx) => `
                            <div class="question-block">
                                <div class="question-text">Frage ${idx + 1}: ${q}</div>
                                <textarea id="answer_${idx}" placeholder="Hier antworte..."></textarea>
                            </div>
                        `).join('')}
                    </div>

                    <div class="button-group">
                        <button class="btn btn-success" onclick="submitAnswers(${caseData.id})">✓ Antworten einreichen</button>
                        <button class="btn" onclick="nextCase()">→ Nächster Fall</button>
                    </div>
                </div>

                <div id="ratingSection_${caseData.id}" class="rating-section">
                    <div class="rating-title">Wie bewertest du deine Antworten?</div>
                    <div class="rating-buttons">
                        <button class="btn btn-success" onclick="rateAnswers(${caseData.id}, 'correct')">✓ Korrekt</button>
                        <button class="btn btn-warning" onclick="rateAnswers(${caseData.id}, 'sufficient')">~ Ausreichend</button>
                        <button class="btn btn-danger" onclick="rateAnswers(${caseData.id}, 'incorrect')">✗ Falsch</button>
                    </div>
                </div>
            `;

            document.getElementById('caseContainer').innerHTML = html;
        }

        function submitAnswers(caseId) {
            const ratingSection = document.getElementById(`ratingSection_${caseId}`);
            if (ratingSection) ratingSection.classList.add('show');
        }

        function rateAnswers(caseId, rating) {
            progress[caseId] = rating;
            saveProgress();
            updateStats();
            showFeedback(caseId);
            nextCase();
        }

        function showFeedback(caseId) {
            const caseData = allCases.find(c => c.id === caseId);
            if (!caseData) return;

            let feedbackHTML = `<div class="feedback-header">💡 Musterlösungen</div>`;
            caseData.q.forEach((q, idx) => {
                feedbackHTML += `
                    <div class="feedback-item">
                        <div class="feedback-q-text">Frage ${idx + 1}: ${q}</div>
                        <div style="margin-top: 10px;">
                            <div style="font-weight: bold; color: var(--text-secondary); margin-bottom: 8px;">Musterlösung:</div>
                            <div class="solution-answer">${caseData.answers[idx] || 'Keine Lösung verfügbar'}</div>
                        </div>
                    </div>
                `;
            });

            const feedbackContainer = document.getElementById('feedback');
            feedbackContainer.innerHTML = feedbackHTML;
            feedbackContainer.classList.add('show');
            feedbackContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function nextCase() {
            currentCaseIndex = (currentCaseIndex + 1) % allCases.length;
            document.getElementById('feedback').classList.remove('show');
            displayCase();
        }

        function switchMode(mode) {
            currentMode = mode;
            currentCaseIndex = 0;
            document.querySelectorAll('.mode-selector .btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            displayCase();
        }

        function updateStats() {
            const completed = Object.keys(progress).length;
            const total = allCases.length;
            const percentage = Math.round((completed / total) * 100);
            
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressPct').textContent = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        function saveProgress() {
            localStorage.setItem('kp_progress', JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('kp_progress');
            progress = saved ? JSON.parse(saved) : {};
        }

        function exportProgress() {
            const dataStr = JSON.stringify(progress, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'kp_progress_' + new Date().getTime() + '.json';
            link.click();
        }

        function importProgress() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        progress = JSON.parse(event.target.result);
                        saveProgress();
                        updateStats();
                        alert('Fortschritt importiert!');
                    } catch (err) {
                        alert('Fehler beim Importieren');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function resetProgress() {
            if (confirm('Sicher? Alle Fortschritte werden gelöscht!')) {
                progress = {};
                localStorage.removeItem('kp_progress');
                updateStats();
                displayCase();
            }
        }

        initApp();
    </script>
