, Serosa. Organe im Oberbauch:"}], "runde_2": [{"q": "Wenn der Patient bereits eine Lebermetastase hat – was dann?", "a": "    "}, {"q": "Anatomie der Leber – welche Segmente gibt es?", "a": "Nach Couinaud-Klassifikation (chirurgisch relevant): "}], "runde_3": [{"q": "CHA₂ DS₂ -VASc-Score – wann DOAK?", "a": "Kriterium C – Herzinsuffizienz (Congestive heart failure) H – Hypertonie A₂ – Alter ≥ 75 Jahre D – Diabetes mellitus S₂ – Schlaganfall / TIA / Thromboembolie (Stroke) V – Vaskuläre Erkrankung (KHK, pAVK, Aortenplaque) A – Alter 65–74 Jahre Sc – Weibliches Geschlecht (Sex category)"}, {"q": "Braucht dieser Patient (60-jähriger Mann, keine Vorerkrankungen) ein DOAK?", "a": "  "}, {"q": "Was wollte der Prüfer hören (Winkel und Art der Pathologie)?", "a": "Dies entspricht einem Steiltyp-/Rechtstyp-bezogenen Befund oder wahrscheinlicher einer: Hauptdiagnose: Anteriore/globale Ischämie oder Perikarditis / TakotsuboKardiomyopathie "}, {"q": "Welche Arterien und Venen versorgen die Leber?", "a": "  "}, {"q": "Welche Zeichen / Prinzipien des Strahlenschutzes gibt es?", "a": "Die 3 Grundprinzipien des Strahlenschutzes (ALARA-Prinzip): 1. Rechtfertigung: Jede Strahlenexposition muss gerechtfertigt sein (Nutzen > Risiko) 2. Optimierung: Dosis so niedrig wie vernünftigerweise möglich (As Low As Reasonably Achievable = ALARA)"}], "clinical_case": "**Hauptsymptom:** Fall 32\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 32. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Laborchemische Parameter und Entzündungsmarker\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_33": {"case_info": "Fall 33\nPrüfungsprotokoll – Kenntnisprüfung\nPrüfungsdatum: 04.05.2026 — Ergebnis: Bestanden (1/3) Datum der Nachricht:\n06.05.2026\n\nPatientenvorstellung (Runde 1) – Ulcus ventriculi\nAnamnese\nEine 50-jährige Frau stellt sich mit seit einem halben Jahr bestehenden\nOberbauchschmerzen vor, die sich in den letzten zwei Wochen verstärkt haben.\nBegleitend bestehen Übelkeit und Erbrechen (mit Speiseresten). Die Schmerzen\nverstärken sich nach dem Essen.\nMedikamente: Ibuprofen 400 mg 3× täglich seit einem halben Jahr wegen\nRückenschmerzen – ohne ärztliche Verordnung, eigenständig in der Apotheke gekauft.\nAuf Nachfrage gab die Patientin an, eine behinderte Tochter zu haben, um die sie sich\nkümmern muss.\nRisikofaktoren:\n\n\n\n\nNSAR-Einnahme (Ibuprofen) – ohne Verordnung, langfristig\nNikotinkonsum: 15 Zigaretten/Tag\nAlkohol: 1 Glas Wein jeden Abend\n\nKörperliche Untersuchung\n\n\n\n\n\nDruckschmerz im Epigastrium\nKein Loslassschmerz (kein Peritonismus)\nRR beidseits 120/70 mmHg\nPuls wurde vergessen zu tasten (Anmerkung: In der Prüfung auffallen lassen,\nPulstastung immer standardmäßig durchführen)\n\nAufklärung und weiteres Vorgehen\nDie Patientin wurde über die Verdachtsdiagnose aufgeklärt. Sie fragte, ob sie heute\nnach Hause gehen und morgen wiederkommen könne, da sie sich um ihre Tochter\nkümmern müsse.\nEmpfohlenes Vorgehen:\n1. Labor und EKG veranlassen\n2. Entlassbrief für Hausarzt ausstellen\n3. Ibuprofen absetzen\n4. PPI (Protonenpumpeninhibitor) zur Magenschutztherapie einleiten\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n5. Hausarzt-Überweisung zur weiteren Abklärung (inkl. ÖGD)\n\nFragen und Antworten – Runde 1\nVerdachtsdiagnose und Differenzialdiagnosen\nVerdachtsdiagnose: Ulcus ventriculi\nDifferenzialdiagnosen:\nUlcus duodeni, Gastritis (A, B oder C), Magenkarzinom, Refluxösophagitis\n(GERD), Pankreatitis, Cholezystitis, funktionelle Dyspepsie\n\nWarum bei dieser Patientin eher Ulcus ventriculi als Ulcus duodeni?\n\n\n\n\n\nSchmerzverstärkung nach dem Essen (beim Ulcus duodeni: Besserung nach\ndem Essen, Nüchternschmerz, Nachtschmerz)\nLangfristige NSAR-Einnahme → schädigt bevorzugt die Magenmukosa\nÄltere Patientin (Ulcus ventriculi häufiger im höheren Alter)\nAlkohol- und Nikotinkonsum begünstigen ebenfalls das Magenulkus\n\nUnterschied Ulcus ventriculi vs. Ulcus duodeni\nMerkmal\nUlcus ventriculi\nSchmerzcharakter Sofortschmerz nach dem\nEssen\nHäufigkeit\nSeltener\nMalignomrisiko\nHöher (Biopsie pflicht!)\nAssoziation\nNSAR, Alkohol, Nikotin\nLokalisation\nMeist Angulus/kleine\nKurvatur\n\nUlcus duodeni\nNüchternschmerz, Besserung nach\ndem Essen\nHäufiger (ca. 4× häufiger)\nSehr gering\nH. pylori (häufigste Ursache)\nBulbus duodeni\n\nUrsachen des Ulkus – H. pylori\nWas ist H. pylori?\nHelicobacter pylori ist ein gramnegativer, mikroaerophiles, spiralförmiges\nBakterium, das die Magenmukosa besiedelt. Es ist der häufigste Erreger einer\nchronischen Gastritis (Typ B) und gilt als Hauptursache des peptischen Ulkus\nsowie Risikofaktor für das Magenkarzinom.\nWarum kann H. pylori in der Magensäure überleben?\nDurch das Enzym Urease: Es spaltet Harnstoff (Urea) in Ammoniak (NH₃ )\nund CO₂ . Das basische Ammoniak neutralisiert lokal die Magensäure und\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nschafft so eine Schutzzone um das Bakterium. Zudem schützt ein Schleimfilm\ndas Bakterium.\nWo ist das Ulkus am häufigsten lokalisiert?\n\n\n\nUlcus ventriculi: Angulus ventriculi und kleine Kurvatur des Magens\nUlcus duodeni: Bulbus duodeni (Pars superior)\n\nGastritis A, B, C – Übersicht\nTyp\nA\n(Autoimmun)\nB (Bakteriell)\n\nÄtiologie\nAutoantikörper gegen\nParietalzellen / Intrinsic Factor\nH. pylori\n\nC (Chemisch) NSAR, Alkohol, Gallereflux\n\nLokalisation\nKorpus,\nFundus\nAntrum\n(initial)\nAntrum\n\nBemerkung\n→ Perniziöse Anämie,\nAchlorhydrie\nHäufigste Form\n(>80 %)\nReaktive Gastritis\n\nBei dieser Patientin: Gastritis Typ C (NSAR + Alkohol + Nikotin)\nErkrankungsbezeichnung für NSAR-/Alkohol-induzierte Schädigung: Reaktive\n(chemische) Gastropathie / Gastritis Typ C\n\nLaborwerte\nRelevante Laborparameter:\nParameter\nBB (Blutbild)\nCRP, BSG\nAST (GOT), ALT (GPT)\nγ-GT\n\nBedeutung\nAnämie? (z. B. bei GI-Blutung)\nEntzündungszeichen\nLeberzellschaden (Zytolyseparameter)\nCholestase, Alkohol-Marker (sensitiv für\nAlkoholkonsum)\nAP (Alkalische Phosphatase)\nCholestase, Knochenerkrankungen\nLipase, Amylase\nPankreasenzyme – zum Ausschluss\nPankreatitis\nBilirubin\nLeberfunktion, Cholestase\nKreatinin, GFR\nNierenfunktion (Ibuprofen-Nephrotoxizität)\nH.-pylori-Antigentest (Stuhl) oder ¹³C- Nachweis H. pylori\nAtemtest\nGerinnung (Quick/INR, PTT)\nBei Blutungszeichen\nWas sind AST und ALT?\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nAST (Aspartat-Aminotransferase) und ALT (Alanin-Aminotransferase) sind\nintrazelluläre Enzyme, die bei Leberzellschädigung in die Blutbahn freigesetzt\nwerden. ALT ist leberspezifischer als AST. Erhöhung → Hepatitis, toxischer\nLeberschaden (Alkohol), etc.\nγ-GT: Sensitiver Cholestaseparameter, stark erhöht bei Alkoholabusus (auch ohne\nstrukturellen Leberschaden).\nAP: Erhöht bei Cholestase (intra-/extrahepatisch), Knochenmetastasen, Morbus Paget.\nPankreasparameter: Lipase (sensitiver und spezifischer als Amylase) → PankreatitisAusschluss.\n\nWarum EKG bei dieser Patientin?\nZum Ausschluss eines Hinterwandinfarkts (STEMI inferior): Ein inferiorer\nMyokardinfarkt kann sich mit Oberbauchschmerzen, Übelkeit und\nErbrechen manifestieren und klinisch einem Ulkus ähneln. Das EKG\n(Ableitung II, III, aVF) ist daher bei unklaren Oberbauchbeschwerden obligat.\n\nÖGD (Ösophago-Gastro-Duodenoskopie)\nWas muss bei der ÖGD gemacht werden?\n\n\n\nBiopsie aus dem Ulkusrand (mind. 6–8 Biopsien: 4 aus Antrum, 2 aus Korpus für\nH.-pylori-Nachweis und Histologie)\nWarum Biopsie? → Ausschluss eines Magenkarzinoms (maligne Entartung des\nUlkus) + H.-pylori-Nachweis (CLO-Test / Histologie)\n\nKlassifikation des Magenkarzinoms\nG-Klassifikation (Grading – Differenzierungsgrad):\n\n\n\n\n\nG1: gut differenziert\nG2: mäßig differenziert\nG3: schlecht differenziert\nG4: undifferenziert (anaplastisch)\n\nR-Klassifikation (Residualtumor nach Resektion):\n\n\n\n\nR0: Kein Residualtumor, mikroskopisch und makroskopisch tumorfrei → kurativ\nR1: Mikroskopischer Residualtumor (histologisch nachweisbar)\nR2: Makroskopischer Residualtumor (sichtbar verbliebener Tumor)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nEradikationstherapie bei H. pylori\nErstlinientherapie (French Triple Therapy):\nPPI (z. B. Omeprazol 2×20 mg) + Clarithromycin 2×500 mg + Amoxicillin\n2×1000 mg → 7–14 Tage\nBei Clarithromycin-Resistenz (Italian Triple Therapy / Quadruple Therapy):\nPPI + Metronidazol + Amoxicillin oder Bismut-basierte Quadrupeltherapie\n(PPI + Bismut + Tetracyclin + Metronidazol)\nEradikationskontrolle: ¹³C-Harnstoff-Atemtest frühestens 4 Wochen nach\nTherapieende (PPI vorher absetzen).\n\nMagennanatomie und Oberbauchorgane\nMagenabschnitte:\nKardia → Fundus → Korpus → Antrum → Pylorus\nOrgane im Oberbauch:\nMagen, Leber (re. Oberbauch), Gallenblase, Milz (li. Oberbauch), Pankreas\n(retroperitoneal), Duodenum, rechte und linke Niere (retroperitoneal), Teile des\nKolons (re. u. li. Flexur), Aorta, V. cava inferior", "runde_1": [], "runde_2": [{"q": "Was wurde falsch beantwortet?", "a": "Sonografie Abdomen wurde genannt → korrekt ist: CT Abdomen mit KM (höhere Sensitivität für Lebermetastasen, Lymphknoten, lokale Infiltration) Vollständiges Staging-Schema:      "}, {"q": "Wann adjuvante Chemotherapie?", "a": "Ab Stadium UICC III (Lymphknotenbefall) obligat. Bei Stadium II mit Risikofaktoren (T4, Perforation, notfallmäßige OP) ggf. erwägen."}, {"q": "Wann neoadjuvante Therapie?", "a": "Beim Rektumkarzinom (nicht Kolonkarzinom): Neoadjuvante Radiochemotherapie (RCT) bei Stadium II–III zur Tumorverkleinerung vor OP (→ R0-Resektion, Sphinktererhalt)."}, {"q": "Was wenn bereits eine Lebermetastase vorhanden?", "a": "   "}], "runde_3": [{"q": "Wann DOAK (Direkte orale Antikoagulanzien)?", "a": "  "}, {"q": "Braucht dieser Patient DOAK?", "a": "Nein – 60-jähriger Mann, keine Risikofaktoren → CHA₂ DS₂ -VASc = 0 oder 1 (Alter 60 = 0 Punkte für Alterskriterium, keine anderen RF) → Antikoagulation nicht zwingend indiziert bei erstmaligem, unkompliziertem VHF ohne weitere Risikofaktoren. Verlauf: Nach Kardioversion → erneutes VHF nach 20 Minuten. Medikamentöse"}, {"q": "Kardioversion ebenfalls erfolglos. Was dann?", "a": "Katheterablation der Pulmonalvenen (Pulmonalvenenisolation, PVI)   "}, {"q": "Was wollte der Prüfer hören?", "a": "  "}, {"q": "Wie verläuft die Pfortader? Wie wird sie gebildet?", "a": "Die V. portae hepatis entsteht durch Zusammenfluss von:  "}], "clinical_case": "**Hauptsymptom:** Fall 33\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 33. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Bildgebende Verfahren (Ultraschall, CT oder Röntgen)\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_34": {"case_info": "Fall 34\nKenntnisprüfungsprotokoll\nDatum der Nachricht\nDatum der\nKenntnisprüfung\nErgebnis\nVorbereitung\nQuellen\n\n09.05.2026\n04.05.2026, 12:30 Uhr\nBestanden\nca. 9 Monate (neben der Arbeit); Simulation nur in den\nletzten 2 Wochen\nRojaht 806, 2024 PDF; Protokolle der letzten Monate\n(April)\n\nFallvorstellung – Schauspielerpatient\nDiagnose: pAVK (periphere arterielle Verschlusskrankheit)\nSymptomatik: Typische pAVK-Symptomatik; der Schauspieler schilderte die\nBeschwerden sehr überzeugend.\nUntersuchungsbefunde:\n\n\n\n\nBeidseitige Unterschenkelödeme\nNarbe am rechten Knie (Z. n. Operation)\nKeine weiteren auffälligen Befunde\n\nKörperliche Untersuchung: Der Prüfer wollte nur eine orientierende Untersuchung mit\nden Hauptbefunden an Lunge, Herz und Abdomen sehen.\nHinweis: Die Ratschow-Lagerungsprobe wurde vergessen – dies wurde von\nden Prüfern nicht kommentiert.", "runde_1": [{"q": "F: Was ist die Verdachtsdiagnose und warum?", "a": "A: Verdachtsdiagnose: pAVK (periphere arterielle Verschlusskrankheit). Begründung: typische Symptomatik (z. B. Claudicatio intermittens, Ruheschmerz je nach Stadium), Risikofaktoren (Rauchen, Diabetes, arterielle Hypertonie, Hyperlipidämie), reduzierte oder fehlende periphere Pulse, trophische Hautveränderungen."}, {"q": "F: Welche Differenzialdiagnosen kommen infrage?", "a": "A:     "}, {"q": "betroffen und auf welcher Höhe?", "a": "A: Beim vorliegenden Patienten:  "}, {"q": "das?", "a": "A: Es handelt sich um eine chronische Ischämie, da im Angiografiebild eine Kollateralperfusion (Umgehungskreislauf) erkennbar ist. Diese bildet sich erst über Wochen bis Monate bei allmählichem Gefäßverschluss. Bei akutem Verschluss fehlen"}], "runde_2": [{"q": "F: Befundung des EKGs (ST-Hebungen, Hinterwandinfarkt, AV-Block-Typ)?", "a": "A:   "}, {"q": "F: Was tun wir beim Myokardinfarkt (STEMI)?", "a": "A: 1. Sofortmaßnahmen: Monitoring, i.v.-Zugang, O₂ bei SpO₂ < 90 %, 12-KanalEKG 2. Medikamentös: ASS 250–500 mg i.v. + P2Y12-Inhibitor (z. B. Ticagrelor, Prasugrel), Antikoagulation (Heparin), Nitrate bei Bedarf, Betablocker 3. Reperfusion: Primäre PCI (perkutane Koronarintervention) innerhalb von 90 min – Therapie der Wahl; Lyse als Alternative, wenn PCI nicht rechtzeitig möglich (< 120 min Gesamtzeit) 4. Stationäre Überwachung: Intensivstation, Echokardiografie, Verlaufs-EKG, Troponin-Kontrollen"}, {"q": "F: Welches Fremdmaterial ist auf dem Röntgenbild zu sehen?", "a": "A:  "}, {"q": "F: Weiterer Befund auf dem Röntgenbild?", "a": "A: Lobäre Pneumonie – Verschattung eines gesamten Lungenlappens, typischerweise mit positivem Bronchopneumogramm und luftgefüllten Bronchien im konsolidierten Bereich."}, {"q": "F: Was ist der Unterschied zwischen typischer und atypischer Pneumonie?", "a": "A: Merkmal Erreger"}], "runde_3": [{"q": "F: Wann antikoaguliert man lebenslang?", "a": "A:  "}, {"q": "F: Was ist Vorhofflimmern (VHF)?", "a": "A: Vorhofflimmern ist die häufigste anhaltende Herzrhythmusstörung. Es entsteht durch chaotische, unkoordinierte elektrische Aktivität der Vorhöfe (400–600/min), sodass keine effektive Vorhofkontraktion mehr stattfindet. Im EKG: fehlende P-Wellen, unregelmäßige RR-Abstände, Flimmerwellen (f-Wellen). Folge: hämodynamische Beeinträchtigung und Thromboembolierisiko durch Blutpool im linken Vorhofohr."}, {"q": "F: Welcher Zusammenhang besteht zwischen VHF und Schlaganfall?", "a": "A: Durch den fehlenden Vorhofkick und den Blutstau im linken Vorhofohr entstehen Thromben, die sich ablösen und als kardiale Embolien in die Hirnarterien gelangen können → ischämischer Schlaganfall. VHF erhöht das Schlaganfallrisiko um das 5Fache. Schlaganfälle durch VHF sind oft schwerer und mit höherer Mortalität verbunden."}, {"q": "F: Kann VHF einen plötzlichen Herzinfarkt (Myokardinfarkt) verursachen?", "a": "A: Nein, nicht direkt. VHF verursacht keinen klassischen Myokardinfarkt (der durch Koronararterienverschluss entsteht). Allerdings kann VHF zu einer koronaren Embolie führen (selten), und durch Tachykardie/hämodynamische Instabilität kann eine bestehende KHK dekompensieren. Die Hauptgefahr von VHF sind thromboembolische Schlaganfälle, nicht Myokardinfarkte."}, {"q": "Antikoagulation geben?", "a": "A: Ja, wenn der CHA₂ DS₂ -VASc-Score ≥ 2 (Mann) bzw. ≥ 3 (Frau) ist. Ein 65-jähriger Patient erhält allein durch das Alter (65–74 Jahre) bereits 1 Punkt; weitere Risikofaktoren (Herzinsuffizienz, Hypertonie, Diabetes, Schlaganfall/TIA in der Vorgeschichte, Gefäßerkrankung, weibliches Geschlecht) können den Score erhöhen. Auch bei paroxysmalem VHF ist die Antikoagulationsindikation dieselbe wie bei persistierendem oder permanentem VHF. CHA₂ DS₂ -VASc-Score: | Faktor | Punkte | |—|—| | C – Herzinsuffizienz (Congestive heart failure) | 1 | | H – Hypertonie | 1 | | A₂ – Alter ≥ 75 Jahre | 2 | | D – Diabetes mellitus | 1 | | S₂ – Schlaganfall/TIA/Thromboembolie | 2 | | V – Vaskuläre Erkrankung (KHK, pAVK, Aortenplaque) | 1 | | A – Alter 65–74 Jahre | 1 | | Sc – Weibliches Geschlecht (Sex category) | 1 |"}, {"q": "F: Warum geben wir überhaupt Antikoagulation bei VHF?", "a": "A: Zur Schlaganfallprophylaxe – Verhinderung thromboembolischer Ereignisse durch kardiogene Embolie. Komplikationen: ischämischer Schlaganfall, periphere Embolien, TIA, kognitive Einschränkungen. Der Prüfer erwartete als zentralen Punkt: Vermeidung von Einschränkung der Lebensqualität und Leistungsfähigkeit (z. B. durch Schlaganfall-bedingte Pflegebedürftigkeit, Behinderung, Aphasie)."}, {"q": "Sie Antikoagulation geben?", "a": "A: Dies ist eine ethisch und medizinisch komplexe Entscheidung. In diesem Fall spricht vieles gegen eine Fortsetzung der Antikoagulation:    "}, {"q": "F: Woraus bestehen biologische Herzklappen?", "a": "A: Biologische Herzklappen bestehen überwiegend aus Schweineherzklappen (porzines Gewebe) oder Rinderperikard (bovines Perikard). Sie werden chemisch behandelt (Glutaraldehyd-Fixierung), um Immunreaktionen zu minimieren. Alternativ gibt es auch Homografts (menschliche Spenderklappen) und Autografts (körpereigene Pulmonalklappe → Ross-Operation)."}], "title": "Fall 34", "header": "Fall 34\nKenntnisprüfungsprotokoll\nDatum der Nachricht 09.05.2026\nDatum der 04.05.2026, 12:30 Uhr\nKenntnisprüfung\nErgebnis Bestanden\nVorbereitung ca. 9 Monate (neben der Arbeit); Simulation nur in den\nletzten 2 Wochen\nQuellen Rojaht 806, 2024 PDF; Protokolle der letzten Monate\n(April)\nFallvorstellung – Schauspielerpatient\nDiagnose: pAVK (periphere arterielle Verschlusskrankheit)\nSymptomatik: Typische pAVK-Symptomatik; der Schauspieler schilderte die\nBeschwerden sehr überzeugend.\nUntersuchungsbefunde:\n Beidseitige Unterschenkelödeme\n Narbe am rechten Knie (Z. n. Operation)\n Keine weiteren auffälligen Befunde\nKörperliche Untersuchung: Der Prüfer wollte nur eine orientierende Untersuchung mit\nden Hauptbefunden an Lunge, Herz und Abdomen sehen.\nHinweis: Die Ratschow-Lagerungsprobe wurde vergessen – dies wurde von\nden Prüfern nicht kommentiert.", "clinical_case": "**Hauptsymptom:** Plötzlich auftretender retrosternaler Brustschmerz mit Ausstrahlung\n\n**Anamnese:** Ein 67-jähriger Mann mit bekannter Hypertonie, Diabetes mellitus Typ 2 und aktuellem Rauchen (20 py) stellt sich mit akutem retrosternalem Brustschmerz vor. Der Schmerz begann plötzlich vor 2 Stunden während der Arbeit, ist dumpf-drängend und strahlt in den linken Arm aus. Der Patient ist schwitzend und ängstlich. Seine Frau hat ihn sofort in die Notaufnahme gebracht.\n\n**Klinische Befunde:** Allgemeinzustand: akut erkrankt, ängstlich, diaphoretisch. RR 165/98, HR 102/min, Atemfrequenz 20/min. Auskultation: unauffällige Herzgeräusche, Lungen belüftet. Körperliche Untersuchung zeigt keine Ödeme. Patient blass und schweißnass.\n\n**Diagnostische Kriterien:**\n• 12-Kanal-EKG sofort (ST-Elevationen oder T-Wellen-Inversionen)\n• Troponin T/I (hochsensitiv, mehrfach)\n• Blutbild, Nierenfunktion, Elektrolyte\n• Thorax-Röntgen zum Ausschluss anderer Pathologie\n\n**Therapie:**\n• Notfall-Reperfusionstherapie: perkutane Koronarintervention (PCI) oder Thrombolyse\n• Duale Thrombozytenaggregation (Aspirin + P2Y12-Inhibitor)\n• Antikoagulation mit Heparin\n• ß-Blocker, ACE-Hemmer, Statine, Rehabilitation\n"}, "Fall_35": {"case_info": "Fall 35\nPrüfungsprotokoll\n\n\n\n\nPrüfungsdatum: 29.04.2026\nNachricht vom: 01.05.2026\nStation: 3 von 3\n\nFall 1 – Pyelonephritis\nPatientenvorstellung\nEine Patientin stellte sich wegen seit zwei Tagen bestehenden Schüttelfrost und\nFlankenschmerzen, die in den Unterbauch ausstrahlen, vor. Bei der körperlichen\nUntersuchung zeigte sich ein klopfschmerzhaftes Nierenlager.\n\nFragen und Antworten\nWie nimmt man Blutkulturen ab? Blutkulturen werden unter sterilen Bedingungen\nabgenommen. Die Haut wird sorgfältig desinfiziert. In der Regel werden zwei Pärchen\n(jeweils eine aerobe und eine anaerobe Flasche) entnommen. Laut aktueller\nEmpfehlung (RKI, KRINKO) erfolgt die Entnahme aus einer Vene in einem Zug (d. h.\naus einer einzigen Punktionsstelle), jedoch werden dabei beide Flaschen gefüllt.\nWarum hat man früher Blutkulturen von verschiedenen Stellen abgenommen?\nFrüher entnahm man Blutkulturen von zwei oder mehr verschiedenen Punktionsstellen,\num zwischen echter Bakteriämie und Kontamination unterscheiden zu können: War nur\neine Kultur positiv, galt dies als wahrscheinliche Kontamination; waren beide positiv,\nsprach dies für eine echte Bakteriämie.\nWarum nimmt man heute Blutkulturen nur von einer Stelle ab? Die aktuelle\nEmpfehlung basiert auf der Erkenntnis, dass der diagnostische Mehrwert mehrerer\nEntnahmestellen gering ist, während das Kontaminationsrisiko pro zusätzlicher Punktion\nsteigt. Wenn die erste Flasche kontaminiert ist, sind es in der Regel auch die weiteren\naus derselben Entnahme – die Stichprobenmenge (Blutvolumen) ist entscheidender als\ndie Anzahl der Punktionsstellen. Zwei Flaschen (aerob + anaerob) aus einem\nVenenzugang mit ausreichendem Volumen (je 8–10 ml) sind daher Standard.\nAb wann spricht man von Fieber? Ab einer Körperkerntemperatur von ≥ 38,0 °C\n(rektal gemessen). Subfebril: 37,5–37,9 °C.\nWelche Entzündungsparameter gibt es?\n\n\n\nCRP (C-reaktives Protein)\nLeukozyten (Leukozytose)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nPCT (Procalcitonin) – besonders bei bakterieller Sepsis erhöht\nBSG (Blutsenkungsgeschwindigkeit) – langsamer, weniger spezifisch\nIL-6 (Interleukin-6)\nFibrinogen\n\nWelcher Entzündungsparameter steigt zuerst an? Das CRP steigt als erstes an –\nbereits 6–12 Stunden nach Beginn der Entzündung, mit einem Maximum nach ca. 48\nStunden. Das Procalcitonin (PCT) steigt bei bakteriellen Infektionen noch früher (ca. 3–6\nStunden), ist jedoch spezifischer für Sepsis. In der Praxis wird CRP am häufigsten\nbestimmt.\nWas sind typische Befunde in der Sonographie bei Pyelonephritis?\n\n\n\n\n\n\nVergrößerte, ödematöse Niere\nEchogenitätsveränderungen des Nierenparenchyms (echoarm oder inhomogen)\nAufgehobene kortikomedulläre Differenzierung\nGgf. perirenales Ödem\nBei komplizierter Pyelonephritis: Abszessformationen, Harnstau (Hydronephrose)\n\nWelche normalen Blutdruckwerte gibt es beim Menschen? Normal: systolisch < 120\nmmHg und diastolisch < 80 mmHg. Hochnormal: 130–139 / 85–89 mmHg.\nWie werden die Hypertonie-Grade eingeteilt? (ESC/ESH 2023)\nGrad\nGrad 1 (mild)\nGrad 2 (moderat)\nGrad 3 (schwer)\nIsoliert systolisch\n\nSystolisch (mmHg)\n140–159\n160–179\n≥ 180\n≥ 140\n\nDiastolisch (mmHg)\n90–99\n100–109\n≥ 110\n< 90\n\nWelche Antihypertensiva kennen Sie?\n\n\n\n\n\n\n\n\nACE-Hemmer (z. B. Ramipril, Enalapril)\nAT1-Rezeptorblocker / Sartane (z. B. Losartan, Valsartan)\nKalziumkanalblocker (CCB) (z. B. Amlodipin, Nifedipin)\nBetablocker (z. B. Metoprolol, Bisoprolol)\nDiuretika (z. B. HCT, Chlortalidon, Torasemid)\nAlphablocker (z. B. Doxazosin)\nZentrale Antihypertensiva (z. B. Moxonidin)\n\nWas sind Nebenwirkungen von Kalziumkanalblockern (CCB)?\n\n\n\n\n\nUnterschenkelödeme (periphere Vasodilatation → kapilläre Filtration ↑) –\nhäufigste NW\nFlush (Hautrötung, Wärmegefühl)\nReflextachykardie (besonders Dihydropyridine wie Nifedipin)\nKopfschmerzen\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nObstipation (besonders Verapamil)\nGingivahyperplasie (selten)\n\nWas sind Nebenwirkungen von Betablockern, insbesondere bei einem jungen\nsportlichen Patienten? Bei einem Sportler ist die wichtigste Nebenwirkung, dass die\nHerzfrequenz unter Belastung nicht ausreichend ansteigt (chronotrope Inkompetenz)\n→ verminderte Leistungsfähigkeit und körperliche Belastbarkeit. Weitere NW: Müdigkeit,\nKältegefühl der Extremitäten, Bronchospasmus (bei nicht-selektiven Betablockern, z. B.\nbei Asthma), erektile Dysfunktion, Maskierung einer Hypoglykämie bei Diabetikern.\n\nErläuterung und wichtige Hinweise\nPyelonephritis ist eine bakterielle Infektion des Nierenparenchyms und des\nNierenbeckens, häufig durch aszendierende Erreger (meist E. coli). Sie gehört\nzu den häufigen Ursachen einer Urosepsis.\nDiagnostik: Urinstatus (Leukozyturie, Nitrit, Hämaturie), Urinsediment,\nUrinkultur (vor Antibiotikagabe!), Blutbild, Entzündungsparameter (CRP, PCT),\nBlutkultur bei Fieber/Sepsisverdacht, Sonographie der Nieren und Harnwege.\nTherapie: Hydratation, Antipyretika, empirische Antibiotikatherapie (z. B.\nCeftriaxon i.v. bei stationärer Aufnahme, oral Ciprofloxacin oder\nTrimethoprim/Sulfamethoxazol je nach Resistenzlage).\nMerke: Der Blutdruck sollte frühzeitig in der körperlichen Untersuchung\ngemessen werden und nicht am Ende vergessen werden – er gehört zu den\nVitalparametern!\n\nFall 2 – ERCP, Choledocholithiasis und Strahlenschutz\nFragen und Antworten\nWas sehen Sie auf dem Bild (ERCP)? Was ist eine ERCP? Die ERCP\n(Endoskopisch Retrograde Cholangiopankreatikographie) ist ein endoskopisches\nVerfahren, bei dem ein Duodenoskop bis zur Papilla Vateri vorgeschoben wird. Über\neinen Katheter wird Kontrastmittel in die Gallenwege und den Pankreasgang injiziert,\nsodass diese röntgenologisch dargestellt werden können. Sie ist sowohl diagnostisch\nals auch therapeutisch einsetzbar (z. B. Steinextraktion, Sphinkterotomie, Stenteinlage).\nWarum ist eine ERCP gemacht worden und warum reicht normaler Ultraschall\nnicht aus? Auf dem Bild zeigen sich zwei Steine im Ductus choledochus\n(Choledocholithiasis) mit erweiterten Gallenwegen. Der normale Ultraschall kann\nGallensteine in der Gallenblase gut darstellen, ist aber für Steine im distalen\nCholedochus häufig insuffizient (Überlagerung durch Darmgas, schlechte Schallbarkeit).\nDie ERCP ermöglicht neben der Diagnose auch die direkte Therapie (Steinextraktion\nmittels Dormiakörbchen nach Sphinkterotomie).\nWas zeigt das CT-Abdomen? Multiple Zysten in der Leber → Differenzialdiagnosen:\neinfache Leberzysten (häufigste Ursache, benigne), polyzystische Lebererkrankung,\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nEchinokokkuszysten (Vorsicht: serologische Abklärung!), biliäre Hamartome (VonMeyenburg-Komplexe).\nWelche Maßeinheit wird zur Messung von Strahlung verwendet?\n\n\n\n\nGray (Gy): absorbierte Strahlendosis (Energieübertragung pro Masse: J/kg)\nSievert (Sv): effektive Dosis (biologische Wirkung; berücksichtigt Strahlungsart\nund Gewebeempfindlichkeit)\nBecquerel (Bq): Aktivität einer radioaktiven Quelle (Zerfälle pro Sekunde)\n\nIn der klinischen Praxis ist die Einheit Millisievert (mSv) gebräuchlich.\nWas sind die Regeln des Strahlenschutzes (die 5 As)?\n1. Abstand – Vergrößerung des Abstands zur Strahlungsquelle (Intensität nimmt\nmit dem Quadrat des Abstands ab)\n2. Abschirmung – Nutzung von Bleiabschirmungen, Schutzkleidung (Bleischürze,\nSchilddrüsenschutz)\n3. Aufenthaltsdauer – Minimierung der Expositionszeit\n4. Angemessenheit – Jede Strahlenexposition muss medizinisch gerechtfertigt sein\n(Indikationsstellung)\n5. Alternative – Prüfen, ob strahlenfreie Alternativen (Sonographie, MRT)\neingesetzt werden können\nWelche anderen Quellen ionisierender Strahlung gibt es außerhalb der Medizin?\n\n\n\nNatürliche Quellen: kosmische Strahlung, terrestrische Strahlung (Radon aus\ndem Boden), natürliche Radionuklide im Körper (z. B. Kalium-40)\nZivilisatorische Quellen (außerhalb Medizin): Kernkraftwerke, nuklearer\nFallout, Flugreisen (erhöhte kosmische Strahlung), bestimmte Baumaterialien (z.\nB. Granit)\n\nWelche Strahlenquellen gibt es in der Medizin?\n\n\n\n\n\n\nKonventionelles Röntgen (Thorax, Skelett)\nCT (höchste Einzeldosis in der Diagnostik)\nDurchleuchtung / Fluoroskopie (z. B. bei ERCP, Angiographie)\nNuklearmedizin (Szintigraphie, PET, Radiojodtherapie)\nStrahlentherapie (Radioonkologie)\n\nWas ist ein Dosimeter? Was wird damit gemessen? Ein Dosimeter ist ein Gerät zur\nMessung der persönlichen Strahlenexposition. Es wird von strahlenexponiertem\nPersonal (Ärzte, MTRA, Pflegepersonal in Interventionsräumen) am Körper getragen\n(meist am Rumpf oder Handgelenk). Es misst die akkumulierte Strahlendosis über einen\nbestimmten Zeitraum und dient der Überwachung der gesetzlichen Grenzwerte (in\nDeutschland: 20 mSv/Jahr effektive Dosis für beruflich Strahlenexponierte gemäß\nStrlSchV).\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nWarum gibt es im Krankenhaus Bereiche mit unterschiedlicher Strahlenbelastung\n(z. B. mittelstarke vs. hohe)? Die Einteilung in Strahlenschutzzonen\n(Überwachungsbereich, Kontrollbereich) dient dem Schutz des Personals. Bereiche mit\nhöherer Strahlenbelastung (z. B. Interventionsradiologie, Nuklearmedizin,\nStrahlentherapie) erfordern besondere Schutzmaßnahmen, regelmäßige Dosimetrie und\nZugangskontrollen. Durch die Zonierung wird sichergestellt, dass nur eingewiesenes\nund ausgerüstetes Personal diese Bereiche betritt und die Strahlenexposition für alle\nMitarbeiter so gering wie möglich gehalten wird (ALARA-Prinzip: As Low As Reasonably\nAchievable).\n\nErläuterung und wichtige Hinweise\nCholedocholithiasis: Steine im Ductus choledochus können eine obstruktive\nCholestase, Cholangitis (Charcot-Trias: Fieber, Ikterus, rechtsseitiger\nOberbauchschmerz) oder eine biliäre Pankreatitis verursachen. Die ERCP ist\nMethode der Wahl zur Diagnose und Therapie.\nStrahlenschutz ist Pflichtbestandteil der ärztlichen Ausbildung. In Deutschland\nregelt die Strahlenschutzverordnung (StrlSchV) die Grenzwerte und\nPflichten. Das ALARA-Prinzip ist die grundlegende ethische Leitlinie.\n\nFall 3 – Pneumothorax, Thoraxdrainage, Schädel-Hirn-Trauma\nFragen und Antworten\nWas sehen Sie auf dem Röntgenbild? Es zeigt sich ein Pneumothorax mit fehlender\nGefäßzeichnung im betroffenen Bereich und einer kollabierten Lunge (partiell, vor allem\nim Oberlappen). Das Mediastinum ist nicht verlagert → kein Spannungspneumothorax.\nWelche Arten von Pneumothorax gibt es?\n1. Spontanpneumothorax\no Primär spontan: ohne vorbestehende Lungenerkrankung (meist junger,\nschlanker, großwüchsiger Mann durch Ruptur von\nEmphysemblasen/Bullae)\no Sekundär spontan: auf dem Boden einer vorbestehenden\nLungenerkrankung (z. B. COPD, Mukoviszidose, Marfan-Syndrom)\n2. Traumatischer Pneumothorax: durch direkte Thoraxverletzung\n(Rippenfrakturen, penetrierendes Trauma)\n3. Iatrogener Pneumothorax: durch medizinische Eingriffe\n4. Spannungspneumothorax (Tension Pneumothorax): Ventilmechanismus →\nLuft strömt ein, aber nicht aus → lebensbedrohliche Mediastinalverlagerung\nWelche typische Klinik hat der primäre Spontanpneumothorax?\n\n\n\nPlötzlich einsetzender, atemabhängiger, ipsilateraler Thoraxschmerz\nDyspnoe (Ausmaß abhängig von der Größe)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nTrockener Reizhusten\nAbgeschwächtes Atemgeräusch auf der betroffenen Seite\nHypersonorer Klopfschall auf der betroffenen Seite\nHäufig bei jungen, schlanken, hochgewachsenen Männern (Raucher!)\n\nWie wird ein Pneumothorax behandelt?\n\n\n\n\nKleiner asymptomatischer Pneumothorax: konservativ, O₂ -Gabe,\nBeobachtung, Kontroll-Röntgen\nSymptomatischer / größerer Pneumothorax: Entlastung durch\nNadeldekompression (Notfall) oder Thoraxdrainage\nRezidivprophylaxe: Pleurodese (chemisch oder chirurgisch), videoassistierte\nThorakoskopie (VATS) mit Bullaresektion\n\nAn welcher Stelle legt man eine Thoraxdrainage an?\n\n\n\n\nKlassische Stelle: 4.–5. ICR (Interkostalraum), vordere bis mittlere Axillarlinie\n(sog. „Sicherheitsdreieck“ = Triangle of Safety)\nGrenzen des Sicherheitsdreiecks: Lateralrand des M. pectoralis major (ventral),\nVorderrand des M. latissimus dorsi (dorsal), Horizontale durch die Mamille\n(kaudal)\nAlternativ (früher, heute seltener): 2. ICR, Medioklavikularlinie (Monaldi-Position)\n– bei anterior-apikaem Pneumothorax\n\nWarum legt man die Drainage am Oberrand der Rippe an? Die Interkostalgefäße\nund -nerven (A./V./N. intercostalis) verlaufen am Unterrand der Rippe. Um eine\nVerletzung dieser Strukturen mit nachfolgender Blutung (Hämatothorax) und starken\nSchmerzen zu vermeiden, wird die Drainage stets knapp über dem Oberrand der\ndarunterliegenden Rippe eingeführt.\nWie lange bleibt die Thoraxdrainage liegen?\n\n\n\n\nSolange Luft/Sekret über das Drainagesystem abgeleitet wird\n(Sprudeln/Förderung)\nEntfernung in der Regel nach 24–48 Stunden ohne Förderung, nach Kontrolle\ndes Röntgenthorax und Sicherstellung der vollständigen Lungenentfaltung\nBei anhaltender Leckage ggf. länger, ggf. operative Intervention\n\nWas sind iatrogene Ursachen eines Pneumothorax?\n\n\n\n\n\n\n\n\nZentralvenöser Katheter (ZVK) – Anlage über V. subclavia oder V. jugularis\nPleurapunktion (Thorakozentese)\nLungenbiopsie (CT-gesteuert oder transbronchial)\nMechanische Beatmung (Barotrauma → Baro-/Volutrauma)\nAkupunktur (selten)\nPeridural-/Plexusanästhesie\nReanimation mit aggressiver Beatmung\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nWas kann man präklinisch bei einem Spannungspneumothorax tun? NotfallNadeldekompression (Nadel-Entlastungspunktion):\n\n\n\n\n\nSofortige Entlastung durch Einstechen einer großlumigen Venenverweilkanüle\n(14–16 G) im 2. ICR, Medioklavikularlinie (alternativ: 4./5. ICR, vordere\nAxillarlinie)\nZiel: Aufhebung des Überdrucks im Pleuraspalt\nAnschließend (in der Klinik): Anlage einer definitiven Thoraxdrainage\nKlinik des Spannungspneumothorax: Dyspnoe, Hypotonie, Tachykardie, gestaute\nHalsvenen, abgeschwächte Atemgeräusche, Zyanose, Trachealdeviation zur\nGegenseite (Spätsymptom) → lebensbedrohlich!\n\nPatient gestürzt auf den Kopf – wie beurteilt man den GCS (Glasgow Coma Scale)?\nKategorie\nAugen öffnen\n\nReaktion\nSpontan\nAuf Ansprechen\nAuf Schmerzreiz\nKeine Reaktion\nVerbale Antwort\nOrientiert\nVerwirrt\nEinzelne Wörter\nUnverständliche Laute\nKeine Reaktion\nMotorische Reaktion Befolgt Aufforderungen\nGezielte Abwehr auf Schmerz\nUngezielte Abwehr auf Schmerz\nBeugesynergismen\nStrecksynergismen\nKeine Reaktion\n\nPunkte\n4\n3\n2\n1\n5\n4\n3\n2\n1\n6\n5\n4\n3\n2\n1\n\nMaximaler Score: 15 (vollorientiert), Minimaler Score: 3 (tiefes Koma).\nWie wird das Schädel-Hirn-Trauma (SHT) anhand des GCS eingeteilt?\nSchweregrad\nLeichtes SHT (LSHT)\nMittelschweres SHT\nSchweres SHT\n\nGCS\n13–15\n9–12\n3–8\n\nMerke: GCS ≤ 8 → Intubationsindikation (kein ausreichender Schutzreflex der\nAtemwege)\nWas ist der Unterschied zwischen Epidural-, Subdural- und\nSubarachnoidalblutung?\n\n\fNeue Fälle finden Sie auf dem Kanal:\nEpiduralblutung\nMerkmal\n(EDH)\nLokalisation Zwischen Schädel\nund Dura mater\nUrsache\n\nCT-Bild\n\nMeist Trauma\n(Schläfenbeinfraktur)\n→ A. meningea\nmedia\nBikonvexe\n(linsenförmige),\nhyperdens\n\nKlinik\n\nFreies Intervall, dann\nrasche\nVerschlechterung\n\nTherapie\n\nNeurochirurgische\nNotfall-OP\n\nhttps://t.me/KP_Niedersachsen_Gekocht\nSubduralblutung\n(SDH)\nZwischen Dura\nmater und\nArachnoidea\nTrauma (akut)\noder chronisch\n(ältere Patienten,\nAntikoagulanzien)\nSichelförmig,\nhyperdens (akut) /\nhypodens\n(chronisch)\nVariabel;\nlangsame\nProgredienz\nmöglich\nAbhängig von\nAusdehnung: OP\noder konservativ\n\nSubarachnoidalblutung\n(SAB)\nZwischen Arachnoidea und\nPia mater\n(Subarachnoidalraum)\nSpontan: Aneurysmaruptur;\ntraumatisch\n\nHyperdense Füllung der\nbasalen Zisternen / Sulci\n\n„Vernichtungskopfschmerz“,\nMeningismus\n\nAneurysma-Coiling oder Clipping; Nimodipin\n\nErläuterung und wichtige Hinweise\nPneumothorax-Merksatz: „Beim Anlegen der Drainage immer am Oberrand\nder unteren Rippe des gewählten ICR – niemals am Unterrand, wegen der\nneurovaskulären Strukturen!“\nSpannungspneumothorax ist ein lebensbedrohlicher Notfall und wird klinisch\ndiagnostiziert – nicht warten auf Bildgebung, sofort entlasten!\nGCS ist ein universelles, schnell durchführbares Instrument zur\nBewusstseinsbeurteilung. Beim intubierten Patienten kann der verbale Score\nnicht erhoben werden → Dokumentation als „1T“ (tubuiert).\nArachnoidalblutung im Originaltext bezieht sich auf die\nSubarachnoidalblutung (SAB) – die häufigste Ursache ist das rupturierte\nAneurysma (Cave: Vernichtungskopfschmerz als Leitsymptom).\nViel Erfolg allen Prüflingen! Viele Fragen wiederholen sich – die Protokolle sind eine\nwertvolle Ressource. Ihr schafft es!\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 35\n\n**Status:** Keine Fragen verfügbar."}, "Fall_36": {"case_info": "Fall 36\nPrüfungsprotokoll – Ärztliche Prüfung\nPrüfungsdatum: 28.04.2026, 09:00 Uhr Datum der Nachricht: 01.05.2026\n\nAllgemeine Informationen\n\n\n\n\n\n\nErgebnis: Bestanden\nEigener Fall: pAVK (periphere arterielle Verschlusskrankheit)\nWeitere Fälle der Kollegen: Cholezystitis, Divertikulitis\nLernmaterial: Herold Innere Medizin 2025, Checkliste Innere Medizin 2025,\nProtokolle der letzten 6 Monate (444 Protokolle)\nLernstrategie: Schwerpunkt auf Pathophysiologie und klinischem Verständnis;\nkeine Simulationen", "runde_1": [{"q": "Frage 1: Was tun?", "a": "Sofortige klinische und radiologische Diagnostik (Röntgen Becken/Hüfte, ggf. CT). Chirurgische Versorgung der Schenkelhalsfraktur ist dringlich (innerhalb 24–48 h anzustreben, um Komplikationen wie Hüftkopfnekrose und Bettlägerigkeit zu vermeiden). Parallel muss das Blutungsrisiko vs. Thromboembolierisiko abgewogen werden. Interdisziplinäre Entscheidung (Orthopädie/Unfallchirurgie, Innere Medizin/Hämatologie, ggf. Anästhesie)."}, {"q": "Frage 2: Operation verschieben?", "a": "In der Regel nein – eine Schenkelhalsfraktur gilt als dringliche OPIndikation. Eine Verzögerung erhöht das Risiko für Hüftkopfnekrose, tiefe Beinvenenthrombose, Pneumonie und Dekubitus. Die Antikoagulation muss perioperativ pausiert werden. Bei akuter lebensbedrohlicher Blutung kann Andexanet alfa (Ondexxya®) als Antidot für Apixaban eingesetzt werden. Die Antikoagulationstherapie der Lungenembolie muss postoperativ so bald wie möglich (meist nach 24–48 h, abhängig vom Blutungsrisiko) wieder aufgenommen werden."}, {"q": "Frage 3: Wie lange wirkt Apixaban (Eliquis®) im Körper?", "a": "Apixaban hat eine Halbwertszeit von ca. 8–15 Stunden. Bei normaler Nierenfunktion ist die gerinnungshemmende Wirkung nach ca. 24 Stunden (etwa 2 Halbwertszeiten) ausreichend reduziert. Bei eingeschränkter Nierenfunktion verlängert sich die Wirkdauer. Da Apixaban kein routinemäßig messbares Gerinnungsparameter hat (Anti-Xa-Aktivität kann bestimmt werden), empfiehlt sich bei dringlicher OP nach ≥ 24 h Pause und normaler Nierenfunktion die OP. Bei nicht dringlicher OP: 48 h Pause. Als Bridging mit NMH ist nicht erforderlich bei Apixaban."}], "runde_2": [{"q": "Mögliche Ursachen der Hypothyreose?", "a": "Richtige Antwort: Strahlentherapie im Halsbereich als häufigste Ursache nach Larynxkarzinom-Behandlung. Ionisierende Strahlung schädigt das Schilddrüsengewebe direkt → Hypothyreose (kann Monate bis Jahre nach Bestrahlung auftreten). Weitere Ursachen: Autoimmunthyreoiditis (Hashimoto), Medikamente (z. B. Amiodaron, Lithium, Checkpoint-Inhibitoren bei Immuntherapie), Jodmangel (selten in Deutschland). Weitere Fragen und Antworten: Pathophysiologie der Hashimoto-Thyreoiditis: Antwort: Chronisch-lymphozytäre Autoimmunthyreoiditis. Autoreaktive TLymphozyten infiltrieren die Schilddrüse und triggern eine Immunreaktion. Autoantikörper gegen Thyreoidperoxidase (TPO-AK, positiv in > 90 %) und Thyreoglobulin (Tg-AK) führen zur progressiven Destruktion des Schilddrüsenparenchyms → Fibrosierung → Hypothyreose. Initial kann durch Zelllyse eine transiente Hyperthyreose (Hashitoxikose) auftreten. Assoziation mit anderen Autoimmunerkrankungen (z. B. Typ-1-Diabetes, Morbus Addison, Vitiligo). Wichtige Schilddrüsenwerte: Antwort:      "}, {"q": "Wann Bluttransfusion?", "a": "  "}, {"q": "Zeugen Jehovas)?", "a": "Antwort (bestätigt und ergänzt): Bei entscheidungsfähigem, volljährigem Patienten: 1. Aufklärung über alle Risiken, einschließlich des Todes, bei weiterem Blutverlust ohne Transfusion. 2. Respektierung des Patientenwillens (Selbstbestimmungsrecht, Art. 2 GG). 3. Schriftliche Dokumentation der Aufklärung und der Ablehnung (vom Patienten unterzeichnen lassen). 4. Prüfung von Alternativen: Eigenblutspende, Zellseparation (Cell Saver), Erythropoetin, Eisensubstitution, Hämodilution, Minimierung von Blutverlusten. 5. Bei vorhandener Patientenverfügung ist diese bindend – auch im Notfall. 6. Bei nicht entscheidungsfähigem Patienten (Bewusstlosigkeit): Bluttransfusion ist rechtlich und ethisch in der Regel erlaubt, wenn keine eindeutige Patientenverfügung vorliegt (Güterabwägung: Leben vs. mutmaßlicher Wille). 7. Bei Minderjährigen: Elternentscheidung vs. Kindeswohl → ggf. Familiengericht einschalten."}, {"q": "Mögliche Ursachen der Hypothyreose? Richtige Antwort: Strahlentherapie im Halsbereich als häufigste Ursache nach Larynxkarzinom-Behandlung. Ionisierende Strahlung schädigt das Schilddrüsengewebe direkt → Hypothyreose (kann Monate bis Jahre nach Bestrahlung auftreten). Weitere Ursachen: Autoimmunthyreoiditis (Hashimoto), Medikamente (z. B. Amiodaron, Lithium, Checkpoint-Inhibitoren bei Immuntherapie), Jodmangel (selten in Deutschland). Weitere Fragen und Antworten: Pathophysiologie der Hashimoto-Thyreoiditis:", "a": "Chronisch-lymphozytäre Autoimmunthyreoiditis. Autoreaktive TLymphozyten infiltrieren die Schilddrüse und triggern eine Immunreaktion. Autoantikörper gegen Thyreoidperoxidase (TPO-AK, positiv in > 90 %) und Thyreoglobulin (Tg-AK) führen zur progressiven Destruktion des Schilddrüsenparenchyms → Fibrosierung → Hypothyreose. Initial kann durch Zelllyse eine transiente Hyperthyreose (Hashitoxikose) auftreten. Assoziation mit anderen Autoimmunerkrankungen (z. B. Typ-1-Diabetes, Morbus Addison, Vitiligo). Wichtige Schilddrüsenwerte: Antwort:      "}], "runde_3": [{"q": "Wann Einkammer-Schrittmacher (VVI)?", "a": "Indiziert bei:    "}], "clinical_case": "**Hauptsymptom:** Akute Dyspnoe mit Thoraxschmerz und Tachykardie\n\n**Anamnese:** Eine 55-jährige Frau mit Adipositas (BMI 32) und Immobilität (lange Autofahrt vor 2 Tagen) präsentiert sich mit plötzlicher Dyspnoe. Sie berichtet von rechtsseitigem Thoraxschmerz, der sich bei tiefem Atmen verschlimmert. Die Patientin ist ängstlich, gibt an, gehustet zu haben, und bemerkte keine Hämoptoe. Sie nimmt orale Kontrazeptiva.\n\n**Klinische Befunde:** Allgemeinzustand: ängstlich, tachypneisch. RR 28/min, HR 118/min, Blutdruck 135/82, Temperatur 37,2°C. SpO2 90% an Raumluft. Lungenauskultat: vermindertes Atemgeräusch basal rechts, kein Stridor. Keine Beinödeme bilaterally.\n\n**Diagnostische Kriterien:**\n• D-Dimer (sensitiv, aber nicht spezifisch)\n• CT-Pulmonalisangiographie (CTPA) als Goldstandard\n• EKG: Sinustachykardie, ggf. S1-Q3-T3-Muster\n• Arterielle Blutgasanalyse: Hypoxämie und Hyperkapnie\n\n**Therapie:**\n• Antikoagulation (Heparin bolus + kontinuierliche Infusion oder LMWH)\n• Sauerstofftherapie zur SpO2 >90%\n• Hämodynamisch instabile Patienten: Thrombolyse oder mechanische Intervention\n• Langzeitantikoagulation (Warfarin oder DOAC) für 3 Monate\n"}, "Fall_37": {"case_info": "Fall 37\nKenntnisprüfung – Protokoll\nDatum der Nachricht: 02.05.2026 Prüfungsdatum: 27.04.2026, 12:30 Uhr Ergebnis:\nBestanden ✅\nZusammensetzung der Kommission:\n\n\n\n\nNeurologe\nInternist (Prüfungsleiter und Hauptprüfer)\nViszeralchirurg\nDie Prüfung besteht aus drei Runden. Läuft eine Runde nicht optimal, besteht\ndie Möglichkeit, sich in den folgenden Runden zu verbessern. Ruhig bleiben ist\nentscheidend.\n\nLernquellen: „444“, Prüfungsprotokolle (orange-blaues Heft), AMBOSS (Hauptthemen).\nLernzeitraum: Intensives Lernen ca. 3 Wochen vor der Prüfung; 2 Wochen davor\nUrlaub. Aktuelle Stelle: Viszeralchirurgie, ca. 9 Monate Berufserfahrung.", "runde_1": [{"q": "Was ist Herzinsuffizienz?", "a": "Herzinsuffizienz ist die Unfähigkeit des Herzens, ausreichend Blut zur Deckung des peripheren Sauerstoffbedarfs zu pumpen – oder dies nur unter erhöhtem Füllungsdruck zu gewährleisten."}, {"q": "Herzinsuffizienz?", "a": "Ab einer LVEF < 50 % spricht man von einer eingeschränkten Herzinsuffizienz (HFrEF). Einteilung nach ESC-Leitlinien: | Typ | LVEF | Bezeichnung | |—–|——|———––| | HFrEF | < 40 % | Heart Failure with reduced EF | | HFmrEF | 40–49 % | Heart Failure with mildly reduced EF | | HFpEF | ≥ 50 % | Heart Failure with preserved EF | Korrekte Antwort des Kandidaten: < 50 % – bezieht sich auf das Spektrum ab HFmrEF abwärts."}, {"q": "Konsequenzen haben diese?", "a": "Aortenstenose:     "}], "runde_2": [{"q": "Was ist eine Subarachnoidalblutung?", "a": "Blutung in den Subarachnoidalraum (zwischen Arachnoidea und Pia mater). In ca. 85 % der Fälle durch Ruptur eines intrakraniellen (sakkulären) Aneurysmas."}], "runde_3": [{"q": "Was ist ein Gallenstein-Ileus?", "a": "Mechanischer Dünndarmileus durch Obturation des Darmlumens durch einen großen Gallenstein (> 2,5 cm), der über eine cholezystoenterale Fistel (meist Cholezystoduodenale Fistel) in den Darm eingetreten ist. Häufigste Lokalisationen (von häufig zu selten): 1. Terminales Ileum (engste Stelle) → ca. 60 % 2. Jejunum 3. Duodenum (Bouveret-Syndrom: Magenausgang) 4. Kolon Diagnostik  CT-Abdomen (Goldstandard): Darstellung der Rigler-Trias  Abdomenleer-Röntgen: Pneumobilie + Ileus-Zeichen (Spiegel, Haustrenverlust)  Sonographie: eingeschränkt (Darmgasüberlagerung) Therapie des Gallenstein-Ileus Notfallindikation – operative Therapie: 1. Laparotomie / Laparoskopie 2. Enterotomie an der proximalen Seite des Steins und manuelle Extraktion (Milking) → Steinentfernung 3. Darmresektion nur bei Ischämie oder Nekrose"}], "title": "Fall 37", "header": "Fall 37\nKenntnisprüfung – Protokoll\nDatum der Nachricht: 02.05.2026 Prüfungsdatum: 27.04.2026, 12:30 Uhr Ergebnis:\nBestanden ✅\nZusammensetzung der Kommission:\n Neurologe\n Internist (Prüfungsleiter und Hauptprüfer)\n Viszeralchirurg\nDie Prüfung besteht aus drei Runden. Läuft eine Runde nicht optimal, besteht\ndie Möglichkeit, sich in den folgenden Runden zu verbessern. Ruhig bleiben ist\nentscheidend.\nLernquellen: „444“, Prüfungsprotokolle (orange-blaues Heft), AMBOSS (Hauptthemen).\nLernzeitraum: Intensives Lernen ca. 3 Wochen vor der Prüfung; 2 Wochen davor\nUrlaub. Aktuelle Stelle: Viszeralchirurgie, ca. 9 Monate Berufserfahrung.", "clinical_case": "**Hauptsymptom:** Fall 37\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 37. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Bildgebende Verfahren (Ultraschall, CT oder Röntgen)\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_38": {"case_info": "Fall 38\nKenntnisprüfung – Erfahrungsbericht\nPrüfungsdatum: Mittwoch, 22.04.2026 Datum der Nachricht: 03.05.2026 Ergebnis:\nBestanden (1/3 – erster Versuch) Zugewiesene Fälle: Divertikulitis (Hauptfall), Diabetes\nmellitus (DM), Unfallchirurgie (UV)\nKommission:\n\n\n\n\nUnfallchirurg\nInternistin (Palliativmedizin)\nInternist (Leitender der Notaufnahme)\n\nFall 1 – Divertikulitis (Hauptfall)\nAnamnese\nPatient: Herr Olaf Tacking, 72 Jahre\nAktuelle Beschwerden: Linksseitige Unterbauchschmerzen seit mehreren Tagen.\nInitial sistierten die Schmerzen beim Stuhlgang, seit 2 Tagen jedoch persistierend.\nBegleitend: Fieber 38,2 °C, Übelkeit, Inappetenz. Letzter Stuhlgang gestern.\nVerneinte Symptome: Meläna, Hämatochezie, Durchfall, Erbrechen,\nMiktionsbeschwerden, Leistenschwellung, Gewichtsverlust.\nVorerkrankungen: Obstipation, arterielle Hypertonie (aHT)\nMedikation: Ramipril, Laxans bei Bedarf\nOperationen: Leistenherniorrhaphie beidseits, Appendektomie, Cholezystektomie\nVorsorge: Koloskopie vor 8 Jahren – unauffällig\nAllergien: Keine bekannt\nImpfstatus: Vollständig\nReiseanamnese: Keine Auslandsreise\nSozialanamnese: Verheiratet, ein gesunder Sohn, Rentner (zuvor Büroarbeit in einer\nLogistikfirma)\n\nKörperliche Untersuchung\n\n\nVollständige körperliche Untersuchung\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nLeistenhernie-Untersuchung: Patient wird im Stehen aufgefordert zu husten;\nBeobachtung und Palpation auf Vorwölbung in der Leiste\n\nArzt-Patienten-Gespräch\nPatient: „Muss ich hier bleiben?“ Arzt: „Derzeit kann ich dazu noch keine genaue\nAussage treffen. Nach weiterer Diagnostik (Sonographie, Blutuntersuchung) können wir\ndarüber sprechen.“\n(Kurze Aufklärung über den Unterschied zwischen Divertikulose und Divertikulitis wurde\ngeführt.)", "runde_1": [{"q": "Was ist eine Divertikulose?", "a": "Ausstülpungen der Darmwand (Schleimhaut und Submukosa durch Lücken in der Muskularis), meist als Pseudodivertikel. Häufig im Colon sigmoideum."}, {"q": "Wo befinden sich Kolondivertikel am häufigsten?", "a": "Im Colon sigmoideum (ca. 90 % der Fälle in westlichen Ländern)."}, {"q": "Zeichen einer Perforation bei der körperlichen Untersuchung?", "a": "Ausgeprägte Abwehrspannung (brettharter Bauch), Loslassschmerz (BlumbergZeichen), diffuser Peritonismus, Schocksymptome."}, {"q": "Sonographische Befunde bei Divertikulitis?", "a": "   "}, {"q": "Sonographie bei freier Perforation?", "a": "Freie Flüssigkeit im Abdomen (echofreie Zonen in abhängigen Positionen: DouglasRaum, Morrison-Pouch), ggf. freie Luft (Reverberationsartefakte)."}, {"q": "Therapie bei freier Perforation?", "a": "Notfalloperation: 1. Hartmann-Operation (Standardverfahren bei Peritonitis/instabilem Patient): o Resektion des betroffenen Sigmasegments o Anlage eines endständigen Kolostomas (Hartmann-Stoma) o Blindverschluss des Rektumstumpfes o Ggf. spätere Rückverlagerung (Hartmann-Rückverlagerung) 2. Primäre Anastomose (mit oder ohne protektives Stoma): nur bei stabilen Patienten, erfahrenem Team, guten Bedingungen (geringe Kontamination). Warum keine primäre Anastomose bei Peritonitis? Erhöhtes Risiko einer Anastomoseninsuffizienz durch: Entzündung, Ischämie, fäkale Kontamination, schlechter Allgemeinzustand → Hartmann-OP sicherer."}, {"q": "Weber-Klassifikation?", "a": "⚠️ Hinweis: Die „Weber-Klassifikation“ ist im Kontext der Divertikulitis nicht eine etablierte Standardklassifikation. Möglicherweise wurde im Prüfungsgespräch die Hansen/Stock-Klassifikation oder CDD-Klassifikation gemeint, oder es handelt sich um eine lokal verwendete Einteilung. Die CDD-Klassifikation (s. o.) ist die aktuell gebräuchliche."}], "runde_2": [{"q": "Hypertonie vor?", "a": "Nein, eine einmalige Messung reicht nicht aus. → Diagnose erfordert: LangzeitBlutdruckmessung (ABDM) oder wiederholte Messungen an verschiedenen Tagen (≥ 2 Messungen an ≥ 2 Terminen)."}, {"q": "Ausschluss einer sekundären arteriellen Hypertonie – Ursachen?", "a": "Ursache Renovaskuläre Hypertonie (Nierenarterienstenose) Primärer Hyperaldosteronismus (Conn-Syndrom) Cushing-Syndrom Phäochromozytom"}, {"q": "Hypertonie-Graduierung (ESC/ESH 2023)?", "a": "Grad Grad 1 Grad 2 Grad 3 Isoliert systolisch"}, {"q": "Vorgehen bei RR 220/100 mmHg?", "a": "1. Stationäre Aufnahme 2. i.v. Antihypertensivum: Urapidil (α₁ -Blocker + zentral serotoninerg) – langsame, kontrollierte Blutdrucksenkung"}, {"q": "Therapie der arteriellen Hypertonie?", "a": "1. Stufe: Lebensstiländerung "}, {"q": "Wann geben wir Beta-Blocker?", "a": "Nicht als Erstlinientherapie bei unkomplizierter Hypertonie, sondern bei spezifischen Indikationen:      "}, {"q": "1. Liegt eine Patientenverfügung vor?", "a": "o Nein → „Fangen Sie mit der Reanimation an, ich komme sofort.“ o Ja (mit Ablehnung reanimationspflichtiger Maßnahmen) → Reanimation nicht einleiten; Arzt kommt zur Todesfeststellung."}, {"q": "unterschreiben?", "a": "Nein. Die Leichenschau und Ausstellung des Totenscheins darf nur von einem approbierten Arzt vorgenommen werden. Als Arzt in Weiterbildung (ohne Approbation) ist dies nicht erlaubt."}, {"q": "Unterschreiben Sie den Totenschein?", "a": "Nein. Blässe und Atemstillstand sind unsichere Todeszeichen. Erst wenn sichere Todeszeichen festgestellt wurden, darf der Totenschein ausgestellt werden."}, {"q": "Patient verstarb nach Operation in Ihrem Dienst – Was tun?", "a": "Bei einem nicht-natürlichen Tod (z. B. nach Operation, unerwarteter Tod) muss die Kriminalpolizei (Kripo) informiert werden. Der Leichnam darf bis dahin nicht verändert werden."}, {"q": "verstorben. Polizei rufen?", "a": "Ja. Bei unklaren Todesumständen – auch bei älteren, pflegebedürftigen Patienten – besteht die Pflicht zur Abklärung, ob ein nicht-natürlicher Tod vorliegt. Bei Verdacht auf unzureichende Pflege (Dekubitus = mögliches Zeichen der Vernachlässigung) muss die Polizei verständigt werden."}, {"q": "Stufenschema der Schmerztherapie (WHO-Stufenschema)?", "a": "Stufe Wirkstoffgruppe I Nicht-Opioid-Analgetika"}, {"q": "Wichtige Nebenwirkung von Metamizol?", "a": "Agranulozytose (selten, aber lebensbedrohlich): Granulozytenzahl < 500/µl → Infektanfälligkeit, Sepsisgefahr. Was tun bei Langzeittherapie? Regelmäßige Blutbildkontrolle (BB-Kontrolle), insbesondere Differenzialblutbild. Bei Auftreten von Fieber, Halsschmerzen oder Infektzeichen → sofortiges Absetzen und Blutbild."}], "runde_3": [{"q": "Diagnostisches Vorgehen?", "a": "1. Echokardiographie (TTE/TEE): o Suche nach: Perikardtamponade, Aortenklappeninsuffizienz, Dissektionsmembran in der Aorta ascendens 2. Sonographie Abdomen: Freie Flüssigkeit, Aortenerweiterung abdominal 3. CT-Angiographie Thorax/Abdomen (CT-Angio): Goldstandard zur Diagnose und Klassifikation"}, {"q": "CT-Angio-Befund (Bildinterpretation)?", "a": "   "}, {"q": "Stanford-Klassifikation der Aortendissektion?", "a": "Typ Typ A Typ B"}, {"q": "Röntgen-Thorax-Befunde bei Aortendissektion?", "a": "    "}, {"q": "Welche Fachrichtung operiert die Aortendissektion Typ A?", "a": "Herzchirurgie"}, {"q": "Was tun vor der Operation?", "a": "Beta-Blocker i.v. (z. B. Esmolol, Labetalol, Metoprolol):    "}, {"q": "Supraventrikuläre Tachykardie (SVT). Was kann sein?", "a": "Differenzialdiagnosen bei SVT: 1. AVNRT – AV-Knoten-Reentry-Tachykardie (häufigste Form, ca. 60 %) 2. AVRT – AV-Reentry-Tachykardie (bei akzessorischer Leitungsbahn, z. B. WPWSyndrom)"}, {"q": "Pathophysiologie AVNRT vs. AVRT?", "a": "AVNRT Mechanismus Reentry-Kreislauf innerhalb des AV-Knotens (schneller und langsamer Pfad) EKG Schmalkomplexige Tachykardie, P-Wellen nicht sichtbar oder im QRS verborgen Vorkommen"}, {"q": "Therapie der AVNRT?", "a": "Schrittweise Vorgehensweise: 1. Vagale Manöver (First-line, nicht-pharmakologisch): o Karotismassage (Barorezeptoren im Karotissinus → reflektorische Vagusaktivierung → AV-Überleitungsverzögerung) o Valsalva-Manöver o Kaltwasserapplikation im Gesicht 2. Adenosin i.v. (wenn vagale Manöver erfolglos): o Halbwertszeit: < 10 Sekunden (ca. 5–10 s) o Kontraindikationen: Asthma bronchiale, höhergradiger AV-Block, SickSinus-Syndrom, WPW-Syndrom (mit vorbestehendem VHF → Gefahr der Kammerflimmern-Induktion), Dipyridamol-Therapie o Applikation: Schneller i.v. Bolus (periphere Vene, großes Lumen) + sofortiger 20-ml-NaCl-Flush (wegen extrem kurzer HWZ) o Nebenwirkungen: Flush, Dyspnoe, Brustenge, kurzzeitiger AV-Block, Asystolie (Sekunden), Bronchospasmen 3. Elektrische Kardioversion (bei hämodynamischer Instabilität)"}, {"q": "Was befindet sich im Karotissinus?", "a": "Barorezeptoren (Druckrezeptoren), die bei Reizung über den N. glossopharyngeus (CN IX) eine reflektorische Vagusaktivierung auslösen → Sinusknotenfrequenz ↓, AVÜberleitung ↓."}, {"q": "Patient fragt: „Kann das wieder passieren?“ – Wie verhindern?", "a": "Ja, es kann wiederkehren. Langfristige Therapie:   "}, {"q": "5 wichtige Differenzialdiagnosen bei thorakalen Schmerzen?", "a": "1. ACS – Akutes Koronarsyndrom (STEMI, NSTEMI, instabile Angina) 2. Aortendissektion 3. Lungenarterienembolie (LAE) 4. Pneumothorax (spontan oder traumatisch) 5. Ösophagusruptur (Boerhaave-Syndrom) (Weitere DD: Perikarditis, Pleuritis, Rippenfraktur, Herpes zoster)"}, {"q": "Orale Antidiabetika – Übersicht?", "a": "Klasse Biguanide"}, {"q": "Differenzialdiagnosen der Polydipsie?", "a": "Ursache Diabetes mellitus Diabetes insipidus (zentral/renal) Primäre Polydipsie (psychogen) Hyperkalzämie Hyperthyreose Niereninsuffizienz Medikamente"}, {"q": "Gruppe A – Transfundieren?", "a": "Nein. Beim Bedside-Test (ABO-Identitätstest) wird die Blutgruppe des Empfängers direkt am Patienten überprüft. Bei Diskrepanz zwischen Bedside-Test und Blutbankangabe darf NICHT transfundiert werden. Sofortige Rücksprache mit der Blutbank; neues Kreuzblut abnehmen und Verwechslung ausschließen."}, {"q": "Weichteilinfektionen mit Erregern?", "a": "Infektion Erysipel Phlegmone Furunkel /"}, {"q": "Symptome einer Lymphangitis?", "a": "   "}, {"q": "Was passiert, wenn Lymphangitis nicht behandelt wird?", "a": "Sepsis (Bakteriämie → systemische Inflammation → Multiorganversagen) Außerdem: Abszessbildung, Osteomyelitis, chronische Lymphödeme."}, {"q": "Colles-Fraktur – Bild und Fragen?", "a": "Colles-Fraktur: Distale Radiusfraktur mit dorsaler Dislokation des distalen Fragments (Gabelungsdeformität/Bajonettstellung). Mechanismus: Sturz auf die dorsal extendierte Hand (FOOSH – Fall on outstretched hand); typisch bei älteren Frauen mit Osteoporose."}, {"q": "Innervation der Hand?", "a": "Nerv N. medianus N. ulnaris"}, {"q": "Arten der Knochenheilung?", "a": "Typ Primäre Knochenheilung"}, {"q": "Kompartmentsyndrom?", "a": "Definition: Erhöhter Druck in einem muskulofaszialen Kompartiment → Durchblutungsstörung → Ischämie von Muskeln und Nerven. Ursachen: Frakturen (häufigste), Weichteilverletzungen, enge Verbände/Gipse, Reperfusion, Rhabdomyolyse. Symptome (6 P’s): 1. Pain (Schmerz – unverhältnismäßig stark, passiver Dehnungsschmerz) 2. Pressure (Druckgefühl) 3. Pallor (Blässe) 4. Pulselessness (Pulslosigkeit – spätes Zeichen!) 5. Paresthesia (Parästhesien) 6. Paralysis (Paralyse – spätes Zeichen!) Therapie:   "}, {"q": "Kompartmente des Unterschenkels?", "a": "4 Kompartmente: 1. Anterior (Tibialis anterior, Extensoren) 2. Lateral (Mm. peronei) 3. Oberflächlich posterior (Gastrocnemius, Soleus) 4. Tief posterior (Tibialis posterior, Flexoren, N. tibialis) Bei Fasziotomie: alle 4 Kompartimente eröffnen (meist über 2 Längsschnitte)."}, {"q": "Sonographie der Gallenblase – 3 Bilder: Welches zeigt einen Stein?", "a": "Sonographisches Bild eines Gallensteins:   "}, {"q": "Tachyarrhythmia absoluta bei Vorhofflimmern (VHF)?", "a": "Tachyarrhythmia absoluta bei VHF:  "}, {"q": "Maisonneuve-Fraktur (Unfallchirurgie)?", "a": "Definition: Spiralförmige Fibulafraktur im proximalen Drittel (Fibulaköpfchen/-schaft) durch indirektes Trauma mit gleichzeitiger Verletzung der distalen Sprunggelenkstabilisatoren (Innen- oder Außenbandkomplex, Membrana interossea, distale Syndesmose). Mechanismus: Außenrotationstrauma des Fußes (Eversion/Pronation). Wichtig: Proximale Fibulafraktur kann übersehen werden wenn nur auf Sprunggelenk fokussiert → immer gesamtes Fibula röntgen bei Sprunggelenksverletzung. Therapie:   "}], "title": "Fall 38", "header": "Fall 38\nKenntnisprüfung – Erfahrungsbericht\nPrüfungsdatum: Mittwoch, 22.04.2026 Datum der Nachricht: 03.05.2026 Ergebnis:\nBestanden (1/3 – erster Versuch) Zugewiesene Fälle: Divertikulitis (Hauptfall), Diabetes\nmellitus (DM), Unfallchirurgie (UV)\nKommission:\n Unfallchirurg\n Internistin (Palliativmedizin)\n Internist (Leitender der Notaufnahme)\nFall 1 – Divertikulitis (Hauptfall)\nAnamnese\nPatient: Herr Olaf Tacking, 72 Jahre\nAktuelle Beschwerden: Linksseitige Unterbauchschmerzen seit mehreren Tagen.\nInitial sistierten die Schmerzen beim Stuhlgang, seit 2 Tagen jedoch persistierend.\nBegleitend: Fieber 38,2 °C, Übelkeit, Inappetenz. Letzter Stuhlgang gestern.\nVerneinte Symptome: Meläna, Hämatochezie, Durchfall, Erbrechen,\nMiktionsbeschwerden, Leistenschwellung, Gewichtsverlust.\nVorerkrankungen: Obstipation, arterielle Hypertonie (aHT)\nMedikation: Ramipril, Laxans bei Bedarf\nOperationen: Leistenherniorrhaphie beidseits, Appendektomie, Cholezystektomie\nVorsorge: Koloskopie vor 8 Jahren – unauffällig\nAllergien: Keine bekannt\nImpfstatus: Vollständig\nReiseanamnese: Keine Auslandsreise\nSozialanamnese: Verheiratet, ein gesunder Sohn, Rentner (zuvor Büroarbeit in einer\nLogistikfirma)\nKörperliche Untersuchung\n Vollständige körperliche Untersuchung\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Leistenhernie-Untersuchung: Patient wird im Stehen aufgefordert zu husten;\nBeobachtung und Palpation auf Vorwölbung in der Leiste\nArzt-Patienten-Gespräch\nPatient: „Muss ich hier bleiben?“ Arzt: „Derzeit kann ich dazu noch keine genaue\nAussage treffen. Nach weiterer Diagnostik (Sonographie, Blutuntersuchung) können wir\ndarüber sprechen.“\n(Kurze Aufklärung über den Unterschied zwischen Divertikulose und Divertikulitis wurde\ngeführt.)", "clinical_case": "**Hauptsymptom:** Akuter Bauchschmerz im linken Unterbauch mit Übelkeit und Fieber\n\n**Anamnese:** Ein 58-jähriger männlicher Patient präsentiert sich mit plötzlich einsetzenden, starken Bauchschmerzen im linken Unterbauch, die vor 12 Stunden begannen. Der Schmerz ist konstant, wird begleitet von Übelkeit und leichtem Fieber (37,8°C). Der Patient hat in der Vergangenheit mehrere ähnliche, aber mildere Episoden gehabt. Er ist übergewichtig (BMI 28), raucht gelegentlich und hat eine unauffällige Vormedikation.\n\n**Klinische Befunde:** Allgemeinzustand: mäßig beeinträchtigt. Vitale Parameter: RR 145/88, HR 88/min, Temperatur 37,8°C. Abdominell: lokalisierter Druckschmerz und Abwehrspannung im linken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_39": {"case_info": "Fall 39\nPrüfungsprotokoll – Kenntnisprüfung\nNachrichtendatum\nPrüfungsdatum\nErgebnis\nThemenschwerpunkte\nPrüfungskommission\n\n03.05.2026\nMittwoch, 22.04.2026\n1/3 – Erster Versuch bestanden\nDivertikulitis (Hauptfall), Arterielle Hypertonie, Unfallchirurgie\nUnfallchirurg, Internistin (Palliativmedizin), Internist (Leiter der\nNotaufnahme)\n\nHauptfall: Herr Olaf Tacking, 72 Jahre\nAnamnese\nVorstellungsgrund: Linksseitige Unterbauchschmerzen seit einigen Tagen.\nSchmerzcharakter:\n\n\n\n\n\nInitial beim Stuhlgang sistierend\nSeit 2 Tagen persistierend\nBegleitet von: Fieber 38,2 °C, Übelkeit, Inappetenz\nLetzter Stuhlgang: gestern\n\nVerneinte Symptome: Meläna, Hämatochezie, Durchfall, Erbrechen, Miktionsprobleme,\nLeistenhernienschwellung, Gewichtsverlust\nVorerkrankungen: Obstipation, arterielle Hypertonie (aHT)\nDauermedikation: Ramipril, Laxans bei Bedarf\nOperationsvorgeschichte: Leistenherniorrhaphie beidseits, Appendektomie,\nCholezystektomie\nKoloskopie: Vor 8 Jahren als Vorsorgeuntersuchung – unauffällig\nAllergien: Keine bekannt\nImpfstatus: Vollständig\nReisen: Keine Auslandsreisen\nSozialanamnese: Verheiratet, ein gesunder Sohn, Rentner, zuvor Büroarbeit in einem\nLogistikunternehmen\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nKörperliche Untersuchung\nVollständige körperliche Untersuchung inklusive Leistenhernienbefund:\n\n\n\n\nPatient in aufrechter (stehender) Position\nAufgefordert zu husten\nInspektion und Palpation der Leistengegend auf Schwellung/Vorwölbung\n\nBefund: Kein Anhalt für Leistenhernie zum Untersuchungszeitpunkt.\n\nGesprächsführung\nVerdachtsdiagnose und Aufklärung: Kurzes Gespräch mit dem Patienten über\nVerdachtsdiagnose, Divertikulose und Divertikulitis.\nPatientenfrage: „Muss ich hier bleiben?“\nAntwort (korrekt): „Derzeit kann ich Ihnen noch nichts Genaues sagen. Nach weiterer\nDiagnostik (Sonographie, Blutabnahme) werde ich mit Ihnen darüber sprechen.“", "runde_1": [{"q": "F: Vorläufige Verdachtsdiagnose?", "a": "A: Akute Divertikulitis des Sigmas (linksseitige Unterbauchschmerzen, Fieber, Inappetenz, Alter, Vorgeschichte mit Obstipation)."}, {"q": "F: Was ist eine Divertikulose?", "a": "A: Divertikulose bezeichnet das Vorhandensein mehrerer Divertikel im Darm – also sackartige Ausbuchtungen der Darmwand – ohne Entzündungszeichen. Sie stellt einen häufigen Zufallsbefund dar und ist meist asymptomatisch."}, {"q": "F: Welche Arten von Divertikulose gibt es?", "a": "A: "}, {"q": "F: Wo befindet sich die Kolondivertikulose am häufigsten?", "a": "A: Am häufigsten im Sigma (Colon sigmoideum) – in westlichen Ländern in ca. 95 % der Fälle. In asiatischen Ländern überwiegt die Rechtsseitenlokalisation (Coecum, Colon ascendens)."}, {"q": "F: Klassifikation und Therapie der Divertikulitis?", "a": "A: Klassifikation nach der Klassifikation der Deutschen Gesellschaft für Gastroenterologie (CDD): Stadium Befund Typ 0 Asymptomatische Divertikulose Typ 1a Akute unkomplizierte Divertikulitis, keine Abszesse Typ 1b Typ 2a Typ 2b Typ 2c Typ 3a Typ 3b Typ 4"}, {"q": "DD Appendizitis?", "a": "A: "}, {"q": "F: Zenker-Divertikel – Wo? Echter oder Pseudodivertikel? Symptome?", "a": "A:   "}, {"q": "F: Zeichen der Perforation bei der körperlichen Untersuchung?", "a": "A:     "}, {"q": "F: Sonographische Befunde der Divertikulitis?", "a": "A:      "}, {"q": "F: Sonographie bei freier Perforation?", "a": "A: Nachweis von freier Flüssigkeit intraabdominal (bereits korrekt genannt), zusätzlich:  "}, {"q": "F: Abszess 3 cm – Therapie?", "a": "A:   "}, {"q": "primäre Anastomose?", "a": "A: "}, {"q": "Warum keine primäre Anastomose?", "a": "o Bei freier Perforation mit fäkaler Peritonitis (Hinchey III/IV) besteht ein extrem hohes Anastomoseninsuffizienzrisiko (Kontamination, Ödem, Entzündung, schlechter Allgemeinzustand) o Eine undichte Anastomose würde die Sepsis aggravieren und die Mortalität deutlich erhöhen o Die Hartmann-Operation ist das sicherere Verfahren unter Notfallbedingungen"}, {"q": "F: Weber-Klassifikation? Therapie?", "a": "A: Korrektur: Im Kontext der Divertikelkrankheit wird die Perforation nach Hinchey klassifiziert, nicht nach Weber. Die Weber-Klassifikation ist in der Traumatologie gebräuchlich (Sprunggelenkfrakturen). Hier ist die HincheyKlassifikation gemeint: HincheyStadium I II III IV"}, {"q": "F: Maisonneuve-Fraktur?", "a": "A: Die Maisonneuve-Fraktur ist eine Kombinationsverletzung des oberen Sprunggelenks (OSG):   "}], "runde_2": [{"q": "F: Eine 52-jährige Patientin, RR 165/90 mmHg – Ist das eine arterielle Hypertonie?", "a": "A: Nicht definitiv. Einzelmessungen genügen nicht zur Diagnosestellung. Die Diagnose einer arteriellen Hypertonie erfordert:   "}, {"q": "F: Ursachen der sekundären arteriellen Hypertonie?", "a": "A: (Bereits korrekt genannt – ergänzt und vervollständigt)     "}, {"q": "F: Patientin kommt am nächsten Tag mit RR 220/100 mmHg – Vorgehen?", "a": "A: 1. Stationäre Aufnahme (hypertensive Entgleisung / hypertensiver Notfall bei RR ≥ 180/120 mmHg, insbesondere wenn Organschäden zu befürchten) 2. Klinische Untersuchung: Neurologisch (Schlaganfall?), kardiopulmonal (Herzinsuffizienz, ACS?), renal 3. I.v. Antihypertensivum: z. B. Urapidil (Alpha-1-Blocker + zentraler 5-HT1AAgonist) – Mittel der Wahl bei hypertensiver Krise ohne spezifische Komorbidität; alternativ Nitroprussid-Natrium, Glyceroltrinitrat (bei kardialer Beteiligung) 4. Ziel: Langsame Blutdrucksenkung (nicht zu abrupt: Risiko von Organischämie); initial um ca. 25 % innerhalb der ersten Stunden 5. Einstellung der Dauertherapie: Orale Antihypertensiva optimieren"}, {"q": "F: Therapie der arteriellen Hypertonie?", "a": "A: 1. Lebensstiländerung (immer Basis): o Kochsalzreduktion (< 5 g/Tag) o Gewichtsreduktion (Ziel BMI 20–25) o Regelmäßige körperliche Aktivität (150 min/Woche, moderat aerob) o Nikotinverzicht o Alkoholreduktion (< 14 Einheiten/Woche beim Mann, < 8 bei der Frau) o DASH-Diät 2. Medikamentöse Therapie (ab Grad 1 mit hohem Risiko oder ab Grad 2): o Erstlinie (Zweifach-Kombination empfohlen laut ESC 2023):  ACE-Hemmer (z. B. Ramipril) oder ARB + Kalziumantagonist (z. B. Amlodipin)  Alternativ: ACE-Hemmer/ARB + Diuretikum (Thiazid/Thiazidähnliches: Hydrochlorothiazid, Indapamid)"}, {"q": "F: Sichere und unsichere Todeszeichen?", "a": "A: Unsichere Todeszeichen (können auch beim Lebenden auftreten):     "}, {"q": "Was tun Sie?", "a": "A:   "}, {"q": "Totenschein?", "a": "A: Nein. Blässe und fehlende Atmung sind unsichere Todeszeichen. Sichere Todeszeichen (Rigor mortis, Livores, Fäulnis, nicht mit dem Leben vereinbare Verletzungen) sind noch nicht eingetreten. Zunächst Reanimationsmaßnahmen einleiten, bis sichere Todeszeichen festgestellt werden oder bis ein approbierter Arzt die Feststellung des Todes übernimmt."}, {"q": "F: Ein Patient ist in Ihrem Dienst nach einer Operation verstorben – Was tun Sie?", "a": "A:     "}, {"q": "in Ihrem Dienst – Rufen Sie die Polizei an?", "a": "A: Die Prüferin erwartete „Ja“ – und das ist korrekt:   "}, {"q": "F: Standard-Schmerztherapie (WHO-Stufenschema)?", "a": "A: "}, {"q": "F: Wichtige Nebenwirkung von Metamizol?", "a": "A:  "}, {"q": "F: Was machen wir bei Langzeittherapie?", "a": "A: Regelmäßige Blutbildkontrollen (BB-Kontrolle) (bereits korrekt genannt) – auf Leukopenie/Neutropenie achten. Bei Abfall der Granulozyten → Metamizol sofort absetzen."}], "runde_3": [{"q": "F: Welche Verdachtsdiagnose?", "a": "A: Aortendissektion (bereits korrekt erkannt):   "}, {"q": "F: Vorgehen?", "a": "A: 1. Notaufnahme-Monitoring: Vitalzeichen, EKG, Pulsoxymetrie, i.v.-Zugang, Blutabnahme (BB, Gerinnung, Troponin, D-Dimere, Laktat, Kreuzprobe) 2. Echokardiographie (TTE/TEE) – (bereits korrekt genannt) 3. Abdomensonographie – (bereits korrekt genannt)"}, {"q": "F: Was suchen wir in der Echokardiographie?", "a": "A:    "}, {"q": "F: Welche Untersuchung zeigt die Dissektion sicher?", "a": "A: CT-Angiographie (CT-Angio) – Golds nd Abwehrspannung im linken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_40": {"case_info": "Fall 40\nKenntnisprüfung – Protokoll\nDatum der Nachricht: 07.05.2026 Datum der Prüfung: 06.05.2025, 12:30 Uhr\n\nAllgemeine Informationen\nDie Kenntnisprüfung wurde am 06.05.2025 um 12:30 Uhr abgelegt und bestanden (alHamdulillah).\nDie Prüfungskommission bestand aus drei Ärzten:\n\n\n\n\neinem Gastroenterologen\neinem Kardiologen\neinem Chirurgen (Vorsitzender)\n\nAlle Kommissionsmitglieder waren freundlich, geduldig und angenehm im Umgang.\n\nPrüfungsfälle\n1. Ulkuskrankheit (eigener Fall)\n2. Herzinfarkt (HI)\n3. Divertikulitis\n\nPrüfungsablauf\nErster Teil – Anamnese und körperliche Untersuchung\nDie Anamnese entsprach einer typischen Ulkus-Anamnese (epigastrische Schmerzen,\nZusammenhang mit Nahrungsaufnahme, ggf. Nüchternschmerz, Nausea, Sodbrennen).\nDie körperliche Untersuchung verlief problemlos.\n\nZweiter Teil\nDer zweite Teil war allgemein gehalten und wenig spezifisch (z. B. schriftliche Aufgaben\noder Aktendokumentation – je nach Prüfungsformat).\n\nDritter Teil – Kommissionsgespräch\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [{"q": "F: Welche Befunde sprechen für ein Ulkus?", "a": "A:    "}, {"q": "F: Wann sollte nach der Therapie eine Kontrollgastroskopie durchgeführt werden?", "a": "A:   "}, {"q": "F:
