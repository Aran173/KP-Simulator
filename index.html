<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>KP Simulator - 56 Fälle mit Klinischen Szenarien</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { border-bottom: 3px solid var(--primary); margin-bottom: 25px; padding-bottom: 15px; }
        .header h1 { font-size: 28px; color: var(--primary); margin-bottom: 5px; }
        .header p { font-size: 13px; color: var(--text-secondary); }
        
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .stats-grid {
            display: grid;
            gap: 10px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
        
        .fall-selector {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .fall-btn {
            padding: 6px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .fall-btn:hover { border-color: var(--primary); }
        .fall-btn.active { background: var(--primary); border-color: var(--primary); }
        .fall-btn.has-questions { color: var(--success); }
        
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .case-panel {
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
        }
        
        .case-title {
            font-size: 22px;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
        
        .clinical-case {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.7;
        }
        
        .clinical-case h4 {
            color: var(--primary);
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .clinical-case h4:first-child {
            margin-top: 0;
        }
        
        .clinical-case p {
            margin-bottom: 10px;
            color: var(--text-secondary);
            text-align: justify;
        }
        
        .clinical-case ul {
            margin-left: 20px;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }
        
        .clinical-case li {
            margin-bottom: 6px;
        }
        
        .runde-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
        
        .runde-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.2s;
        }
        .runde-btn:hover { border-color: var(--primary); }
        .runde-btn.active { background: var(--primary); border-color: var(--primary); }
        
        .questions-container {
            display: grid;
            gap: 12px;
        }
        
        .runde-header {
            margin-top: 0;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }
        
        .question-card {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            border-left: 3px solid var(--primary);
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .question-num { font-size: 11px; color: var(--text-secondary); background: var(--bg-card); padding: 3px 6px; border-radius: 2px; min-width: 35px; text-align: center; }
        .question-text { font-weight: 600; color: var(--text-primary); flex: 1; font-size: 14px; }
        
        .btn-toggle {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: var(--primary);
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-toggle:hover { opacity: 0.8; }
        .btn-toggle.shown { background: var(--success); }
        
        .answer-box {
            display: none;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 4px;
            padding: 12px;
            margin-top: 10px;
            border-left: 3px solid var(--success);
        }
        .answer-box.show { display: block; }
        .answer-title { font-weight: bold; color: var(--success); margin-bottom: 6px; font-size: 12px; }
        .answer-text { color: var(--text-secondary); font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
        
        .rating-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            justify-content: flex-end;
        }
        
        .btn-rate {
            padding: 4px 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 3px;
            font-size: 10px;
            transition: all 0.2s;
        }
        .btn-rate:hover { background: var(--border); }
        .btn-rate.correct { background: var(--success); color: white; border-color: var(--success); }
        .btn-rate.sufficient { background: var(--warning); color: #000; border-color: var(--warning); }
        .btn-rate.incorrect { background: var(--danger); color: white; border-color: var(--danger); }
        
        .no-data { text-align: center; color: var(--text-secondary); padding: 30px; font-size: 12px; }
        
        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
            .fall-selector { grid-template-columns: repeat(10, 1fr); max-height: 150px; }
        }
    </style>
</head>

    <script>
        const allFalls = {"Fall_1": {"case_info": "Fall 1\nKenntnisprüfung – Erfahrungsbericht\nPrüfungsdatum: 28.05.2026 Prüfungszeit: 13:15 Uhr Datum der Nachricht:\n29.05.2026 Ergebnis: Bestanden ✅\nHauptfall: Divertikulitis\nQuelle: 444 + Erfahrungen von Kandidaten + Hauptfälle von Amboss + Last-MinuteSkript von Dr. Yazdi", "runde_1": [{"q": "Welche Differenzialdiagnosen kommen bei Verdacht auf Divertikulitis in Betracht?", "a": " Appendizitis (Cave: bei linksseitiger Unterbauchsymptomatik ist Divertikulitis wahrscheinlicher, bei rechtsseitiger eher Appendizitis)  Kolonkarzinom  Reizdarmsyndrom (RDS)  Morbus Crohn / Colitis ulcerosa  Ovarialpathologien (bei Frauen): Ovarialzyste, Adnexitis, Extrauteringravidität  Harnwegsinfekt / Uretersteinkolik  Mesenteriale Ischämie"}, {"q": "Welche Laborwerte sind bei Divertikulitis wichtig?", "a": " CRP (C-reaktives Protein) – wichtigster Entzündungsmarker  Leukozyten – Hinweis auf bakterielle Infektion  Blutbild (Hb, Hkt – Ausschluss Anämie/Blutung)  Kreatinin / Harnstoff – Nierenfunktion  Urinstatus – Ausschluss Harnwegsinfektion  Lipase – Ausschluss Pankreatitis Hinweis des Prüfers: Die BSG (Blutkörperchensenkungsgeschwindigkeit) ist eher rheumatologisch relevant und bei Divertikulitis nicht zwingend erforderlich."}, {"q": "Welches ist das weitere Vorgehen bei Verdacht auf Divertikulitis?", "a": "Sonographie des Abdomens als Mittel der ersten Wahl."}, {"q": "Was sehen Sie in der Sonographie bei Divertikulitis?", "a": " Verdickte Kolonwand (> 4–5 mm)  Echogene Divertikel (ggf. mit Kotolithen)  Perikolisches Fettgewebe echoreich verändert (entzündliche Infiltration)  Ggf. perikolische Flüssigkeit oder Abszess  Compressibility des betroffenen Darmabschnitts vermindert"}, {"q": "Ist immer ein CT indiziert?", "a": "Nein. Ein CT ist nur bei Verdacht auf Komplikationen indiziert (z. B. Perforation, Abszess, Fistel, Obstruktion)."}, {"q": "Welche Komplikationen der Divertikulitis kennen Sie?", "a": " Perforation (gedeckt oder frei → Peritonitis)  Abszess (perikolisch, mesokolisch, pelvin)  Fistelbildung (z. B. kolovesikal, kolovaginal, koloenterisch)  Stenose / Ileus (durch narbige Einengung)  Divertikelblutung (meist schmerzlos, nicht entzündlich)"}, {"q": "Was haben Patienten klinisch bei Perforation?", "a": " Plötzlich einsetzender, starker Bauchschmerz  Peritonismus: Druckschmerz, Loslassschmerz, Abwehrspannung (brettharter Bauch)  Übelkeit, Erbrechen  Fieber, Schüttelfrost  Tachykardie, Hypotonie (bis hin zum Schock)  Darmgeräusche aufgehoben (paralytischer Ileus)"}, {"q": "Welche Therapie ist bei Divertikulitis indiziert?", "a": "Unkomplizierte Divertikulitis (Stadium I nach Hansen & Stock):  "}, {"q": "Welche Antibiotika (AB) werden eingesetzt? Warum Metronidazol?", "a": "Typische Kombinationstherapie:   "}, {"q": "Der Patient liegt im Schockraum. Was machen Sie?", "a": "Bei hämodynamischer Instabilität → sofortige elektrische Kardioversion (synchron) Vorgehen nach ABCDE-Schema:     "}, {"q": "Wo liegt der Infarkt?", "a": "Anteriorer (vorderer) Myokardinfarkt = Vorderwandinfarkt (STEMI anterior) "}, {"q": "Wie gehen Sie beim STEMI vor?", "a": "Sofortmaßnahmen (Zeit = Myokard!): 1. Notarzt/Intensivstation alarmieren, EKG-Monitor, venöser Zugang 2. Aspirin 300 mg p.o. + P2Y12-Inhibitor (z. B. Ticagrelor 180 mg oder Clopidogrel)"}, {"q": "Was ist der Unterschied zwischen Kardioversion und Defibrillation?", "a": "Kardioversion Defibrillation Indikation Hämodynamisch instabile Kammerflimmern (VF), Tachyarrhythmien mit vorhandenem pulslose ventrikuläre Rhythmus (VT mit Puls, Tachykardie Vorhofflimmern/-flattern) Synchronisation Synchron (Schock wird mit R-Zacke Asynchron (ohne getriggert, um Kammerflimmern zu Triggerung) vermeiden) Bewusstsein Patient ist ggf. bewusst → Sedierung Patient ist bewusstlos → erforderlich keine Sedierung notwendig Joule Niedriger beginnend (z. B. 100–200 J 200 J biphasisch biphasisch) (einheitlich)"}, {"q": "Sedierung vor Kardioversion – welche Medikamente?", "a": " Midazolam (Benzodiazepin, Anxiolyse + Sedierung)  Propofol (kurzwirksames Hypnotikum)  Etomidat (kreislaufstabil, gut geeignet bei instabilen Patienten)  Cave: Immer Atemwegsmanagement und Notfallausstattung bereithalten!"}, {"q": "Joule-Zahl bei Kardioversion / Defibrillation?", "a": " Kardioversion: Beginn mit 100–200 J (biphasisch), ggf. steigern  Defibrillation: 200 J (biphasisch, alle Schocks gleich)  Bei Kindern: 4 J/kg KG"}, {"q": "Elektrodenposition (Paddleposition)?", "a": "Anterior-lateral:  "}], "runde_2": [{"q": "Welche Typen von Tabletten gibt es?", "a": " Filmtablette (mit Filmüberzug, schluckfertig)  Manteltablette / Dragée (Zuckerschicht)  Retardtablette (verzögerte Wirkstofffreisetzung)  Brausetablette (in Wasser auflösen)  Schmelztablette / Sublingualtablette (im Mund zergehen lassen)  Lutschtablette (im Mund lutschen)  Kautablette  Magensaftresistente Tablette (mit säureresistentem Überzug)"}, {"q": "Warum verwenden wir Kapseln?", "a": " Schutz vor Geschmack und Geruch des Wirkstoffs  Schutz des Wirkstoffs vor Licht, Feuchtigkeit und Oxidation  Gezielte Wirkstofffreisetzung (z. B. magensaftresistente Kapseln)  Für Wirkstoffe, die sich schlecht zu Tabletten verpressen lassen (z. B. Öle, hygroskopische Substanzen)  Leichteres Schlucken für manche Patienten"}, {"q": "Warum verwenden wir Sirup?", "a": " Für Kinder und Patienten mit Schluckbeschwerden  Bessere Dosierbarkeit bei flüssiger Form  Schnellere Resorption als feste Formen  Maskierung des bitteren Geschmacks durch Süßungsmittel und Geschmacksstoffe  Geeignet für Wirkstoffe, die nicht fest formulierbar sind"}, {"q": "Was bedeutet Lutschtablette?", "a": "Eine Lutschtablette wird im Mund langsam aufgelöst (gelutscht, nicht geschluckt). Der Wirkstoff wird über die Mundschleimhaut (Buccalabsorption) oder lokal in der Mundhöhle/Rachen freigesetzt. Beispiel: Halstabletten mit Lokalantiseptika, LoratadinLutschtabletten."}, {"q": "Was bedeutet Retardtablette?", "a": "Eine Retardtablette (= Depot-/Slow-release-Tablette) gibt den Wirkstoff verzögert und gleichmäßig über einen längeren Zeitraum frei. Vorteile:"}, {"q": "Was bedeutet Fieber?", "a": "Fieber ist eine kontrollierte Erhöhung der Körperkerntemperatur über den Normwert (> 38,0 °C axillär, > 38,5 °C rektal) als Reaktion des Organismus auf Infektionen, Entzündungen oder andere Noxen. Mechanismus:   "}, {"q": "Was bedeutet Schüttelfrost?", "a": "Schüttelfrost bezeichnet unwillkürliche rhythmische Muskelkontraktionen (Zittern), die zur Wärmeproduktion dienen, wenn der Hypothalamus den Temperatursollwert erhöht. Er tritt typischerweise zu Beginn eines Fieberanstiegs auf."}, {"q": "die Körpertemperatur erhöht ist?", "a": "Weil der Hypothalamus den Temperatursollwert (Set-Point) heraufgesetzt hat. Die aktuelle Körpertemperatur liegt zwar objektiv erhöht, aber noch unterhalb des neuen Sollwerts. Der Körper „interpretiert“ dies als zu kalt und reagiert mit:  "}, {"q": "Was ist ein Abszess?", "a": "Ein Abszess ist eine abgekapselte Eiteransammlung in einem neu gebildeten Hohlraum im Gewebe. Er entsteht durch eine lokale bakterielle Infektion mit Gewebseinschmelzung. Klinisch: Rötung, Schwellung, Überwärmung, Druckschmerz, ggf. Fluktuation. Therapie: Inzision und Drainage (ubi pus, ibi evacua)."}, {"q": "Welche bekapselten Bakterien kennen Sie?", "a": " Streptococcus pneumoniae  Haemophilus influenzae Typ b  Neisseria meningitidis  Klebsiella pneumoniae  Pseudomonas aeruginosa  Salmonella typhi  Escherichia coli (K-Antigen)  Cryptococcus neoformans (Pilz mit Polysaccharidkapsel) Merkhilfe: „Some Killers Have Pretty Nice Structured Capsules“ (S. pneumoniae, K. pneumoniae, H. influenzae, P. aeruginosa, N. meningitidis, S. typhi, C. neoformans)"}, {"q": "Warum produzieren Bakterien eine Kapsel?", "a": " Schutz vor Phagozytose durch Makrophagen und Neutrophile (wichtigste Funktion!)  Hemmung der Komplementaktivierung  Schutz vor Austrocknung  Verbesserung der Adhärenz an Oberflächen (z. B. Biofilmbildung)  Schutz vor antimikrobiellen Substanzen"}, {"q": "Woraus besteht die Kapsel?", "a": "Die bakterielle Kapsel besteht überwiegend aus Polysacchariden (z. B. bei S. pneumoniae, N. meningitidis, H. influenzae). Ausnahme: Bacillus anthracis → Kapsel aus Poly-D-Glutaminsäure (Polypeptid)"}, {"q": "Fragte er nach Enzymen in der Kapsel?", "a": "Bakterien können Hyaluronidase und andere Enzyme sezernieren (nicht die Kapsel selbst enthält Enzyme, aber manche Erreger produzieren kapselassoziierte Virulenzfaktoren):   "}, {"q": "Welche Antibiotikagruppen kennen Sie?", "a": " Beta-Laktame: Penicilline, Cephalosporine, Carbapeneme, Monobactame  Makrolide: Azithromycin, Clarithromycin, Erythromycin  Tetracycline: Doxycyclin, Tetracyclin  Aminoglykoside: Gentamicin, Tobramycin, Amikacin  Fluorchinolone: Ciprofloxacin, Levofloxacin  Glykopeptide: Vancomycin, Teicoplanin  Sulfonamide + Trimethoprim: Cotrimoxazol  Lincosamide: Clindamycin  Nitroimidazole: Metronidazol  Oxazolidinone: Linezolid  Polymyxine: Colistin"}, {"q": "Gegen welche Erreger wirken Aminoglykoside?", "a": "Aminoglykoside wirken hauptsächlich gegen aerobe gramnegative Bakterien:     "}, {"q": "Was bedeutet Laktat?", "a": "Laktat (Milchsäure) ist das Endprodukt der anaeroben Glykolyse. Es entsteht, wenn Zellen aufgrund von Sauerstoffmangel oder erhöhtem Energiebedarf Pyruvat nicht im Citratzyklus verwerten können und stattdessen zu Laktat reduzieren. Normalwert: < 2 mmol/L im Blut"}, {"q": "Wann ist Laktat klinisch erhöht?", "a": " Typ A (Hypoxisch): Schock (septisch, kardiogen, hypovolämisch), Herzstillstand, schwere Anämie, CO-Vergiftung  Typ B (Nicht-hypoxisch): o Leberversagen (verminderte Laktatclearance) o Metformin-assoziierte Laktatazidose o Maligne Erkrankungen (Tumorlyse) o Intensives körperliches Training o Thiaminmangel Klinische Bedeutung: Laktat > 4 mmol/L → schwerer Schock, schlechte Prognose"}, {"q": "Was ist LDH?", "a": "LDH (Laktatdehydrogenase) ist ein intrazelluläres Enzym, das die reversible Umwandlung von Pyruvat zu Laktat (und umgekehrt) katalysiert. Es kommt in vielen Geweben vor und wird bei Zelluntergang freigesetzt → unspezifischer Marker für Gewebsschäden."}, {"q": "Warum ist LDH erhöht?", "a": "LDH tritt bei Zelluntergang (Zytolyse) aus zerstörten Zellen ins Blut aus. Erhöhte LDHWerte finden sich bei:     "}, {"q": "In welchen Zellen kommt LDH vor?", "a": "LDH kommt in nahezu allen Körperzellen vor, besonders in:      "}, {"q": "Was ist das Produkt von Pyruvat?", "a": "Abhängig vom Stoffwechselweg:    "}, {"q": "Welches Enzym wandelt Pyruvat in Laktat um?", "a": "Laktatdehydrogenase (LDH) Reaktion: Pyruvat + NADH + H⁺ → Laktat + NAD⁺"}, {"q": "Welches Enzym kann Laktat wieder zu Pyruvat umwandeln?", "a": "Ebenfalls LDH (die Reaktion ist reversibel): Laktat + NAD⁺ → Pyruvat + NADH + H⁺ (Dies geschieht z. B. in der Leber im Rahmen der Cori-Zyklus-Reaktion)"}, {"q": "Was bedeutet Isoenzym?", "a": "Isoenzyme (Isoformen) sind verschiedene molekulare Formen desselben Enzyms, die: "}, {"q": "Was bedeutet Haltbarkeit von Medikamenten?", "a": "Die Haltbarkeit (Verfallsdatum) gibt den Zeitraum an, bis zu dem ein Medikament unter angegebenen Lagerbedingungen seine Wirksamkeit, Reinheit und Sicherheit beibehält. Nach Ablauf kann der Wirkstoff degradiert sein, und die Wirksamkeit oder Sicherheit ist nicht mehr gewährleistet."}, {"q": "Was bedeutet Bioverfügbarkeit?", "a": "Bioverfügbarkeit (F) ist der Anteil (in %) eines Wirkstoffs, der nach Verabreichung unverändert in den systemischen Kreislauf gelangt und dort zur Verfügung steht.  "}, {"q": "Halbwertszeit?", "a": "Die Halbwertszeit (t½) ist die Zeit, in der die Konzentration eines Wirkstoffs im Plasma auf die Hälfte des Ausgangswertes abfällt.  "}, {"q": "First-Pass-Effekt?", "a": "Der First-Pass-Effekt (First-Pass-Metabolismus) bezeichnet den präsystemischen Abbau eines oral aufgenommenen Wirkstoffs in der Darmwand und der Leber, bevor er den systemischen Kreislauf erreicht. "}, {"q": "Was ist die Definition von Enzym und Hormon? Was ist der Unterschied?", "a": "Enzym:     "}], "runde_3": [{"q": "Was bedeutet Hämoptyse?", "a": "Hämoptyse = Bluthusten – Aushusten von Blut oder bluthaltigem Schleim aus den unteren Atemwegen (Bronchien, Lunge). Ursachen:     "}, {"q": "Was bedeutet Hämatemesis?", "a": "Hämatemesis = Bluterbrechen – Erbrechen von Blut oder kaffeesatzartigem Material aus dem oberen Gastrointestinaltrakt (Speiseröhre, Magen, Duodenum). Ursachen:    "}, {"q": "Was bedeutet Bronchiektasie?", "a": "Bronchiektasien sind irreversible, pathologische Erweiterungen der Bronchien und Bronchiolen durch Zerstörung der Bronchialwand. Ursachen:  "}, {"q": "Welche zentralen Nerven haben wir?", "a": "Es gibt 12 Hirnnervenpaare (Nn. craniales): Nr. I II III IV V VI VII VIII IX X XI XII"}, {"q": "Welche Erreger können das zentrale oder periphere Nervensystem beeinträchtigen?", "a": "Viren:      "}, {"q": "Wie behandelt man eine Herpesenzephalitis?", "a": "Aciclovir i.v. (10–15 mg/kg KG alle 8 Stunden für 14–21 Tage) Sofortiger Therapiebeginn bei klinischem Verdacht – nicht auf PCR-Ergebnis warten! Zusätzlich:   "}, {"q": "Diabetes mellitus Typ 2 – Welche Medikamente kennen Sie?", "a": "1. Metformin (Biguanid) – Mittel der ersten Wahl 2. GLP-1-Agonisten (z. B. Semaglutid, Liraglutid) – Gewichtsreduktion, kardioprotektiv 3. SGLT-2-Inhibitoren (z. B. Empagliflozin, Dapagliflozin) – kardio- und nephroprotektiv 4. DPP-4-Inhibitoren (Gliptine, z. B. Sitagliptin) – gewichtsneutral 5. Sulfonylharnstoffe (z. B. Glibenclamid, Glimepirid) – Hypoglykämiegefahr! 6. Insulin (basal, prandial oder Mischinsulintherapie) – bei Versagen oraler Antidiabetika"}, {"q": "Wie gehen Sie therapeutisch beim Diabetes mellitus Typ 2 vor?", "a": "Stufenschema: 1. Lebensstiländerung (Ernährung, Gewichtsreduktion, körperliche Aktivität) 2. Metformin als Monotherapie (wenn keine Kontraindikation, z. B. GFR > 30 mL/min) 3. Kombinationstherapie (Metformin + GLP-1-Agonist oder SGLT-2-Inhibitor, v. a. bei KHK, Herzinsuffizienz oder chronischer Nierenerkrankung) 4. Bei unzureichender Kontrolle: Insulin hinzufügen oder umstellen 5. Ziel-HbA1c: individuell (i.d.R. 6,5–7,5 %)"}, {"q": "Was ist wichtig im Labor bei Diabetes mellitus Typ 2?", "a": " HbA1c (Langzeitkontrolle, alle 3 Monate)  Nüchternblutzucker / postprandialer BZ  Nierenfunktion: Kreatinin, GFR (für Metformin-Dosierung!)  Urin: Albumin/Kreatinin-Ratio (Mikroalbuminurie → diabetische Nephropathie)  Blutbild (Anämie?)  Lipidstatus (LDL, HDL, Triglyzeride – kardiovaskuläres Risiko)  Leberwerte (ALT, AST)  TSH (Schilddrüsenfunktion, da Hypothyreose Glukosestoffwechsel beeinflusst)"}, {"q": "Was bedeutet Sarkoidose?", "a": "Sarkoidose ist eine systemische Granulomatose unbekannter Ätiologie, charakterisiert durch die Bildung von nicht-verkäsenden Epitheloidzellgranulomen in verschiedenen Organen."}, {"q": "Welche Ursachen gibt es?", "a": "Die genaue Ursache ist unbekannt (idiopathisch). Diskutiert werden:   "}, {"q": "Welche Klinik hat die Sarkoidose?", "a": "Lunge (häufigste Manifestation):  "}, {"q": "Welche Therapie bei Sarkoidose?", "a": " Milde/asymptomatische Form: abwartende Verlaufskontrolle (häufig Spontanremission)  Symptomatische / progrediente Form: Kortikosteroide (Prednison) als Mittel der Wahl  Therapierefraktär: Methotrexat, Azathioprin, Hydroxychloroquin  Bei Hyperkalzämie: Steroide, ausreichend Flüssigkeit"}, {"q": "Was bedeutet TNM?", "a": "TNM ist das internationale Klassifikationssystem zur Stadieneinteilung maligner Tumoren: Buchstabe Bedeutung T Tumor N"}], "title": "Divertikulitis", "header": "Fall 1\nKenntnisprüfung – Erfahrungsbericht\nPrüfungsdatum: 28.05.2026 Prüfungszeit: 13:15 Uhr Datum der Nachricht:\n29.05.2026 Ergebnis: Bestanden ✅\nHauptfall: Divertikulitis\nQuelle: 444 + Erfahrungen von Kandidaten + Hauptfälle von Amboss + Last-Minute-\nSkript von Dr. Yazdi", "clinical_case": "**Hauptsymptom:** Akuter Bauchschmerz im linken Unterbauch mit Übelkeit und Fieber\n\n**Anamnese:** Ein 58-jähriger männlicher Patient präsentiert sich mit plötzlich einsetzenden, starken Bauchschmerzen im linken Unterbauch, die vor 12 Stunden begannen. Der Schmerz ist konstant, wird begleitet von Übelkeit und leichtem Fieber (37,8°C). Der Patient hat in der Vergangenheit mehrere ähnliche, aber mildere Episoden gehabt. Er ist übergewichtig (BMI 28), raucht gelegentlich und hat eine unauffällige Vormedikation.\n\n**Klinische Befunde:** Allgemeinzustand: mäßig beeinträchtigt. Vitale Parameter: RR 145/88, HR 88/min, Temperatur 37,8°C. Abdominell: lokalisierter Druckschmerz und Abwehrspannung im linken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_2": {"case_info": "Fall 2\n# Prüfungsbericht – Kenntnisprüfung\nPrüfungsdatum: 28.05.2026, 12:30 Uhr Datum der Nachricht: 29.05.2026 Ergebnis:\nBestanden (3/3) Hauptfall: Ulcus ventriculi / Ulcus duodeni\nPrüfungskommission:\n\n\n\n\nPalliativmedizinerin\nInternist\nGefäßchirurg\nDie Kommission war sehr freundlich. Anamnese und körperliche Untersuchung\nverliefen normal; die Prüferin stellte währenddessen keine Fragen, sondern\nbeobachtete nur.", "runde_1": [{"q": "Weiteres diagnostisches Vorgehen bei Ulkusverdacht?", "a": "Ösophagogastroduodenoskopie (ÖGD) als Goldstandard – ermöglicht direkte Visualisierung, Biopsieentnahme (Histologie, Urease-Schnelltest auf H. pylori) und ggf. therapeutische Intervention. Ergänzend: Labor (BB, CRP, Gerinnung, Hb), AbdomenSonografie zum Ausschluss freier Luft/Flüssigkeit; ggf. H.-pylori-Diagnostik (Atemtest, Stuhlantigentest)."}, {"q": "Klassifikation von Ulkusblutungen?", "a": "Forrest-Klassifikation: Klasse Ia Ib IIa IIb IIc III"}, {"q": "Diagnostik beim Magenkarzinom?", "a": "    "}, {"q": "Unterschiede zwischen oberer und unterer GI-Blutung?", "a": "Leitsymptom"}, {"q": "WHO-Schmerzstufenschema?", "a": "Stufe Stufe 1 Stufe 2 Stufe 3"}, {"q": "Nebenwirkungen von Metamizol?", "a": "    "}], "runde_2": [{"q": "Weber-Klassifikation der Sprunggelenksfrakturen (Fibulafraktur)?", "a": "Typ Weber A Weber B Weber C"}, {"q": "Therapie der einzelnen Frakturtypen?", "a": "  "}, {"q": "Mögliche Komplikationen – TVT (Tiefe Venenthrombose)?", "a": "   "}, {"q": "Mögliche Komplikationen – Kompartmentsyndrom?", "a": "   "}, {"q": "Differenzialdiagnosen bei Unterbauchschmerzen rechts (junge Frau)?", "a": "  "}], "runde_3": [{"q": "Nebenwirkungen von ACE-Hemmern?", "a": "     "}, {"q": "Nebenwirkungen von Spironolacton?", "a": "  "}, {"q": "Alternative zu Spironolacton bei Herzinsuffizienz (falls NW nicht toleriert)?", "a": "Eplerenon – selektiverer Mineralokortikoidrezeptorantagonist ohne antiandrogene Wirkung → keine Gynäkomastie. Gleiche kardioprotektive Wirkung (Mortalitätssenkung nach Herzinfarkt mit eingeschränkter LV-Funktion, s. EPHESUS-Studie)."}, {"q": "Therapie der Herzinsuffizienz (HFrEF)?", "a": "Leitliniengerechte Basistherapie (4-Säulen-Therapie): 1. ACE-Hemmer/ARB (alternativ: ARNI = Sacubitril/Valsartan) 2. Betablocker (Carvedilol, Bisoprolol, Metoprolol) 3. MRA (Spironolacton oder Eplerenon) 4. SGLT2-Inhibitor (Empagliflozin, Dapagliflozin) Ergänzend: Schleifendiuretika (Furosemid) bei Stauungssymptomatik; ICD bei LVEF < 35 %; CRT bei Linksschenkelblock."}, {"q": "Eradikationstherapie bei Helicobacter pylori?", "a": "Erstlinientherapie:   "}, {"q": "Therapie des Herzinfarkts – präklinisch und im Krankenhaus?", "a": "Präklinisch (MONA-Schema):     "}, {"q": "Vorgehen bei Vorhofflimmern?", "a": "1. Hämodynamisch instabil → sofortige elektrische Kardioversion 2. Hämodynamisch stabil: o Frequenzkontrolle (Betablocker, Verapamil, Digoxin/Digitoxin) bei persistierendem VHF o Rhythmuskontrolle (elektrische oder pharmakologische Kardioversion: Flecainid, Amiodaron) bei Erstmanifestation oder symptomatischem VHF < 48 h 3. Antikoagulation: Indikation nach CHA₂ DS₂ -VASc-Score; NOAKs (Apixaban, Rivaroxaban, Edoxaban, Dabigatran) bevorzugt gegenüber Vitamin-KAntagonisten 4. Bei Kardioversion bei VHF > 48 h oder unbekannter Dauer: 3 Wochen Antikoagulation vor Kardioversion oder TEE-Ausschluss eines Vorhofthrombus"}, {"q": "EKG-Befund bei AVNRT (AV-Knoten-Reentry-Tachykardie)?", "a": "    "}, {"q": "Echo-Befund bei Takotsubo-Kardiomyopathie / Was ist Takotsubo?", "a": "    "}], "clinical_case": "**Hauptsymptom:** Fall 2\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 2. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Laborchemische Parameter und Entzündungsmarker\n• Differenzialdiagnosen basierend auf Klinik und Laborbefunden\n• EKG und kardiale Diagnostik\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_3": {"case_info": "Fall 3\nPrüfungsprotokoll – Kenntnisprüfung\nPrüfungsdatum: Mittwoch, 27.05.2026, 13:15 Uhr Nachrichtendatum: 29.05.2026\nErgebnis: 3/3 bestanden (zweiter Versuch) Prüfungsort: Hannover\nKommission:\n\n\n\n\nGastroenterologe (Vorsitzender)\nInternist\nGefäßchirurg\n\nFälle der Gruppe:\n\n\n\n\nKandidat: Diabetes mellitus\nKollege 1: KHK\nKollege 2: pAVK", "runde_1": [{"q": "Welche Differenzialdiagnosen haben Sie?", "a": "  "}], "runde_2": [{"q": "Was ist schlimmer – einfacher oder Spannungspneumothorax?", "a": "Spannungspneumothorax (Tension pneumothorax). Frage: Warum? Durch einen Ventilmechanismus gelangt bei jeder Inspiration Luft in den Pleuraspalt, kann aber nicht entweichen → zunehmende Druckerhöhung → Kompression des Mediastinums und Verlagerung zur Gegenseite → Kompression der V. cava und des Herzens → obstruktiver Schock → lebensbedrohlich. Röntgenzeichen: Mediastinalverlagerung zur Gegenseite, Zwerchfelltiefstand, Herzverschiebung."}, {"q": "Es ist ein Notfall – Sie sind allein auf der Straße. Was tun Sie?", "a": "1. Notruf (112) absetzen 2. Bei begründetem Verdacht auf Spannungspneumothorax: Sofortige Entlastungspunktion am 2. ICR in der Medioklavikularlinie (MCL) → Notfallnadel oder improvisiert (z. B. Kugelschreibermine als Kanüle)"}, {"q": "zunächst die ätiologische Abklärung (einseitig/beidseitig? Exsudat/Transsudat?", "a": "Ursache?)."}, {"q": "Welche Komplikationen gibt es?", "a": "       "}, {"q": "Welche Antikoagulanzien kennen Sie?", "a": "  "}], "runde_3": [{"q": "Welche weiteren Beschwerden könnte sie entwickeln?", "a": "   "}, {"q": "Was geben Sie beim anaphylaktischen Schock?", "a": "Sofortmaßnahmen: 1. Adrenalin (Epinephrin) 0,5 mg i. m. in den Oberschenkel (M. vastus lateralis) – Mittel der Wahl 2. Auslöser eliminieren (Allergenexposition stoppen) 3. Großlumigen i. v. Zugang legen, Volumen (kristalloide Infusion) 4. Antihistaminikum (z. B. Dimetinden) i. v."}], "clinical_case": ken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_6": {"case_info": "Fall 6\nKenntnisprüfung – Fallbericht\nDatum der Prüfung: 21.05.2026, 14:00 Uhr Datum der Nachricht: 23.05.2026\n\nErgebnis\nBestanden. Alhamdulillah (‫)هلل الحمد‬.\n\nFalldiagnose\nPyelonephritis (Nierenbeckenentzündung)\n\nAnamnese\nPatientin: 72-jährige Frau\nHauptbeschwerden:\n\n\n\n\n\nFlankenschmerzen seit drei Tagen, beidseitig, aber deutlich linksbetont\nPollakisurie (häufiges Wasserlassen in kleinen Mengen)\nFieber und Schüttelfrost\nBrennendes Gefühl beim Wasserlassen (Dysurie)\n\nWeitere erfragte Symptome:\n\n\n\n\n\nÜbelkeit und Erbrechen\nGewichtsab- oder -zunahme\nBeschwerden beim Stuhlgang\nSystematische Befragung von kranial nach kaudal: Fieber, Schüttelfrost,\nSchwitzen, Appetit → Oberes Abdomen (z. B. Sodbrennen) → Unteres Abdomen\n(Wasserlassen, Stuhlgang)\n\nVorerkrankungen:\n\n\n\n\nHyperthyreose\nHypercholesterinämie\nArthrose (am Daumensattelgelenk, d. h. am Karpometakarpalgelenk I)\nPrüferfrage: Die Patientin zeigte ihr Handgelenk und sagte, die Beschwerden\nseien beidseitig. Die Prüferin präzisierte später, dass die Arthrose am ersten\nGelenk des Daumens lokalisiert sei. Frage der Prüferin: Wie heißt dieses\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nGelenk? Antwort: Daumensattelgelenk (Articulatio carpometacarpalis pollicis /\nKarpometakarpalgelenk I)\nVoroperationen:\n\n\n\n\nAppendektomie\nTonsillektomie\nKatarakt-Operation mit Linsenimplantation (von der Patientin als „Grauer\nStar“ bezeichnet)\n\nMedikamente:\n\n\n\n\n\nAtorvastatin – einmal täglich abends (bei Hypercholesterinämie)\nL-Thyroxin 75 µg – morgens nüchtern (bei Hypothyreose nach Behandlung der\nHyperthyreose)\nIbuprofen – bei Bedarf wegen Gelenkschmerzen (Arthrose)\nAugentropfen zur Befeuchtung – nach Katarakt-Operation\n\nKörperliche Untersuchung\nUntersuchte Systeme:\n\n\n\n\n\n\n\n\nHerz\nLunge\nAbdomen\nNierenlager (Klopfschmerz)\nHirnnerven\nReflexe\nGefäßstatus (Pulse)\nPrüferfrage beim Tasten der Pulse: Wie heißt diese Arterie? Gemeint waren:\n\n\n\n\nA. tibialis posterior\nA. dorsalis pedis\n\nZeitmanagement: Die Prüferin stellte zu Beginn einen Wecker auf 25 Minuten, um am\nEnde ca. 5 Minuten Reserve zu haben. Anamnese und körperliche Untersuchung\nwurden in ca. 25 Minuten abgeschlossen.\n\nDifferentialdiagnosen\nBesprochene Differentialdiagnosen bei Flankenschmerzen:\n\n\n\nPyelonephritis (Hauptverdachtsdiagnose)\nUrolithiasis (Nieren-/Harnleiterstein)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nBandscheibenvorfall (lumbaler Bereich) → daher Untersuchung der Wirbelsäule /\nWirbelkörper wichtig\nHinweis der Prüferin: Bei Flankenschmerzen muss auch an einen\nBandscheibenvorfall gedacht werden; die Wirbelsäule sollte entsprechend\nuntersucht werden.\n\nDokumentation\nFür die Dokumentation standen 30 Minuten zur Verfügung. Die verbleibende Zeit wurde\ngenutzt, um Differentialdiagnosen, Medikamente und therapeutische Maßnahmen\ngedanklich zu wiederholen.\n\nDiagnostisches Vorgehen\nFrage der Prüferin: Welche diagnostischen Maßnahmen sind sinnvoll?\nAntwort:\n\n\n\n\n\n\nSonographie der Nieren und ableitenden Harnwege\nUrinstatus (Urinstreifentest)\nUrinkultur (mit Antibiogramm)\nBlutbild (BB, CRP, Kreatinin, Elektrolyte)\nBlutkulturen\nAnmerkung der Prüferin: Blutkulturen seien hier besonders wichtig. Eigene\nAnmerkung: Laut Leitlinien (AWMF) sind Blutkulturen vor allem bei der\nkomplizierten Pyelonephritis oder bei Sepsisverdacht empfohlen. Bei der\nunkomplizierten Pyelonephritis sind sie nicht routinemäßig indiziert. Um keine\nDiskussion zu provozieren, wurde der Empfehlung der Prüferin zugestimmt.\n\nTherapie\nVorschlag: Ciprofloxacin\nPrüferfrage: Zu welcher Antibiotikagruppe gehört Ciprofloxacin? Antwort:\nFluorchinolone (Gyrasehemmer)\nPrüferin: „Ich empfehle Ciprofloxacin nicht. Wissen Sie, warum?“ Antwort:\nWegen Nebenwirkungen.\nPrüferfrage: Welche Nebenwirkungen? Antwort (Auswahl):\n\n\n\n\n\n\nAchillessehnenriss (Tendinitis / Sehnenruptur) – besonders relevant in der\nRheumatologie\nQT-Verlängerung (kardiales Risiko)\nPhototoxizität\nZentralnervöse Störungen (Schlaflosigkeit, Schwindel, Krampfanfälle)\nHepatotoxizität\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nDysglykämie (Blutzuckerschwankungen)\nPrüferfrage (als Rheumatologin): Welche Nebenwirkung interessiert mich\nbesonders? Antwort: Der Achillessehnenriss (Fluorchinolon-assoziierte\nTendinopathie / Sehnenruptur)\nPrüferfrage: Welche Alternative gibt es? Falscher Vorschlag: Cephalosporin\nder 2. Generation Korrekte Antwort (von der Prüferin erwartet):\nAmoxicillin/Clavulansäure (Amoxiclav) – Mittel der ersten Wahl bei\nunkomplizierter Pyelonephritis (wenn keine Resistenz vorliegt und lokale\nResistenzlage berücksichtigt wird)\nAnmerkung: Laut aktuellen AWMF-Leitlinien (S3-Leitlinie Harnwegsinfektionen)\nsind bei der unkomplizierten Pyelonephritis Fluorchinolone zwar wirksam,\nwerden aber wegen zunehmender Resistenzentwicklung und Nebenwirkungen\nzurückhaltender eingesetzt. Bevorzugte Alternativen sind Cephalosporine der 3.\nGeneration (z. B. Cefpodoxim) oder Amoxicillin/Clavulansäure – je nach lokaler\nResistenzlage. Cotrimoxazol ist ebenfalls möglich, aber nur bei bekannter\nEmpfindlichkeit.\n\nLeitlinien\nPrüferfrage: Wo findet man Therapieempfehlungen? Antwort: In den\nLeitlinien (z. B. AWMF-Leitlinien).\nPrüferfrage: Was sind Leitlinien? Antwort: Leitlinien sind systematisch\nentwickelte, evidenzbasierte Empfehlungen, die medizinisches Fachpersonal\nbei Diagnose und Therapie unterstützen sollen. Sie sind keine bindenden\nVorschriften, sondern Orientierungshilfen.\nPrüferfrage: Muss man sich immer an Leitlinien halten? Antwort: Nein, nicht\nzwingend.\nPrüferfrage: Was gilt, wenn man von den Leitlinien abweicht? Antwort: Die\nAbweichung muss medizinisch begründet und sorgfältig dokumentiert werden.\nDer individuelle Patientenfall (Komorbiditäten, Allergien, Resistenzlage,\nPatientenwille) kann eine begründete Abweichung rechtfertigen.\n\nErklärung und wichtige Hinweise\nZur Diagnose: Pyelonephritis\nDie Pyelonephritis ist eine bakterielle Entzündung des Nierenparenchyms und des\nNierenbeckens, meist aufsteigend aus der Harnblase (aszendierende Infektion).\nHäufigster Erreger ist Escherichia coli.\nTypische Symptome (wie im Fall):\n\n\n\nFlankenschmerz (oft einseitig, hier linksbetont)\nFieber > 38 °C, Schüttelfrost\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nDysurie, Pollakisurie\nKlopfschmerz im Nierenlager\n\nKomplikation: Urosepsis → deshalb ggf. Blutkulturen\n\nZum Daumensattelgelenk\nDas Daumensattelgelenk (Articulatio carpometacarpalis pollicis) ist die häufigste\nLokalisation der Rhizarthrose (Arthrose des Daumens). Es verbindet das Os trapezium\nmit dem Os metacarpale I.\n\nZur Medikation – wichtige Hinweise\n\n\n\n\n\nIbuprofen bei Pyelonephritis: Bei Nierenentzündung sollten NSAR (wie\nIbuprofen) möglichst vermieden werden, da sie die Nierenperfusion reduzieren\nund eine bestehende Nierenschädigung verschlechtern können. Dies hätte in der\nPrüfung angesprochen werden können.\nL-Thyroxin: Korrekte Einnahme morgens nüchtern, mindestens 30 Minuten vor\ndem Frühstück – wurde korrekt dokumentiert.\nAtorvastatin: Abends einzunehmen, da die Cholesterinsynthese nachts am\nhöchsten ist – ebenfalls korrekt.\n\nZu den Leitlinien\nIn Deutschland sind Leitlinien rechtlich nicht verbindlich, aber sie haben eine wichtige\nOrientierungs- und Haftungsrelevanz. Eine begründete Abweichung ist zulässig und\nmanchmal sogar notwendig (z. B. bei Allergien, Kontraindikationen oder individuellem\nPatientenwunsch), muss aber klar dokumentiert werden.\n\nZum Prüfungsablauf\n\n\n\n\n\nStrukturierte Anamnese (kranial → kaudal) ist eine bewährte Methode, um nichts\nzu vergessen.\nDie körperliche Untersuchung sollte vollständig und systematisch sein – Prüfer\nunterbrechen gelegentlich mit gezielten Fragen zu Anatomie oder Technik.\nDifferentialdiagnosen sollten breit gedacht werden – auch außerhalb des\noffensichtlichsten Fachgebiets (hier: Bandscheibenvorfall als DD für\nFlankenschmerzen).\nBei Meinungsverschiedenheiten mit der Prüferin ist sachliches Zustimmen oft\nklüger als eine Diskussion – solange die eigene Wissensbasis klar ist.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [], "runde_2": [], "runde_3": [], "title": "Pankreatitis – Ätiologie", "header": "Fall 6\nKenntnisprüfung – Fallbericht\nDatum der Prüfung: 21.05.2026, 14:00 Uhr Datum der Nachricht: 23.05.2026\nErgebnis\nBestanden. Alhamdulillah (دمحلا لله).\nFalldiagnose\nPyelonephritis (Nierenbeckenentzündung)\nAnamnese\nPatientin: 72-jährige Frau\nHauptbeschwerden:\n Flankenschmerzen seit drei Tagen, beidseitig, aber deutlich linksbetont\n Pollakisurie (häufiges Wasserlassen in kleinen Mengen)\n Fieber und Schüttelfrost\n Brennendes Gefühl beim Wasserlassen (Dysurie)\nWeitere erfragte Symptome:\n Übelkeit und Erbrechen\n Gewichtsab- oder -zunahme\n Beschwerden beim Stuhlgang\n Systematische Befragung von kranial nach kaudal: Fieber, Schüttelfrost,\nSchwitzen, Appetit → Oberes Abdomen (z. B. Sodbrennen) → Unteres Abdomen\n(Wasserlassen, Stuhlgang)\nVorerkrankun ur Verfügung. Die verbleibende Zeit wurde\ngenutzt, um Differentialdiagnosen, Medikamente und therapeutische Maßnahmen\ngedanklich zu wiederholen.\nDiagnostisches Vorgehen\nFrage der Prüferin: Welche diagnostischen Maßnahmen sind sinnvoll?\nAntwort:\n Sonographie der Nieren und ableitenden Harnwege\n Urinstatus (Urinstreifentest)\n Urinkultur (mit Antibiogramm)\n Blutbild (BB, CRP, Kreatinin, Elektrolyte)\n Blutkulturen\nAnmerkung der Prüferin: Blutkulturen seien hier besonders wichtig. Eigene\nAnmerkung: Laut Leitlinien (AWMF) sind Blutkulturen vor allem bei der\nkomplizierten Pyelonephritis oder bei Sepsisverdacht empfohlen. Bei der\nunkomplizierten Pyelonephritis sind sie nicht routinemäßig indiziert. Um keine\nDiskussion zu provozieren, wurde der Empfehlung der Prüferin zugestimmt.\nTherapie\nVorschlag: Ciprofloxacin\nPrüferfrage: Zu welcher Antibiotikagruppe gehört Ciprofloxacin? Antwort:\nFluorchinolone (Gyrasehemmer)\nPrüferin: „Ich empfehle Ciprofloxacin nicht. Wissen Sie, warum?“ Antwort:\nWegen Nebenwirkungen.\nPrüferfrage: Welche Nebenwirkungen? Antwort (Auswahl):\n Achillessehnenriss (Tendinitis / Sehnenruptur) – besonders relevant in der\nRheumatologie\n QT-Verlängerung (kardiales Risiko)\n Phototoxizität\n Zentralnervöse Störungen (Schlaflosigkeit, Schwindel, Krampfanfälle)\n Hepatotoxizität\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Dysglykämie (Blutzuckerschwankungen)\nPrüferfrage (als Rheumatologin): Welche Nebenwirkung interessiert mich\nbesonders? Antwort: Der Achillessehnenriss (Fluorchinolon-assoziierte\nTendinopathie / Sehnenruptur)\nPrüferfrage: Welche Alternative gibt es? Falscher Vorschlag: Cephalosporin\nder 2. Generation Korrekte Antwort (von der Prüferin erwartet):\nAmoxicillin/Clavulansäure (Amoxiclav) – Mittel der ersten Wahl bei\nunkomplizierter Pyelonephritis (wenn keine Resistenz vorliegt und lokale\nResistenzlage berücksichtigt wird)\nAnmerkung: Laut aktuellen AWMF-Leitlinien (S3-Leitlinie Harnwegsinfektionen)\nsind bei der unkomplizierten Pyelonephritis Fluorchinolone zwar wirksam,\nwerden aber wegen zunehmender Resistenzentwicklung und Nebenwirkungen\nzurückhaltender eingesetzt. Bevorzugte Alternativen sind Cephalosporine der 3.\nGeneration (z. B. Cefpodoxim) oder Amoxicillin/Clavulansäure – je nach lokaler\nResistenzlage. Cotrimoxazol ist ebenfalls möglich, aber nur bei bekannter\nEmpfindlichkeit.\nLeitlinien\nPrüferfrage: Wo findet man Therapieempfehlungen? Antwort: In den\nLeitlinien (z. B. AWMF-Leitlinien).\nPrüferfrage: Was sind Leitlinien? Antwort: Leitlinien sind systematisch\nentwickelte, evidenzbasierte Empfehlungen, die medizinisches Fachpersonal\nbei Diagnose und Therapie unterstützen sollen. Sie sind keine bindenden\nVorschriften, sondern Orientierungshilfen.\nPrüferfrage: Muss man sich immer an Leitlinien halten? Antwort: Nein, nicht\nzwingend.\nPrüferfrage: Was gilt, wenn man von den Leitlinien abweicht? Antwort: Die\nAbweichung muss medizinisch begründet und sorgfältig dokumentiert werden.\nDer individuelle Patientenfall (Komorbiditäten, Allergien, Resistenzlage,\nPatientenwille) kann eine begründete Abweichung rechtfertigen.\nErklärung und wichtige Hinweise\nZur Diagnose: Pyelonephritis\nDie Pyelonephritis ist eine bakterielle Entzündung des Nierenparenchyms und des\nNierenbeckens, meist aufsteigend aus der Harnblase (aszendierende Infektion).\nHäufigster Erreger ist Escherichia coli.\nTypische Symptome (wie im Fall):\n Flankenschmerz (oft einseitig, hier linksbetont)\n Fieber > 38 °C, Schüttelfrost\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Dysurie, Pollakisurie\n Klopfschmerz im Nierenlager\nKomplikation: Urosepsis → deshalb ggf. Blutkulturen\nZum Daumensattelgelenk\nDas Daumensattelgelenk (Articulatio carpometacarpalis pollicis) ist die häufigste\nLokalisation der Rhizarthrose (Arthrose des Daumens). Es verbindet das Os trapezium\nmit dem Os metacarpale I.\nZur Medikation – wichtige Hinweise\n Ibuprofen bei Pyelonephritis: Bei Nierenentzündung sollten NSAR (wie\nIbuprofen) möglichst vermieden werden, da sie die Nierenperfusion reduzieren\nund eine bestehende Nierenschädigung verschlechtern können. Dies hätte in der\nPrüfung angesprochen werden können.\n L-Thyroxin: Korrekte Einnahme morgens nüchtern, mindestens 30 Minuten vor\ndem Frühstück – wurde korrekt dokumentiert.\n Atorvastatin: Abends einzunehmen, da die Cholesterinsynthese nachts am\nhöchsten ist – ebenfalls korrekt.\nZu den Leitlinien\nIn Deutschland sind Leitlinien rechtlich nicht verbindlich, aber sie haben eine wichtige\nOrientierungs- und Haftungsrelevanz. Eine begründete Abweichung ist zulässig und\nmanchmal sogar notwendig (z. B. bei Allergien, Kontraindikationen oder individuellem\nPatientenwunsch), muss aber klar dokumentiert werden.\nZum Prüfungsablauf\n Strukturierte Anamnese (kranial → kaudal) ist eine bewährte Methode, um nichts\nzu vergessen.\n Die körperliche Untersuchung sollte vollständig und systematisch sein – Prüfer\nunterbrechen gelegentlich mit gezielten Fragen zu Anatomie oder Technik.\n Differentialdiagnosen sollten breit gedacht werden – auch außerhalb des\noffensichtlichsten Fachgebiets (hier: Bandscheibenvorfall als DD für\nFlankenschmerzen).\n Bei Meinungsverschiedenheiten mit der Prüferin ist sachliches Zustimmen oft\nklüger als eine Diskussion – solange die eigene Wissensbasis klar ist.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nFall 7\nPrüfungsbericht – Kenntnisstandprüfung / FSP\nPrüfungsdatum: Dienstag, 19.05.2026 Datum der Nachricht: 20.05.2026\nHauptthema des Falles: Diabetes mellitus Typ II\nPatientenvorstellung\nPatient: 72-jähriger Mann Vorstellungsgrund: Seit 4 Wochen bestehende\nBeschwerden\nAnamnese\nAktuelle Beschwerden:\n Asthenie und Adynamie (Schwäche, Antriebslosigkeit) – vom Patienten als\n„Müdigkeit“ beschrieben\n Polydipsie: ca. 4 Liter Flüssigkeit pro Tag\n Polyurie\nVegetative Anamnese: unauffällig\nSchmerzanamnese: keine Schmerzen\nVorerkrankungen (seit ca. 1 Monat bekannt, durch Hausärztin festgestellt):\n Arterielle Hypertonie (aHT)\n Dyslipidämie\nMedikamente: keine – Patient lehnte medikamentöse Therapie ab und setzt auf\ngesunde Ernährung und Sport\nVoroperationen:\n Appendektomie\n Cholezystektomie\n Hernioplastie beidseits\nFamilienanamnese:\n Mutter: Diabetes mellitus Typ II (vom Patienten als „alter Zucker“ bezeichnet)\n Vater: arterielle Hypertonie und Dyslipidämie\nHinweis: Die Anamnese dauerte 15–20 Minuten.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nKörperliche Untersuchung\nDurchgeführte Untersuchungen:\n Hygiene: Händedesinfektion ✓ (Handschuhe wurden nicht benutzt – für nicht-\ninvasive Untersuchungen akzeptabel, bei bestimmten Untersuchungen – z. B.\nGenitalbereich – obligat)\n Herz: Auskultation\n Lunge: Auskultation\n Abdomen: Palpation und Auskultation der Aorta abdominalis\n Gefäßstatus: Palpation aller relevanter Pulse:\no A. carotis\no A. brachialis (korrekte Schreibweise: „Brachialis“, nicht „Braquialis“)\no A. radialis\no A. femoralis\no A. poplitea\no A. dorsalis pedis\no A. tibialis posterior\n Neurologische Untersuchung (orientierend):\no Kraft\no Sensibilität\no N. facialis: Augenschluss, Zähne zeigen, Stirn runzeln (Fasern des N.\nfacialis)\no Muskeleigenreflexe\nWichtige Ergänzung: Bei Verdacht auf Diabetes mellitus sollte die körperliche\nUntersuchung systematisch und vollständig erfolgen (siehe Abschnitt „Wichtige\nAnmerkungen“).\nPrüfungsrunden", "clinical_case": "**Hauptsymptom:** Pankreatitis – Ätiologie\n\n**Status:** Keine Fragen verfügbar."}, "Fall_7": {"case_info": "Fall 7\nPrüfungsbericht – Kenntnisstandprüfung / FSP\nPrüfungsdatum: Dienstag, 19.05.2026 Datum der Nachricht: 20.05.2026\nHauptthema des Falles: Diabetes mellitus Typ II\n\nPatientenvorstellung\nPatient: 72-jähriger Mann Vorstellungsgrund: Seit 4 Wochen bestehende\nBeschwerden\n\nAnamnese\nAktuelle Beschwerden als DD?", "a": "A:  "}, {"q": "– von Kopf bis Fuß?", "a": "A: Bereich Kopf/Augen"}, {"q": "F: Welche Laborwerte sprechen für Diabetes mellitus?", "a": "A: Test Nüchternblutzucker HbA1c oraler Glukosetoleranztest (oGTT) Gelegenheitsblutzucker (mit Symptomen)"}, {"q": "F: Nierenkomplikationen bei Diabetes mellitus?", "a": "A:   "}, {"q": "F: Was machen Sie, wenn der Patient einen Blutzucker von 600 mg/dl hat?", "a": "A:  "}, {"q": "F: Was ist der Fachbegriff, wenn ein Patient ausgetrocknet ist?", "a": "A: Exsikkose (korrekte Schreibweise: Exsikkose, nicht „Eksikkose“) – Synonym: Dehydratation"}, {"q": "F: Wie beurteilt man eine Exsikkose?", "a": "A:       "}, {"q": "F: Auf welche Elektrolyte müssen Sie bei Insulintherapie achten?", "a": "A: Kalium (K⁺ )"}, {"q": "F: Was macht Insulin mit dem Kalium?", "a": "A: Insulin aktiviert die Na⁺ /K⁺ -ATPase in den Zellen → verstärkter Einstrom von Kalium in die Zelle → Hypokaliämie im Serum. Klinische Relevanz: Bei DKA/HHS besteht oft initial eine Pseudonormokaliämie oder Hyperkaliämie (durch Azidose-bedingte Verschiebung). Nach Insulingabe + Azidosekorrektur → gefährlicher Kaliumabfall → kardialer Gefahr (Herzrhythmusstörungen). Daher: Kalium immer substituieren, wenn K⁺ < 5,5 mmol/l vor Insulinbeginn."}, {"q": "F: Mit welchen Medikamenten entlassen Sie den Patienten?", "a": "A: "}], "runde_2": [{"q": "Anaphylaxie. Was machen Sie?", "a": "A: 1. KM-Gabe sofort stoppen und MRT abbrechen ✓ 2. Notruf / Team alarmieren (laut rufen, Hilfe holen) 3. Adrenalin i.m. – Mittel der Wahl ✓ o Dosis: 0,3–0,5 mg Adrenalin i.m. (Autoinjektor oder Ampulle 1:1000) in den lateralen Oberschenkel o Bei Kindern: 0,01 mg/kg KG 4. Flachlagerung mit erhöhten Beinen (Schocklagerung), außer bei Dyspnoe → halbsitzend 5. Sauerstoffgabe (hochdosiert, 10–15 l/min) 6. Volumensubstitution i.v. (NaCl 0,9 % oder Ringer-Lösung, 500–1000 ml rasch) ✓ 7. Ggf. Adrenalin wiederholen nach 5–15 min 8. Antihistaminika (H1-Blocker: z. B. Dimetinden) und Kortikosteroide (z. B. Prednisolon 250–1000 mg i.v.) – nicht als Erstmaßnahme, sondern ergänzend"}, {"q": "F: Wie viel Adrenalin? Dosis?", "a": "A: 0,3–0,5 mg i.m. (Erwachsene), Konzentration 1:1000 = 1 mg/ml → also 0,3–0,5 ml i.m. Bei schwerer Anaphylaxie mit Kreislaufstillstand: Adrenalin i.v. 1:10.000 (0,1 mg) titriert"}, {"q": "F: Wie wirkt Adrenalin?", "a": "A:  "}, {"q": "F: Was ist der Unterschied zwischen Adrenalin und Noradrenalin?", "a": "A: Eigenschaft Rezeptoren Vasokonstriktion Bronchodilatation Herzfrequenz Hauptindikation"}, {"q": "F: Nach welchen Kriterien im EKG unterscheidet man ein akutes von einem alten Infarkt?", "a": "A: Stadium Supraakut"}, {"q": "Fall: Bild mit Koronargefäßen – Wo liegt der Verschluss bei Hauptstammstenose?", "a": "A: Eine Hauptstammstenose betrifft den linken Hauptstamm (Left Main / LM), d. h. die A. coronaria sinistra vor ihrer Aufteilung in: "}], "runde_3": [{"q": "F: Was können Sie tun?", "a": "A (korrekte Notfallantwort): Im Notfall ohne Ausrüstung: Nadeldekompression mit dem nächsten verfügbaren spitzen Gegenstand (z. B. Taschenmesser, KugelschreiberHülse) im 2. ICR (Interkostalraum) medioklavikulär oder 4./5. ICR vordere Axillarlinie → Druckentlastung durch Punktion (Der Prüfer bestätigte: ein Messer wäre ein mögliches Mittel zur Druckentlastung. Kugelschreiber-Idee war kreativ, aber zu chaotisch laut Prüfer.)"}, {"q": "F: Welche Aneurysmen kennen Sie?", "a": "A:     "}, {"q": "F: Was ist ein Pseudoaneurysma?", "a": "A: Ein Pseudoaneurysma (falsches Aneurysma) ist kein echtes Aneurysma – die Gefäßwand ist nicht vollständig betroffen. Blut tritt durch eine Wandverletzung aus und wird von perivasklulärem Bindegewebe (nicht von allen Wandschichten) umgeben → pulsierende Blutansammlung. Ursachen: Katheteruntersuchung (A. femoralis), Trauma, Infektion Unterschied echtes Aneurysma: Alle 3 Wandschichten (Intima, Media, Adventitia) sind beteiligt"}, {"q": "F: Was ist ein dissezierendes Aneurysma?", "a": "A: Eine Aortendissektion (früher: dissezierendes Aneurysma) entsteht durch einen Einriss der Intima → Blut strömt in die Media und bildet ein falsches Lumen neben dem wahren Lumen. Klassifikation (Stanford):  "}, {"q": "F: Woran sterben Patienten mit Lungenarterienembolie (LAE)?", "a": "Kandidat sagte: Rechtsherzinsuffizienz (falsch laut Prüfer) Korrekte Antwort: Akutes Rechtsherzversagen** (Rechtsherzversagen / akutes Cor pulmonale) Erklärung: Bei massiver LAE → plötzliche Druckerhöhung im Pulmonalkreislauf → akute Rechtsherzbelastung → Rechtsherzversagen → Linksherzversagen (Füllungsbehinderung) → kardiogener Schock → Tod. Unterschied: „Rechtsherzinsuffizienz“ ist ein chronischer Zustand (z. B. bei COPD). Bei LAE tritt das akute Rechtsherzversagen plötzlich auf – ein anderer Begriff für einen anderen Mechanismus."}], "clinical_case": "**Hauptsymptom:** Fall 7\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 7. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Laborchemische Parameter und Entzündungsmarker\n• EKG und kardiale Diagnostik\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_8": {"case_info": "Fall 8\nKenntnisprüfung – Prüfungsprotokoll\nPrüfungsdatum: 19.05.2026 (KP 2/3) Datum der Nachricht: 27.05.2026\n\nAblauf der Prüfung\nAnamnese und körperliche Untersuchung (KU)\n\n\n\nVerlief normal und ohne Unterbrechung.\nBeim Kollegen wurden zusätzlich eine Traumauntersuchung sowie die\nUntersuchung der Kreuzbänder des Knies verlangt.", "runde_1": [{"q": "Welche Medikamente werden bei Herzinsuffizienz eingesetzt?", "a": "      "}, {"q": "Welche Typen von Kardiomyopathien gibt es und wie unterscheiden sie sich?", "a": "Typ"}, {"q": "Welche Laborparameter sind bei Alkoholkrankheit relevant?", "a": "       "}, {"q": "Welche Medikamente werden bei Herzinsuffizienz eingesetzt?", "a": "      "}, {"q": "Welche Laborparameter sind bei Alkoholkrankheit relevant?", "a": "       "}], "runde_2": [{"q": "Sie die Aufklärung?", "a": "1. Einwilligungsfähigkeit prüfen: Demenz ≠ automatisch einwilligungsunfähig. Eine klinische Beurteilung der Einwilligungsfähigkeit ist zwingend erforderlich. 2. Bei fehlender Einwilligungsfähigkeit: o Ehefrau/Ehemann: Darf nur entscheiden, wenn eine notariell beglaubigte Vorsorgevollmacht vorliegt, die medizinische Entscheidungen einschließt. o Kinder: Dürfen nur entscheiden, wenn sie vom Gericht als gesetzliche Betreuer bestellt oder durch Vollmacht bevollmächtigt sind. o Lebenspartner (unverheiratet, auch > 20 Jahre): Hat kein automatisches Entscheidungsrecht – weder rechtlich noch medizinisch, ohne Vollmacht. 3. Gesetzlicher Betreuer: Kann vom Betreuungsgericht für medizinische Entscheidungen bestellt werden, wenn keine Vollmacht vorhanden ist. → Richterliche Genehmigung bei nicht dringlichen Eingriffen erforderlich. 4. Patientenverfügung: Muss berücksichtigt werden, falls vorhanden, jedoch ist der Begriff „Patientenverfügung“ im Kontext der Aufklärung zu vermeiden – es geht um die Entscheidungsbefugnis, nicht um ein Dokument mit Behandlungswünschen. 5. Visite / Datenschutz: Über Krankheitsdetails darf während der Visite nicht vor Dritten gesprochen werden. Nicht bevollmächtigte Personen müssen das Zimmer verlassen. ⚠️ Wichtige Begriffe für die Prüfung: Vorsorgevollmacht, gesetzlicher Betreuer (Betreuungsgericht), Einwilligungsfähigkeit vs. Geschäftsfähigkeit. Kein automatisches Entscheidungsrecht durch Verwandtschaft ohne formale Vollmacht oder Betreuung."}, {"q": "Welche Typen von Antidepressiva gibt es und nennen Sie Beispiele?", "a": "Klasse SSRI (Selektive SerotoninWiederaufnahme-Inhibitoren) SNRI (SerotoninNoradrenalin-WI) TZA (Trizyklische Antidepressiva) MAO-Hemmer"}, {"q": "vor und woran denken Sie?", "a": "Anamnese (strukturiert):  Seit wann? (Dauer → wichtig für Differenzierung TIA/Amaurosis fugax vs. persistierendem Defizit)"}, {"q": " Schmerzhaft oder schmerzlos?", "a": " Kopfschmerzen? Schläfenschmerzen? Kieferschmerzen (Claudicatio"}, {"q": "masticatoria)?", "a": " Schulter-/Nacken-/Beckengürtelschmerzen? (Polymyalgia rheumatica)  Vorerkrankungen: Hypertonie, Diabetes, Vorhofflimmern, KHK, Gerinnungsstörungen"}, {"q": " Trauma?", "a": "Differenzialdiagnosen: 1. Vaskuläre Ursachen (häufigste):    "}, {"q": "Wann ist die Biopsie unter Kortison nicht mehr aussagekräftig?", "a": "Nach ca. 14 Tagen Kortisontherapie können die histologischen Veränderungen rückläufig sein. (Falsch wäre: 4 Tage) ⚠️ Wichtig: Kortison sofort starten, nicht auf Biopsieergebnis warten – das Risiko der Erblindung überwiegt. Die Biopsie kann noch bis zu 14 Tage nach Therapiebeginn aussagekräftig sein."}, {"q": "Der Patient ist dement und soll eine Cholezystektomie erhalten. Wie gestalten Sie die Aufklärung?", "a": "1. Einwilligungsfähigkeit prüfen: Demenz ≠ automatisch einwilligungsunfähig. Eine klinische Beurteilung der Einwilligungsfähigkeit ist zwingend erforderlich. 2. Bei fehlender Einwilligungsfähigkeit: o Ehefrau/Ehemann: Darf nur entscheiden, wenn eine notariell beglaubigte Vorsorgevollmacht vorliegt, die medizinische Entscheidungen einschließt. o Kinder: Dürfen nur entscheiden, wenn sie vom Gericht als gesetzliche Betreuer bestellt oder durch Vollmacht bevollmächtigt sind. o Lebenspartner (unverheiratet, auch > 20 Jahre): Hat kein automatisches Entscheidungsrecht – weder rechtlich noch medizinisch, ohne Vollmacht. 3. Gesetzlicher Betreuer: Kann vom Betreuungsgericht für medizinische Entscheidungen bes
