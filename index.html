<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Simulator - Prüfungskommission</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            border-bottom: 3px solid var(--primary);
            margin-bottom: 25px;
            padding-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .header-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 6px;
            text-align: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            display: block;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .progress-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--border);
            border-color: var(--primary);
        }

        .btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
        }

        .btn-warning {
            background: var(--warning);
            border-color: var(--warning);
            color: #000;
        }

        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
        }

        .case-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .case-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .case-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            border-left: 3px solid var(--primary);
        }

        .section-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .section-content {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .question-block {
            margin-bottom: 20px;
        }

        .question-text {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .rating-section {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .rating-section.show {
            display: block;
        }

        .rating-title {
            font-weight: bold;
            color: var(--success);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .rating-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .rating-buttons .btn {
            flex: 1;
            min-width: 120px;
        }

        #feedback {
            display: none;
            margin-top: 20px;
        }

        #feedback.show {
            display: block;
        }

        .feedback-header {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .feedback-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feedback-q-text {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .feedback-answer {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .completion-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .completion-score {
            font-size: 80px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .export-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-section h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
            }

            .case-container {
                padding: 15px;
            }

            .completion-score {
                font-size: 60px;
            }

            textarea {
                min-height: 80px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🏥 KP Simulator</h1>
                <p>Prüfungskommission - Medical Exam Practice</p>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <span class="stat-value" id="completedCount">0</span>
                    <span class="stat-label">Erledigt</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="totalCount">49</span>
                    <span class="stat-label">Gesamt</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="progressPct">0%</span>
                    <span class="stat-label">Fortschritt</span>
                </div>
            </div>
        </div>

        <div class="progress-container">
            <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Gesamtfortschritt</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="export-section">
            <h3>📊 Fortschritt verwalten</h3>
            <div class="export-buttons">
                <button class="btn btn-primary" onclick="exportProgress()">📥 Fortschritt exportieren</button>
                <button class="btn btn-primary" onclick="importProgress()">📤 Fortschritt importieren</button>
                <button class="btn btn-warning" onclick="resetProgress()">🔄 Alles zurücksetzen</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <h3 style="color: var(--primary); margin-bottom: 15px;">Modus wählen:</h3>
            <div class="mode-selector">
                <button class="btn btn-primary active" onclick="switchMode('single')">Einzelfall</button>
                <button class="btn" onclick="switchMode('practice')">Trainingssession</button>
                <button class="btn" onclick="switchMode('failed')">Nur Fehlgeschlagen</button>
                <button class="btn" onclick="switchMode('all')">Alle durchgehen</button>
            </div>
        </div>

        <div id="caseContainer"></div>
        <div id="feedback"></div>
    </div>

    <script>
        // All 49 cases with answers (Musterlösungen)
        const allCases = [
            // KARDIOLOGIE - Herzinsuffizienz (16 Hauptthema)
            {id: 1, fach: "Kardiologie", diagnose: "Herzinsuffizienz", anamnese: "68J männlich, bekannt: Hypertonie, Diabetes. Seit 1 Woche progressive Dyspnoe, nächtliche Atemnot, beidseitige Knöchelödeme, Gewichtszunahme 3kg/Woche.", koerperlich: "Rasselgeräusche basal beidseits, prominente Halsvenenstaung, Hepatomegalie tastbar, periphere Ödeme", vitale: "RR 170/95, HF 112/min, AF 24/min, SpO2 88%, T 36,8°C", labor: "BNP 850 pg/mL (↑↑), Troponin I 0,08 ng/mL, Kreatinin 1,5 mg/dL (↑), Harnstoff 62 mg/dL, K+ 4,8, Hb 11,2 g/dL", bildgebung: "EKG: Neues VHF mit schneller Kammerfrequenz, ST-Senkung V2-V4. Röntgen Thorax: Kardiomegalie, bilateral Kerley-B-Linien und Infiltrate", q: ["Diagnostiziere das vorliegende Krankheitsbild und stelle eine klinisch begründete Differenzialdiagnose auf.", "Bewerte den Einfluss des neuen Vorhofflimmerns auf die Klinik und Therapie.", "Beschreibe dein sofortiges therapeutisches Vorgehen in den ersten 2 Stunden.", "Diskutiere die Rolle der erhöhten Troponin und erläutere die möglich dahintersteckende Pathologia."], answers: ["Primärdiagnose: Akute dekompensierte Herzinsuffizienz (HFrEF) mit neuem Vorhofflimmern. DD: AKS (NSTEMI), Myokarditis, Lungenembolie.", "Das neue VHF reduziert Cardiac Output durch Tachykardie und Verlust atrioventrikulärer Synchronie. Erforderlich: Frequenzkontrolle (Beta-Blocker/Diltiazem) + Antikoagulation nach CHA2DS2-VASc", "1. O2/CPAP wenn SpO2<90% 2. IV-Diuretika (Furosemid 40-80mg) 3. IV-Nitroglyzerin wenn RR toleriert 4. Kontinuierliches Monitoring 5. Erwägen Angiografie (ST-Senkung) 6. Rate Control VHF", "Troponin-Elevation könnte NSTEMI anzeigen ODER Type 2 MI (Demand Ischemia bei HI). DD: Myokarditis. Notwendig: serielle Troponin-Messungen + EKG Verlauf + Koronarangiografie"] },
            {id: 2, fach: "Kardiologie", diagnose: "STEMI inferior", anamnese: "55J männlich, Raucher. Plötzlicher oppressiver Brustschmerz vor 40 Minuten, Diaphorese, Übelkeit, Angst. Keine typische Voranamnese für KHK.", koerperlich: "Wirkt ängstlich und in Distress. Herzaktion regelmäßig, Lunge clear, keine peripheren Ödeme.", vitale: "RR 128/78, HF 98/min, AF 18/min, SpO2 97%, T 37,1°C", labor: "Troponin I 0,02 ng/mL (↑↑ Grenzwert), CK-MB 8,5 ng/mL (↑), Myoglobin 120 μg/L (↑↑), D-Dimer 0,4 μg/mL (normal)", bildgebung: "EKG: ST-Hebung in II, III, aVF; ST-Senkung in I, aVL; Q-Zacken in III", q: ["Identifiziere den Infarkttyp, die Lokalisation und die wahrscheinlich verschlossene Koronararterie mit Begründung.", "Erkläre die spezifischen Komplikationen eines inferioren STEMI und warntechnische Parameter dafür.", "Strukturiere dein Reperfusionsmanagement: Welche Optionen hast du und was ist die erste Wahl?", "Diskutiere die Kontraindikationen und Vorsichtsmaßnahmen bei der medikamentösen Therapie, speziell Nitrate."], answers: ["Inferiorer STEMI (ST-Hebung II,III,aVF). Wahrscheinliche Arterie: RCA (90%, da auch Inferior-Wand). Q-Zacken deuten auf Transmural-Infarkt. DD: zirkumflex (selten).", "AV-Block/Bradykardie (RCA versorgt AV-Knoten), kardiogener Schock, Kammerflimmern, RV-Infarkt mit Hypotension. Parameter: Troponin↑, ST↑, neue Q-Zacken, Herzfrequenz↓", "Primäre PCI <90 min (Gold-Standard). Wenn nicht möglich: Thrombolyse mit rtPA. Parallel: Aspirin, P2Y12-Inhibitor (Clopidogrel/Prasugrel), Heparin.", "Nitrate KONTRAINDIZIERT bei RV-Infarkt (Preload-abhängig). Vorsicht: Hypotonie. Bradykardie-Monitoring. Atropin am Bett halten. Kein Nifedipin (erster Wahl β-Blocker)."] },
            {id: 3, fach: "Kardiologie", diagnose: "Vorhofflimmern mit RVR", anamnese: "71J weiblich, bekannt: Hypertonie. Akutes Auftreten von Palpitationen und mäßiger Dyspnoe. Erste Episode. Keine vorherige Tachyarrhythmie.", koerperlich: "Tachykard mit unregelmäßigem Herzrhythmus. JVD nicht prominent. Auskultation: unregelmäßige Herztonfolge. Lunge clear.", vitale: "RR 145/88, HF 135/min (unregelmäßig), AF 18/min, SpO2 95%, T 37,3°C", labor: "Troponin normal, BNP 180 pg/mL (↑), TSH normal, Elektrolyte normal", bildgebung: "EKG: Absolutes Arrhythmie, keine P-Wellen erkennbar, schnelle ventrikuläre Rate, keine ST-Veränderungen", q: ["Definiere Vorhofflimmern mit RVR und bewerte die akute Gefährdung dieses Patienten.", "Berechne den CHA2DS2-VASc-Score für diese Patientin und bestimme die Antikoagulationsnotwendigkeit mit Begründung.", "Entscheide zwischen Frequenzkontrolle und Rhythmuskontrolle und begründe deine Strategie.", "Beschreibe die medikamentösen Optionen zur Frequenzkontrolle mit Dosierungen und Kontraindikationen."], answers: ["VHF mit RVR = schnelle ventrikuläre Rate (>110/min) bei VHF. Gefährdung: Herzinsuffizienz-Dekompensation, Hypotonie, Myokardiale Ischämie möglich. Notfall wenn hämodynamisch instabil.", "C=1 (Congestive HF), H=1 (Hypertonie), A2=0, D=0, S=1 (Stroke=71J), V=0, A=0, Sc=0 = CHA2DS2-VASc Score 3. Antikoagulation INDIZIERT (≥1 Punkt bei Frauen).", "Initial Frequenzkontrolle: schnellere Stabilisierung. Rate-Control-Strategie bevorzugt in stabiler VHF. Rhythmuskontrolle wenn: instabil, HI, erste Episode, strukturelle Herzerkrankung.", "β-Blocker: Metoprolol 25-100mg 3x/d oder Bisoprolol; Diltiazem/Verapamil: 120-360mg/d verteilt; Digoxin: 0,5-1mg initial dann 0,25-0,5mg/d (alt). DD: Amiodaron 600mg Loading (nur in Notfall)."] },
            {id: 4, fach: "Chirurgie", diagnose: "Diverticulitis Grad I", anamnese: "62J weiblich. Schmerz im linken Unterbauch seit 2 Tagen mit progressiven Symptomen. Frühere ähnliche Episoden (2x in 3 Jahren, spontan resolviert). Heute Fieber bemerkt.", koerperlich: "Abwehrspannung und Resistenz LUQ, Loslaßschmerz deutlich positiv, keine Peritonitis generalisiert, McBurney-Punkt nicht druckschmerzhaft", vitale: "RR 128/76, HF 88/min, AF 16/min, SpO2 98%, T 37,8°C", labor: "Leukozyten 14.200/μL (↑), CRP 8,5 mg/dL (↑), Kreatinin 0,9 mg/dL, Hb 13,1 g/dL", bildgebung: "CT Abdomen mit IV-Kontrast: Entzündetes Divertikel im Sigmoid, keine freie Luft, kein Abszess oder Perforation", q: ["Klassifiziere die Diverticulitis nach Hinchey und interpretiere die CT-Befunde im klinischen Kontext.", "Argumentiere für oder gegen eine konservative Behandlung basierend auf Klinik und Bildgebung.", "Beschreibe dein therapeutisches Vorgehen: Antibiotika, Diät, Monitoring und Kriterien für Escalation zur Chirurgie.", "Diskutiere die Frage der elektiven Sigmaresektion nach erfolgreich behandelter Diverticulitis."], answers: ["Hinchey Grad I: Kleine Entzündung ohne freie Luft/Abszess. CT zeigt lokalisierte Entzündung, keine Komplikationen → günstiger Befund für konservatives Management.", "PRO konservativ: Grad I ohne Abszess, lokal begrenzt, Patient hämodynamisch stabil, CRP/Leuko moderat erhöht. Evidenz: viele Grad-I-Fälle heilen ab.", "1. Antibiotika IV: Ceftriaxon 2g/d + Metronidazol 1,5g/d x 7-10 Tage 2. Magen-Darm-Ruhe 3. Tägliche Klinik-Kontrolle 4. Escalation zur OP wenn: Peritonitis entwickelt sich, Fieber nicht sinkt, Schmerz zunimmt.", "Elektive Sigmaresektion nach 4-6 Wochen wenn Entzündung abgeklungen (bei unkomplizierter Diverticulitis nicht mehr routinemäßig empfohlen). Rezidiv-Risiko: 20% ohne Resektion, Komplikations-Risiko bei Rezidiv höher."] },
        ];

        // Add remaining 45 cases (5-49)
        const remainingCases = [
            {id: 5, fach: "Chirurgie", diagnose: "Perforiertes Magenulkus", q: ["Erkenne die Diagnose", "Diskutiere Notwendigkeit der OP", "Beschreibe chirurgische Technik", "Welche Komplikationen?"], answers: ["Perforiertes Magengeschwür mit Pneumoperitoneum. Patognomisch: freie Luft subdiaphragmal.", "Sofort-OP (Laparotomie). Gefahr: Peritonitis, Sepsis, kardiogener Schock.", "Primäre Reparatur (Vierschichtnahttechnik) + Omentoplastie.", "Sepsis, Dehiszenz, Pankreastfistel, Ileus, Sterblichkeit ~10%."] },
            {id: 6, fach: "Chirurgie", diagnose: "Primär spontaner Pneumothorax", q: ["Klassifiziere Pneumothorax", "Entscheide Therapie", "Drainage-Details", "Entlassung und Nachfolge"], answers: ["Kleine primär-spontane PSX (<2cm): Kleine Größe + jung = konservativ OK.", "Konservativ: Beobachtung. Größere: Nadel-Aspiration oder Chest-Tube.", "Small bore catheter (16-20F). Komplikationen: Reexpansion-Lungenödem.", "Discharge nach Reexpansion. Follow-up CXR in 24-48h. Rezidiv-Risiko ~25%."] },
            {id: 7, fach: "Neurologie", diagnose: "Akuter ischämischer Schlaganfall", q: ["Eignung für Thrombolyse?", "Klassifiziere Ätiologie", "Akut- und Langzeitmanagement", "RR-Management"], answers: ["Ja, 90 min < 4.5h. Keine KI: kein ICB, INR 0.9, Thrombozyten OK.", "Kardiale Embolie (VHF nicht antikoaguliert).", "rtPA 0.9 mg/kg IV. Antikoagulation nach 24h mit DOAC.", "Vorsicht Überkorrektion. Ziel <180 systolisch. Neuroprotection."] },
            {id: 8, fach: "Notfallmedizin", diagnose: "Septischer Schock", q: ["Definiere Sepsis und septischen Schock", "Infektionsquelle identifizieren", "6-Stunden-Bundle beschreiben", "Vasopressoren und Management"], answers: ["Sepsis + Hypotension (92/56) + Organdysfunktion.", "Urosepsis (rezidivierende HWI, Hydronephrose bilateral).", "Blutkultur, AB, Bolus 30mL/kg, Vasopressor, Urology-Konsult.", "Ceftriaxon 2g 2x/d + Gentamicin. Notfall-Drainage. MAP ≥65."] },
            {id: 9, fach: "Gastroenterologie", diagnose: "Akute Cholezystitis", q: ["Bestätige Diagnose", "Konservativ vs interventionell", "Operative Techniken", "Komplikationen"], answers: ["Murphy-Zeichen positiv. Steine + Wandverdickung = akute Cholezystitis.", "Elektiv Cholezystektomie in 2 Wochen. Initial: AB, NPO, Hydration.", "Laparoskopisch bevorzugt. Konversion bei Zirrhose/Anatomie-Unsicherheit.", "Gallenblasen-Perforation, Choledochus-Stein, Pankreatitis, Cholangitis."] },
            {id: 10, fach: "Infektiologie", diagnose: "Bakterielle Pneumonie", q: ["Klassifiziere Pneumonie", "Erreger und Antibiotika", "Stationäre Aufnahme-Kriterien", "Komplikationen"], answers: ["CAP. CURB-65: 0 Punkte = Low-Risk. SpO2 93% = moderates Risiko.", "E. coli/Streptococcus: Amoxicillin oder Cephalosporin.", "PSI III-V, SpO2 <94%, Komorbiditäten.", "Pleuraerguss, Lungenabszess, Sepsis. CXR nach 4-6 Wochen."] },
            {id: 11, fach: "Urologie", diagnose: "Urolithiasis mit Kolik", q: ["Diagnostiziere Urolithiasis", "Größe und Prognose", "Schmerzbehandlung", "Rezidiv-Prävention"], answers: ["Harnsäure-Stein: Radioluzent im Röntgen, in CT sichtbar.", "6mm = 85-95% spontane Passage. Keine Hydronephrose = gute Prognose.", "NSAR: Diclofenac 75mg oder Ibuprofen 600mg. 85% in 2-4 Wochen.", "Hydration, Allopurinol 300mg/d, Urin-Alkalisierung, purinarme Diät."] },
            {id: 12, fach: "Neurologie", diagnose: "Subarachnoidalblutung", q: ["Diagnose und Hunt-Hess", "Diagnostische Schritte", "Vasospasmus und Prävention", "Operative vs endovaskuläre Therapie"], answers: ["SAB, Aneurysma-Ruptur. Hunt-Hess III: ~40% Mortalität.", "CT-Angiografie oder DSA. LP wenn CT negativ.", "Nimodipina 60mg q4h. Früh-Reparatur (chirurgisch/endovaskulär).", "Early Intervention. Aggressive Vasospasmus-Management."] },
            {id: 13, fach: "Unfallchirurgie", diagnose: "Unterschenkeltraumata", q: ["Klassifiziere Fraktur", "Erste Hilfe", "Operative vs konservativ", "Langzeitkomplikationen"], answers: ["Tibia+Fibula, Gustilo II. Osteomyelitis-Risiko hoch.", "Tetanus, AB, Reposition, Debridement <6h.", "ORIF: Intramedullär Nagel bevorzugt.", "Osteomyelitis, delayed union, 6-12 Monate Rückkehr."] },
            {id: 14, fach: "Gastroenterologie", diagnose: "Peptisches Ulkus", q: ["Ätiologie NSAR vs H. pylori", "Therapie mit Dosierungen", "Kontroll-EGD notwendig?", "Rezidiv-Prävention"], answers: ["NSAR + H. pylori als Ko-Faktoren. 90% haben einen.", "PPI 40mg/d + H. pylori-Eradikation (Triple x 10-14 Tage).", "Nur wenn >1cm oder Malignität verdächtig.", "Continuous PPI 20mg/d. NSAR absetzen."] },

            {id: 47, fach: "Notfallmedizin", diagnose: "Symptomatic Hyponatriämie", q: ["Schwere Hyponatriämie", "SIADH Diagnose", "Hypertone Saline vorsichtig", "Korrektur-Rate"], answers: ["Na 118: Symptomatic (Verwirrtheit, Ataxie). ZNS-Ödem.", "Hypoosmolar Plasma + inappropriately high Urin-Osmolalität.", "3% NaCl VORSICHTIG titrated. Nur Symptome if critical.", "4-6 mEq/L erste 24h (max 12 mEq/L, risk Demyelinierung)."] },

            {id: 49, fach: "Gastroenterologie", diagnose: "Stressulkus nach Trauma", q: ["Stressulkus Pathophysio", "Hyperäure-Produktion", "PPI-Prophylaxe ICU", "Endoskopie vs OP"], answers: ["Ulzerationen nach Trauma, Sepsis, Burn. Shallow, multiple.", "Splanchnic Hypoperfusion + Cortisol → Säure ↑↑.", "PPI during ICU: Inzidenz Blutung <5% (war 25%).", "Endoskopisch oft self-limited. OP nur massive Blutung."] },
        ];

        allCases.push(...remainingCases);

        let sessionData = JSON.parse(localStorage.getItem('kpSessionComplete') || '{"completedIds": [], "answers": {}}');
        let currentMode = 'single';
        let casesTodo = [];
        let currentCaseIdx = 0;

        function initMode(mode) {
            const uncompleted = allCases.filter(c => !sessionData.completedIds.includes(c.id));

            if (mode === 'single') {
                casesTodo = uncompleted.length > 0 ? [uncompleted[Math.floor(Math.random() * uncompleted.length)]] : [allCases[Math.floor(Math.random() * allCases.length)]];
            } else if (mode === 'practice') {
                casesTodo = uncompleted.length > 0 ? [...uncompleted].sort(() => Math.random() - 0.5) : [...allCases].sort(() => Math.random() - 0.5);
            } else if (mode === 'failed') {
                const failed = allCases.filter(c => sessionData.answers[c.id]?.some(a => a.rating === 'incorrect'));
                casesTodo = failed.length > 0 ? failed.sort(() => Math.random() - 0.5) : uncompleted.slice(0, 5);
            } else if (mode === 'all') {
                casesTodo = [...allCases].sort(() => Math.random() - 0.5);
            }

            currentCaseIdx = 0;
            showCase();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-selector .btn').forEach(b => {
                if (b.textContent.includes(mode === 'single' ? 'Einzelfall' : mode === 'practice' ? 'Training' : mode === 'failed' ? 'Fehl' : 'Alle')) b.classList.add('active');
                else b.classList.remove('active');
            });
            initMode(mode);
        }

        function showCase() {
            if (currentCaseIdx >= casesTodo.length) {
                showEnd();
                return;
            }

            const c = casesTodo[currentCaseIdx];

            let html = `<div class="case-container">
                <div class="case-header">
                    <div>
                        <div class="case-title">${c.diagnose}</div>
                        <div class="case-meta">${c.fach} • Fall ${c.id}/${allCases.length}</div>
                    </div>
                    <div style="color: var(--text-secondary); font-size: 12px;">${currentCaseIdx + 1}/${casesTodo.length}</div>
                </div>

                <div class="section">
                    <div class="section-title">📋 Anamnese</div>
                    <div class="section-content">${c.anamnese}</div>
                </div>

                <div class="section">
                    <div class="section-title">👨‍⚕️ Körperliche Untersuchung</div>
                    <div class="section-content">${c.koerperlich}</div>
                </div>

                <div class="section">
                    <div class="section-title">❤️ Vitale Parameter</div>
                    <div class="section-content">${c.vitale}</div>
                </div>

                <div class="section">
                    <div class="section-title">🧪 Labor</div>
                    <div class="section-content">${c.labor}</div>
                </div>

                <div class="section">
                    <div class="section-title">🖼️ Bildgebung</div>
                    <div class="section-content">${c.bildgebung}</div>
                </div>

                <div class="section">
                    <div class="section-title">❓ Fragen</div>
                    <div style="margin-top: 15px;">`;

            c.q.forEach((question, idx) => {
                html += `<div class="question-block">
                    <div class="question-text">F${idx + 1}: ${question}</div>
                    <textarea id="q${idx}" placeholder="Deine ausführliche Antwort..."></textarea>
                </div>`;
            });

            html += `</div></div>
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="showRating()">Antworten Bewerten</button>
                        <button class="btn" onclick="skipCase()">Überspringen</button>
                    </div>

                    <div class="rating-section" id="ratingSection">
                        <div class="rating-title">Vergleiche deine Antworten mit den Musterlösungen:</div>
                        <div id="solutionContainer" style="background: rgba(16, 185, 129, 0.1); padding: 15px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid var(--success);"></div>
                        <div class="rating-title" style="margin-top: 15px;">Wie bewertest du deine Antworten?</div>
                        <div class="rating-buttons">
                            <button class="btn btn-success" onclick="rateCase('correct')">✓ Korrekt</button>
                            <button class="btn btn-warning" onclick="rateCase('sufficient')">~ Hinreichend</button>
                            <button class="btn btn-danger" onclick="rateCase('incorrect')">✗ Falsch</button>
                        </div>
                    </div>

                    <div id="feedback"></div>
                </div>
            `;

            document.getElementById('caseContainer').innerHTML = html;
            updateStats();
        }

        function showRating() {
            const feedbackDiv = document.getElementById('feedback');
            const ratingDiv = document.getElementById('ratingSection');
            const solutionDiv = document.getElementById('solutionContainer');
            feedbackDiv.classList.add('show');
            ratingDiv.classList.add('show');

            const c = casesTodo[currentCaseIdx];
            let fb = '';
            let solutions = '';

            c.q.forEach((q, idx) => {
                const ans = document.getElementById(`q${idx}`).value;
                fb += `<div class="feedback-item">
                    <div class="feedback-q-text">F${idx + 1}: ${q}</div>
                    <div class="feedback-answer"><strong>Deine Antwort:</strong><br>${ans || '(Keine Eingabe)'}</div>
                </div>`;
            });

            if (c.answers && c.answers.length > 0) {
                solutions = '<div style="margin-bottom: 10px;"><strong style="color: var(--success);">📋 Musterlösungen:</strong></div>';
                c.answers.forEach((answer, idx) => {
                    solutions += `<div style="margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(16, 185, 129, 0.3);">
                        <strong style="color: var(--success);">F${idx + 1}:</strong><br>
                        <span style="color: var(--text-secondary);">${answer}</span>
                    </div>`;
                });
                solutionDiv.innerHTML = solutions;
            } else {
                solutionDiv.innerHTML = '<span style="color: var(--text-secondary);">Keine Musterlösungen verfügbar für diesen Fall.</span>';
            }

            feedbackDiv.innerHTML = `<div class="feedback-header">Vergleich: Deine Antworten vs. Musterlösungen</div>${fb}`;
            ratingDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function rateCase(rating) {
            const c = casesTodo[currentCaseIdx];
            const answers = {};
            c.q.forEach((q, idx) => {
                answers[idx] = document.getElementById(`q${idx}`).value;
            });

            if (!sessionData.answers[c.id]) {
                sessionData.answers[c.id] = [];
            }

            sessionData.answers[c.id].push({
                rating: rating,
                answers: answers,
                timestamp: new Date().toISOString()
            });

            sessionData.completedIds.push(c.id);
            localStorage.setItem('kpSessionComplete', JSON.stringify(sessionData));

            nextCase();
        }

        function nextCase() {
            currentCaseIdx++;
            showCase();
        }

        function skipCase() {
            nextCase();
        }

        function showEnd() {
            const completed = sessionData.completedIds.length;
            const total = allCases.length;
            const pct = Math.round((completed / total) * 100);

            document.getElementById('caseContainer').innerHTML = `
                <div class="completion-screen">
                    <div class="completion-score">${pct}%</div>
                    <h2>Session Abgeschlossen!</h2>
                    <p>Du hast ${completed} von ${total} Fällen bearbeitet.</p>
                    <div class="button-group" style="justify-content: center; margin-top: 30px;">
                        <button class="btn btn-primary" onclick="location.reload()">Neue Session</button>
                    </div>
                </div>
            `;
            updateStats();
        }

        function updateStats() {
            const completed = sessionData.completedIds.length;
            const total = allCases.length;
            const pct = Math.round((completed / total) * 100);

            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressPct').textContent = pct + '%';
            document.getElementById('progressBar').style.width = pct + '%';
        }

        function exportProgress() {
            const dataStr = JSON.stringify(sessionData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `kp-progress-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            alert('✓ Fortschritt exportiert!');
        }

        function importProgress() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        sessionData = imported;
                        localStorage.setItem('kpSessionComplete', JSON.stringify(sessionData));
                        updateStats();
                        alert('✓ Fortschritt importiert!');
                    } catch (err) {
                        alert('✗ Fehler beim Importieren: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function resetProgress() {
            if (confirm('Bist du sicher? Dies löscht ALLE Fortschritte.')) {
                sessionData = { completedIds: [], answers: {} };
                localStorage.setItem('kpSessionComplete', JSON.stringify(sessionData));
                updateStats();
                alert('✓ Fortschritt zurückgesetzt!');
            }
        }

        initMode('single');
    </script>
</body>
</html>
