render Faktor) zur Stimulation der\nGranulopoese\n6. Engmaschige Laborkontrollen\nWichtig: Metamizol ist in vielen Ländern (z. B. USA, UK) wegen dieses Risikos\nnicht zugelassen. In Deutschland ist es verschreibungspflichtig. Patienten\nmüssen über das Agranulozytose-Risiko aufgeklärt werden.", "runde_1": [], "runde_2": [], "runde_3": [{"q": "F: Unterschied Obstruktion vs. Restriktion?", "a": "Merkmal FEV1/FVC (Tiffeneau) FVC TLC Fluss-Volumen-Kurve"}, {"q": "F: Ursachen?", "a": "1. Primärer Spontanpneumothorax (PSP): Ohne zugrundeliegende Lungenerkrankung, rupturierte subpleurale Bläschen (Blebs) 2. Sekundärer Spontanpneumothorax: Bei Vorerkrankung (COPD, Asthma, Mukoviszidose, Marfan-Syndrom) 3. Iatrogen: Z. B. nach Subklaviakatheter, Pleurapunktion, Biopsie, Überdruckbeatmung 4. Traumatisch: Rippenfraktur, penetrierendes Thoraxtrauma"}, {"q": "F: Typischer Patient beim primären Spontanpneumothorax?", "a": "Junger, großgewachsener, schlanker Mann, Raucher (20–40 Jahre)"}, {"q": "F: Häufigste Fraktur bei älteren Menschen nach Sturz?", "a": "Schenkelhalsfraktur (Femurhalsfraktur) Wichtig: Komplikationen: Hüftkopfnekrose (avaskuläre Nekrose), Pseudarthrose. Therapie meist operativ (Osteosynthese oder Hüftendoprothese je nach Frakturtyp und Patientenzustand)."}, {"q": "F: Sichere vs. unsichere Frakturzeichen?", "a": "Sichere Frakturzeichen (beweisend):"}, {"q": "Hand)?", "a": "Colles-Fraktur (distale Radiusfraktur)"}, {"q": "F: Was ist eine Colles-Fraktur?", "a": "Distale Radiusfraktur mit:   "}, {"q": "F: Röntgen unauffällig, aber Handgelenkschmerzen – Differenzialdiagnose?", "a": "Skaphoidfraktur (Kahnbeinfraktur) Wichtig: Im initialen Röntgen häufig nicht sichtbar! Bei klinischem Verdacht: MRT oder CT zur Sicherung. Unbehandelt droht avaskuläre Nekrose des Skaphoids."}, {"q": "F: Was sehen/tasten wir klinisch bei der Skaphoidfraktur?", "a": "Druckschmerz in der Tabatière (Foveola radialis) – die anatomische Schnupftabakdose, begrenzt durch:  "}, {"q": "F: Klassifikation der Skaphoidfraktur?", "a": "Herbert-Klassifikation (klinisch gebräuchlichste):"}], "clinical_case": "**Hauptsymptom:** Fall 18\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 18. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Bildgebende Verfahren (Ultraschall, CT oder Röntgen)\n• Differenzialdiagnosen basierend auf Klinik und Laborbefunden\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_19": {"case_info": "Fall 19\nKenntnisprüfung Niedersachsen – Bestanden ✅\nDatum der Nachricht\nPrüfungsdatum\nBundesland\nErgebnis\n\n07.05.2026\n06.05.2026, 13:15 Uhr\nNiedersachsen\nBestanden ✅\n\nPrüfungsatmosphäre\nDie Prüfungskommission bestand aus drei männlichen Prüfern. Die Atmosphäre war\nwährend der gesamten Prüfung angenehm und respektvoll. Der Vorsitzende war\ngleichzeitig der Hauptprüfer. Die Kandidatin war zum Zeitpunkt der Prüfung krank und\ndaher müde sowie gestresst.\n\nFallvorstellung\nHauptfall: Diabetes mellitus Typ 2\nPatientin: Frau Erika Sopik, 76 Jahre alt\nBeschwerden (seit ca. 4 Wochen):\n\n\n\n\nPolyurie\nPolydipsie\nAllgemeine Erschöpfung\n\nAnamnese: Das Anamnesegespräch verlief problemlos; die Patientin kooperierte gut.\nKörperliche Untersuchung: Verlief weitgehend problemlos. Die Reflexprüfung im\nRahmen der neurologischen Untersuchung wurde versehentlich ausgelassen\n(prüfungsrelevanter Punkt, siehe Erste Runde).\nArztbrief: Wurde verfasst und enthielt die dokumentierten Untersuchungsbefunde und\ndurchgeführten Maßnahmen.", "runde_1": [{"q": "F: Was versteht man unter Sensibilitätsstörungen bei Diabetes mellitus Typ 2?", "a": "Diabetische Polyneuropathie führt zu gestörter Oberflächensensibilität (Berührung, Schmerz, Temperatur) und Tiefensensibilität (Vibration, Lageempfinden). Typisch ist ein symmetrisches, strumpf- und handschuhförmiges Verteilungsmuster mit Beginn an den Füßen (Parästhesien, Taubheitsgefühl, Brennschmerz)."}, {"q": "F: Wie untersucht man die Sensibilität?", "a": "     "}, {"q": "F: Was wurde bei der körperlichen Untersuchung vergessen?", "a": "Die Reflexprüfung im Rahmen der neurologischen Untersuchung (z. B. Achillessehnenreflex, Patellarsehnenreflex). Bei Diabetes mellitus Typ 2 sind abgeschwächte oder fehlende Muskeleigenreflexe ein Frühzeichen der diabetischen Polyneuropathie."}, {"q": "F: Wie erkennt man einen Schrittmacherrhythmus im EKG?", "a": "Typische Merkmale:     "}, {"q": "F: Welche radiologischen Befunde können auf ein Bronchialkarzinom hinweisen?", "a": "      "}, {"q": "F: Wie ist das weitere Vorgehen bei Verdacht auf Bronchialkarzinom?", "a": "1. CT-Thorax/Abdomen mit Kontrastmittel zur Ausdehnung und Staging 2. Bronchoskopie mit Biopsie zur histologischen Sicherung 3. PET-CT bei kurativem Therapieanspruch (Fernmetastasenausschluss) 4. Interdisziplinäres Tumorboard"}, {"q": "F: Welche Medikamentengruppen werden eingesetzt?", "a": "Medikamentengruppe Beispiel Biguanide Metformin"}], "runde_2": [{"q": "F: Welche Komplikationen können auftreten?", "a": "Mikrovaskuläre Komplikationen:   "}, {"q": "F: Was sind die Fontaine-Stadien der pAVK?", "a": "Stadium I IIa IIb"}, {"q": "F: Therapie der pAVK?", "a": "   "}, {"q": "F: Wer nimmt an einer gefäßchirurgischen Konferenz teil?", "a": "     "}, {"q": "reduzierter EF (HFrEF)?", "a": "Säule Wirkstoffklasse 1 ACE-Hemmer / ARNi 2 3 4"}, {"q": "F: Wie behandelt man Kammerflimmern?", "a": "Sofortige Einleitung der Reanimation nach dem ABCDE-Schema / ERCLeitlinien: 1. Keine Reaktion / keine normale Atmung → Notruf (112), Defibrillator holen 2. CPR beginnen: 30 Thoraxkompressionen : 2 Beatmungen (30:2) 3. Defibrillation so früh wie möglich: Biphasisch 200 J (monophasisch 360 J) – danach sofort CPR fortführen (2 min) 4. Rhythmusanalyse alle 2 Minuten 5. Medikamentöse Therapie: o Ab dem 3. Schock: Adrenalin 1 mg i.v. alle 3–5 min o Ab dem 3. Schock: Amiodaron 300 mg i.v. (Bolus); 2. Dosis 150 mg möglich 6. Reversible Ursachen behandeln (4 H’s und 4 T’s)"}, {"q": "F: Wie viele Joule bei der Defibrillation?", "a": "200 J biphasisch beim ersten und allen Folgeschocks (geräteabhängig; Herstellerangaben beachten). Monophasisch: 360 J."}, {"q": "F: Welcher Perfusor auf der IMC nach erfolgreicher Reanimation?", "a": "Amiodaron als Dauerperfusor zur Rezidivprophylaxe von Kammerflimmern/flattern."}, {"q": "F: Wie lange wird Amiodaron als Perfusor gegeben?", "a": "In der Regel ca. 6–8 Stunden i.v. (900 mg über 24 h gemäß Standardprotokoll: 360 mg über 6 h, dann 540 mg über 18 h); anschließend oraler Wechsel nach klinischer Beurteilung."}, {"q": "F: Was bedeutet die Neutral-Null-Methode 10/0/60 am Kniegelenk?", "a": "  "}], "runde_3": [{"q": "F: Welche Ätiologien führen zur Leberzirrhose?", "a": "     "}, {"q": "F: Welche Funktionen hat die Leber?", "a": "     "}, {"q": "F: Welche Leberparameter werden im Labor bestimmt?", "a": "Parameter GOT (AST) GPT (ALT) GGT AP (Alkalische Phosphatase) Bilirubin (gesamt, direkt, indirekt) Albumin Quick / INR Ammoniak CHE (Cholinesterase)"}, {"q": "F: Was ist der Child-Pugh-Score?", "a": "Klassifikation der Leberzirrhose nach Schweregrad anhand von 5 Parametern (je 1–3 Punkte): Parameter Bilirubin (µmol/l) Albumin (g/l) Quick (%) Aszites Enzephalopathie"}, {"q": "F: Diagnose und Maßnahmen?", "a": "Diagnose: Anteroseptaler/Vorderwand-STEMI (ST-Hebungsinfarkt) – Verschluss des Ramus interventricularis anterior (RIVA / LAD) Sofortmaßnahmen (Zeit = Myokard): 1. Notruf, stationäre Aufnahme, kontinuierliches Monitoring 2. Venöser Zugang, Blutabnahme (Troponin I/T, CK-MB, BB, Elektrolyte, Gerinnung) 3. Reperfusion innerhalb von 90 min: Primäre PCI (perkutane Koronarintervention) = Goldstandard 4. Medikamentös: Duale Thrombozytenaggregationshemmung (ASS 250–500 mg + P2Y12-Inhibitor: Ticagrelor oder Prasugrel), Heparin i.v. (unfraktioniert), ggf. Betablocker, Nitrate (bei fehlenden Kontraindikationen) 5. Lyse (Thrombolyse) nur wenn PCI nicht innerhalb von 120 min möglich"}], "title": "Fall 19", "header": "Fall 19\nKenntnisprüfung Niedersachsen – Bestanden ✅\nDatum der Nachricht 07.05.2026\nPrüfungsdatum 06.05.2026, 13:15 Uhr\nBundesland Niedersachsen\nErgebnis Bestanden ✅\nPrüfungsatmosphäre\nDie Prüfungskommission bestand aus drei männlichen Prüfern. Die Atmosphäre war\nwährend der gesamten Prüfung angenehm und respektvoll. Der Vorsitzende war\ngleichzeitig der Hauptprüfer. Die Kandidatin war zum Zeitpunkt der Prüfung krank und\ndaher müde sowie gestresst.\nFallvorstellung\nHauptfall: Diabetes mellitus Typ ", "clinical_case": "**Hauptsymptom:** Fall 19\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 19. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Laborchemische Parameter und Entzündungsmarker\n• Bildgebende Verfahren (Ultraschall, CT oder Röntgen)\n• EKG und kardiale Diagnostik\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_20": {"case_info": "Fall 20\nKenntnisprüfung – Fallbericht\nDatum der Prüfung: 06.05.2026 Datum der Nachricht: 07.05.2026\n✅Die Kenntnisprüfung wurde erfolgreich bestanden.\n\nPrüfungskommission\nRolle\nVorsitzender\nZweiter Prüfer\nDritter Prüfer\n\nFachrichtung\nViszeralchirurgie\nGastroenterologie / Pathologie\nKardiologie\n\nDie Kommission war sehr freundlich, unterstützend und angenehm.\n\nPatientenvorstellung\nPatientin: Frau Erika Sopik Alter: 67 Jahre Diagnose: Akute Divertikulitis\n\nAnamnese\nAktuelle Beschwerden\nDie 67-jährige Patientin berichtet über seit zwei Tagen bestehende, progrediente\nSchmerzen im linken Unterbauch. Die Schmerzintensität wird mit 6/10 auf der\nnumerischen Rating-Skala (NRS) angegeben. Heute Morgen nahm die Patientin\neinmalig Paracetamol 500 mg ein, jedoch ohne wesentliche Besserung.\n⚠️ Korrektur: Im Original wurde „Paracetamol 400 mg“ angegeben. Die übliche\nund zugelassene Einzeldosis beträgt 500 mg (Erwachsene). 400 mg ist keine\nStandarddosierung – dies war vermutlich ein Erinnerungs- oder Schreibfehler.\nHeute Morgen maß die Patientin eine Temperatur von 38,2 °C axillär. Weitere\nBeschwerden wurden verneint. Eine ärztliche Vorstellung aufgrund ähnlicher\nBeschwerden hat bislang nicht stattgefunden.\n\nVegetative Anamnese\n\n\n\nChronische Obstipation seit längerer Zeit; Therapie mit Lactulose (Duphalac) mit\nnur vorübergehender Besserung.\nKeine Miktionsstörungen.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nVorerkrankungen\n\n\n\n\n\n\nArterielle Hypertonie\nZustand nach partieller Thyreoidektomie vor ca. 20 Jahren (Indikation:\nSchilddrüsenknoten)\nZustand nach Thrombektomie am linken Oberschenkel im Januar 2026\nZustand nach Appendektomie im Kindesalter\nAlle bisherigen Operationen verliefen komplikationslos.\n\nMedikation\nMedikament Dosis Schema\nRamipril\n5 mg 1-0-0\nL-Thyroxin\n75 µg 1-0-0\n\nAllergien\nKeine bekannten.\n\nNoxen\n\n\n\nNikotin: Aktuell ca. 1 Schachtel Zigaretten täglich; früher bis zu 2 Schachteln\ntäglich.\nAlkohol: Gelegentlicher Konsum.\n\nFamilienanamnese\n\n\n\nVater: Arterielle Hypertonie\nMutter: Leukämie\n\nSozialanamnese\nRentnerin; früher tätig als Bankkauffrau.\n\nKörperliche Untersuchung\n\n\n\n\n\nAllgemeinzustand: Reduziert durch Schmerzen.\nAbdomen: Tastbare Resistenz im linken Unterbauch mit lokalem Druckschmerz.\nSonstige Befunde: Unauffällig.\nNeurologische Untersuchung: Ohne pathologischen Befund. Eigenreflexe\nwurden nicht geprüft (vergessen).\n\nPrüfungsfragen und Antworten", "runde_1": [{"q": "Was ist eine Bauchresistenz? Warum tritt sie auf?", "a": "Eine Bauchresistenz bezeichnet einen palpatorisch tastbaren Widerstand im Abdomen. Sie entsteht durch eine entzündlich bedingte Infiltration und Verdickung des umgebenden Gewebes (Mesenterium, Darm, Fettgewebe) – sogenannte „phlegmonöse Umgebungsreaktion“. Bei der Divertikulitis bildet sich um das entzündete Divertikel eine entzündliche Gewebemasse, die als Resistenz tastbar wird. Alternativ kann eine Resistenz durch einen Abszess, einen Tumor oder ein Hämatom entstehen."}, {"q": "Was ist ein echtes Divertikel?", "a": "Ein echtes (= vollständiges) Divertikel ist eine Ausstülpung aller Wandschichten des Hohlorgans (Mukosa, Submukosa, Muskularis, Serosa/Adventitia). Beispiele: MeckelDivertikel, Zenker-Divertikel, Blasendivertikel."}, {"q": "Was ist ein Pseudodivertikel?", "a": "Ein Pseudodivertikel (= falsches Divertikel) ist eine Ausstülpung nur der inneren Wandschichten (Mukosa und Submukosa) durch Lücken in der Muskularis, meist an Gefäßeintrittstellen. Die Kolondivertikel (inkl. Sigma) sind fast ausschließlich Pseudodivertikel."}, {"q": "Appendizitis und Divertikulitis?", "a": "Sonographiebefund bei Divertikulitis:    "}, {"q": "Was ist ein Meckel-Divertikel? Wo genau?", "a": "Das Meckel-Divertikel ist ein echtes Divertikel des Dünndarms. Es ist ein Überbleibsel des Ductus omphaloentericus (Dottergang) und stellt die häufigste angeborene Fehlbildung des Gastrointestinaltrakts dar. Lokalisation: Am Ileum, ca. 40–60 cm oral (proximal) der Ileozökalklappe, an der antimesenterischen Seite. Merkregel „Regel der 2en“: 2 % der Bevölkerung, ca. 2 Zoll lang (~5 cm), ca. 2 Fuß (60 cm) vor der Ileozökalklappe, meist symptomatisch vor dem 2. Lebensjahr. Enthält in ca. 50 % ektopes Gewebe (Magenschleimhaut, Pankreasgewebe). Komplikationen: Blutung, Entzündung (Meckelitis – klinisch wie Appendizitis), Invagination, Perforation."}, {"q": "Was ist ein Zenker-Divertikel? Symptome?", "a": "Das Zenker-Divertikel ist ein echtes Pulsionsdivertikel im Bereich des pharyngoösophagealen Übergangs (Killian-Dreieck), dorsal zwischen dem M. thyropharyngeus und dem M. cricopharyngeus. Symptome:    "}, {"q": "Wie erfolgt die Behandlung der Divertikulitis je nach Stadium?", "a": "Klassifikation nach Hansen & Stock (modifiziert, weit verbreitet in Deutschland) bzw. CDD-Klassifikation: Stadium Stadium 0 Stadium I"}, {"q": "Was ist eine phlegmonöse Umgebungsreaktion? Warum entsteht sie?", "a": "Eine phlegmonöse Umgebungsreaktion bezeichnet eine diffuse, nicht abgegrenzte Entzündung des umgebenden Fett- und Bindegewebes um das entzündete Divertikel. Sie entsteht durch:   "}, {"q": "Welche Operationsmöglichkeiten gibt es bei Divertikulitis? Unterschiede?", "a": "1. Hartmann-Operation (Notfalleingriff):  "}, {"q": "nicht an einen Chirurgen?", "a": "Bei einer kolovesikalen Fistel als Komplikation der Divertikulitis kann Luft (Pneumaturie) oder Stuhl (Fäkalurie) beim Wasserlassen auftreten. Betroffene Patienten deuten diese Symptome als urologisches Problem (Harnwegsinfektion, Blasenbeschwerden) und suchen zunächst einen Urologen auf. Erst die weiterführende Diagnostik (Zystoskopie, CT) klärt den chirurgischen Ursprung."}], "runde_2": [{"q": "Was ist die Blutsenkungsgeschwindigkeit (BSG)?", "a": "Die BSG (Synonyme: Erythrozytensedimentationsrate, ESR) ist ein unspezifischer Entzündungsparameter. Sie misst die Geschwindigkeit, mit der Erythrozyten in einem senkrecht stehenden Röhrchen mit antikoaguliertem Blut absinken (mm/h). Mechanismus: Bei Entzündung steigen Fibrinogen und andere Akute-Phase-Proteine im Blut an. Diese verringern die negative Oberflächenladung der Erythrozyten, sodass diese zu Geldrollen (Rouleaux-Formationen) aggregieren und schneller sedimentieren. Normwerte:   "}, {"q": "Bei welchen Erkrankungen kann die BSG erhöht sein?", "a": "      "}, {"q": "Was sehen Sie auf diesem Bild?", "a": "Homogene, lobäre oder segmentale Verschattung (Konsolidierung) im Lungenparenchym, typischerweise mit positivem Bronchopneumogramm (Luftbronchogramm), d. h. luftgefüllte Bronchien heben sich von der konsolidierten Umgebung ab. Die Zwerchfellkontur kann teilweise aufgehoben sein (je nach Lokalisation)."}, {"q": "Welche Therapie empfehlen Sie bei ambulant erworbener Pneumonie (CAP)?", "a": "Orientierung an CRB-65-Score (Orientierung für ambulant): Punkte 0 1–2 ≥3"}, {"q": "Kann man Doxycyclin zur Behandlung einsetzen?", "a": "Ja. Doxycyclin ist ein Breitspektrum-Tetracyclin-Antibiotikum und wirksam gegen:  "}, {"q": "Was kann beim Pneumothorax gefährlich sein?", "a": "Der Spannungspneumothorax (Tension Pneumothorax) ist ein lebensbedrohlicher Notfall:     "}], "runde_3": [{"q": "Was erkennen Sie im EKG?", "a": "Vorhofflattern (Atrial Flutter): "}, {"q": "Welche Formen supraventrikulärer Rhythmusstörungen kennen Sie?", "a": "1. Sinusbradykardie / Sinustachykardie (eigentlich physiologisch, aber Grenzbereiche) 2. Supraventrikuläre Extrasystolen (SVES) 3. AV-Knoten-Reentry-Tachykardie (AVNRT) – häufigste SVT 4. AV-Reentry-Tachykardie (AVRT) – z. B. bei WPW-Syndrom 5. Vorhofflattern (Atrial Flutter) 6. Vorhofflimmern (Vorhofflimmern, VHF) – häufigste anhaltende Herzrhythmusstörung 7. Atriale Tachykardie (fokale / Makroreentry) 8. Sinusknoten-Reentry-Tachykardie 9. Junktionale Tachykardie Was ist der jeweilige elektrophysiologische Mechanismus von AVRT, AVNRT, VHF"}, {"q": "und Vorhofflattern?", "a": "AVNRT (AV-Knoten-Reentry-Tachykardie):   "}], "title": "Fall 20", "header": "Fall 20\nKenntnisprüfung – Fallbericht\nDatum der Prüfung: 06.05.2026 Datum der Nachricht: 07.05.2026\n✅ Die Kenntnisprüfung wurde erfolgreich bestanden.\nPrüfungskommission\nRolle Fachrichtung\nVorsitzender Viszeralchirurgie\nZweiter Prüfer Gastroenterologie / Pathologie\nDritter Prüfer Kardiologie\nDie Kommission war sehr freundlich, unterstützend und angenehm.\nPatientenvorstellung\nPatientin: Frau Erika Sopik Alter: 67 Jahre Diagnose: Akute Divertikulitis\nAnamnese\nAktuelle Beschwerden\nDie 67-jährige Patientin berichtet über seit zwei Tagen bestehende, progrediente\nSchmerzen im linken Unterbauch. Die Schmerzintensität wird mit 6/10 auf der\nnumerischen Rating-Skala (NRS) angegeben. Heute Morgen nahm die Patientin\neinmalig Paracetamol 500 mg ein, jedoch ohne wesentliche Besserung.\n⚠️ Korrektur: Im Original wurde „Paracetamol 400 mg“ angegeben. Die übliche\nund zugelassene Einzeldosis beträgt 500 mg (Erwachsene). 400 mg ist keine\nStandarddosierung – dies war vermutlich ein Erinnerungs- oder Schreibfehler.\nHeute Morgen maß die Patientin eine Temperatur von 38,2 °C axillär. Weitere\nBeschwerden wurden verneint. Eine ärztliche Vorstellung aufgrund ähnlicher\nBeschwerden hat bislang nicht stattgefunden.\nVegetative Anamnese\n Chronische Obstipation seit längerer Zeit; Therapie mit Lactulose (Duphalac) mit\nnur vorübergehender Besserung.\n Keine Miktionsstörungen.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nVorerkrankungen\n Arterielle Hypertonie\n Zustand nach partieller Thyreoidektomie vor ca. 20 Jahren (Indikation:\nSchilddrüsenknoten)\n Zustand nach Thrombektomie am linken Oberschenkel im Januar 2026\n Zustand nach Appendektomie im Kindesalter\n Alle bisherigen Operationen verliefen komplikationslos.\nMedikation\nMedikament Dosis Schema\nRamipril 5 mg 1-0-0\nL-Thyroxin 75 µg 1-0-0\nAllergien\nKeine bekannten.\nNoxen\n Nikotin: Aktuell ca. 1 Schachtel Zigaretten täglich; früher bis zu 2 Schachteln\ntäglich.\n Alkohol: Gelegentlicher Konsum.\nFamilienanamnese\n Vater: Arterielle Hypertonie\n Mutter: Leukämie\nSozialanamnese\nRentnerin; früher tätig als Bankkauffrau.\nKörperliche Untersuchung\n Allgemeinzustand: Reduziert durch Schmerzen.\n Abdomen: Tastbare Resistenz im linken Unterbauch mit lokalem Druckschmerz.\n Sonstige Befunde: Unauffällig.\n Neurologische Untersuchung: Ohne pathologischen Befund. Eigenreflexe\nwurden nicht geprüft (vergessen).\nPrüfungsfragen und Antworten", "clinical_case": "**Hauptsymptom:** Akuter Bauchschmerz im linken Unterbauch mit Übelkeit und Fieber\n\n**Anamnese:** Ein 58-jähriger männlicher Patient präsentiert sich mit plötzlich einsetzenden, starken Bauchschmerzen im linken Unterbauch, die vor 12 Stunden begannen. Der Schmerz ist konstant, wird begleitet von Übelkeit und leichtem Fieber (37,8°C). Der Patient hat in der Vergangenheit mehrere ähnliche, aber mildere Episoden gehabt. Er ist übergewichtig (BMI 28), raucht gelegentlich und hat eine unauffällige Vormedikation.\n\n**Klinische Befunde:** Allgemeinzustand: mäßig beeinträchtigt. Vitale Parameter: RR 145/88, HR 88/min, Temperatur 37,8°C. Abdominell: lokalisierter Druckschmerz und Abwehrspannung im linken Unterbauch, keine Loslassschmerzen. Darmgeräusche vorhanden. Rektale Untersuchung unauffällig. Gewicht 85 kg bei 165 cm.\n\n**Diagnostische Kriterien:**\n• CRP und Leukozyten als Entzündungsmarker\n• Sonographie des Abdomens (verdickte Kolonwand, echoiche Divertikel)\n• CT bei Komplikationsverdacht\n• Ausschluss Harnwegsinfekt durch Urinstatus\n\n**Therapie:**\n• Konservatives Management: Kostaufbau, ausreichende Flüssigkeitszufuhr\n• i.v. Antibiotika (Metronidazol + Cephalosporin) bei mittelschweren Fällen\n• Schmerzmanagement mit Metamizol oder Paracetamol\n• Bei Komplikationen: CT-gesteuerte Drainage oder operative Intervention\n"}, "Fall_21": {"case_info": "Fall 21\nFallbericht – Kenntnisprüfung\nDatum der Nachricht: 08.05.2026 Datum der Kenntnisprüfung: Mittwoch, 06.05.2026,\n13:15 Uhr Ergebnis: Bestanden – 3/3 ✓\n\nPatientenvorstellung\nPatient: Heinrich Kronlager, 71 Jahre\n\nAktuelle Beschwerden (Anamnese)\nDer Patient stellte sich mit folgenden Beschwerden vor:\n\n\n\n\n\n\nBelastungsabhängige Dyspnoe: Auftreten bereits beim Treppensteigen ab dem\n1. Stockwerk sowie beim Spaziergang mit dem Hund.\nOrthopnoe: Der Patient muss wegen der Luftnot nachts auf drei Kissen schlafen.\nHerzrasen\nNykturie\nBeinödeme (beidseits)\n\nVerneint wurden: Brustschmerzen, Synkope, Fieber, Gewichtszunahme.\n\nVorerkrankungen\n1. Arterielle Hypertonie (aHT) – seit 10 Jahren\no Medikation: Candesartan 1–0–0\n2. Vorhofflimmern – vor 2 Jahren diagnostiziert\no Der Patient berichtete, er sei damals stationär aufgenommen worden\nwegen eines unangenehmen Herzgefühls (Palpitationen).\no Medikation: Apixaban (Eliquis) – laut Patient nur morgens eingenommen;\nDosierung unbekannt.\no Hinweis: Die korrekte Standarddosierung von Apixaban bei\nVorhofflimmern beträgt 2 × 5 mg/Tag (bzw. 2 × 2,5 mg bei\nDosisreduktionskriterien). Eine einmalige Einnahme pro Tag ist bei diesem\nIndikationsgebiet nicht korrekt – dies sollte im klinischen Alltag verifiziert\nund ggf. korrigiert werden.\n\nOperationen\n\n\nTonsillektomie\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nNoxen\n\n\n\nNikotin: Nichtraucher\nAlkohol: ca. 2 Gläser am Wochenende (moderater Konsum)\n\nAllergien\n\n\nPenicillin-Allergie mit Urtikaria\n\nSozialanamnese\n\n\n\n\nRentner\nLebt allein (mit Hund)\nEhemaliger Tischler\n\nFamilienanamnese\n\n\nNicht erhoben (wurde vergessen – wichtig für zukünftige Prüfungen nachzuholen,\ninsbesondere bei kardiovaskulären Erkrankungen)\n\nKörperliche Untersuchung\nUntersuchung im Sitzen\n1. Blutdruckmessung beidseits:\no Initial fehlerhafte Manschettenanlage → selbstständig erkannt und\nkorrigiert.\no Ergebnis: RR beidseits 120/80 mmHg (normwertig)\n2. Puls: Getastet, als normal bewertet.\n3. Lungenuntersuchung:\no Auskultation, Perkussion, Palpation\no Auf Prüfung der Atemverschieblichkeit wurde verzichtet (Schonung des\nälteren Patienten bei V.a. Herzinsuffizienz – vertretbare Entscheidung).\n\nUntersuchung im Liegen\n4. Herzuntersuchung:\no Auskultation\no Palpation des Herzspitzenstoßes\no Palpation der Karotiden und Armpulse\no Pulsvergleich mit Herztönen\n5. Gefäßauskultation:\no Karotiden, subklavikulär, Abdominalaorta, Nierenarterien, A. brachialis, A.\nfemoralis\n6. Hepatojugulärer Reflux:\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\no Befund: Positiv (kurze Stauung beim Drücken, danach Rückgang) →\nHinweis auf erhöhten venösen Druck bei Rechtsherzinsuffizienz.\n7. Abdomenuntersuchung:\no Auskultation, Perkussion, oberflächliche und tiefe Palpation\n8. Periphere Pulse: Getastet\n9. Sensibilitätsprüfung: Am gesamten Körper\n10. Ödeme: Beidseits prätibial geprüft (5 Sekunden Druck), Meyer-Zeichen geprüft.\no Hinweis: Das Meyer-Zeichen (Wadenkompressionsschmerz) dient zum\nAusschluss einer tiefen Beinvenenthrombose (TVT) und ist bei Ödemen\nunklarer Ursache sinnvoll.\n11. Neurologische Untersuchung:\no Beinhalteversuch, Knie-Hacke-Versuch, Tonus, Kraft, Reflexe, Hirnnerven\n\nKommunikation während der Untersuchung\nDer Kandidat hat den Patienten während der gesamten Untersuchung informiert und\nbegleitet, z. B.:\n\n\n\n\n\n„Ich möchte Ihre Lunge einmal beklopfen, bitte erschrecken Sie nicht.“\n„Wenn etwas unangenehm ist, sagen Sie mir bitte Bescheid.“\n„Tut es weh?“\n„Ihre Lunge ist gut belüftet und frei.“\n\n→ Dies ist vorbildlich und entspricht dem patientenzentrierten Untersuchungsansatz.\n\nPatientenaufklärung am Ende\nDer Patient fragte: „Was habe ich?“ – Antwort des Kandidaten:\n„Ihre Symptome weisen auf eine chronische Herzinsuffizienz hin. Ich kann die\nDiagnose aber noch nicht sicher bestätigen. Wir müssen noch einige\nUntersuchungen durchführen, z. B. Labor, EKG und Echokardiographie, um\nsicherzugehen. Wenn sich die Diagnose bestätigt, machen Sie sich bitte keine\nSorgen. Dann bekommen Sie zusätzliche Medikamente zu denen, die Sie\nbereits einnehmen.“\n→ Gut formuliert: Verdachtsdiagnose kommuniziert, Unsicherheit benannt, nächste\nSchritte erklärt, Beruhigung ausgesprochen.\n\nPrüfungsgespräch – 1. Runde\nPatientenvorstellung\nErfolgt.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nErb-Punkt\nWas ist der Erb-Punkt? Wo liegt er? Warum hört man dort?\nDer Erb-Punkt ist ein kardialer Auskultationspunkt, der im 3./4. Intercostalraum (ICR)\nlinks parasternal liegt. Er ist kein klassischer Herzklappenpunkt, sondern ein\nSummationspunkt: Hier können Geräusche aller vier Herzklappen gehört werden,\nbesonders Aorteninsuffizienz-Geräusche. Er wird genutzt, weil sich hier die Schallwege\nmehrerer Klappen überschneiden und Geräusche gut fortgeleitet werden.\n\nHerztöne\nWelche Herztöne gibt es und wo hört man jeden Herzton?\nHerzton\n1.\nHerzton\n(S1)\n2.\nHerzton\n(S2)\n3.\nHerzton\n(S3)\n4.\nHerzton\n(S4)\n\nEntstehung\nSchluss der Mitral- und\nTrikuspidalklappe\n(Systolenbeginn)\n\nAuskultationspunkt\nApex (Herzspitze, 5. ICR,\nMedioklavikularlinie links) und\nTrikuspidalareal (4./5. ICR links\nparasternal)\nSchluss der Aorten- und\nAortenareal (2. ICR rechts parasternal)\nPulmonalklappe (Diastolenbeginn) und Pulmonalareal (2. ICR links\nparasternal)\nFrühdiastolische schnelle\nApex\nVentrikelfüllung; bei\nHerzinsuffizienz pathologisch\nSpäte Diastole, bei verstärkter\nApex\nVorhofkontraktion gegen steife\nVentrikel; pathologisch\n\nHinweis: S3 ist bei Herzinsuffizienz ein wichtiger Befund und bildet mit S1 und S2 den\nsog. „Galopprhythmus“.\n\nVerdachtsdiagnose\nChronische Herzinsuffizienz – begründet durch:\n\n\n\n\n\n\n\n\nBelastungsdyspnoe (NYHA III)\nOrthopnoe (Schlaf auf 3 Kissen)\nNykturie\nHerzrasen\nBeinödeme beidseits\nPositiver hepatojugulärer Reflux\nVorerkrankungen: aHT (10 J.), Vorhofflimmern\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nDifferenzialdiagnosen\n1. Paroxysmales Vorhofflimmern – muss bei bekanntem Vorhofflimmern\nausgeschlossen werden (Herzrasen, Palpitationen).\n2. Koronare Herzkrankheit (KHK) / Instabile Angina pectoris –\nBelastungsdyspnoe kann auch ischämisch bedingt sein; Troponin und EKG zur\nAbgrenzung notwendig.\n3. Akutes Koronarsyndrom / Myokardinfarkt – auch bei ausschließlich\nbelastungsabhängiger Dyspnoe ohne typischen Brustschmerz möglich (stumme\nIschämie, v.a. bei älteren Patienten und Diabetikern). Troponin obligat.\n4. COPD / Lungenemphysem – bei Dyspnoe immer als pulmonale Ursache in\nBetracht ziehen.\n5. Lungenembolie – bei Beinödemen und Dyspnoe relevant.\n6. Niereninsuffizienz – kann Ödeme und Dyspnoe (durch Überwässerung)\nverursachen.\n\nInspektion bei Herzinsuffizienz\nWas kann man bei der Inspektion sehen?\n\n\n\n\n\n\n\n\nÖdeme (beidseits): prätibial, Knöchel, Fußrücken\nAnasarka: Generalisiertes Ödem (gesamter Körper, inkl. Aszites, Pleuraerguss,\nPerikarderguss)\nHalsvenengestaung (erhöhter ZVD)\nHepatomegalie (ggf. tastbar/sichtbar)\nZyanose (peripher oder zentral)\nBlässe\nKachexie / reduzierter AZ und EZ (bei chronischer Herzinsuffizienz)\n\nWichtig: Ödeme nicht nur an den Beinen suchen – bei bettlägerigen Patienten auch\nsakral!\nWas ist Anasarka? Ein generalisiertes Ödem des gesamten Körpers (Subkutangewebe,\nKörperhöhlen), das bei schwerer Herzinsuffizienz, Niereninsuffizienz oder\nHypoalbuminämie auftreten kann.\nWo sieht man Ödeme besonders bei älteren Patienten? Bei mobilen Patienten:\nKnöchel und prätibiale Region (Schwerkraftödem). Bei bettlägerigen Patienten:\nSakralregion (dorsal). Bei Herzinsuffizienz zusätzlich: Halsvenen (Stauung), Leber\n(Stauungshepatomegalie), im Verlauf Aszites.\n\nHerzspitzenstoß bei Herzinsuffizienz\nWas kann man bei Herzinsuffizienz am Herzspitzenstoß finden?\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nNach lateral verlagert (z. B. 6. ICR, anterior-axilläre Linie) – Zeichen der\nKardiomegalie / Linksherzhypertrophie bzw. -dilatation\nVerbreitert (normal: münzgroß, ca. 2 cm²)\nHebend (bei Druckbelastung, z. B. aHT, Aortenstenose)\nAbgeschwächt oder nicht tastbar – häufig bei älteren Patienten, Adipositas,\nLungenemphysem oder Perikarderguss\n\nHinweis des Prüfers: Bei älteren Patienten ist der Herzspitzenstoß oft nicht oder kaum\ntastbar – dies ist kein Untersuchungsfehler, sondern ein bekanntes klinisches\nPhänomen.\n\nDiagnostik bei Herzinsuffizienz\nLaboruntersuchungen:\n\n\n\n\n\nHerzenzyme / Troponin I oder T → Ausschluss Myokardinfarkt / ACS\nBNP / NT-proBNP → Biomarker der Herzinsuffizienz\no BNP (Brain Natriuretic Peptide): Wird vom Ventrikel bei Wandstress\n(Volumen-/Druckbelastung) freigesetzt; erhöht bei Herzinsuffizienz.\no NT-proBNP: Inaktives Spaltprodukt von proBNP; längere Halbwertszeit,\nstabiler; erhöhte Werte bei Herzinsuffizienz. Cutoff-Werte je nach Alter\nverschieden.\no Unterschied: NT-proBNP hat eine längere Halbwertszeit (~120 min vs.\n~20 min bei BNP) und ist nierenpflichtig eliminiert → bei Niereninsuffizienz\nstärker erhöht. Beide eignen sich zur Diagnose und Verlaufskontrolle.\nBlutbild, Elektrolyte, Kreatinin, eGFR, Leberwerte, TSH (Ursachensuche und\nBegleiterkrankungen)\n\nApparative Diagnostik:\n\n\n\n\n12-Kanal-EKG → Rhythmusdiagnostik (Vorhofflimmern, ACS), Ischämiezeichen,\nLVH\nRöntgen-Thorax → Kardiomegalie, Stauungszeichen (Kerley-B-Linien, perihiläre\nUnschärfe, Pleuraerguss)\nEchokardiographie (TTE) → Goldstandard zur Beurteilung der kardialen\nFunktion\no EF (Ejektionsfraktion): Anteil des Schlagvolumens am enddiastolischen\nVolumen\no Normwerte: Männer ca. 52–72 %, Frauen ca. 54–74 %\no Bei HFrEF (Heart Failure with reduced EF): EF < 40 %\no Klinischer Hinweis: In der Notaufnahme werden EKG und Röntgen sofort\ndurchgeführt; die Echokardiographie erfolgt elektiv (z. B. am Folgetag).\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nNYHA-Klassifikation\nWas bedeutet NYHA? Warum wird sie verwendet? Welche Stadien gibt es?\nDie NYHA-Klassifikation (New York Heart Association) dient zur Einstufung der\nfunktionellen Einschränkung bei Herzinsuffizienz anhand der Belastbarkeit des\nPatienten. Sie ist wichtig für Therapieentscheidungen und die Beurteilung des\nKrankheitsverlaufs.\nStadium\nNYHA I\nNYHA II\nNYHA\nIII\nNYHA\nIV\n\nBeschreibung\nHerzerkrankung bekannt, aber keine Beschwerden bei normaler Belastung.\nNormale körperliche Aktivität verursacht keine Symptome.\nBeschwerden bei stärkerer körperlicher Belastung (z. B. Treppensteigen\nmehrere Stockwerke, schnelles Gehen). Leichte Einschränkung.\nBeschwerden bereits bei leichter körperlicher Belastung (z. B.\nTreppensteigen 1 Stockwerk, ebenes Gehen). Deutliche Einschränkung,\nbeschwerdefrei in Ruhe.\nBeschwerden in Ruhe oder bei minimaler Belastung. Bettlägerigkeit möglich.\n\nEinstufung des Patienten: NYHA III → Dyspnoe bereits beim Treppensteigen ab dem\n1. Stockwerk und beim Spaziergang.\n\nCHA₂ DS₂ -VA-Score\nWas ist der CHA₂ DS₂ -VA-Score und warum wird er bestimmt?\nDer CHA₂ DS₂ -VA-Score wird bei Patienten mit Vorhofflimmern (nicht-valvuläres VHF)\neingesetzt, um das individuelle Schlaganfallrisiko und damit die Indikation zur oralen\nAntikoagulation zu bewerten.\nKriterium\nC – Congestive heart failure (Herzinsuffizienz)\nH – Hypertension (Hypertonie)\nA₂ – Age ≥ 75 Jahre\nD – Diabetes mellitus\nS₂ – Stroke/TIA (Schlaganfall/TIA in der Vorgeschichte)\nV – Vascular disease (KHK, pAVK, Aortenplaque)\nA – Age 65–74 Jahre\n\nPunkte\n1\n1\n2\n1\n2\n1\n1\n\n(Anmerkung: Das frühere „Sc“ für Sex category – weibliches Geschlecht – wurde in der\naktuellen ESC-Leitlinie 2024 entf n Knöcheln. Bei\nbettlägerigen Patienten sakral. Bei Herzinsuffizienz muss immer auch an Ödeme der\nLeber (Hepatomegalie), der Lunge (Pleuraerguss), des Abdomens (Aszites) und\nallgemein an ein Anasarka gedacht werden.\n\nHerzspitzenstoß bei Herzinsuffizienz\nF: Was kann man bei Herzinsuffizienz am Herzspitzenstoß finden?\nA:\n\n\n\n\n\nNach lateral verlagert – durch Dilatation des linken Ventrikels\nVerbreitert – Normalbefund: ca. 2 cm², bei Dilatation flächenhafter Impuls\nHebend – bei Hypertrophie (z. B. bei aHT)\nSchwach tastbar oder nicht tastbar – häufig bei älteren Patienten, Adipositas,\nEmphysem oder Perikarderguss\nPrüferkommentar: Bei älteren Patienten ist der Herzspitzenstoß häufig nicht\nsicher tastbar. Das hat keine negative Prüfungsrelevanz, wenn man es korrekt\nkommuniziert.\n\nDiagnostik bei Herzinsuffizienz\nF: Welche Diagnostik veranlassen Sie?\nA:\nLabor: | Parameter | Zweck | |—|—| | Troponin I/T | Myokardinfarkt ausschließen | | BNP\n/ NT-proBNP | Herzinsuffizienz-Marker; erhöht bei Volumenbelastung und\nWandspannung | | Großes Blutbild | Anämie als Ursache/Kofaktor ausschließen | |\nElektrolyte (Na⁺ , K⁺ , Ca²⁺ , Mg²⁺ ) | Entgleisungen, die Herzrhythmusstörungen\nbegünstigen | | Kreatinin, Harnstoff | Nierenfunktion, Medikamentendosierung | |\nLeberenzyme (GOT, GPT, GGT, Bilirubin) | Stauungsleber bei Rechtsherzinsuffizienz | |\nTSH | Hypo-/Hyperthyreose als Ursache | | Blutglukose, HbA1c | Diabetes mellitus als\nRisikofaktor |\nF: Was ist BNP / NT-proBNP und was ist der Unterschied?\nA:\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nBNP (Brain Natriuretic Peptide): Hormon, das von Kardiomyozyten bei erhöhter\nWandspannung (z. B. Volumenüberlastung) produziert und direkt sezerniert wird.\nHalbwertszeit: ca. 20 Minuten.\nNT-proBNP (N-terminales pro-BNP): Biologisch inaktives Spaltprodukt der\nBNP-Vorstufe. Längere Halbwertszeit (~60–120 min), daher im klinischen Alltag\nhäufiger bestimmt.\nErhöhte Werte sprechen für Herzinsuffizienz; normale Werte machen eine\nHerzinsuffizienz weitgehend unwahrscheinlich (hoher negativer prädiktiver Wert).\nNT-proBNP ist stärker nierenabhängig → bei Niereninsuffizienz falsch hoch.\n\nApparative Diagnostik: | Untersuchung | Zweck | |—|—| | 12-Kanal-EKG |\nHerzrhythmusstörungen (z. B. Vorhofflimmern), Ischämiezeichen, Linksherzhypertrophie\n| | Röntgen-Thorax p.a. | Kardiomegalie, Pleuraerguss, pulmonalvenöse Stauung | |\nEchokardiographie (transthorakal) | Ejektionsfraktion, Wandbewegungsstörungen,\nKlappendefekte, Perikarderguss |\nPrüferhinweis: In der Notaufnahme sind EKG und Röntgen-Thorax die\nprimären Maßnahmen. Die Echokardiographie kann elektiv, z. B. am nächsten\nTag, durchgeführt werden.\n\nEjektionsfraktion (EF)\nF: Was ist die Ejektionsfraktion? Was ist der Normalwert?\nA:\n\n\n\n\n\n\nDie Ejektionsfraktion (EF) beschreibt den prozentualen Anteil des\nSchlagvolumens am enddiastolischen Volumen des linken Ventrikels.\nFormel: EF = (EDV − ESV) / EDV × 100\nNormalwerte:\no Männer: ca. 52–72 %\no Frauen: ca. 54–74 %\nEinteilung der Herzinsuffizienz nach EF:\no HFrEF (Heart Failure with reduced EF): EF < 40 %\no HFmrEF (mildly reduced EF): EF 40–49 %\no HFpEF (preserved EF): EF ≥ 50 %\n\nNYHA-Klassifikation\nF: Was bedeutet NYHA? Warum benutzen wir diese Klassifikation? Welche\nStadien gibt es? Welches Stadium hat der Patient?\nA:\n\n\nNYHA = New York Heart Association\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n\n\nDient der Einschätzung des funktionellen Schweregrads der Herzinsuffizienz\nanhand der Belastungstoleranz. Relevant für Therapieentscheidungen, Prognose\nund Verlaufskontrolle.\nStadium Beschreibung\nNYHA I Herzerkrankung bekannt, aber keine Beschwerden bei normaler körperlicher\nBelastung\nNYHA II Beschwerden bei stärkerer körperlicher Belastung (z. B. Treppensteigen\nmehrerer Etagen)\nNYHA III Beschwerden bereits bei leichter körperlicher Belastung (z doskopie,\nSigmoidoskopie (nur Teiluntersuchung)\n\nRektumkarzinom – Therapie\nF: Der Patient hat einen Tumor im Rektum. Was machen Sie?\nA:\n1. Interdisziplinäre Tumorkonferenz – Anmeldung und Therapieplanung\n2. Therapie abhängig vom Stadium (TNM):\nStadium\nTherapie\nStadium I (T1/T2,\nPrimär chirurgische Resektion; bei T1 low risk ggf. lokale\nN0, M0)\nExzision (TEM)\nStadium II (T3/T4,\nNeoadjuvante Radiochemotherapie (RCT) → Operation → ggf.\nN0, M0)\nadjuvante Chemotherapie\nStadium III (jedes T,\nNeoadjuvante RCT → Operation → adjuvante Chemotherapie\nN+, M0)\n\n\fNeue Fälle finden Sie auf dem Kanal:\nStadium\nStadium IV (M1)\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nTherapie\nPalliative oder ggf. multimodale Therapie (falls\nMetastasenresektion möglich)\n\nF: Was ist der Sinn der neoadjuvanten Therapie?\nA:\n\n\n\n\n\nTumorverkleinerung (Downstaging/Downsizing) → verbesserte Resektabilität\nR0-Resektion ermöglichen (tumorfreie Resektionsränder)\nSphinktererhalt – durch Tumorverkleinerung kann ggf. eine kontinenzerhaltende\nOP statt Rektumamputation erfolgen\nSenkung des Lokalrezidivrisikos (vom Prüfer besonders betont)\n\nChemotherapie beim Rektumkarzinom\nF: Welche Chemotherapie wird eingesetzt?\nA: FOLFOX\nF: Wofür stehen die Buchstaben?\nA:\n\n\n\n\nFOL – Folinsäure (Leucovorin) → verstärkt die Wirkung von 5-FU\nF – 5-Fluorouracil (5-FU) → Pyrimidinanalogon, hemmt Thymidylatsynthase\nOX – Oxaliplatin → Platinderivat, DNA-Quervernetzung\nWeitere Schemata: FOLFIRI (Oxaliplatin ersetzt durch Irinotecan), CAPOX\n(Capecitabin + Oxaliplatin)\n\nEKG-Interpretation: AV-Block III°\nF: (EKG mit AV-Block III° und HF 26/min) – Interpretieren Sie das EKG von Anfang\nan.\nA:\nSystematische EKG-Auswertung:\n1. Rhythmus: Unregelmäßig? Regelmäßig?\no P-Wellen vorhanden und regelmäßig (Sinusrhythmus der Vorhöfe)\no QRS-Komplexe regelmäßig, aber unabhängig von den P-Wellen → AVDissoziation\n2. Herzfrequenz: ~26/min → Bradykardie (Kammerersatzrhythmus)\n3. Lagetyp: ie) vs. schleichend (atypische Pneumonie)\nVorerkrankungen, Immunstatus\n\nKörperliche Untersuchung: | Methode | Befund bei Pneumonie | |—|—| | Auskultation |\nFeinblasige Rasselgeräusche, Bronchialatmen, Knistern; Zeichen der Konsolidierung:\nBronchophonie (Stimmübertragung auf Lunge) | | Palpation | Verstärkter Stimmfremitus\n(über konsolidiertem Areal) | | Perkussion | Gedämpfter Klopfschall (Konsolidierung,\nPleuraerguss) |\nLabor: | Parameter | Bedeutung | |—|—| | Großes Blutbild | Leukozytose (bakteriell),\nLeukopenie (viral/schwere Sepsis) | | CRP | Entzündungsmarker (erhöht bei bakterieller\nPneumonie) (von der Kandidatin vergessen) | | Procalcitonin (PCT) | Bakterielle Infektion;\nauch zur Therapiesteuerung (Antibiotika absetzen) | | Laktat | Schweregrad, Sepsis | |\nBlutgasanalyse | Oxygenierung, Ventilation | | Elektrolyte (Na⁺ ) | Hyponatriämie bei\nLegionellen-Pneumonie (SIADH) | | Kreatinin, Harnstoff | Nierenfunktion,\nMedikamentendosierung | | Leberenzyme | Atypische Pneumonie (Legionellen →\nHepatitis möglich) | | Blutkulturen (×2) | Erregernachweis bei stationärer/schwerer\nPneumonie | | Urin-Antigentest | Legionellen, Pneumokokken | | Sputumkultur |\nErregernachweis und Resistenzbestimmung |\nF: Wenn Kreatinin niedrig ist, die Kreatinin-Clearance aber rechnerisch hoch\nerscheint – wo sieht man das?\nA: Bei älteren, kachektischen oder sehr schlanken Patienten mit reduzierter\nMuskelmasse. Aufgrund der verminderten Kreatininproduktion ist das Serumkreatinin\ntrotz eingeschränkter Nierenfunktion niedrig. Dadurch kann die GFR/KreatininClearance nach Cockcroft-Gault rechnerisch überschätzt werden → Gefahr der\nÜberdosierung renaler Medikamente. In solchen Fällen ist Cystatin C ein besserer\nMarker der Nierenfunktion.\n\nCRB-65-Score (bzw. CRB-65-Score)\nF: Was ist der CRB-65-Score und was ist sein Sinn?\nA:\nBuchstabe Kriterium\nC\nConfusion (neue Verwirrtheit)\nR\nRespiratory Rate ≥ 30/min\n\nPunkte\n1\n1\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nh gsbericht\nDatum der Prüfung: 05.05.2026 Datum der Nachricht: 05.05.2026 Ergebnis:\nBestanden ✓\nPatientenfall: pAVK (periphere arterielle Verschlusskrankheit)\nPatient: Herr G. Pape, 72 Jahre alt Vorstellung wegen: Krampfartige Schmerzen im\nlinken Unterschenkel nach einer Gehstrecke von ca. 300 Metern, die sich in Ruhe\nbessern (Claudicatio intermittens), kaltes Bein, Paresen und Sensibilitätsstörungen.\nKörperliche Untersuchung: Unauffällig (keine weiteren Angaben des Prüfers\nerforderlich).\nErste Runde\n1. Wichtiges über pAVK und AVK – insbesondere die 6 P\npAVK (periphere arterielle Verschlusskrankheit): Chronische Minderdurchblutung\nder Extremitäten, meist durch Atherosklerose bedingt. Hauptrisikofaktoren: Rauchen,\nDiabetes mellitus, arterielle Hypertonie, Hyperlipidämie.\nStadieneinteilung nach Fontaine:\n Stadium I: Keine Beschwerden, aber Stenose nachweisbar\n Stadium IIa: Schmerzfreie Gehstrecke > 200 m (Claudicatio intermittens)\n Stadium IIb: Schmerzfreie Gehstrecke < 200 m\n Stadium III: Ruheschmerzen\n Stadium IV: Nekrose, Gangrän, Ulzeration\nDie 6 P (klassische Zeichen der akuten arteriellen Ischämie):\n1. Pain – Schmerz\n2. Paleness – Blässe\n3. Pulselessness – Pulslosigkeit\n4. Paresthesia – Parästhesien (Kribbeln, Taubheitsgefühl)\n5. Paralysis – Lähmung (motorisches Defizit)\n6. Prostration (Polar/Poikilothermia) – Kältegefühl, Temperatursenkung\nWichtig: Das Vorhandensein von Paresen und Sensibilitätsstörungen beim\nPatienten deutet auf ein fortgeschrittenes Stadium hin (akute Ischämie /\nStadium III–IV) → Notfall!\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n2. Differenzialdiagnosen\n Tiefe Venenthrombose (TVT) – Schwellung, Überwärmung, Rötung, Homan-\nZeichen\n Spinale Stenose / Claudicatio spinalis – Rückenschmerzen, Besserung durch\nVorneigen\n Diabetische Polyneuropathie – symmetrische Sensibilitätsstörungen,\nstrumpfförmig\n Chronisches Kompartmentsyndrom – Belastungsschmerz, Druckgefühl\n Thrombangitis obliterans (Morbus Buerger) – junge Raucher, distale Gefäße\nbetroffen\n Embolie – akutes Auftreten, Vorhofflimmern als Ursache häufig\n3. Weitere diagnostische Maßnahmen\n Knöchel-Arm-Index (ABI/KAI): < 0,9 pathologisch; < 0,5 kritische Ischämie\n Doppler-/Duplexsonographie: Visualisierung der Gefäße, Flussmessung\n CT-Angiographie / MR-Angiographie: Genaue Lokalisation der Stenose/des\nVerschlusses\n Konventionelle Angiographie: Goldstandard, auch therapeutisch (PTA, Stent)\n Labor: BB, Gerinnung, CRP, Kreatinin, Lipide, HbA1c, D-Dimere\n4. TVT – Zeichen und Therapie\nZeichen der tiefen Venenthrombose:\n Schwellung der betroffenen Extremität (Umfangsdifferenz)\n Überwärmung und Rötung\n Ziehende Schmerzen, Spannungsgefühl\n Homan-Zeichen: Wadenschmerz bei Dorsalflexion des Fußes (wenig spezifisch)\n Lowenberg-Zeichen: Schmerz bei Manschettendruck über der Wade\n Meyer-Druckpunkt: Druckschmerz über dem medialen Unterschenkel\n Erhöhte D-Dimere im Labor\n Diagnose: Kompressionssonographie (Mittel der Wahl)\nTherapie der TVT:\n Akuttherapie: Antikoagulation mit niedermolekularem Heparin (NMH) oder\nFondaparinux subkutan\n Langzeittherapie: Überleitung auf direkte orale Antikoagulanzien (DOAKs, z. B.\nRivaroxaban, Apixaban) oder Vitamin-K-Antagonisten (z. B. Phenprocoumon) für\nmindestens 3–6 Monate (je nach Ursache ggf. länger)\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Kompressionstherapie: Kompressionsstrümpfe Klasse II zur Vermeidung eines\npostthrombotischen Syndroms\n Bei Beckenvenenthrombose: ggf. Thrombolyse oder Thrombektomie erwägen\n Mobilisierung unter Antikoagulation\nZweite Runde\n5. COPD – Ätiologie, GOLD-Klassifikation, wichtige Symptome\nDefinition: Chronisch-obstruktive Lungenerkrankung – progrediente, nicht vollständig\nreversible Atemwegsobstruktion.\nÄtiologie:\n Hauptursache: Zigarettenrauchen (ca. 90 % der Fälle)\n Weitere: Luftverschmutzung (Feinstaub, Berufsexposition), Alpha-1-Antitrypsin-\nMangel (genetisch), rezidivierende Atemwegsinfekte in der Kindheit\nSymptome (AHA-Trias):\n Atmot (Dyspnoe) – anfangs bei Belastung, später in Ruhe\n Husten (chronisch, produktiv)\n Auswurf (Sputum, meist morgens)\n Später: Zyanose, Fassthorax, Lippenbremse, verlängertes Exspirium, Kachexie\nGOLD-Klassifikation (nach FEV₁ /FVC < 0,7):\nGOLD-Grad Schweregrad FEV₁ (% Soll)\nI Leicht ≥ 80 %\nII Mittelgradig 50–79 %\nIII Schwer 30–49 %\nIV Sehr schwer < 30 %\n(Zusätzlich wird die Symptomlast mit dem mMRC- oder CAT-Score erhoben →\nEinteilung in Gruppen A–D)\n6. Spirometrie vs. Bodyplethysmographie\nSpirometrie:\n Misst: FEV₁ (forciertes exspiratorisches Volumen in 1 Sekunde), FVC (forcierte\nVitalkapazität), FEV₁ /FVC-Quotient (Tiffeneau-Index)\n Bei Obstruktion: FEV₁ /FVC < 0,7\n Einfach durchführbar, günstig\n Kann intrathorakales Residualvolumen nicht messen\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nBodyplethysmographie:\n Misst zusätzlich: Residualvolumen (RV), totale Lungenkapazität (TLC),\nAtemwegswiderstand (Raw)\n Ermöglicht Nachweis von Überblähung (erhöhtes RV und TLC) → typisch für\nEmphysem\n Aufwendiger, braucht eine Messkabine\nMerksatz: Spirometrie = Flussvolumen; Bodyplethysmographie = Flussvolumen +\nLungenvolumina + Resistance.\n7. Asthma bronchiale – Definition und Ätiologie\nDefinition: Chronisch-entzündliche Erkrankung der Atemwege mit reversibler\nObstruktion, bronchialer Hyperreagibilität und typischen Symptomen (Dyspnoe, Giemen,\nHusten, Engegefühl). Im Gegensatz zur COPD ist die Obstruktion reversibel (spontan\noder durch Therapie).\nÄtiologie:\n Allergisch (extrinsisch): Typ-I-Allergie (IgE-vermittelt), häufig bei Kindern und\nJugendlichen; Auslöser: Pollen, Hausstaubmilben, Tierhaare, Schimmelpilze\n Nicht-allergisch (intrinsisch): Infekte (viral), Kälte, körperliche Belastung,\nStress, Acetylsalicylsäure (Analgetika-Asthma)\n Mischformen (häufig)\n Genetische Prädisposition; atopischer Formenkreis (Asthma, allergische Rhinitis,\nNeurodermitis)\n8. EKG – Hinterwandinfarkt\nLokalisationszeichen im EKG:\nInfarktlokalisation Ableitungen mit Veränderungen\nHinterwand (inferior) II, III, aVF\nVorderwand (anterior) V1–V4\nSeitenwand (lateral) I, aVL, V5–V6\nPosterolateral V7–V9 (spiegelbildliche Veränderungen in V1–V3)\nTypische EKG-Zeichen beim Hinterwandinfarkt (Ableitungen II, III, aVF):\n Akutphase: ST-Hebung (STEMI) oder ST-Senkung (NSTEMI)\n Entwicklung: pathologisches Q (Pardee-Q), T-Negativierung\n In V1–V3: spiegelbildliche ST-Senkungen (reciproke Veränderungen)\nEs waren nur Extremitätenableitungen vorhanden – weitere Ableitungen:\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Extremitätenableitungen (Standard): I, II, III (bipolar nach Einthoven) + aVR,\naVL, aVF (unipolar nach Goldberger)\n Brustwandableitungen (Präkordialableitungen): V1, V2, V3, V4, V5, V6 (nach\nWilson)\n Rechtspräkordiale Ableitungen: V3R, V4R (bei Rechtsherzinfarkt)\n Posterior-Ableitungen: V7, V8, V9 (bei posteriorem/echtem Hinterwandinfarkt)\n Gesamt: 12-Kanal-Standard-EKG = 6 Extremitäten + 6 Brustwand\n9. Weiteres Vorgehen beim Hinterwandinfarkt (STEMI)\n Sofortmaßnahmen (MONA-Schema):\no Morphin i.v. (bei starken Schmerzen, titriert)\no Oxygen (O₂ ) – nur wenn SpO₂ < 94 %\no Nitrate – sublingual (Kontraindikation: Hypotonie, Rechtsherzinfarkt!)\no ASS (Acetylsalicylsäure) 300–500 mg i.v. → Handelsname: Aspisol®\n Antikoagulation: Heparin i.v.\n P2Y12-Inhibitor: z. B. Ticagrelor oder Prasugrel (duale Plättchenhemmung)\n Reperfusionstherapie: Primäre perkutane Koronarintervention (PCI) innerhalb\nvon 90 min (Door-to-balloon-Zeit) → Goldstandard\n Alternativ: Thrombolyse, wenn PCI nicht rechtzeitig möglich\n Monitoring: EKG-Monitoring, Blutdruck, SpO₂ , Venenzugang, Laborkontrolle\n10. ASS – Handelsname und Dosierung\n Wirkstoff: Acetylsalicylsäure (ASS)\n Handelsname (i.v.-Präparat): Aspisol®\n Dosierung bei i.v.-Gabe: 300–500 mg (als Bolus, langsam i.v.)\n Wirkmechanismus: Irreversible Hemmung der Cyclooxygenase (COX-1 und\nCOX-2) → Thromboxan-A₂ -Hemmung → Thrombozytenaggregationshemmung\n11. Troponin und LDH – Was sind sie, wo kommen sie vor?\nTroponin:\n Was: Regulatorprotein des Aktomyosin-Komplexes (Muskelkontraktion); Komplex\naus Troponin T, I und C\n Herzspezifisch: kardiales Troponin T (cTnT) und Troponin I (cTnI)\n Vorkommen: Herzmuskelzellen (Kardiomyozyten), in geringem Maß in\nSkelettmuskel\n Klinische Bedeutung: Goldstandard-Biomarker beim Myokardinfarkt; Anstieg 3–\n6 h nach Infarktbeginn, Gipfel nach 12–24 h, erhöht bis zu 2 Wochen\n Hochsensitives Troponin (hs-cTn): bereits 1–3 h nach Symptombeginn\nnachweisbar\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nLDH (Laktatdehydrogenase):\n Was: Intrazelluläres Enzym der Glykolyse; katalysiert die Umwandlung von\nLaktat zu Pyruvat\n Vorkommen: Ubiquitär – Herzmuskel, Skelettmuskel, Erythrozyten, Leber, Niere,\nLunge, Gehirn\n Isoenzyme: LDH-1 (Herz, Erythrozyten), LDH-5 (Leber, Skelettmuskel)\n Klinische Bedeutung: Unspezifischer Marker; beim Myokardinfarkt spät erhöht\n(Anstieg nach 24–48 h, Gipfel nach 3–6 Tagen); auch bei Hämolyse,\nLebererkrankungen, Tumorlyse\nDritte Runde\n12. Untere gastrointestinale Blutung\nDefinition: Blutung distal des Treitz’schen Bandes (Duodenojejunalübergang).\nHäufige Ursachen:\n Divertikelblutung (häufigste Ursache beim Erwachsenen)\n Angiodysplasien\n Kolorektales Karzinom / Polypen\n Colitis ulcerosa / Morbus Crohn\n Hämorrhoiden, Analfissuren\n Infektiöse Kolitis\n Ischämische Kolitis\nSymptome:\n Hämatochezie (frisches Blut im Stuhl)\n Meläna (Teerstuhl) – kann auch bei oberer GI-Blutung auftreten\n Abdominalschmerzen (je nach Ursache)\n Hämodynamische Instabilität bei stärkerem Blutverlust\nDiagnostik:\n Labor: BB, Gerinnung, Blutgruppe/Kreuzprobe, Laktat\n Koloskopie: Mittel der Wahl zur Diagnose und Therapie\n CT-Angiographie: bei aktiver Blutung, wenn Koloskopie nicht möglich\n Szintigraphie: Nachweis intermittierender Blutungen\n13. Bis wohin kann man mit der Koloskopie beurteilen?\nAntwort: Bis zur Ileozökalklappe (Valva ileocaecalis / Bauhin’sche Klappe).\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nBei vollständiger Koloskopie kann das gesamte Kolon sowie das terminale Ileum (einige\nZentimeter über die Ileozökalklappe hinaus) beurteilt werden.\n14. Vorhofflimmern – Klassifikation, Therapie, Antikoagulation\nDefinition: Unkoordinierte atriale elektrische Aktivität mit irregulärer Ventrikelantwort;\nhäufigste anhaltende Herzrhythmusstörung.\nKlassifikation: | Typ | Dauer | |—–|—––| | Erstdiagnose | Erstmalig diagnostiziert | |\nParoxysmal | Terminiert spontan oder durch Intervention ≤ 7 Tage | | Persistierend | > 7\nTage, nicht selbst-terminierend | | Langanhaltend persistierend | > 12 Monate,\nRhythmuskontrolle angestrebt | | Permanent | Rhythmuskontrolle nicht mehr angestrebt |\nTherapie:\n1. Frequenzkontrolle (Ratenkontrolle):\no Betablocker (Metoprolol), Kalziumantagonisten (Verapamil, Diltiazem),\nDigitalis\no Ziel: Herzfrequenz 60–110/min in Ruhe\n2. Rhythmuskontrolle (Kardioversion):\no Elektrische Kardioversion (Defibrillation)\no Pharmakologische Kardioversion: Flecainid, Propafenon (bei strukturell\ngesundem Herz), Amiodaron\no Katheterablation (Pulmonalvenenisolation)\n3. Antikoagulation (zur Schlaganfallprophylaxe):\no DOAKs (z. B. Apixaban, Rivaroxaban, Dabigatran, Edoxaban) – bevorzugt\no Vitamin-K-Antagonisten (z. B. Phenprocoumon) – bei\nMitralklappenstenose oder mechanischen Herzklappen\nWarum Antikoagulation wichtig ist:\n Bei Vorhofflimmern → fehlende atriale Kontraktion → Blutstase im linken Vorhof\n(insbesondere im linken Vorhofohr) → Thrombenbildung → Embolisation →\nischämischer Schlaganfall (5-fach erhöhtes Risiko) und systemische Embolien.\n15. CHA₂ DS₂ -VASc-Score\nZur Abschätzung des Schlaganfallrisikos bei nicht-valvulärem Vorhofflimmern:\nKriterium Punkte\nC – Congestive Heart Failure (Herzinsuffizienz) 1\nH – Hypertension (Hypertonie) 1\nA₂ – Age ≥ 75 Jahre 2\nD – Diabetes mellitus 1\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nKriterium Punkte\nS₂ – Stroke/TIA (Schlaganfall/TIA in der Anamnese) 2\nV – Vascular disease (KHK, pAVK, Aortenplaque) 1\nA – Age 65–74 Jahre 1\nSc – Sex category (weibliches Geschlecht) 1\nEmpfehlung zur Antikoagulation:\n Männer: ≥ 1 Punkt → Antikoagulation empfohlen\n Frauen: ≥ 2 Punkte → Antikoagulation empfohlen\n Score 0 (Männer) / 1 (Frauen): kein erhöhtes Risiko → keine Antikoagulation\nnötig\n16. Katheterablation – Wann?\nIndikationen für die Katheterablation (Pulmonalvenenisolation, PVI):\n Symptomatisches paroxysmales oder persistierendes Vorhofflimmern nach\nVersagen oder Unverträglichkeit von mindestens einem Antiarrhythmikum\n Als Erstlinientherapie bei symptomatischen Patienten mit paroxysmalem VHF\n(Klasse IIa-Empfehlung, je nach Leitlinie)\n Bei Herzinsuffizienz mit reduzierter EF (HFrEF) und VHF kann die Ablation die\nEF verbessern\n Patientenpräferenz nach ausführlicher Aufklärung\nZiel: Elektrische Isolation der Pulmonalvenen (häufigste Trigger-Quelle des VHF) vom\nrestlichen linken Vorhof.\n17. Antiarrhythmika-Gruppen (Vaughan-Williams-Klassifikation)\nKlasse Wirkung Beispiele\nI Na⁺ -Kanal-Blocker Ia: Chinidin, Procainamid; Ib: Lidocain,\nMexiletin; Ic: Flecainid, Propafenon\nII Betablocker Metoprolol, Bisoprolol, Atenolol\nIII K⁺ -Kanal-Blocker Amiodaron, Sotalol, Dronedaron\n(Repolarisationsverlängerung)\nIV Ca²⁺ -Kanal-Blocker Verapamil, Diltiazem\nWeitere Nicht klassifiziert Digitalis (Herzglykosid), Adenosin,\nAtropin\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nAtmosphäre und Ablauf\nDie Kommission war sehr freundlich und die Prüfungsatmosphäre angenehm. Die Prüfer\nhaben sich nicht vorgestellt; die Fachrichtungen sind nicht bekannt. Die Prüfer haben bei\nBedarf geholfen und Hinweise gegeben, um auf die richtige Antwort zu kommen.\nLernquellen\n Amboss\n Eigene Notizen\n Prüfungsprotokolle (sehr wichtig – viele Fragen wiederholen sich)\n Rohjat\nSchlusswort des Kandidaten\n„Die Protokolle sind sehr wichtig, da sich viele Fragen wiederholen. Viel Erfolg an alle!\nEs ist sehr stressig, aber ihr schafft das. Ich hatte auch das Gefühl, dass ich nichts weiß,\naber die Informationen kommen einfach. Bleibt ruhig und macht weiter.“\nErklärung und wichtige Hinweise\nZum Patientenfall (pAVK)\nDie geschilderte Symptomatik – Claudicatio intermittens nach 300 m, Kältegefühl,\nParesen und Sensibilitätsstörungen – entspricht einer akut-auf-chronischen arteriellen\nIschämie und ist als Notfall einzustufen. Die 6 P markieren das klinische Bild der\nakuten Extremitätenischämie. Differenzialdiagnostisch muss eine TVT ausgeschlossen\nwerden, da diese mit Schwellung und Überwärmung einhergeht, während die pAVK eine\nblasse, kühle, pulslose Extremität zeigt.\nZur zweiten Runde (COPD, Asthma, Infarkt)\n COPD vs. Asthma: Wichtigster Unterschied: COPD = irreversible Obstruktion,\nAsthma = reversible Obstruktion. Im EKG immer auf reciproke (spiegelbildliche)\nVeränderungen achten – sie liefern wichtige Hinweise auf den Infarkttyp.\n Troponin vs. LDH: Troponin ist herzspezifisch und der Goldstandard; LDH ist\nunspezifisch und heute klinisch weniger relevant für die Akutdiagnostik des\nInfarkts, aber noch immer prüfungsrelevant.\n Aspisol® ist das einzige i.v.-Präparat von ASS in Deutschland – relevanter\nPrüfungsklassiker.\nZur dritten Runde (GI-Blutung, Vorhofflimmern)\n Koloskopie kann bis ins terminale Ileum reichen – wichtig für den Nachweis\neiner Blutungsquelle im Bereich der Ileozökalklappe.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n CHA₂ DS₂ -VASc-Score ist essenziell für die Entscheidung zur Antikoagulation –\nauswendig lernen!\n Katheterablation ist keine Erstlinientherapie für alle Patienten, sondern wird bei\nVersagen der medikamentösen Therapie oder auf Patientenwunsch erwogen.\n Die Vaughan-Williams-Klassifikation der Antiarrhythmika ist ein häufiges\nPrüfungsthema – Klasse I–IV + Sonderstellung von Digitalis und Adenosin\nmerken.\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nFall 24\nPrüfungsprotokoll – Kenntnisprüfung\nNachrichtendatum 06.05.2026\nPrüfungsdatum 05.05.2026, 13:15 Uhr\nErgebnis Bestanden (zweiter Versuch)\nPrüfer 2 Professoren und eine junge Ärztin mit osteuropäischem Akzent\nHauptfälle (Patientenvorstellung)\nDiagnosen: Cholezystitis, Herzinsuffizienz, periphere arterielle Verschlusskrankheit\n(pAVK)\nAnamnese\nVerlief unauffällig, keine Besonderheiten.\nKörperliche Untersuchung\n Blutdruckmessung: Konnte nicht durchgeführt werden – Manschette scheinbar\ndefekt (Patientin bestätigte, dass es zuvor noch funktioniert hatte). Prüfer\nentschied, die Messung wegzulassen, um keine Zeit zu verlieren.\n Abdominelle Untersuchung: Positives Murphy-Zeichen bei der Patientin.\n Reihenfolge der Untersuchung: Kandidat begann nach der\nAbdomenuntersuchung mit dem Kopf. Prüfer korrigierte: Bei dieser Patientin\nmüsse als nächstes die Thorax- und kardiale Untersuchung folgen (aufgrund\nder bekannten Herzinsuffizienz und pAVK).\n Munduntersuchung: Prüfer wies darauf hin, dass auch unter der Zunge\ninspiziert werden muss, um eine Malignität (z. B. Mundbodenkarzinom) nicht zu\nübersehen.\n Sonstige Untersuchungen: Nicht mehr möglich – keine Zeit übrig.\nFragerunden", "clinical_case": "**Hauptsymptom:** Fall 23\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 23. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_24": {"case_info": "Fall 24\nPrüfungsprotokoll – Kenntnisprüfung\nNachrichtendatum\nPrüfungsdatum\nErgebnis\nPrüfer\n\n06.05.2026\n05.05.2026, 13:15 Uhr\nBestanden (zweiter Versuch)\n2 Professoren und eine junge Ärztin mit osteuropäischem Akzent\n\nHauptfälle (Patientenvorstellung)\nDiagnosen: Cholezystitis, Herzinsuffizienz, periphere arterielle Verschlusskrankheit\n(pAVK)\n\nAnamnese\nVerlief unauffällig, keine Besonderheiten.\n\nKörperliche Untersuchung\n\n\n\n\n\n\n\nBlutdruckmessung: Konnte nicht durchgeführt werden – Manschette scheinbar\ndefekt (Patientin bestätigte, dass es zuvor noch funktioniert hatte). Prüfer\nentschied, die Messung wegzulassen, um keine Zeit zu verlieren.\nAbdominelle Untersuchung: Positives Murphy-Zeichen bei der Patientin.\nReihenfolge der Untersuchung: Kandidat begann nach der\nAbdomenuntersuchung mit dem Kopf. Prüfer korrigierte: Bei dieser Patientin\nmüsse als nächstes die Thorax- und kardiale Untersuchung folgen (aufgrund\nder bekannten Herzinsuffizienz und pAVK).\nMunduntersuchung: Prüfer wies darauf hin, dass auch unter der Zunge\ninspiziert werden muss, um eine Malignität (z. B. Mundbodenkarzinom) nicht zu\nübersehen.\nSonstige Untersuchungen: Nicht mehr möglich – keine Zeit übrig.\n\nFragerunden", "runde_1": [], "runde_2": [], "runde_3": [{"q": "F: Strahlenarten – was sind Gamma-, Alpha-, Beta- und Röntgenstrahlen? Schutz?", "a": "A: Strahlenart Natur Alpha (α) Heliumkerne (2p + 2n)"}, {"q": "muss noch wiederholt werden?", "a": "Bei Wissenslücken: Klar sagen „Ich weiß es nicht“ – vermeidet Zeitverlust und wirkt professioneller"}], "clinical_case": "**Hauptsymptom:** Fall 24\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 24. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_25": {"case_info": "Fall 25\nPrüfungsprotokoll – Kenntnisprüfung\nDatum der Nachricht: 06.05.2026 Datum der Prüfung: 05.05.2026, 13:15 Uhr\nErgebnis: ✅Bestanden (2. Versuch) Prüfungskommission: 2 Professoren und eine\njunge Ärztin mit osteuropäischem Akzent\n\nPatientenvorstellung & körperliche Untersuchung\nAnamnese\nUnauffällig, keine Besonderheiten.\n\nKörperliche Untersuchung\n\n\n\n\n\n\nBlutdruckmessung: Nicht möglich – die Manschette war vermutlich defekt (die\nPatientin gab an, dass die Messung zuvor funktioniert hatte). Der Prüfer\nentschied, die Messung wegzulassen, um keine Zeit zu verlieren.\nAbdominelle Untersuchung: Positives Murphy-Zeichen → Hinweis auf\nCholezystitis.\nHinweis des Prüfers: Nach der Abdominaluntersuchung sollte bei dieser\nPatientin als nächstes die Thorax- und Kardialuntersuchung erfolgen (wegen\nbekannter Herzinsuffizienz und pAVK).\nMunduntersuchung: Der Prüfer wies darauf hin, dass auch unter die Zunge\ngeschaut werden muss, um eine mögliche Malignität (z. B. Mundbodenkarzinom)\nzu erkennen.\nFür weitere Untersuchungen blieb keine Zeit.\n\nHauptdiagnosen der Patientin\n1. Cholezystitis (akut, Murphy-Zeichen positiv)\n2. Herzinsuffizienz\n3. pAVK (periphere arterielle Verschlusskrankheit)", "runde_1": [{"q": "Frage 1: Verdachtsdiagnose (VD)?", "a": "Akute Cholezystitis. Klinisch: rechtsseitiger Oberbauchschmerz, positives Murphy-Zeichen, ggf. Fieber und Leukozytose."}, {"q": "Frage 2: Differenzialdiagnosen (DD)?", "a": "       "}, {"q": "beachten?", "a": "    "}, {"q": "Frage 4: Welche Untersuchungen werden durchgeführt?", "a": "     "}, {"q": "Frage 5: Was ist die ERCP?", "a": "ERCP = Endoskopisch Retrograde Cholangiopankreatikographie. Endoskopisches Verfahren zur Darstellung und gleichzeitigen Therapie der Gallenwege"}, {"q": "Frage 6: Was ist die Post-ERCP-Pankreatitis?", "a": "Die häufigste Komplikation der ERCP (~3–5 % der Fälle). Durch mechanische oder chemische Reizung des Pankreasganges kommt es zu einer akuten Pankreatitis. Klinisch: akute Oberbauchschmerzen nach dem Eingriff, Lipase-Anstieg. Risikofaktoren: junges Alter, weibliches Geschlecht, normaler Bilirubin-Spiegel vor ERCP, schwieriger Zugang zur Papille."}, {"q": "Frage 7: Ursachen der akuten Pankreatitis?", "a": "Antwort (Eselsbrücke: „GET SMASHED“):          "}, {"q": "Frage 8: Komplikationen der akuten Pankreatitis?", "a": "  "}, {"q": "Frage 11: Wofür wird Ozempic (Semaglutid) sonst noch eingesetzt?", "a": "  "}, {"q": "Frage 12: Wie führt Semaglutid (GLP-1-RA) zur Gewichtsabnahme?", "a": "  "}, {"q": "Frage 13: Welche Gefahr besteht durch die verzögerte Magenentleerung?", "a": "Aspirationsrisiko – insbesondere perioperativ und bei Sedierung/Anästhesie. Patienten unter GLP-1-RA haben auch nach ausreichender Nüchternheit noch"}, {"q": "Frage 14: Welche neurologische Erkrankung entsteht bei B12-Mangel?", "a": "Funikuläre Myelose (subakute kombinierte Degeneration des Rückenmarks). Durch B12-Mangel → gestörte Myelinsynthese → Demyelinisierung der Hinterstränge und Pyramidenbahnen. Klinik: Sensibilitätsstörungen (Parästhesien, Pallhypästhesie), spastische Paraparese, Ataxie, kognitive Einschränkungen."}, {"q": "Frage 15: Welche Medikamente verursachen B12-Mangel?", "a": "  "}], "runde_2": [{"q": "Frage 16: EKG-Befund – Vorderwandinfarkt. Typische EKG-Zeichen?", "a": "   "}, {"q": "Frage 17: Unterschied STEMI vs. NSTEMI?", "a": "Merkmal EKG"}, {"q": "Frage 18: Behandlung von STEMI / ACS / NSTEMI?", "a": "Allgemeine Maßnahmen (MONA+):       "}, {"q": "Opioide?", "a": "Morphin hat neben der Analgesie folgende kardiovaskuläre Vorteile:   "}, {"q": "hat?", "a": ""}, {"q": "Vorderwandinfarkt auf?", "a": "   "}, {"q": "Frage 22: Wie kommt es zu den Rhythmusstörungen?", "a": "Durch den Infarkt entsteht ein ischämisches Myokard: 1. Ventrikuläre Extrasystolen (VES) als Frühzeichen der ischämischen Irritation 2. VES können auf die vulnerable Phase des Aktionspotenzials fallen (R-on-TPhänomen) → Auslösung von Kammerflimmern 3. Elektrolytverschiebungen (Kalium ↑ in der Ischämiezone), Azidose und Katecholaminausschüttung verstärken die elektrische Instabilität"}, {"q": "Frage 23: Was macht die Ärztekammer?", "a": "Die Ärztekammer ist die berufsständische Selbstverwaltungskörperschaft der Ärzte (Körperschaft des öffentlichen Rechts). Aufgaben:       "}, {"q": "Frage 24: Was ist die Kassenärztliche Vereinigung (KV)?", "a": "Die KV ist die Körperschaft des öffentlichen Rechts, die die vertragsärztliche Versorgung der gesetzlich Versicherten sicherstellt. Aufgaben:      "}], "runde_3": [{"q": "nach einer Koronarangiographie (Coro). Was machen Sie?", "a": "Anamnese erweitern:      "}, {"q": "Vorangehende Punktion an der A. femoralis (Zugang für Coro)?", "a": "Antikoagulation? (Heparin, ASS, Marcumar)"}, {"q": "Blutungszeichen (Hämatom, Hypotonie)?", "a": "Verdachtsdiagnose: Pseudoaneurysma spurium (falsches Aneurysma) der A. femoralis Entsteht nach arterieller Punktion bei unvollständigem Gefäßwandverschluss → Blut tritt aus dem Lumen aus und wird von Bindegewebe eingekapselt → pulsierendes Hämatom."}, {"q": "Frage 26: Welche Diagnostik beim Pseudoaneurysma spurium?", "a": ""}, {"q": "Frage 27: Behandlung des Pseudoaneurysma spurium?", "a": "   "}, {"q": "Frage 28: Differenzialdiagnosen der Leistenschwellung?", "a": "        "}, {"q": "Frage 29: Anatomische Unterschiede zwischen Venen und Arterien?", "a": "Merkmal Arterie Wandaufbau 3 Schichten (Intima, Media, Adventitia) Media Dick, muskelreich (Tunica media stark) Lumen Klein, rund Klappen Keine (außer Semilunarklappen am Herzen)"}, {"q": "Frage 30: Welche Clostridien kennen Sie?", "a": "    "}, {"q": "Frage 31: Welche Clostridien sind für Chirurgen besonders relevant?", "a": "Chirurgisch relevant (wegen Wundinfektionen und lebensbedrohlichen postoperativen Komplikationen): 1. C. perfringens → Gasbrand (Gasgangrän): o Tritt auf nach traumatischen Wunden, Amputationen, Darmoperationen o Produziert Lecithinase (Alpha-Toxin) → Gewebsnekrose, Hämolyse o Klinik: rapid progrediente Myonekrose, Krepitation, süßlicher Geruch, Schock o Therapie: sofortiges radikales chirurgisches Débridement + Penicillin G, ggf. hyperbare Sauerstofftherapie 2. C. difficile → Postoperative pseudomembranöse Kolitis: o Häufig nach Antibiotikagabe → Disruption der Darmflora → C. difficileÜberwucherung o Klinik: wässriger Durchfall, abdominale Krämpfe, Fieber o Komplikation: toxisches Megakolon → chirurgische Resektion (Kolektomie) notwendig 3. C. tetani → Tetanus: o Wundkontamination (z. B. Stichverletzungen, Traumata) o Tetanospasmin → Hemmung inhibitorischer Neurone → Krampfanfälle, Opisthotonus o Prophylaxe: Impfung (präoperativ prüfen!) Nicht primär chirurgisch (aber erwähnenswert):"}, {"q": "Frage 32: Was machen Clostridien? Warum sind sie so gefährlich?", "a": "  "}], "clinical_case": "**Hauptsymptom:** Plötzlich einsetzende, intensive epigastrische Schmerzen mit Ausstrahlung in den Rücken\n\n**Anamnese:** Ein 52-jähriger Mann mit bekannter Cholelithiasis stellt sich mit plötzlich einsetzenden, intensiven epigastrischen Schmerzen vor, die in den Rücken ausstrahlen. Der Schmerz begann vor 4 Stunden. Der Patient berichtet von Übelkeit, Erbrechen und Diarrhoe. Er konsumiert täglich 60g Alkohol. Keine Fieber, aber erhebliches Unwohlsein.\n\n**Klinische Befunde:** Allgemeinzustand: akut erkrankt. RR 142/85, HR 110/min, Temperatur 37,9°C. Abdominell: erheblicher Epigastriumschmerz, Peritonismus im Oberbauch, Rebound-Phänomen, Cullen-Zeichen negativ, Grey-Turner-Zeichen negativ. Darmgeräusche leise.\n\n**Diagnostische Kriterien:**\n• Serum-Amylase und Lipase (mindestens 3x Obergrenze)\n• Transaminasen und alkalische Phosphatase (Cholestase?)\n• Blutglukose, Kalzium, Blutgasanalyse\n• Bildgebung: Abdominal-Ultraschall oder CT\n\n**Therapie:**\n• Konservativ: NPO, i.v. Volumengabe, Elektrolytausgleich\n• Analgesie (Metamizol, ggf. Opioide)\n• Antibiotika nur bei Infektion/schwerer Pankreatitis\n• Behandlung der zugrunde liegenden Ursache (Gallensteine, Alkohol)\n"}, "Fall_26": {"case_info": "Fall 26\nKenntnisprüfung – Protokoll\nNachrichtendatum: 06.05.2026\nPrüfungsdatum: 05.05.2026\nErgebnis: Bestanden (zweiter Versuch)\nPrüfungskommission: Zwei Professoren und eine junge Ärztin mit osteuropäischem\nAkzent\n\nPraktischer Teil – Patientenuntersuchung\nHauptdiagnosen der Patientin: Cholezystitis, Herzinsuffizienz, pAVK\n\nAnamnese\nUnauffällig, keine Besonderheiten.\n\nKörperliche Untersuchung\n\n\n\n\n\n\nBlutdruckmessung: Konnte nicht durchgeführt werden – vermutlich defekte\nManschette. Die Patientin gab an, dass die Messung zuvor möglich war. Der\nPrüfer entschied, die Messung zu überspringen, um keine Zeit zu verlieren.\nAbdominelle Untersuchung: Positives Murphy-Zeichen (Hinweis auf\nCholezystitis).\nHinweis des Prüfers: Nach der Abdominaluntersuchung sollte bei dieser\nPatientin (Herzinsuffizienz, pAVK) als nächstes die Thorax- und\nKardialuntersuchung folgen – nicht der Kopf.\nWichtiger Hinweis zur Munduntersuchung: Der Prüfer betonte ausdrücklich,\ndass bei der Inspektion der Mundhöhle auch unter die Zunge geschaut werden\nmuss, um ein Malignom (z. B. Mundbodenkarzinom) nicht zu übersehen.\nFür weitere Untersuchungen blieb keine Zeit.\n\n1. Fragenrunde – Gastroenterologie / Diabetologie / Neurologie\nCholezystitis / Oberbauchschmerz\nVerdachtsdiagnose?\nCholezystitis (akut), bei positivem Murphy-Zeichen und typischer Klinik.\nDifferenzialdiagnosen (DD)?\nCholedocholithiasis, akute Pankreatitis, peptisches Ulkus, Appendizitis (atypisch),\nHerzinfarkt (atypisch, besonders bei Frauen), Pneumonie (basale rechtsseitige),\nPleuritis, Nierenkolik (rechts).\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nWelche DD besonders bei Frauen?\nExtrauteringravidität (Eileiterschwangerschaft), Adnexitis, Ovarialtorsion, Ovarialzyste –\ndiese müssen gynäkologisch ausgeschlossen werden.\nWelche Untersuchungen?\n\n\n\n\n\nLabor: BB, CRP, Lipase, Amylase, Leberenzyme (GOT, GPT, GGT, AP), Bilirubin,\nGerinnung, Urinstatus, β-HCG (bei Frauen im gebärfähigen Alter)\nBildgebung: Abdomensonographie (erste Wahl), ggf. CT Abdomen\nEKG (zum Ausschluss eines Herzinfarkts)\nGynäkologische Untersuchung bei Verdacht auf gynäkologische Ursache\n\nWas ist ERCP?\nEndoskopisch-retrograde Cholangiopankreatikographie – ein endoskopisches Verfahren,\nbei dem über ein Duodenoskop die Papilla Vateri sondiert wird, um Gallengänge und\nPankreasgang darzustellen. Es dient sowohl der Diagnostik als auch der Therapie (z. B.\nSteinextraktion, Stenteinlage).\nPost-ERCP-Pankreatitis?\nDie häufigste Komplikation der ERCP (ca. 3–5 % der Fälle). Entsteht durch\nmechanische oder chemische Irritation des Pankreasgangs. Klinik: Bauchschmerzen,\nLipaseanstieg > 3× Norm nach dem Eingriff. Therapie: Nahrungskarenz, i.v. Flüssigkeit,\nSchmerztherapie.\nUrsachen der akuten Pankreatitis?\n\n\n\nHäufigste Ursachen (> 80 %): Gallensteine (biliäre Pankreatitis) und Alkohol\nWeitere: Hypertriglyzeridämie, Hyperkalzämie, Medikamente (z. B. Azathioprin,\nValproat), ERCP, Trauma, Mumps, idiopathisch\n\nKomplikationen der akuten Pankreatitis?\n\n\n\n\nLokal: Pseudozyste, Nekrose, Abszess, Pankreasblutung\nSystemisch: ARDS (Schocklunge), akutes Nierenversagen, Sepsis,\nMultiorganversagen, DIC\nSchwere Verlaufsform: nekrotisierende Pankreatitis (hohe Mortalität)\n\nWelcher klinische Befund wurde angesprochen (warme Flasche → Verbrennung)?\nDer Prüfer beschrieb, dass Patienten mit chronischen Bauchschmerzen (z. B. bei\nchronischer Pankreatitis) häufig eine Wärmflasche benutzen und durch\nSchlafeinwirkung Verbrennungen erleiden. Das Muster aus netzartig-fleckigen\nHautveränderungen durch chronische Wärmeexposition nennt sich Erythema ab igne\n(auch: Feuermal oder Livedo reticularis e calore). Es kann ein Hinweis auf chronischen\nSchmerz und chronische Pankreatitis sein.\n\nAntidiabetika\nWelche Antidiabetika werden am häufigsten eingesetzt?\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nMetformin (Biguanid) – Mittel der ersten Wahl bei Typ-2-Diabetes\nGLP-1-Rezeptoragonisten (z. B. Semaglutid = Ozempic, Liraglutid = Victoza)\nSGLT-2-Inhibitoren (z. B. Empagliflozin, Dapagliflozin)\nDPP-4-Inhibitoren (Gliptine, z. B. Sitagliptin)\nSulfonylharnstoffe (z. B. Glibenclamid) – weniger gebräuchlich wegen\nHypoglykämiegefahr\nInsulin (bei insulinpflichtigem Diabetes)\n\nWofür wird Ozempic (Semaglutid) sonst noch eingesetzt?\n\n\n\n\nAdipositas-Therapie / Gewichtsreduktion (unter dem Handelsnamen Wegovy\nbei höherer Dosierung)\nKardiovaskuläre Risikoreduktion bei Typ-2-Diabetes\nIn klinischen Studien auch bei NASH/MASH (nicht-alkoholische Steatohepatitis)\n\nWie führt Ozempic zur Gewichtsabnahme?\nSemaglutid wirkt als GLP-1-Rezeptoragonist und bewirkt:\n1. Verzögerte Magenentleerung (Gastroparese-ähnlich) → längeres\nSättigungsgefühl\n2. Zentrale Appetitreduktion über Hypothalamus-Rezeptoren\n3. Verminderte Nahrungsaufnahme insgesamt\nWas ist die Gefahr der verzögerten Magenentleerung?\nAspirationsrisiko – besonders bei Narkose/Sedierung. Patienten unter GLP-1Agonisten sollten präoperativ länger nüchtern bleiben (aktuelle Empfehlung: mindestens\n6 h für feste Speisen, ggf. Pausierung des Medikaments vor elektiven Eingriffen).\n\nNeurologie / B12-Mangel\nWelche neurologische Krankheit entsteht bei B12-Mangel?\nFunikuläre Myelose (subakute kombinierte Degeneration des Rückenmarks) –\nDemyelinisierung der Hinterstränge (Tiefensensibilität ↓) und der Pyramidenbahn\n(Spastik, Hyperreflexie). Klinik: Ataxie, Pallhypästhesie, Parästhesien, positive\nRomberg-Zeichen.\nWelche Medikamente verursachen B12-Mangel?\n\n\n\n\nMetformin – hemmt die aktive Aufnahme von B12 im terminalen Ileum (über den\nIntrinsic-Factor-Komplex)\nProtonenpumpenhemmer (PPI) – reduzieren die Magensäure, die für die\nFreisetzung von proteingebundenem B12 aus der Nahrung notwendig ist\nWeitere: H2-Antagonisten, Colchicin, bestimmte Antibiotika (z. B.\nChloramphenicol)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n2. Fragenrunde – Kardiologie / EKG\nEKG: Vorderwandinfarkt\nEKG-Befund: Vorderwandinfarkt (STEMI anterior) – ST-Hebungen in V1–V4, ggf. V5;\nreciproke ST-Senkungen in II, III, aVF.\nBehandlung des STEMI?\n\n\n\n\n\n\nPrähospital: Aspirin (300 mg p.o.), Heparin i.v., Nitro (wenn kein Schock),\nMorphin i.v., O₂ (bei SpO₂ < 90 %), Beta-Blocker (i.v., wenn keine KI)\nKausal: Primäre perkutane Koronarintervention (PCI) innerhalb von 90–120\nMinuten (Door-to-Balloon-Zeit)\nFalls PCI nicht rechtzeitig möglich: Thrombolyse (Lysetherapie)\nAntikoagulation: Heparin, ggf. Bivalirudin\nDuale Thrombozytenaggregationshemmung (DAPT): Aspirin + P2Y12Inhibitor (Ticagrelor oder Prasugrel bevorzugt gegenüber Clopidogrel)\n\nBehandlung des ACS allgemein?\nMONA-BAS: Morphin, O₂ , Nitrat, Aspirin – Beta-Blocker, Antikoagulation, Statin\nNSTEMI vs. STEMI – Unterschied?\nKriterium\nEKG\nKoronararterie\nTroponin\nDringlichkeit\nPCI\nInfarktgröße\n\nSTEMI\nST-Hebungen ≥ 1 mm\nin ≥ 2 Ableitungen\nKomplette Okklusion\nErhöht\nSofort (< 90–120 min)\n\nNSTEMI\nKeine ST-Hebungen; ST-Senkungen, TNegativierungen oder unauffäl ei Behandlungsfehlern\n Interessensvertretung der Ärzteschaft gegenüber Politik\nWas ist die Kassenärztliche Vereinigung (KV)?\nDie KV ist eine Körperschaft des öffentlichen Rechts, die die vertragsärztliche\nVersorgung (GKV-Patienten) sicherstellt. Aufgaben:\n Sicherstellung der ambulanten Versorgung (Sicherstellungsauftrag)\n Abrechnung der ärztlichen Leistungen mit den Krankenkassen\n Honorarverteilung an die niedergelassenen Vertragsärzte\n Zulassung und Niederlassung von Vertragsärzten\n Qualitätssicherung im ambulanten Bereich\n Mitgliedschaft: Pflicht für alle niedergelassenen Vertragsärzte (nicht für rein\nprivatärztlich tätige Ärzte)\n3. Fragenrunde – Chirurgie / Infektiologie\nFall: 77-jährige Patientin mit Leistenschwellung nach Koronarangiographie\nVorgeschichte: Seit 2 Wochen bestehende Schwellung in der Leiste, nach einer\nKoronarangiographie (Coro = Herzkatheter, transfemoraler Zugang).\nWas tun Sie?\nZunächst erweiterte Anamnese (Beginn der Schwellung, Schmerzen,\nWachstumstendenz, Pulsation, Wärme, Hautveränderungen, Antikoagulation?) und\nvollständige körperliche Untersuchung der Leiste und der Extremität.\nDiagnose: Pseudoaneurysma (Aneurysma spurium)\nEntsteht nach arterieller Punktion (z. B. A. femoralis beim Herzkatheter) durch\nunvollständigen Verschluss der Gefäßwand → paravasale Blutansammlung mit\npulsierender Verbindung zum Gefäßlumen. Klinik: pulsierende Schwellung, Schwirren\n(Bruit), Druckschmerz.\nWelche Diagnostik?\n Duplexsonographie (Doppler-Ultraschall) – Mittel der ersten Wahl: Nachweis\ndes Blutflusses im Pseudoaneurysma (charakteristisches Yin-Yang-Muster),\nVerbindung zur A. femoralis\n CT-Angiographie (bei unklaren Befunden oder vor Intervention)\nBehandlung?\nOption Indikation\nKonservativ Kleines, stabiles Pseudoaneurysma (< 2 cm):\nKompression, Bettruhe, Beobachtung – oft spontaner\nVerschluss\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nOption Indikation\nUltraschallgesteuerte Mitte
