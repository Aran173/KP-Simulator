• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_49": {"case_info": "Fall 49\nPrüfungsprotokoll\nDatum der Nachricht: 08. Mai 2026 Prüfungsdatum: nicht angegeben\n\n1. Runde – Antikoagulation\nThema: Antikoagulanzien\nErklärung der Wirkstoffgruppen (Wirkmechanismus, Beispiele, Kontrolle,\nBesonderheiten):\n\n\n\n\n\nHeparine: Verstärken die Wirkung von Antithrombin III → Hemmung von\nThrombin (IIa) und Faktor Xa. Kontrolle: aPTT (bei unfraktioniertem Heparin).\nBeispiele: Unfraktioniertes Heparin (UFH), niedermolekulare Heparine (NMH, z. B.\nEnoxaparin).\nVitamin-K-Antagonisten (VKA): Hemmen die Synthese der vitamin-Kabhängigen Gerinnungsfaktoren (II, VII, IX, X) in der Leber. Kontrolle: INR.\nBeispiel: Phenprocoumon (Marcumar).\nDirekte orale Antikoagulanzien (DOAKs): Hemmen direkt einzelne\nGerinnungsfaktoren – entweder Thrombin (z. B. Dabigatran) oder Faktor Xa (z. B.\nRivaroxaban, Apixaban, Edoxaban). Keine routinemäßige Gerinnungskontrolle\nerforderlich.\n\nIndikationen für DOAKs:\n\n\n\n\nThromboseprophylaxe bei Vorhofflimmern\nTherapie und Prophylaxe der tiefen Venenthrombose (TVT)\nTherapie und Prophylaxe der Lungenarterienembolie (LAE)\n\nFrage: Warum sind DOAKs gegenüber Vitamin-K-Antagonisten bevorzugt?\nVKA hemmen die vitamin-K-abhängigen Gerinnungsfaktoren in der Leber und erfordern\nregelmäßige INR-Kontrollen sowie eine aufwändige Dosisanpassung. DOAKs hingegen\nhaben eine vorhersehbare Pharmakodynamik, benötigen keine routinemäßigen\nGerinnungskontrollen, haben weniger Wechselwirkungen mit Nahrungsmitteln und\nMedikamenten und besitzen ein günstigeres Sicherheitsprofil in Bezug auf\nBlutungskomplikationen (insbesondere intrakranielle Blutungen). Außerdem ist bei VKA\nvor Operationen häufig ein Bridging notwendig.\n\nFrage: Was bedeutet Bridging?\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nWenn eine elektive Operation geplant ist und der Patient VKA einnimmt, werden diese\nabgesetzt (Cumarine haben eine lange Halbwertszeit). Überbrückend wird Heparin\ngegeben – bis kurz vor der Operation. Nach dem Eingriff wird Heparin fortgeführt, bis die\nVKA wieder therapeutisch wirksam sind (INR im Zielbereich).\n\nFrage: Machen wir immer Bridging bei Operationen?\nNein. Bridging ist nur indiziert, wenn ein erhöhtes thromboembolisches Risiko besteht (z.\nB. mechanische Herzklappen, kürzliche TVT/LAE, Vorhofflimmern mit hohem\nCHA₂ DS₂ -VASc-Score). Die Entscheidung erfolgt individuell unter Berücksichtigung\ndes Thrombose- und Blutungsrisikos sowie des aktuellen INR-Werts.\n\n2. Runde – Onkologie & Kardiologie\nThema: Häufige Tumoren\nFrage: Welche Tumoren kennen Sie und wie wollen Sie sie ordnen?\nEinteilung nach Häufigkeit und Geschlecht (Inzidenz in Deutschland, ungefähre\nAngaben):\nRang\n1\n2\n3\n\nMänner\nProstatakarzinom (~25 %)\nLungenkarzinom (~15 %)\nKolorektales Karzinom (~12 %)\n\nFrauen\nMammakarzinom (~30 %)\nKolorektales Karzinom (~12 %)\nLungenkarzinom (~10 %)\n\n(Der Prüfer bestätigte grobe Prozentzahlen als annähernd richtig.)\n\nThema: Kolorektales Karzinom (KRK)\nFrage: Welche Einteilung gibt es (anatomische Lokalisation)?\n\n\n\n\n\nRektumkarzinom: ca. 50 %\nSigmakarzinom: ca. 30 %\nColon descendens und transversum: ca. 10 %\nColon ascendens und Zäkum: ca. 10 %\n\nFrage: Ab welchem Abstand (ab Anokutanlinie) spricht man von einem\nSigmakarzinom?\nAb einem Abstand von ca. 12–16 cm von der Anokutanlinie. Tumoren unterhalb von 16\ncm werden als Rektumkarzinom klassifiziert. (Prüfer bestätigte: „Richtig, etwa 12–16\ncm.“)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nThema: Diagnostik und Staging beim KRK\nFrage: Was ist der Goldstandard für die Diagnose?\nKoloskopie mit Biopsie und anschließender histologischer Aufarbeitung.\n\nFrage: Was kommt nach der Diagnose?\nStaging zur Bestimmung der Tumorausdehnung (TNM-Klassifikation).\n\nFrage: Wie führen Sie das Staging durch?\n\n\n\n\n\n\nSonographie Abdomen (Lebermetastasen, Lymphknoten)\nRöntgen-Thorax (Lungenmetastasen)\nEndosonographie (lokale Tumortiefe, v. a. beim Rektumkarzinom)\nCT Thorax/Abdomen/Becken (Fernmetastasen, Lymphknoten)\nMRT des Beckens (besonders wichtig beim Rektumkarzinom)\n\nFrage: Warum MRT des Beckens?\nDas MRT des Beckens ist beim Rektumkarzinom essenziell zur präzisen Beurteilung der\nTumorausdehnung (T-Stadium), des mesorektalen Faszienabstands (zirkumferentieller\nResektionsrand, CRM), des Lymphknotenbefalls (N-Stadium) sowie zur\nTherapieplanung (z. B. ob eine neoadjuvante Radiochemotherapie notwendig ist). Es\nermöglicht eine genaue TNM-Klassifikation und beeinflusst die Operationsstrategie\ndirekt.\n\nThema: Aufklärung zur Koloskopie\nFrage: Was sagen Sie dem Patienten bei der Aufklärung zur Koloskopie?\nAufklärung umfasst:\n\n\n\n\n\n\nIndikation: Warum wird die Untersuchung durchgeführt?\nAblauf: Vorbereitung (Darmreinigung mit Abführlösung, z. B. Polyethylenglykol),\nNüchternheit, Sedierung (z. B. Propofol), Einführen des Endoskops über den\nAfter, Inspektion der Darmschleimhaut bis zum Zäkum bzw. terminalem Ileum,\nggf. Polypenabtragung oder Biopsie.\nKomplikationen: Blutung (insbesondere nach Polypektomie), Perforation,\nKreislaufreaktionen, Unverträglichkeit der Sedierung.\nAlternativen: CT-Kolonographie, Sigmoidoskopie, Kapselendoskopie.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nThema: Therapie des Rektumkarzinoms\nFrage: Der Patient hat einen Tumor im Rektum. Was machen Sie?\nTherapieentscheidung in der interdisziplinären Tumorkonferenz (Anmeldung und\nVorstellung des Falls). Das weitere Vorgehen richtet sich nach dem Tumorstadium:\n\n\n\n\nStadium I (T1–T2, N0, M0): Primäre chirurgische Resektion (z. B. tiefe anteriore\nRektumresektion oder abdominoperineale Rektumexstirpation je nach\nTumorhöhe). Ggf. lokale Exzision bei sehr frühen Tumoren (T1, low risk).\nStadium II–III (T3–T4 oder N+): Neoadjuvante Radiochemotherapie (RCT) vor\nder Operation, dann chirurgische Resektion, dann adjuvante Chemotherapie.\nStadium IV (M1): Individualisiertes, multimodales Konzept (systemische\nTherapie, ggf. Metastasenresektion).\n\nFrage: Was ist der Sinn der neoadjuvanten Therapie?\n\n\n\n\n\nTumorverkleinerung (Downstaging/Downsizing): Verbesserung der\nResektabilität\nR0-Resektion ermöglichen: Erhöhung der Wahrscheinlichkeit einer\nvollständigen Tumorentfernung (freier Resektionsrand)\nReduktion des Lokalrezidivrisikos (vom Prüfer besonders betont)\nGgf. Sphinktererhalt durch Tumorverkleinerung\n\nThema: Chemotherapie beim KRK\nFrage: Welche Chemotherapie wird eingesetzt?\nFOLFOX (Standardregime beim kolorektalen Karzinom)\n\nFrage: Wofür stehen die Buchstaben FOLFOX?\n\n\n\n\nFOL → Folinsäure (Leucovorin) – moduliert die Wirkung von 5-FU\nF → 5-Fluorouracil (5-FU) – Antimetabolit, hemmt die Thymidylatsynthase\nOX → Oxaliplatin – Platinderivat, bewirkt DNA-Quervernetzung\n\nThema: EKG – AV-Block III°\nBefund: EKG mit AV-Block III° (totaler AV-Block), Herzfrequenz 26/min.\nEKG-Interpretation (systematisch):\n1. Herzfrequenz: 26/min → Bradykardie\n2. Rhythmus: Irregulärer Kammerrhythmus (Kammerersatzrhythmus), P-Wellen\nund QRS-Komplexe ohne zeitliche Beziehung zueinander\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n3. Lagetyp: Beschreibt die elektrische Herzachse (Richtung des mittleren QRSVektors in der Frontalebene). Unterschieden werden: Linkstyp, Steiltyp,\nIndifferenztyp, Rechtstyp, überdrehter Linkstyp, überdrehter Rechtstyp. Bei\nRechts- oder Linksherzbelastung sowie bei Blockbildern kann sich die elektrische\nHerzachse verändern.\n4. P-Wellen: Vorhanden, regelmäßig (~60–80/min), aber ohne Überleitung auf die\nKammer\n5. PQ-Zeit: Nicht konstant → kein fixer Zusammenhang zwischen P und QRS →\nAV-Block III°\n6. QRS: Breit (>120 ms) bei ventrikulärem Ersatzrhythmus oder schmal bei\njunktionalem Ersatzrhythmus\n7. Diagnose: AV-Block III° (totaler AV-Block) → vollständige Unterbrechung der\nÜberleitung vom Vorhof auf die Kammer\nSofortmaßnahmen: Atropin i.v., ggf. temporärer Schrittmacher, Vorbereitung auf\npermanenten Herzschrittmacher.\n\n3. Runde – Pneumologie & Klinische Untersuchung\nThema: Trommelschlägelfinger (Digiti hippocratici)\nFrage: Was ist das? Wo sieht man das?\nTrommelschlägelfinger sind eine Verbreiterung und Vorwölbung der Fingerendglieder\ndurch Vermehrung des subungalen Bindegewebes. Sie entstehen durch chronische\nHypoxie und eine proliferative Gewebsreaktion (Freisetzung von Wachstumsfaktoren\nwie VEGF und PDGF).\nUrsachen:\n\n\n\n\n\nPulmonale Ursachen: COPD, Lungenkarzinom, Bronchiektasen, Lungenfibrose,\nMukoviszidose\nKardiale Ursachen: Zyanotische Herzfehler\nHepatische Ursachen: Leberzirrhose, primär biliäre Zirrhose\nWeitere: Morbus Crohn, Colitis ulcerosa, Endokarditis\n\nFrage: Was fragen Sie den Patienten?\nGezielte Anamnese, insbesondere:\n\n\n\n\n\n\nRaucherstatus (vom Prüfer besonders betont): Wie viele Zigaretten täglich? Seit\nwann? (Packyears)\nDyspnoe (Belastungsdyspnoe, Ruhedyspnoe)\nHusten, Auswurf, Hämoptysen\nGewichtsverlust, Nachtschweiss, Leistungsminderung (B-Symptomatik)\nVorerkrankungen (COPD, Leberkrankung, Herzfehler)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nBerufsanamnese (Asbest, Quarz)\nFamilienanamnese (Lungenkarzinom)\n\nThema: Röntgen-Thorax – Mittellappenpneumonie\nBefund: Röntgen-Thorax p.a. und seitlich mit rechtsseitiger Verschattung.\nFrage: Welcher Lappen ist betroffen?\nAntwort: Mittellappen rechts.\nBestimmung mit dem Silhouettenzeichen:\n\n\n\nMittellappenprozess: Der rechte Herzrand ist aufgehoben (nicht mehr\nabgrenzbar), da der Mittellappen dem Herzen direkt anliegt.\nUnterlappenprozess: Der rechte Herzrand bleibt erhalten; die Verschattung liegt\neher basal und dorsal (im seitlichen Bild posterior).\n\n(Erklärung kam vom Prüfer)\n\nThema: Pneumonie – Diagnostik\nFrage: Wie diagnostiziert man eine Pneumonie?\n1. Anamnese:\n\n\n\n\n\n\n\n\nHusten (trocken oder produktiv)\nAuswurf (Farbe, Konsistenz: rostbraun bei Pneumokokken, grün-gelb bei\nbakteriell, schaumig bei Ödem)\nFieber, Schüttelfrost\nDyspnoe, Tachypnoe\nAllgemeinsymptome: Müdigkeit, Abgeschlagenheit, Myalgien\nReiseanamnese, Tierkontakte (atypische Erreger)\nImmunstatus, Vorerkrankungen\n\n2. Körperliche Untersuchung der Lunge:\n\n\n\n\nAuskultation: Feinblasige Rasselgeräusche (Knisterrasseln), Bronchialatmen,\nBronchophonie (verstärkte Stimmübertragung → Patient sagt „66“, bei\nKonsolidierung klar hörbar)\nPalpation: Verstärkter Stimmfremitus (Patient sagt „99“)\nPerkussion: Gedämpfter Klopfschall über dem konsolidierten Areal\n\n3. Bildgebung:\n\n\nRöntgen-Thorax p.a. (und seitlich): Nachweis des Infiltrats, Lokalisation\n(Silhouettenzeichen)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nCT Thorax: bei Unklarheit oder Komplikationsverdacht\n\nThema: Labor bei Pneumonie\nFrage: Welche Laborwerte bestimmen Sie?\n\n\n\n\n\n\n\n\n\n\n\n\n\nBlutbild (kleines Blutbild):\no Hämoglobin, Hämatokrit\no MCV (mittleres Erythrozytenvolumen), MCH\no Erythrozyten, Leukozyten (Leukozytose bei bakterieller Pneumonie,\nLeukopenie bei schwerer Sepsis), Thrombozyten\nEntzündungsparameter:\no CRP (C-reaktives Protein) – wichtiger Marker, Verlaufskontrolle (im\nPrüfungsgespräch zunächst vergessen, aber essenziell)\no PCT (Procalcitonin) – bei Verdacht auf bakterielle Infektion und zur\nAntibiotikasteuerung\no BSG (Blutsenkungsgeschwindigkeit)\nElektrolyte:\no Natrium, Kalium, Kalzium\no Besonders wichtig: Bei Legionellen-Pneumonie → SIADH →\nHyponatriämie (korrekt vom Kandidaten erwähnt)\nNierenwerte:\no Kreatinin (Nierenfunktion, Medikamentendosierung)\no Harnstoff\no Cystatin C (sensitiver Marker für GFR, unabhängig von Muskelmasse)\nLeberwerte: GOT, GPT, GGT, AP (bei Hepatitis, Medikamenten-NW)\nBlutgasanalyse (BGA): Oxygenierung, Säure-Basen-Haushalt (bei Dyspnoe und\nschwerer Pneumonie)\nBlutkulturen: Bei Fieber vor Antibiotikagabe (2 × aerob/anaerob)\nUrinantigentest: Legionellen-Antigen, Pneumokokken-Antigen\nHinweis des Prüfers zu Kreatinin: Bei älteren, kachektischen oder sehr\nschlanken Patienten mit reduzierter Muskelmasse kann das Serumkreatinin\ntrotz eingeschränkter Nierenfunktion niedrig wirken, weil weniger Kreatinin\nproduziert wird. Dadurch wird die Nierenfunktion (GFR/Kreatinin-Clearance)\nrechnerisch überschätzt. In solchen Fällen ist Cystatin C als\nmuskelmassenunabhängiger Marker zuverlässiger.\n\nFrage: Nach der Diagnose – wie gehen Sie vor?\nCRB-65-Score zur Schweregradeinschätzung und Entscheidung über den\nBehandlungsort:\nKriterium\n\nPunkte\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nKriterium\nC – Confusion (Bewusstseinsstörung)\nR – Respiratory rate ≥ 30/min\nB – Blood pressure (RR syst. < 90 mmHg oder diast. ≤ 60 mmHg)\n65 – Alter ≥ 65 Jahre\n\n\n\n\nPunkte\n1\n1\n1\n1\n\n0 Punkte: Ambulante Behandlung möglich → orale Antibiotikatherapie\n1–2 Punkte: Stationäre Aufnahme in Erwägung ziehen → ggf. i.v. Therapie\n3–4 Punkte: Hohes Mortalitätsrisiko → stationäre Behandlung, ggf.\nIntensivstation, i.v. Antibiotika (vom Prüfer besonders betont)\n\nFrage: Welche Typen von Pneumonie kennen Sie?\n\n\n\n\n\n\n\nTypische Pneumonie: Akuter Beginn, Schüttelfrost, eitrig-rostbrauner Auswurf,\nLobärpneumonie; häufigster Erreger: Streptococcus pneumoniae\nAtypische Pneumonie: Schleichender Beginn, trockener Husten, interstitielles\nMuster im Röntgenbild; Erreger: Mycoplasma pneumoniae, Chlamydophila\npneumoniae, Legionella pneumophila\nAspirationspneumonie: Durch Aspiration von Mageninhalt oder Fremdkörpern;\nhäufig im rechten Unterlappen\nNosokomiale Pneumonie (HAP): Auftreten ≥ 48 h nach Krankenhausaufnahme;\nErreger: oft gramnegative Bakterien, Staphylococcus aureus (inkl. MRSA)\nPneumocystis-Pneumonie (PCP): Bei Immunsupprimierten (HIV,\nChemotherapie); Erreger: Pneumocystis jirovecii\nViruspneumonie: z. B. Influenza, SARS-CoV-2\n\nOffene Zusatzfrage am Ende der Prüfung\nFall: Ein Mann mit kolikartigen Oberbauchschmerzen erhält ein CT mit Kontrastmittel.\nZwei Tage später entwickelt er stark erhöhten Blutdruck und Schockzeichen.\nFrage: Was ist die Diagnose?\nAntwort: Thyreotoxische Krise\nErklärung: Jodhaltiges Kontrastmittel kann bei Patienten mit vorbestehender\nHyperthyreose (z. B. Morbus Basedow, autonomes Adenom, Jodmangelstruma) eine\nthyreotoxische Krise auslösen. Das überschüssige Jod stimuliert die Schilddrüse\nmassiv zur Hormonproduktion.\nTypische Symptome:\n\n\n\n\nHochgradige Hyperthyreose: Tachykardie (>150/min), Hypertonie, Hyperthermie\n(>40 °C)\nSchockzeichen (kardiovaskuläres Versagen)\nAgitiertheit, Verwirrtheit, Koma\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nErbrechen, Diarrhö\n\nZeitlicher Verzug: Das Auftreten 2 Tage nach Kontrastmittelgabe ist typisch für diese\nKomplikation (Latenz durch Hormonausschüttung).\nTherapie (intensivmedizinisch):\n\n\n\n\n\n\nThionamide (Thiamazol, Propylthiouracil) → Hemmung der Hormonsynthese\nJodid (Lugolsche Lösung, erst nach Thionamid!) → Hemmung der\nHormonfreisetzung (Wolff-Chaikoff-Effekt)\nBetablocker (Propranolol) → Symptomkontrolle, Hemmung peripherer T4→T3Konversion\nKortikosteroide → Hemmung der peripheren T4→T3-Konversion\nIntensivmonitoring, Kühlungsmaßnahmen\n\nErklärung & Wichtige Anmerkungen\nZur Prüfung allgemein\nDie Prüfung umfasste drei Runden mit wechselnden Themen: Pharmakologie\n(Antikoagulation), Onkologie (Tumordiagnostik und -therapie), Kardiologie (EKG) und\nPneumologie (Pneumonie, Röntgen). Eine offene klinische Zusatzfrage wurde am Ende\ngestellt.\n\nWichtige inhaltliche Ergänzungen\nZu DOAKs: Der entscheidende Vorteil gegenüber VKA liegt neben der fehlenden INRKontrolle auch im günstigeren Wechselwirkungsprofil, der oralen Einnahme mit fester\nDosierung und dem geringeren Risiko intrakranieller Blutungen. Für alle DOAKs (außer\nDabigatran) gibt es mittlerweile Antidots: Andexanet alfa (für Xa-Inhibitoren),\nIdarucizumab (für Dabigatran).\nZum Bridging: Moderne Leitlinien empfehlen für die meisten Patienten mit\nVorhofflimmern kein Bridging, da das Blutungsrisiko den Nutzen überwiegt. Bridging ist\nnur noch bei sehr hohem thromboembolischem Risiko (z. B. mechanische Herzklappen,\nkürzliche TVT < 3 Monate) indiziert.\nZum kolorektalen Karzinom: Der wichtigste Früherkennungstest ist die Koloskopie (ab\n50 Jahren, in Deutschland ab 55 Jahren als GKV-Leistung). Tumormarker (CEA, CA 199) sind nicht für die Diagnostik, sondern für die Verlaufskontrolle unter Therapie relevant.\nZum AV-Block III°: Ein AV-Block III° ist ein Notfall bei hämodynamischer Instabilität.\nUrsachen sind u. a. Myokardinfarkt (v. a. inferior → AV-Knoten), Digitalisintoxikation,\nElektrolytstörungen, Myokarditis, degenerativ. Die definitive Therapie ist ein\npermanenter Herzschrittmacher.\nZur Legionellen-Pneumonie: Legionellen sind gramnegative Stäbchen und wachsen in\nWasserleitungen (Klimaanlagen, Whirlpools, Krankenhäuser). Die Diagnose erfolgt\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\ndurch den Urin-Antigentest. Therapie: Fluorchinolone oder Makrolide (keine\nBetalaktame, da keine Zellwand bei intrazellulären Erregern).\nZur thyreotoxischen Krise: Vor jeder jodhaltigen Kontrastmittelgabe sollte bei\nRisikopatienten (bekannte Hyperthyreose, vergrößerte Schilddrüse, Jodmangel) eine\nSchilddrüsendiagnostik (TSH, fT3, fT4, Szintigraphie) erfolgen. Bei Bedarf ist eine\nprophylaktische Perchlorat-Gabe möglich.\n\nLernquellen & Lernmethode\nVerwendete Lernquellen\n\n\n\n\n\n\n\n\n\n444 (Hauptlernbuch, alle Fälle)\nAMBOSS (nur die Hauptfälle)\nRojhat (dreimal durchgelesen)\nChatGPT (Pathophysiologie erklären lassen, nach Herold / Last Minute Pharma)\nYouTube-Kanal von Abood Al-Salahi (auf Arabisch, für visuelle Lernphasen)\nKenntniskurs bei Fadi Jarbouh\nPrüfungsprotokolle (seit Juli, alle neuen Fragen analysiert und auf 444\neingetragen)\nSimulationen der Hauptfälle (je zweimal)\n\nLernmethode\n\n\n\n\n\nCa. 1 Jahr Lernzeit, zunächst mit einer Lernpartnerin (444 + Rojhat 3×), danach\nalleine mit zwei weiteren Wiederholungen.\nLetzte 2 Monate: Zwei Wiederholungsdurchläufe (einmal in einem Monat, einmal\nin zwei Wochen).\nLetzte 5 Tage: Gezielte Fachwiederholung (Kardiologie, Gastroenterologie,\nNeurologie in 4 Tagen; Pneumologie, Endokrinologie, Urologie, Infektiologie,\nWunden/Medikamente/Verbrennungen/ASA am letzten Tag).\nPrüfungsmorgen: Schnelle Übung von Anamnese und körperlicher\nUntersuchung mit dem Ehemann.\n\nPersönliche Einschätzung der Kandidatin\n„Glaubt nicht allen Kollegen, wenn sie schreiben: ‚Ich habe nur zwei Monate\ngelernt.’ Solche Aussagen sind oft nicht realistisch. Wenn ihr wirklich bestehen\nwollt, nehmt die Prüfung ernst. Man muss viele Informationen auswendig\nlernen, regelmäßig trainieren und in der Prüfung zeigen, dass man bewusst,\nstrukturiert und sicher handelt.“\n\nDank an alle unterstützenden Personen und an Ruslan. Viel Erfolg für alle!\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [{"q": "Warum sind DOAKs gegenüber Vitamin-K-Antagonisten bevorzugt? VKA hemmen die vitamin-K-abhängigen Gerinnungsfaktoren in der Leber und erfordern regelmäßige INR-Kontrollen sowie eine aufwändige Dosisanpassung. DOAKs hingegen haben eine vorhersehbare Pharmakodynamik, benötigen keine routinemäßigen Gerinnungskontrollen, haben weniger Wechselwirkungen mit Nahrungsmitteln und Medikamenten und besitzen ein günstigeres Sicherheitsprofil in Bezug auf Blutungskomplikationen (insbesondere intrakranielle Blutungen). Außerdem ist bei VKA vor O ion (bei pulsloser VT / Kammerflimmern). Stabile VT (Patient wach, toleriert): → Medikamentöse Therapie: Amiodaron i.v. (300 mg über 10–20 min, dann Infusion) oder Ajmalin i.v. → Bei Therapieversagen: elektrische Kardioversion (synchronisiert, in Kurznarkose). Ursachensuche: Elektrolytstörungen (K⁺ , Mg²⁺ ), Ischämie, Medikamenten-NW (QT-verlängernd)."}, {"q": "F: Was ist der Unterschied zwischen Defibrillation und Kardioversion?", "a": "A: | | Defibrillation | Kardioversion | |—|—|—| | Indikation | Kammerflimmern, pulslose VT | Stabile VT, Vorhofflimmern, Vorhofflattern | | Synchronisation | Nicht synchronisiert (asynchron) | Synchronisiert mit R-Zacke des EKG | | Ziel | Alle Herzaktionen unterbrechen | Rhythmussynchrone Schockabgabe zur Konversion | | Bewusstseinszustand | Patient bewusstlos | Patient ggf. wach → Kurznarkose notwendig | | Energie | Höhere Energie (z. B. 200 J biphasisch) | Niedrigere Energie möglich (z. B. 100–200 J) |"}, {"q": "F: Was muss man bei der Defibrillation beachten?", "a": "A:       "}, {"q": "an der Punktionsstelle vor?", "a": "A:  "}, {"q": "F: Welche Strahlenschutzmaßnahmen gelten während der PTCA?", "a": "A:  "}, {"q": "F: Warum ist es wichtig, die Augen vor Strahlung zu schützen?", "a": "A:     "}], "runde_2": [{"q": "F: Welche Differenzialdiagnosen gibt es bei Ikterus?", "a": "A: "}, {"q": "F: Welche Zeichen und Laborwerte weisen auf eine Hämolyse hin?", "a": "A:  "}, {"q": "F: Welche Ursachen gibt es für Hämolyse?", "a": "A: "}, {"q": "F: Wann liegt ein intrahepatischer Ikterus vor?", "a": "A: Die Störung liegt in den Hepatozyten (Leberzellen) selbst:   "}, {"q": "mit Kontrastmittel dar?", "a": "A:  "}, {"q": "was tut man bei jeder Komplikation?", "a": "A: | Komplikation | Maßnahme | |—|—| | Galleleck / Galleaustritt (Clip-Insuffizienz, Ductus-cysticus-Stumpfinsuffizienz) | ERCP mit Stenteinlage; ggf. interventionelle Drainage; Relaparoskopie bei größerem Leck | | Choledochusläsion / Gallengangsstenose | len Manifestationen gibt es bei CED?", "a": "A:     "}, {"q": "F: Welche palliativen Therapieoptionen gibt es beim Pankreaskarzinom?", "a": "A:  "}, {"q": "F: Was bedeutet neoadjuvant und adjuvant?", "a": "A: | Begriff | Zeitpunkt | Ziel | |—|—|—| | Neoadjuvant | Vor der Operation | Tumorverkleinerung (Downstaging) → Resektabilität ermöglichen; Mikrometastasen behandeln | | Adjuvant | Nach der Operation | Elimination verbliebener Tumorzellen / Mikrometastasen; Reduktion des Rezidivrisikos | "}], "clinical_case": "**Hauptsymptom:** Fall 50\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 50. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Laborchemische Parameter und Entzündungsmarker\n• Bildgebende Verfahren (Ultraschall, CT oder Röntgen)\n• Differenzialdiagnosen basierend auf Klinik und Laborbefunden\n• EKG und kardiale Diagnostik\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Medikamentöse Therapie basierend auf Diagnose\n• Supportive und symptomatische Maßnahmen\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_51": {"case_info": "Fall 51\nIleus – Klinische Übersicht\nDatum der Nachricht: 08. Mai 2026\nPrüfungsdatum: nicht angegeben\n\n1. Definition und Klassifikation\nEin Ileus bezeichnet die Unterbrechung der normalen Darmpassage. Grundsätzlich\nunterscheidet man zwei Hauptformen:\nForm\nParalytischer\nIleus\nMechanischer\nIleus\n\nBeschreibung\nFunktionelle Darmlähmung ohne mechanisches Hindernis (z. B.\npostoperativ, Peritonitis, Elektrolytstörungen)\nPhysikalische Obstruktion des Darmlumens\n\nDer mechanische Ileus wird weiter unterteilt in:\n\n\n\nKompletter Ileus – vollständiger Verschluss des Darmlumens\nInkompletter Ileus (Subileus) – teilweiser Verschluss mit noch teilweise\nerhaltener Passage\n\n2. Klinische Ersteinschätzung\nIm klinischen Alltag müssen zunächst zwei zentrale Fragen beantwortet werden:\nFrage 1: Was ist die Ursache des Ileus?\n→ Die Ursache bestimmt die Therapiestrategie (z. B. Adhäsionen, Tumor, Volvulus,\nparalytische Genese).\nFrage 2: Wie ist der Allgemeinzustand des Patienten?\n→ Entscheidend für die Frage: konservatives vs. operatives Vorgehen.\n\n3. Alarmzeichen (Red Flags)\nFolgende Befunde erfordern eine dringende, in der Regel operative Intervention:\n\n\n\n\nPeritonitiszeichen (Abwehrspannung, Loslassschmerz, brettharter Bauch)\nHinweise auf Strangulation oder Darmischämie (z. B. plötzlicher starker\nSchmerz, blutiger Stuhl)\nHämodynamische Instabilität (Hypotonie, Tachykardie, Schock)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nFieber (Hinweis auf Perforation oder Infektion)\nMetabolische Azidose\nErhöhte Laktatwerte (Zeichen einer Gewebshypoxie)\n\n4. Diagnostik\nLaboruntersuchungen\n\n\n\n\n\n\nBlutbild, CRP, Procalcitonin\nElektrolyte (insbesondere Kalium, Natrium)\nNierenretentionsparameter (Kreatinin, Harnstoff)\nLaktat\nBlutgasanalyse (BGA) – zum Nachweis einer metabolischen Azidose\n\nBildgebung\n\n\n\n\nCT-Abdomen mit Kontrastmittel – Methode der Wahl; ermöglicht Lokalisation\nder Obstruktion, Erkennung von Ischämiezeichen, Perforation oder Strangulation\nRöntgen-Abdomen (Übersicht im Stehen/Linksseitenlage) – orientierend, bei\nnicht verfügbarem CT\nSonographie – ergänzend, besonders bei paralytischem Ileus\n\nSpezifische Zusatzdiagnostik\n\n\nGastrografin-Passage – beim inkompletten Dünndarmileus: diagnostisch und\nggf. therapeutisch wirksam (fördert Passage durch osmotischen Effekt)\n\n5. Therapie\nAllgemeine (konservative) Basismaßnahmen\nGelten für alle Formen des Ileus:\n1. Nahrungskarenz (Nüchternheit)\n2. Magensonde zur Dekompression des Magens\n3. Intravenöse Flüssigkeitssubstitution (ausgeglichene Bilanz)\n4. Elektrolytausgleich (besonders Kalium bei paralytischem Ileus wichtig)\n5. Engmaschiges klinisches Monitoring\n\nKonservatives Vorgehen (bei stabilem Patienten ohne Alarmzeichen)\n\n\n\n\nVoraussetzungen: stabiler Allgemeinzustand, keine Peritonitiszeichen, kein\nVerdacht auf Ischämie\nZusätzlich: Gastrografin-Passage beim inkompletten Dünndarmileus erwägen\nRegelmäßige Reevaluation (klinisch, laborchemisch, ggf. bildgebend)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nOperatives Vorgehen\nIndikationen zur Operation:\n\n\n\n\n\n\nKompletter mechanischer Ileus\nVerdacht auf Strangulationsileus\nPeritonitis oder Perforation\nKlinische Verschlechterung unter konservativer Therapie\nZeichen der Darmischämie\nMerke: Bei Verschlechterung oder Ischämiezeichen muss rasch operiert\nwerden – Verzögerungen erhöhen die Mortalität erheblich.\n\n6. Erklärung und wichtige Anmerkungen\nStrangulationsileus\nBeim Strangulationsileus (z. B. bei Briden, Volvulus, inkarzerierter Hernie) ist die\nBlutversorgung des betroffenen Darmsegments kompromittiert. Dies führt rasch zur\nIschämie, Nekrose und Perforation. Die Diagnose muss klinisch und im CT gestellt\nwerden. Die Operationsindikation ist absolut und dringend (notfallmäßig).\n\nParalytischer vs. mechanischer Ileus\nDie Unterscheidung ist therapeutisch entscheidend: Der paralytische Ileus wird primär\nkonservativ behandelt (Ursachentherapie, Prokinetika, Mobilisation), während der\nmechanische Ileus – je nach Ausprägung – oft einer operativen Intervention bedarf.\n\nGastrografin (Amidotrizoesäure)\nGastrografin ist ein wasserlösliches Kontrastmittel, das beim inkompletten\nDünndarmileus (z. B. bei Bridenileus) sowohl diagnostisch als auch therapeutisch\neingesetzt wird. Sein hoher osmotischer Druck zieht Flüssigkeit ins Darmlumen und\nkann die Obstruktion lösen. Es ist kontraindiziert bei Aspirationsgefahr und Verdacht auf\nPerforation.\n\nMetabolische Azidose und Laktat\nErhöhte Laktatwerte und eine metabolische Azidose sind Zeichen einer Minderperfusion\n(Ischämie). Ihr Auftreten beim Ileus sollte immer an eine intestinale Ischämie denken\nlassen und erfordert sofortiges Handeln.\n\nWichtige Differenzialdiagnosen beim Ileus\n\n\n\n\nPseudoobstruktion (Ogilvie-Syndrom) – Kolondilatation ohne mechanische\nUrsache\nMesenterialischämie – nicht immer mit Ileus kombiniert, aber wichtige DD\nToxisches Megakolon – bei chronisch-entzündlichen Darmerkrankungen\n\n\fNeue Fälle finden Sie auf dem Kanal:\nErstellt am: 28. Mai 2026\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 51\n\n**Status:** Keine Fragen verfügbar."}, "Fall_52": {"case_info": "Fall 52\nPrüfungsprotokoll\n\n\n\nDatum der Nachricht: 14. Mai 2026\nPrüfungsdatum: nicht angegeben", "runde_1": [], "runde_2": [{"q": "Welches Lokalanästhetikum verwendet man bei der Wundversorgung?", "a": "Lidocain lokal infiltriert. Frage: Welches Lokalanästhetikum wird intravenös gegeben, und welche Nebenwirkungen hat es? Lidocain i.v. (z. B. bei Arrythmien). Nebenwirkungen: Taubheitsgefühl perioral (um den Mund), metallischer Geschmack, Bradykardie, zentralnervöse Toxizität (Krampfanfälle, Bewusstlosigkeit). Frage: Zu welcher Gruppe gehört Lidocain? Lidocain ist ein Antiarrhythmikum der Klasse Ib (Natriumkanalblocker)."}, {"q": "Welche anderen Substanzen sind ebenfalls Natriumkanalblocker (Klasse I)?", "a": "Klasse Ia Ib Ic"}, {"q": "Klasse II, dann III, dann IV)?", "a": "Klasse I II III IV"}], "runde_3": [{"q": "sichtbar?", "a": "Steinart Calciumoxalat Calciumphosphat Struvit (Magnesium-AmmoniumPhosphat) Harnsäure (Urat) Zystin Xanthin"}, {"q": "Welche Rolle spielt der proximale Tubulus (PCT) bei der Kalziumregulation?", "a": "Im proximalen Tubulus (PCT) werden ca. 65–70 % des filtrierten Kalziums passiv resorbiert. Parathormon (PTH) hemmt die Phosphatrückresorption im PCT und fördert die Kalziumrückresorption im distalen Tubulus. Frage: Wie viele Nebenschilddrüsen (NSD) hat der Mensch, und wo befinden sie sich? Normalerweise 4 Nebenschilddrüsen (Glandulae parathyroideae), die jeweils paarweise dorsal (hinten) der Schilddrüse liegen – je zwei an den oberen und unteren Schilddrüsenpolen. Frage: Kann man mehr als 4 Nebenschilddrüsen haben? Ja, ektope (überzählige) Nebenschilddrüsen sind möglich. Sie können im Mediastinum (Thorax), seltener auch abdominal, intrathyroidal oder im Thymus liegen. Frage (vom Kandidaten gestellt): Wie kann man auf ektope Nebenschilddrüsen"}, {"q": "Welche Folgen hat eine Hypokalzämie?", "a": "     "}, {"q": "Medikamente (Diuretika, ASS erhöhen Harnsäure)?", "a": "   "}, {"q": "Fieber (Ausschluss septische Arthritis)?", "a": "Frage: Was ist die Diagnose, und warum? Akuter Gichtanfall. Typische Konstellation: Alkoholkonsum → Hyperurikämie → Ablagerung von Mononatriumurat-Kristallen im Gelenk (bevorzugt Metatarsophalangealgelenk I = Großzehe, sog. Podagra) → akute Entzündungsreaktion."}, {"q": "Welche Laborwerte sind relevant?", "a": "   "}, {"q": "nicht zu wegen Schmerzen)?", "a": "1. NSAR (z. B. Indometacin, Diclofenac, Naproxen) – Mittel der 1. Wahl 2. Kolchizin – sehr wirksam im akuten Anfall, hemmt Mikrotubuli-Polymerisation und damit Leukozytenaktivierung 3. Kortikosteroide (z. B. Prednisolon) – bei Kontraindikationen gegen NSAR/Kolchizin Frage: Ist Paracetamol ein NSAR? Nein. Paracetamol ist kein NSAR. Es hat analgetische und antipyretische Wirkung, aber keine relevante antiphlogistische (entzündungshemmende) Wirkung. Frage: Wie wirkt Paracetamol? Zentraler Wirkmechanismus: Hemmung der Prostaglandinsynthese vorwiegend im ZNS (zentrale COX-Hemmung, möglicherweise über den CB1-Rezeptor-Weg / Endocannabinoid-System). Periphere COX-Hemmung ist minimal → daher kein relevanter antiphlogistischer Effekt. Frage: Was ist die gefährlichste Nebenwirkung von Metamizol? Agranulozytose (seltene, aber lebensbedrohliche Nebenwirkung: drastischer Abfall der Granulozyten → schwere Infektionen)."}, {"q": "Was ist Clostridioides difficile, und was ist klinisch relevant?", "a": "     "}, {"q": "Risikofaktoren der Lungenembolie?", "a": "       "}, {"q": "Symptome der Lungenembolie?", "a": "   "}, {"q": "Was sieht man im EKG bei Lungenembolie?", "a": "      "}], "clinical_case": "**Hauptsymptom:** Fall 52\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 52. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Laborchemische Parameter und Entzündungsmarker\n• Bildgebende Verfahren (Ultraschall, CT oder Röntgen)\n• EKG und kardiale Diagnostik\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}, "Fall_53": {"case_info": "Fall 53\nPrüfungsprotokoll – Staatsexamen Innere Medizin /\nChirurgie\nDatum der Nachricht: 21. Mai 2026 Prüfungsdatum: nicht angegeben", "runde_1": [{"q": "F: Antibiotikatherapie?", "a": "  "}, {"q": "F: Therapie bei MRSA?", "a": "  "}], "runde_2": [{"q": "F: Warum sind die Thrombozyten niedrig bei Leberzirrhose?", "a": "1. Hypersplenismus: Portale Hypertension → Milzkongestion → Milzvergrößerung → vermehrte Sequestration von Thrombozyten in der Mi ": "Welche Medikamente werden bei Herzinsuffizienz (HFrEF) eingesetzt?", "a": "Antwort (nach aktuellem Leitlinienstandard – ESC 2021/2023):       "}, {"q": "Welche Laborparameter bestimmen Sie bei Alkoholkrankheit?", "a": "Antwort (vollständig):   "}], "runde_2": [{"q": "gehen Sie bei der Aufklärung vor?", "a": "Antwort (strukturiert nach deutschem Recht): 1. Einwilligungsfähigkeit prüfen: Ist der Patient trotz Demenz noch in der Lage, die Tragweite des Eingriffs zu verstehen und eine eigenverantwortliche Entscheidung zu treffen? → Bei fehlender Einwilligungsfähigkeit gilt: 2. Vorhandene Vollmacht prüfen (Vorsorgevollmacht): Hat der Patient eine Vorsorgevollmacht ausgestellt? → Der bevollmächtigte Vertreter (z. B. Ehefrau mit Generalvollmacht) kann stellvertretend einwilligen. o ⚠️ Nicht automatisch auf Patientenverfügung verweisen – diese regelt den Willen des Patienten selbst, nicht die Vertretungsbefugnis. 3. Kein Bevollmächtigter vorhanden → gesetzlicher Betreuer: o Wenn kein Bevollmächtigter vorhanden ist, muss beim Betreuungsgericht ein gesetzlicher Betreuer bestellt werden. o Ehefrau, Sohn oder Lebenspartner dürfen nicht automatisch entscheiden – nur wenn sie offiziell als Betreuer bestellt oder bevollmächtigt sind. o ⚠️ Ein Lebenspartner (auch nach 20 Jahren) hat kein automatisches Entscheidungsrecht. 4. Notfallsituation: Bei unmittelbarer Lebensgefahr und nicht erreichbarem Betreuer darf der Arzt nach mutmaßlichem Willen des Patienten handeln. 5. Datenschutz auf der Visite: Krankheitsdetails dürfen nicht in Anwesenheit von Dritten (z. B. dem Lebenspartner) besprochen werden, wenn der Patient keine explizite Einwilligung erteilt hat. Dritte müssen das Zimmer verlassen. ⚠️ Prüfungshinweis: Der Prüfer erwartete nicht nur „mit Angehörigen sprechen“, sondern eine genaue rechtliche Differenzierung: Vollmacht → gesetzlicher Betreuer → Betreuungsgericht. Die spontane Antwort „Angehörige fragen“ ist juristisch ungenau."}, {"q": "denken Sie?", "a": "Folgefr erlust in der Regel geringer (ca. 0,5 L). Der genaue Wert hängt vom Frakturtyp und dem Ausmaß der Weichteilbeteiligung ab.", "a": "Zunächst wurde „erniedrigt“ geantwortet, dann sofort korrigiert: „Bei einer akuten Blutung können die Hämoglobinwerte zunächst noch normal sein.“ Erläuterung: Bei einer frischen Blutung kommt es zunächst zu einem proportionalen Verlust von Erythrozyten und Plasma, sodass der Hämatokrit und der Hb-Wert zunächst normal erscheinen können. Erst nach der Hämodilution (Verschiebung von"}, {"q": "Was könnte bei starker Schwellung und Blutung mit geschwollenem Oberschenkel passieren?", "a": "Kompartmentsyndrom."}, {"q": "Welche anderen Komplikationen sind möglich?", "a": "Embolie – konkret: Fettembolie."}, {"q": "Woher kommt das Fett?", "a": "Aus dem Knochenmark."}, {"q": "Wie kommt das Fett in die Gefäße? Antwort (nicht vollständig beantwortet; Prüfer erklärte es selbst): Erläuterung: Bei langen Röhrenknochen (z. B. Femur) enthält das Knochenmark große Mengen an Fett. Durch den Frakturmechanismus und den erhöhten intramedullären Druck (besonders bei der Marknagelung) werden Fetttröpfchen in die eröffneten Knochenmarksvenen gedrückt. Von dort gelangen sie über das venöse System in die Lunge, wo sie die Kapillaren verlegen (pulmonale Fettembolie). Zusätzlich können freie Fettsäuren durch Lipasen freigesetzt werden, die direkte toxische Wirkung auf das Lungengewebe haben.", "a": "1. Frühmobilisation ✔ 2. Thromboseprophylaxe ✔ 3. Volumensubstitution / ausreichende Flüssigkeitszufuhr ✔ (vom Prüfer erwartet, um das Thromboserisiko zu senken) Ergänzung weiterer postoperativer Maßnahmen:    "}], "clinical_case": "**Hauptsymptom:** Fall 56\n\n**Anamnese:** Ein Patient präsentiert sich mit dem Hauptsymptom von Fall 56. Die Symptomatik begann akut vor mehreren Stunden. Der Patient hat relevante Risikofaktoren in seiner Krankengeschichte. Die klinische Präsentation ist typisch für dieses Krankheitsbild mit charakteristischen Befunden.\n\n**Klinische Befunde:** Die körperliche Untersuchung zeigt Zeichen, die mit dem klinischen Bild konsistent sind. Vitale Parameter können verändert sein. Organspezifische Untersuchungsfunde unterstützen die klinische Verdachtsdiagnose.\n\n**Diagnostische Kriterien:**\n• Siehe Fragen und Antworten für spezifische Kriterien\n\n**Therapie:**\n• Siehe Runden 1-3 für detaillierte Therapiekonzepte\n"}};
        let currentFall = 1;
        let currentRunde = 'all';
        let answered = {};

        function initUI() {
            const selector = document.getElementById('fallSelector');
            for (let i = 1; i <= 56; i++) {
                const fallKey = `Fall_${i}`;
                const fallData = allFalls[fallKey] || {};
                const qCount = (fallData.runde_1 || []).length + (fallData.runde_2 || []).length + (fallData.runde_3 || []).length;

                const btn = document.createElement('button');
                btn.className = 'fall-btn' + (qCount > 0 ? ' has-questions' : '');
                btn.textContent = i;
                btn.title = qCount + ' questions';
                btn.dataset.fall = i;
                btn.onclick = () => selectFall(i);
                selector.appendChild(btn);
            }

            for (let i = 1; i <= 56; i++) {
                const fallKey = `Fall_${i}`;
                const fallData = allFalls[fallKey] || {};
                const qCount = (fallData.runde_1 || []).length;
                if (qCount > 0) {
                    selectFall(i);
                    break;
                }
            }

            document.querySelectorAll('.runde-btn').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.runde-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentRunde = e.target.dataset.filter;
                    displayQuestions();
                };
            });
        }

        function selectFall(fallNum) {
            currentFall = fallNum;
            currentRunde = 'all';
            
            document.querySelectorAll('.fall-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-fall="${fallNum}"]`).classList.add('active');
            
            document.querySelectorAll('.runde-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-filter="all"]').classList.add('active');
            
            updateCasePanel();
            displayQuestions();
        }

        function updateCasePanel() {
            const fallKey = `Fall_${currentFall}`;
            const fallData = allFalls[fallKey] || {};
            
            const titleEl = document.getElementById('caseTitle');
            titleEl.textContent = `Fall ${currentFall}: ${fallData.title || 'Unknown'}`;
            
            const caseEl = document.getElementById('clinicalCase');
            const clinicalCase = fallData.clinical_case || 'Keine klinischen Daten verfügbar';
            
            // Convert markdown-like formatting to HTML
            let html = clinicalCase
                .replace(/\*\*([^\*]+)\*\*/g, '<h4>$1</h4>')
                .replace(/^• /gm, '<li>')
                .replace(/\n\n/g, '</li></ul></li><ul><li>')
                .replace(/\n/g, '<br>');
            
            // Wrap in paragraph and list tags
            html = html.replace(/(<h4>)/g, '</p><h4>')
                       .replace(/(<\/h4>)/g, '</h4><p>')
                       .replace(/<li>/g, '<ul><li>')
                       .replace(/(<\/li>)(?!.*<li>)/g, '</li></ul>');
            
            caseEl.innerHTML = '<p>' + html + '</p>';
            
            const qCount = (fallData.runde_1 || []).length + (fallData.runde_2 || []).length + (fallData.runde_3 || []).length;
            document.getElementById('fallQCount').textContent = qCount;
        }

        function displayQuestions() {
            const fallKey = `Fall_${currentFall}`;
            const fallData = allFalls[fallKey] || {};
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const rundes = {
                '1': fallData.runde_1 || [],
                '2': fallData.runde_2 || [],
                '3': fallData.runde_3 || []
            };

            let totalQ = 0;
            for (const [rundeNum, questions] of Object.entries(rundes)) {
                if (currentRunde !== 'all' && currentRunde !== rundeNum) continue;
                if (questions.length === 0) continue;

                if (currentRunde === 'all') {
                    const header = document.createElement('div');
                    header.className = 'runde-header';
                    header.textContent = `RUNDE ${rundeNum} (${questions.length} Fragen)`;
                    container.appendChild(header);
                }

                questions.forEach((qa, idx) => {
                    const key = `F${currentFall}_R${rundeNum}_Q${idx}`;
                    const rating = answered[key] || null;
                    totalQ++;

                    const card = document.createElement('div');
                    card.className = 'question-card';

                    const header = document.createElement('div');
                    header.className = 'question-header';
                    
                    const numSpan = document.createElement('span');
                    numSpan.className = 'question-num';
                    numSpan.textContent = `Q${totalQ}`;
                    
                    const qSpan = document.createElement('span');
                    qSpan.className = 'question-text';
                    qSpan.textContent = qa.q;
                    
                    const toggleBtn = document.createElement('button');
                    toggleBtn.className = 'btn-toggle';
                    toggleBtn.textContent = 'Zeigen';
                    toggleBtn.onclick = () => {
                        const box = document.getElementById(`answer-${key}`);
                        box.classList.toggle('show');
                        toggleBtn.classList.toggle('shown');
                        toggleBtn.textContent = box.classList.contains('show') ? 'Verstecken' : 'Zeigen';
                    };
                    
                    header.appendChild(numSpan);
                    header.appendChild(qSpan);
                    header.appendChild(toggleBtn);
                    card.appendChild(header);

                    const answerBox = document.createElement('div');
                    answerBox.className = 'answer-box';
                    answerBox.id = `answer-${key}`;
                    
                    const answerTitle = document.createElement('div');
                    answerTitle.className = 'answer-title';
                    answerTitle.textContent = '✓ Antwort:';
                    
                    const answerText = document.createElement('div');
                    answerText.className = 'answer-text';
                    answerText.textContent = qa.a;
                    
                    answerBox.appendChild(answerTitle);
                    answerBox.appendChild(answerText);
                    card.appendChild(answerBox);

                    const ratingDiv = document.createElement('div');
                    ratingDiv.className = 'rating-buttons';
                    
                    const createRatingBtn = (text, value, currentVal) => {
                        const btn = document.createElement('button');
                        btn.className = `btn-rate ${currentVal === value ? value : ''}`;
                        btn.textContent = text;
                        btn.onclick = () => rate(key, value);
                        return btn;
                    };
                    
                    ratingDiv.appendChild(createRatingBtn('✓', 'correct', rating));
                    ratingDiv.appendChild(createRatingBtn('~', 'sufficient', rating));
                    ratingDiv.appendChild(createRatingBtn('✗', 'incorrect', rating));
                    
                    card.appendChild(ratingDiv);
                    container.appendChild(card);
                });
            }

            if (container.innerHTML === '') {
                const noData = document.createElement('div');
                noData.className = 'no-data';
                noData.textContent = 'Keine Fragen in diesem Fall';
                container.appendChild(noData);
            }
        }

        function rate(key, rating) {
            answered[key] = rating;
            localStorage.setItem('kp_answered', JSON.stringify(answered));
            displayQuestions();
        }

        const saved = localStorage.getItem('kp_answered');
        if (saved) answered = JSON.parse(saved);

        initUI();
    </script>
