ca intima. Durch den arteriellen Druck dringt Blut in die Gefäßwand ein und spaltet die Media, wodurch ein falsches Lumen entsteht, das parallel zum wahren Lumen verläuft. Dies kann zu einer Kompromittierung von Aortenästen, Aortenklappeninsuffizienz, Perikardtamponade oder Ruptur führen."}, {"q": "Wie wird die Aortendissektion eingeteilt? Antwort (Stanford-Klassifikation): Typ Typ A Typ B", "a": "Bei der unkomplizierten Typ-B-Dissektion ist die konservative Therapie (strenge Blutdruckkontrolle: Ziel systolisch < 120 mmHg, Herzfrequenz < 60/min mit Betablocker + Analgesie) der Standard. Eine operative/interventionelle Therapie (bevorzugt TEVAR = thorakale endovaskuläre Aortenreparatur) ist indiziert bei:      "}], "runde_3": [{"q": "Was ist die Polymyalgia rheumatica?", "a": "Die Polymyalgia rheumatica (PMR) ist eine chronisch-entzündliche Erkrankung des älteren Menschen (> 50 Jahre, Gipfel > 70 Jahre), die sich durch Schmerzen und Steifigkeit der Schulter- und Beckengürtelmuskulatur auszeichnet. Sie ist die häufigste entzündlich-rheumatische Erkrankung bei Personen über 50 Jahre. Pathophysiologisch liegt eine synovitische Entzündung der Schulter-, Hüft- und Sternoklavikulargelenke sowie peritendinöse Entzündung vor."}, {"q": "Welche Symptome hat die Polymyalgia rheumatica?", "a": "     "}, {"q": "Wie wird die Polymyalgia rheumatica diagnostiziert?", "a": "Die Diagnose ist klinisch und basiert auf: Klassifikationskriterien (ACR/EULAR 2012):   "}, {"q": "Welche Therapie ist bei der Polymyalgia rheumatica möglich?", "a": ""}, {"q": "(SLE)?", "a": "Hautbefunde:     "}, {"q": "Was ist die Polymyalgia rheumatica?", "a": "Die Polymyalgia rheumatica (PMR) ist eine chronisch-entzündliche Erkrankung des älteren Menschen (> 50 Jahre, Gipfel > 70 Jahre), die sich durch Schmerzen und Steifigkeit der Schulter- und Beckengürtelmuskulatur auszeichnet. Sie ist die häufigste entzündlich-rheumatische Erkrankung bei Personen über 50 Jahre. Pathophysiologisch liegt eine synovitische Entzündung der Schulter-, Hüft- und Sternoklavikulargelenke sowie peritendinöse Entzündung vor."}, {"q": "Welche Symptome hat die Polymyalgia rheumatica?", "a": "     "}, {"q": "Wie wird die Polymyalgia rheumatica diagnostiziert?", "a": "Die Diagnose ist klinisch und basiert auf: Klassifikationskriterien (ACR/EULAR 2012):   "}, {"q": "Was sind typische Symptome des systemischen Lupus erythematodes (SLE)?", "a": "Hautbefunde:     "}, {"q": "Wie verläuft die Erregungsbildung im Herzen?", "a": "Die primäre Erregungsbildung erfolgt im Sinusknoten (Keith-Flack-Knoten), gelegen im rechten Vorhof an der Mündung der V. cava superior. Der Sinusknoten ist der physiologische Schrittmacher mit einer Eigenfrequenz von 60–100/min. Wichtig: Alle erregbaren Herzzellen besitzen die Fähigkeit zur Automatie (spontane Depolarisation), jedoch mit abnehmender Frequenz in der Hierarchie: 1. Sinusknoten: 60–100/min 2. AV-Knoten / His-Bündel: 40–60/min 3. Purkinje-Fasern / Ventrikel: 20–40/min"}, {"q": "Wie verläuft die Erregungsleitung im Herzen?", "a": "1. Sinusknoten → Erregung breitet sich über die Vorhöfe aus (→ P-Welle im EKG) 2. AV-Knoten (Aschoff-Tawara-Knoten): Physiologische Verzögerung der Erregungsüberleitung (→ PQ-Zeit im EKG, normal < 200 ms) → schützt den Ventrikel vor zu schneller Überleitung bei Vorhofflimmern/-flattern 3. His-Bündel → Aufteilung in linken und rechten Tawara-Schenkel im Kammerseptum"}, {"q": "Was ist ein AV-Block? Welche Typen gibt es?", "a": "Ein AV-Block ist eine Störung der Erregungsleitung vom Vorhof zum Ventrikel im Bereich des AV-Knotens oder His-Bündels."}, {"q": "Wie verläuft die Erregungsbildung im Herzen?", "a": "Die primäre Erregungsbildung erfolgt im Sinusknoten (Keith-Flack-Knoten), gelegen im rechten Vorhof an der Mündung der V. cava superior. Der Sinusknoten ist der physiologische Schrittmacher mit einer Eigenfrequenz von 60–100/min. Wichtig: Alle erregbaren Herzzellen besitzen die Fähigkeit zur Automatie (spontane Depolarisation), jedoch mit abnehmender Frequenz in der Hierarchie: 1. Sinusknoten: 60–100/min 2. AV-Knoten / His-Bündel: 40–60/min 3. Purkinje-Fasern / Ventrikel: 20–40/min"}, {"q": "Wie verläuft die Erregungsleitung im Herzen?", "a": "1. Sinusknoten → Erregung breitet sich über die Vorhöfe aus (→ P-Welle im EKG) 2. AV-Knoten (Aschoff-Tawara-Knoten): Physiologische Verzögerung der Erregungsüberleitung (→ PQ-Zeit im EKG, normal < 200 ms) → schützt den Ventrikel vor zu schneller Überleitung bei Vorhofflimmern/-flattern 3. His-Bündel → Aufteilung in linken und rechten Tawara-Schenkel im Kammerseptum"}, {"q": "Was ist ein AV-Block? Welche Typen gibt es?", "a": "Ein AV-Block ist eine Störung der Erregungsleitung vom Vorhof zum Ventrikel im Bereich des AV-Knotens oder His-Bündels."}], "title": "Fall 41", "header": "Fall 41\nKenntnisprüfung – Prüfungsprotokoll\nDatum der Prüfung: 28.04.2024 Datum der Nachricht: 03.05.2026 Ergebnis:\nBestanden (1. Versuch) Atmosphäre: Freundlich, angenehme Kommunikation mit der\nPrüfungskommission", "clinical_case": "**Hauptsymptom:** Akute Dyspnoe mit Thoraxschmerz und Tachykardie\n\n**Anamnese:** Eine 55-jährige Frau mit Adipositas (BMI 32) und Immobilität (lange Autofahrt vor 2 Tagen) präsentiert sich mit plötzlicher Dyspnoe. Sie berichtet von rechtsseitigem Thoraxschmerz, der sich bei tiefem Atmen verschlimmert. Die Patientin ist ängstlich, gibt an, gehustet zu haben, und bemerkte keine Hämoptoe. Sie nimmt orale Kontrazeptiva.\n\n**Klinische Befunde:** Allgemeinzustand: ängstlich, tachypneisch. RR 28/min, HR 118/min, Blutdruck 135/82, Temperatur 37,2°C. SpO2 90% an Raumluft. Lungenauskultat: vermindertes Atemgeräusch basal rechts, kein Stridor. Keine Beinödeme bilaterally.\n\n**Diagnostische Kriterien:**\n• D-Dimer (sensitiv, aber nicht spezifisch)\n• CT-Pulmonalisangiographie (CTPA) als Goldstandard\n• EKG: Sinustachykardie, ggf. S1-Q3-T3-Muster\n• Arterielle Blutgasanalyse: Hypoxämie und Hyperkapnie\n\n**Therapie:**\n• Antikoagulation (Heparin bolus + kontinuierliche Infusion oder LMWH)\n• Sauerstofftherapie zur SpO2 >90%\n• Hämodynamisch instabile Patienten: Thrombolyse oder mechanische Intervention\n• Langzeitantikoagulation (Warfarin oder DOAC) für 3 Monate\n"}, "Fall_42": {"case_info": "Fall 42\nKenntnisprüfung – Protokoll\nPrüfungsdatum: 29. April 2026 Nachrichtendatum: 01. Mai 2026 Station: 3 von 3\n\nFall 1 – Pyelonephritis\nPatientenvorstellung\nEine Patientin stellte sich mit seit zwei Tagen bestehenden Schüttelfrost und\nFlankenschmerzen, die in den Unterbauch ausstrahlen, vor. Bei der körperlichen\nUntersuchung zeigte sich ein klopfschmerzhaftes Nierenlager.\n\nFragen und Antworten\nF: Welche Diagnostik leiten Sie ein? Blutabnahme (inkl. Entzündungsparameter,\nNierenwerte, BB), Blutkulturen, Urinstix, Urinsediment, Urinkultur sowie ggf.\nSonographie der Nieren und ableitenden Harnwege.\n\nF: Wie nimmt man Blutkulturen ab? Die aktuelle Empfehlung ist die Abnahme von\nzwei Blutkulturpaaren (aerob + anaerob) aus einer Venenpunktionsstelle unter\nsterilen Bedingungen (Hautdesinfektion, sterile Handschuhe).\nF: Früher wurden Blutkulturen von verschiedenen Stellen abgenommen – warum?\nMan erhoffte sich dadurch, Kontaminationen zu erkennen: War nur eine Flasche positiv,\nsprach das eher für eine Kontamination. Wenn beide positiv waren, für eine echte\nBakteriämie.\nF: Warum nimmt man Blutkulturen jetzt nur noch von einer Stelle ab? Die aktuelle\nEmpfehlung basiert darauf, dass mehrere Abnahmen von verschiedenen Stellen das\nKontaminationsrisiko erhöhen, ohne die diagnostische Genauigkeit wesentlich zu\nverbessern. Wichtiger ist das korrekte Abnahmevolumen (mind. 8–10 ml pro Flasche).\nDie Unterscheidung Kontamination vs. echte Bakteriämie erfolgt heute über klinische\nBewertung und Keimidentifikation.\n⚠️ Anmerkung der Prüferin: Die erste Blutkultur könnte kontaminiert sein, die\nzweite und dritte nicht – deshalb werde nur von einer Stelle abgenommen.\n(Dies spiegelt die Begründung wider, die die Prüferin in der Prüfung gegeben\nhat.)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nF: Ab wann spricht man von Fieber? Ab einer Körpertemperatur von ≥ 38,0 °C (rektal\ngemessen).\n\nF: Welche Entzündungsparameter gibt es?\nParameter\nIL-6 (Interleukin-6)\nCRP (C-reaktives Protein)\nPCT (Procalcitonin)\nLeukozyten\nBSG\n(Blutsenkungsgeschwindigkeit)\n\nAnstieg\nSehr früh (1–2\nh)\nNach 6–12 h\nNach 2–4 h\nInnerhalb\nStunden\nNach 24–48 h\n\nBemerkung\nFrühester Marker\nKlassischer Marker, steigt früh an\nSpezifisch für bakterielle\nInfektionen/Sepsis\nUnspezifisch\nTräger Marker\n\nF: Welcher Entzündungsparameter steigt zuerst an? IL-6 steigt am frühesten an\n(bereits nach 1–2 Stunden). Im klinischen Alltag wird häufig das CRP als erstes\nrelevantes Zeichen genannt, da es früh ansteigt und gut verfügbar ist. Das PCT ist der\nspezifischste frühe Marker bei bakterieller Infektion/Sepsis.\n\nF: Was zeigt der Sonographiebefund bei Pyelonephritis?\n\n\n\n\n\n\n\nVergrößerte, geschwollene Niere\nVerdickte Nierenbecken-/Kelchwände\nGgf. Harnstau (Dilatation des Nierenbeckens) → Harnstauungsniere\nGgf. echoarme Areale (Abszess)\nDoppler: verminderte Perfusion bei schwerem Verlauf\nGgf. Nachweis von Nierensteinen als Ursache\n\nF: Wo liegen die normalen Blutdruckwerte beim Menschen? Optimal: < 120/80\nmmHg Normal: 120–129 / 80–84 mmHg Hochnormal: 130–139 / 85–89 mmHg\nF: Wie werden die Hypertoniegrade eingeteilt? (ESC/ESH 2023)\nGrad\nGrad 1 (leicht)\nGrad 2 (mittel)\nGrad 3 (schwer)\nIsoliert systolisch\n\nSystolisch (mmHg)\n140–159\n160–179\n≥ 180\n≥ 140\n\nDiastolisch (mmHg)\n90–99\n100–109\n≥ 110\n< 90\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nF: Welche Antihypertensiva kennen Sie?\nKlasse\nACE-Hemmer\nAT1-Antagonisten (Sartane)\nKalziumkanalblocker (CCB)\nBetablocker\nDiuretika\nAlpha-1-Blocker\nZentral wirksame Mittel\n\nBeispiele\nRamipril, Enalapril\nLosartan, Valsartan\nAmlodipin, Nifedipin\nMetoprolol, Bisoprolol\nHydrochlorothiazid, Torasemid\nDoxazosin\nMoxonidin, Clonidin\n\nF: Was sind Nebenwirkungen von Kalziumkanalblockern (CCB)?\n\n\n\n\n\n\nUnterschenkelödeme (betont von der Prüferin) – durch periphere Vasodilatation\nund erhöhte kapilläre Filtration\nFlush, Kopfschmerzen, Schwindel\nReflextachykardie (besonders Dihydropyridine wie Nifedipin)\nVerstopfung (besonders Verapamil)\nGingivahyperplasie (selten, Nifedipin)\n\nF: Was sind Nebenwirkungen von Betablockern – insbesondere bei einem jungen\nsportlichen Patienten?\n\n\n\n\n\n\n\nEingeschränkte Herzfrequenzsteigerung unter Belastung (betont von der\nPrüferin) – die maximale Herzfrequenz beim Sport kann nicht ausreichend\nerreicht werden → verminderte Leistungsfähigkeit\nBradykardie\nBronchospasmus (bei nicht-selektiven Betablockern, z. B. bei Asthma/COPD)\nMüdigkeit, Kältegefühl in den Extremitäten\nErektile Dysfunktion\nMaskierung einer Hypoglykämie (bei Diabetikern)\n\nErklärung und wichtige Hinweise – Fall 1\nPyelonephritis (akute unkomplizierte/komplizierte):\n\n\n\n\n\nHäufigste Ursache: aszendierende Infektion, meist E. coli (70–80 %)\nKlassische Trias: Fieber + Flankenschmerz + Dysurie/Bakteriurie\nDiagnostik: Urin (Stix, Sediment, Kultur), Blut (BB, CRP, PCT, Krea, Harnstoff),\nBlutkulturen bei Fieber/Sepsisverdacht, Sonographie\nTherapie: Antibiotika (z. B. Ciprofloxacin, Ceftriaxon i.v. bei schwerer Verlauf),\nAnalgesie, Hydratation\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nKomplikationen: Urosepsis, perinephritischer Abszess, Nierenversagen\nBlutkulturen werden abgenommen vor Antibiotikagabe\n\nFall 2 – ERCP / Strahlenbelastung\nFragen und Antworten\nF: Was ist eine ERCP und was sehen Sie auf dem Bild? ERCP = Endoskopischretrograde Cholangiopankreatikographie: ein endoskopisches Verfahren zur Darstellung\nund Behandlung der Gallenwege und des Pankreasgangs.\nAuf dem Bild: Zwei Steine im Ductus choledochus (Choledocholithiasis) mit\nerweiterten Gallenwegen (Cholestase).\nF: Warum ist ein normaler Ultraschall nicht ausreichend?\n\n\n\n\n\nSonographie kann die distalen Gallengänge und den Ductus choledochus nur\neingeschränkt beurteilen (Überlagerung durch Darm/Luft)\nERCP ermöglicht nicht nur die Diagnose, sondern auch die direkte Therapie\n(Steinextraktion, Papillotomie, Stenteinlage)\nKleine Steine im DHC sind sonographisch häufig nicht sichtbar\nAlternativ: MRCP (nicht-invasiv, zur Diagnostik), EUS (endoskopischer Ultraschall)\n\nF: Was zeigt das CT-Abdomen? Im CT-Abdomen fanden sich multiple Zysten in der\nLeber.\nDifferenzialdiagnosen: einfache Leberzysten (häufig, benigne),\nEchinokokkuszysten, polyzystische Lebererkrankung, Lebermetastasen\n(zystisch), Hämangiom, Abszess.\n\nF: Welche Maßeinheit wird für die Messung von Strahlung verwendet?\nGröße\nAbsorbed Dose (Energiedosis)\nEffective Dose (Effektivdosis)\nAktivität einer Strahlenquelle\nIonendosis (alt)\n\nEinheit\nGray (Gy)\nSievert (Sv)\nBecquerel (Bq)\nRöntgen (R)\n\nBedeutung\nAbsorbierte Energie pro Masse\nBiologische Wirkung (gewichtet)\nZerfälle pro Sekunde\nVeraltet\n\nIm klinischen Alltag wird meist die effektive Dosis in Millisievert (mSv) angegeben.\n\nF: Was sind die 5 As des Strahlenschutzes?\nPrinzip\nAbstand\n\nErklärung\nJe größer der Abstand zur Strahlenquelle, desto\ngeringer die Dosis (1/r²-Gesetz)\n\n\fNeue Fälle finden Sie auf dem Kanal:\nPrinzip\nAbschirmung\nAufenthaltsdauer\nAnwendung\nAbstand halten\n(Aktivitätsreduktion)\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nErklärung\nBleischürze, Bleiwände, Schutzwände zwischen\nQuelle und Person\nExpositionszeit minimieren\nNur medizinisch gerechtfertigte Untersuchungen\ndurchführen\nGeringste notwendige Strahlendosis verwenden\n(ALARA-Prinzip)\n\nDas ALARA-Prinzip: As Low As Reasonably Achievable.\n\nF: Welche Strahlenquellen gibt es außerhalb der Medizin?\n\n\n\nNatürliche Quellen: kosmische Strahlung, terrestrische Strahlung (Radon aus\ndem Boden), radioaktive Stoffe in Nahrung und Wasser\nTechnische Quellen (nicht-medizinisch): Kernkraftwerke, Atommüll,\nRauchmeldegeräte (Americium), Flugverkehr (erhöhte kosmische Strahlung)\n\nF: Welche Strahlenquellen gibt es in der Medizin?\n\n\n\n\n\nRöntgen (konventionelles Röntgen, CT, Fluoroskopie/Durchleuchtung)\nERCP, Angiographie, Herzkatheterlabor\nNuklearmedizin (Szintigraphie, PET, Radiojodtherapie)\nStrahlentherapie (Radiotherapie)\n\nF: Was ist ein Dosimeter und wozu dient es? Ein Dosimeter ist ein persönliches\nStrahlenmessgerät, das die kumulierte Strahlenexposition einer Person misst und\ndokumentiert. Es wird vom medizinischen Personal getragen, das beruflich ionisierender\nStrahlung ausgesetzt ist (Ärzte, MTRA, Pflegepersonal im Röntgenbereich).\nArten: Film-Dosimeter, Thermolumineszenzdosimeter (TLD), elektronisches Dosimeter.\n\nF: Warum haben verschiedene Bereiche im Krankenhaus unterschiedliche\nStrahlenschutzkategorien? Je nach der zu erwartenden jährlichen Strahlendosis\nwerden Bereiche und Personen in Strahlenschutzbereiche eingeteilt:\nBereich\nKontrollbereich\nÜberwachungsbereich\nNormaler Aufenthaltsbereich\n\nEffektivdosis/Jahr\n> 6 mSv\n1–6 mSv\n< 1 mSv\n\nZiel ist es, sicherzustellen, dass Personen, die höherer Strahlenbelastung ausgesetzt\nsind, engmaschig überwacht werden und entsprechende Schutzmaßnahmen ergreifen.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nErklärung und wichtige Hinweise – Fall 2\n\n\n\n\n\nCholedocholithiasis kann zu Cholestase, Cholangitis (Charcot-Trias: Fieber,\nIkterus, Schmerz) und Pankreatitis führen\nERCP ist Goldstandard zur Therapie: Papillotomie (EPT) + Steinextraktion + ggf.\nStenteinlage\nMRCP ist die nicht-invasive diagnostische Alternative\nStrahlenschutz ist prüfungsrelevant – die 5 As und ALARA-Prinzip merken\n\nFall 3 – Pneumothorax / SHT / Intrakranielle Blutungen\nFragen und Antworten\nF: Was sehen Sie auf dem Röntgenbild?\n\n\n\n\n\nFehlende Gefäßzeichnung im Bereich des Oberlappens\nKollabierter Oberlappen (nicht kompletter Lungenkollaps)\nKein Mediastinalshift → kein Spannungspneumothorax\nBefund: Partieller Pneumothorax (wahrscheinlich primär spontan)\n\nF: Welche Arten von Pneumothorax gibt es?\nTyp\nPrimärer\nSpontanpneumothorax\nSekundärer\nSpontanpneumothorax\nTraumatischer Pneumothorax\nIatrogener Pneumothorax\nSpannungspneumothorax\nOffener Pneumothorax\n\nBeschreibung\nOhne erkennbare Grunderkrankung, oft junge\nschlanke Männer\nAuf dem Boden einer Lungenerkrankung (COPD,\nAsthma, CF, Tuberkulose)\nNach Trauma (Rippenfraktur, penetrierendes\nTrauma)\nKomplikation einer medizinischen Maßnahme\nVentilmechanismus → zunehmende\nLuftansammlung → lebensbedrohlich\nOffene Thoraxwunde mit Verbindung zur Außenluft\n\nF: Welche Klinik hat ein primärer Spontanpneumothorax?\n\n\n\n\n\nPlötzlich einsetzender, einseitiger Thoraxschmerz (atemabhängig)\nDyspnoe (Ausmaß abhängig von Größe des Pneumothorax)\nTrockener Husten\nHypersonorer Klopfschall, abgeschwächte/aufgehobene Atemgeräusche auf der\nbetroffenen Seite\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nMeist junge, schlanke Männer (Bullae/Emphysemblasen als Ursache)\n\nF: Wie wird ein Pneumothorax behandelt?\nGröße / Klinik\nKlein (< 2 cm),\nasymptomatisch\nMittelgroß / symptomatisch\nGroß /\nSpannungspneumothorax\nRezidiv / persistierend\n\nTherapie\nKonservativ: Beobachtung, O₂ -Gabe (beschleunigt\nResorption)\nNadeldekompression oder Pigtail-Katheter (Aspiration)\nSofortige Druckentlastung + Thoraxdrainage\nVATS (videoassistierte Thorakoskopie), Pleurodese\n\nF: An welchen Stellen wird eine Thoraxdrainage angelegt?\n\n\n\n\n4./5. ICR, mittlere Axillarlinie (bevorzugte Stelle, „Safe Triangle“) –\nStandardposition\n2. ICR, Medioklavikularlinie (Monaldi-Position) – bei Pneumothorax, seltener\nverwendet\nBülau-Position: 4./5. ICR, vordere Axillarlinie – für Blut/Erguss\n\nF: hysiologische Mechanismen der Entzündungskaskade\n1. Erkennung von PAMPs (pathogenassoziierte molekulare Muster) durch Toll-\nlike-Rezeptoren auf Makrophagen und Monozyten → Aktivierung der\nEntzündungskaskade\n2. IL-6-Ausschüttung: Makrophagen sezernieren IL-6 nahezu unmittelbar nach\nStimulation → IL-6 messbar nach ~1–2 h\n3. PCT-Produktion: Durch proinflammatorische Zytokine (IL-6, IL-1β, TNF-α) wird\nPCT in fast allen Geweben (extrathyreoidale Expression) de novo synthetisiert →\nAnstieg nach 2–4 h, Plateau nach 12–48 h\n4. CRP-Synthese (hepatische Phase): IL-6 stimuliert Hepatozyten zur Produktion\nvon Akute-Phase-Proteinen (darunter CRP) → Anstieg erst nach 6–12 h Latenz\ndurch erforderliche Translationsphase\n5. Leukozytenmobilisierung (zelluläre Reaktion): Durch Zytokine, Endotoxine\nund Stresshormone (Cortisol, Adrenalin) → kein lineares kinetisches Muster,\nabhängig von Knochenmarkreserve\n3. Warum Leukozyten ein unzuverlässiger Marker sind\n Keine lineare Korrelation mit dem Ausmaß der Infektion\n Schneller (nicht infektionsspezifischer) Anstieg durch Demargination bei Stress,\nTrauma oder Adrenalinausschüttung (innerhalb von Minuten)\n Falsch-positive Befunde durch Steroide: Glukokortikoide provozieren eine\nNeutrophilie durch Demargination, ohne dass eine Infektion vorliegen muss\n Falsch-negative Befunde: Leukopenie bei schwerer Sepsis möglich\n(Erschöpfung der Knochenmarkreserven)\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Maskierung durch laufende Kortikosteroidtherapie\n Hohe interindividuelle Schwankungsbreite → keine validen Schwellenwerte (Cut-\noff-Werte) definierbar\nFazit zur Leukozytenzahl:\nDie Leukozytenzahl eignet sich nicht zur zeitlichen Einordnung eines Infekts\nund sollte ausschließlich in der Gesamtschau (zusammen mit anderen\nParametern) bewertet werden.\n4. CRP vs. Leukozyten – klinischer Vergleich\nKriterium CRP Leukozyten\nArt der Antwort Hepatisches Akute-Phase- Zelluläre Mobilisierung\nPr rüfer akzeptiert\n– eine vollständige Untersuchung ist nicht zwingend erforderlich)\nHinweis: Die Untersuchung wurde ohne Handschuhe durchgeführt. Der Prüfer\nbeobachtete ohne Unterbrechung.\nArztbrief\nDie Zeit für Anamnese, körperliche Untersuchung und Arztbrief war mehr als\nausreichend.\nPrüfungsgespräch – Erste Runde\nVerdachtsdiagnose und Differentialdiagnosen\nVerdachtsdiagnose: pAVK (periphere arterielle Verschlusskrankheit)\nDifferentialdiagnosen:\n Tiefe Venenthrombose (TVT)\n Akuter Extremitätenverschluss\n Diskusprolaps\n Erysipel\nThemenblock: Erysipel\nWas ist ein Erysipel? Eine akute, nicht-eitrige Infektion der oberflächlichen Dermis und\nder kutanen Lymphgefäße, verursacht durch bakterielle Erreger. Es handelt sich um\neine flächenhafte, scharf begrenzte, livide Rötung mit überwärmter Haut, begleitet von\nAllgemeinsymptomen wie Fieber und Schüttelfrost.\nWelche Erreger verursachen ein Erysipel? Haupterreger: β-hämolysierende\nStreptokokken der Gruppe A (Streptococcus pyogenes). Selten auch Staphylokokken\noder Gruppe-C/G-Streptokokken.\nWas spricht gegen Erysipel bei unserer Patientin?\n Keine Rötung oder Überwärmung der Haut beschrieben\n Kein Fieber\n Schmerzen betreffen das gesamte Bein (Erysipel ist meist umschrieben)\n Langjährige Vorgeschichte ähnlicher Beschwerden (eher vaskuläre Genese)\n Kältegefühl und Parästhesien sprechen für arterielle Ischämie, nicht für Infektion\nTherapie des Erysipels?\n Mittel der Wahl: Penicillin G i.v. (stationär) oder Penicillin V p.o. (ambulant, bei\nleichtem Verlauf)\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Alternative: Amoxicillin, Cefalexin\n Bei Penicillin-Allergie: Clindamycin oder Makrolide (z. B. Erythromycin)\n Lokal: Kühlung, Hochlagerung, Bettruhe\nWirkmechanismus von Penicillin? Penicillin hemmt die bakterielle Zellwandsynthese\ndurch irreversible Bindung an Penicillin-bindende Proteine (PBPs), welche\nTranspeptidasen sind. Dadurch wird die Quervernetzung der Peptidoglykanketten\ngestört → osmotische Lyse der Bakterien. Penicillin wirkt nur auf wachsende Bakterien\n(bakterizid).\nWirkmechanismus von Clindamycin? Clindamycin ist ein Lincosamid-Antibiotikum. Es\nbindet reversibel an die 50S-Untereinheit des bakteriellen Ribosoms und hemmt die\nProteinbiosynthese (bakteriostatisch). Es wirkt gegen grampositive Erreger und\nAnaerobier.\nWelche Antibiotikagruppen wirken auf die bakterielle Zellwand?\n Beta-Laktam-Antibiotika: Penicilline, Cephalosporine, Carbapeneme,\nMonobaktame\n Glykopeptide: Vancomycin, Teicoplanin (hemmen Quervernetzung von außen)\n Fosfomycin (hemmt frühen Schritt der Zellwandsynthese)\nWie viele Generationen haben Cephalosporine, und was ist der Unterschied? Es\ngibt 5 Generationen:\n 1. Generation (z. B. Cefalexin, Cefazolin): Hauptsächlich wirksam gegen\ngrampositive Erreger (z. B. Staphylokokken, Streptokokken); geringe Aktivität\ngegen gramnegative Bakterien.\n 2. Generation (z. B. Cefuroxim, Cefaclor): Erweiterte Aktivität gegen\ngramnegative Erreger (z. B. H. influenzae, E. coli), grampositive Aktivität leicht\nreduziert.\n 3. Generation (z. B. Cefotaxim, Ceftriaxon, Ceftazidim): Breites Spektrum gegen\ngramnegative Erreger; Ceftazidim auch gegen Pseudomonas aeruginosa;\ngeringere Aktivität gegen grampositive Erreger.\n 4. Generation (z. B. Cefepim): Breites Spektrum gegen grampositive und\ngramnegative Erreger einschließlich Pseudomonas; Stabilität gegenüber Beta-\nLaktamasen.\n 5. Generation (z. B. Ceftarolin): Auch wirksam gegen MRSA\n(methicillinresistente Staphylococcus aureus).\nMerke: Zunehmende Generation → zunehmende gramnegative Wirkung,\nabnehmende grampositive Wirkung (außer 4./5. Gen.).\nMuss ein Erysipel stationär behandelt werden? Nicht zwingend. Leichte Fälle können\nambulant mit oralen Antibiotika (Penicillin V) behandelt werden. Eine stationäre\nBehandlung ist indiziert bei:\n Schwerem Verlauf oder ausgeprägten Allgemeinsymptomen\n Komplikationen (z. B. bullös arkt\nBefund: ST-Hebungen in V1, V2, V3, V4, V5\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nDiagnose: Akuter ST-Hebungsmyokardinfarkt (STEMI) der Vorderwand\n(anterobasaler/anteroaptikaler Infarkt)\nWelche Koronararterie ist betroffen? Der Ramus interventricularis anterior (RIVA),\nauch Left Anterior Descending Artery (LAD) genannt – ein Ast der linken Koronararterie\n(LCA). Der RIVA versorgt die anteriore Wand des linken Ventrikels, den Apex, das\nanteriore Interventrikularseptum sowie den vorderen Teil des rechten Ventrikels. Bei\nVerschluss in proximalen Segmenten: Beteiligung auch von V1–V2 (Septum).\nVorgehen beim Myokardinfarkt (STEMI-Management):\n1. Sofortmaßnahmen: Sauerstoff (nur bei SpO₂ < 90 %), i.v.-Zugang, Monitoring\n(EKG, Blutdruck, Pulsoxymetrie), 12-Kanal-EKG-Bestätigung\n2. Medikamentös: Aspirin 300 mg p.o. (Loading dose) + P2Y₁ ₂ -Inhibitor\n(Ticagrelor 180 mg oder Prasugrel 60 mg, ggf. Clopidogrel 600 mg),\nAntikoagulation (Heparin i.v. oder Fondaparinux)\n3. Reperfusionstherapie (Ziel: Door-to-balloon < 90 min):\no Primäre perkutane Koronarintervention (PCI) – Methode der Wahl\no Alternativ: Thrombolyse (falls PCI nicht innerhalb von 120 min möglich)\n4. Begleitend: Betablocker (falls keine Kontraindikation), ACE-Hemmer, Statin\n(hochdosiert)\n5. Monitoring und Nachsorge: Intensivstation/Chest Pain Unit, Echokardiographie\nEKG 2: AV-Block Grad II, Typ Mobitz II\nBefund: Plötzlicher Ausfall einer P-Welle ohne vorherige Verlängerung des PQ-\nIntervalls; PQ-Intervall konstant\nDiagnose: AV-Block Grad II, Typ Mobitz II (im Gegensatz zu Typ Wenckebach, bei dem\ndas PQ-Intervall sich progressiv verlängert bis zum Ausfall)\nWas sind die Ursachen des AV-Blocks?\n Kardiologisch: Koronare Herzkrankheit (v. a. Hinterwandinfarkt), Myokarditis,\nKardiomyopathie, Herzchirurgie/Ablation, Kalkifizierung des Reizleitungssystems\n(Lenègre-Syndrom, Lev-Syndrom)\n Metabolisch/toxisch: Hyperkaliämie, Hyperkalzämie, Azidose, Digoxin-Toxizität,\nBetablocker, Kalziumkanalblocker, Antiarrhythmika (z. B. Amiodaron)\n Infektiös/entzündlich: Borreliose (Lyme-Karditis), Sarkoidose, Endokarditis\n Angeboren: Kongenitaler AV-Block (z. B. bei maternalen Anti-Ro/La-Antikörpern)\n Iatrogen: Nach Herzchirurgie, Katheterablation\nTherapie des AV-Blocks:\n Grad I und II Typ Wenckebach: Meist keine Therapie notwendig, ggf.\nauslösende Ursache behandeln (z. B. Medikamente absetzen)\n Grad II Typ Mobitz II: Hohes Progressionsrisiko zum totalen AV-Block →\nHerzschrittmacher-Implantation indiziert\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Grad III (totaler AV-Block): Herzschrittmacher zwingend erforderlich\n Akut (hämodynamisch instabil): Atropin i.v. (0,5–1 mg), ggf. transthorakale\nStimulation, temporärer transvenöser Schrittmacher\nBlutgasanalyse: Metabolische Azidose\nBefund: pH erniedrigt, HCO₃ ⁻ erniedrigt, pCO₂ erniedrigt\nDiagnose: Metabolische Azidose mit respiratorischer Kompensation\nWarum ist pCO₂ erniedrigt? Bei metabolischer Azidose sinkt der pH-Wert →\nStimulation des Atemzentrums (periphere und zentrale Chemorezeptoren) →\nkompensatorische Hyperventilation → vermehrte CO₂ -Abatmung → Abfall des pCO₂\n→ Verschiebung des Gleichgewichts CO₂ + H₂ O ⇌ H₂ CO₃ ⇌ H⁺ + HCO₃ ⁻ nach\nlinks → leichter Anstieg des pH. Diese Kompensation ist jedoch nie vollständig.\nFormel zur Erwartung der Kompensation (Winter-Formel): Erwartetes pCO₂ = 1,5 ×\nHCO₃ ⁻ + 8 ± 2 mmHg\nRöntgenbild: Pneumothorax\nDiagnose: Pneumothorax\nTypische Röntgenbefunde:\n Fehlende Gefäßzeichnung im betroffenen Lungenabschnitt (avascular zone)\n Sichtbare Pleuragrenze (viszerale Pleura als zarte Linie)\n Mediastinalverlagerung zur Gegenseite bei Spannungspneumothorax\n Tiefstehendes Zwerchfell ipsilateral bei großem Pneumothorax\n(Nur Diagnose wurde verlangt)\nTNM-Staging: pT3N1M0\nWas bedeutet dieses Staging?\n p = pathologisch bestätigt (histologisch, nicht klinisch)\n T3 = Tumor hat eine be n ein Gallenblasenstein Ikterus verursachen?\nNein – ein Gallenblasenstein allein verursacht keinen Ikterus, da er den Gallenfluss aus\nder Leber nicht blockiert. Die Gallenblase ist ein Reservoir, kein obligater Abflussweg.\nWann kann eine Cholezystolithiasis Ikterus verursachen?\n Choledocholithiasis: Wenn ein Stein aus der Gallenblase in den Ductus\ncholedochus migriert und diesen blockiert → Cholestase, Ikterus\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Mirizzi-Syndrom: Ein großer Gallenblasenstein im Collum vesicae oder im\nDuctus cysticus drückt von außen auf den Ductus hepaticus communis →\nmechanischer Ikterus durch extrinsische Kompression (kein intraluminaler Stein\nim Hauptgallengang!)\nMurphy-Zeichen\nDefinition: Klinisches Zeichen bei Cholezystitis.\nDurchführung:\n1. Der Untersucher legt die Finger unter den rechten Rippenbogen in der\nMedioklavikularlinie (Projektion der Gallenblase).\n2. Der Patient wird aufgefordert, tief einzuatmen.\n3. Beim tiefen Einatmen senkt sich das Zwerchfell → die entzündete Gallenblase\nbewegt sich nach kaudal und trifft auf die Finger des Untersuchers →\nreflektorischer Atemstopp durch Schmerzauslösung.\nPositives Murphy-Zeichen: Schmerz und Atemstopp = Hinweis auf Cholezystitis\n(Sensitivität ~65 %, Spezifität ~87 %)\nSonographisches Murphy-Zeichen: Schmerz beim Aufsetzen des Ultraschallkopfes\ndirekt auf die Gallenblase.\nWichtige Differentialdiagnosen bei rechtsseitigen Oberbauchschmerzen,\ndie immer bedacht werden müssen:\n Hinterwandmyokardinfarkt (Verschluss der RCA → viszerale\nSchmerzprojektion)\n Basale Pneumonie rechts (Reizung des Zwerchfells → referred pain)\nThemenblock: Schulterluxation\nDiagnose: Schulterluxation (Röntgenbefund gezeigt)\nHäufigster Typ der Schulterluxation: Anteriore (ventrale) Luxation – macht ca. 95 %\naller Schulterluxationen aus. Der Humeruskopf luxiert nach vorne-unten (subglenoidale\noder subkorakoidale Position). Ursache: meist indirektes Trauma Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nWie klassifiziert man die Herzinsuffizienz anhand der Echokardiographie?\nAnhand der Ejektionsfraktion (EF):\nTyp Abkürzung EF\nHerzinsuffizienz mit reduzierter EF HFrEF < 40 %\nHerzinsuffizienz mit leicht reduzierter EF HFmrEF 40–49 %\nHerzinsuffizienz mit erhaltener EF HFpEF ≥ 50 %\nZusätzlich klinische Klassifikation nach NYHA (I–IV).\nDie Patientin hat eine EF von 38 %. Was bedeutet das?\nEine EF von 38 % liegt unter 40 % → Diagnose: HFrEF (Herzinsuffizienz mit\nreduzierter Ejektionsfraktion). Das bedeutet, dass der linke Ventrikel nur 38 % des\nenddiastolischen Volumens bei jedem Herzschlag auswirft (Normwert: ≥ 55 %). Dieser\nBefund ist therapierelevant, da nur für HFrEF prognostisch wirksame Medikamente\nzugelassen sind.\nWie behandeln Sie?\nAllgemeinmaßnahmen:\n Flüssigkeitsbilanzierung und Gewichtskontrolle (täglich)\n Kochsalzrestriktion (< 2–3 g/Tag)\n Alkoholkarenz (besonders relevant bei dieser Patientin)\n Körperliche Aktivität: moderates Ausdauertraining (nach Kompensation)\n Impfungen: Grippe- und Pneumokokkenimpfung empfehlen\nMedikamentöse Therapie (HFrEF – prognostisch wirksam):\n1. ACE-Hemmer (Ramipril – bereits vorhanden) oder ARB / ARNI\n(Sacubitril/Valsartan)\n2. Betablocker (z. B. Carvedilol, Bisoprolol, Metoprolol succinate)\n3. Mineralokortikoidsantagonist (MRA) (Spironolacton oder Eplerenon)\n4. SGLT2-Hemmer (Dapagliflozin oder Empagliflozin)\n5. Schleifendiuretika zur Symptomkontrolle (z. B. Furosemid bei Ödemen)\nWelche Medikamente verbessern die Prognose?\nDie „Fantastic Four“ bei HFrEF:\n1. ACE-Hemmer / ARNI (z. B. Ramipril oder Sacubitril/Valsartan)\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n2. Betablocker (z. B. Bisoprolol, Carvedilol)\n3. MRA / Aldosteronantagonist (Spironolacton, Eplerenon)\n4. SGLT2-Hemmer (Dapagliflozin, Empagliflozin)\nAlle vier Substanzklassen reduzieren Mortalität und Hospitalisierung bei HFrEF\nnachwe nstoff\no Cystatin C (sensitiver Marker für GFR, unabhängig von Muskelmasse)\n Leberwerte: GOT, GPT, GGT, AP (bei Hepatitis, Medikamenten-NW)\n Blutgasanalyse (BGA): Oxygenierung, Säure-Basen-Haushalt (bei Dyspnoe und\nschwerer Pneumonie)\n Blutkulturen: Bei Fieber vor Antibiotikagabe (2 × aerob/anaerob)\n Urinantigentest: Legionellen-Antigen, Pneumokokken-Antigen\nHinweis des Prüfers zu Kreatinin: Bei älteren, kachektischen oder sehr\nschlanken Patienten mit reduzierter Muskelmasse kann das Serumkreatinin\ntrotz eingeschränkter Nierenfunktion niedrig wirken, weil weniger Kreatinin\nproduziert wird. Dadurch wird die Nierenfunktion (GFR/Kreatinin-Clearance)\nrechnerisch überschätzt. In solchen Fällen ist Cystatin C als\nmuskelmassenunabhängiger Marker zuverlässiger.\nFrage: Nach der Diagnose – wie gehen Sie vor?\nCRB-65-Score zur Schweregradeinschätzung und Entscheidung über den\nBehandlungsort:\nKriterium Punkte\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nKriterium Punkte\nC – Confusion (Bewusstseinsstörung) 1\nR – Respiratory rate ≥ 30/min 1\nB – Blood pressure (RR syst. < 90 mmHg oder diast. ≤ 60 mmHg) 1\n65 – Alter ≥ 65 Jahre 1\n 0 Punkte: Ambulante Behandlung möglich → orale Antibiotikatherapie\n 1–2 Punkte: Stationäre Aufnahme in Erwägung ziehen → ggf. i.v. Therapie\n 3–4 Punkte: Hohes Mortalitätsrisiko → stationäre Behandlung, ggf.\nIntensivstation, i.v. Antibiotika (vom Prüfer besonders betont)\nFrage: Welche Typen von Pneumonie kennen Sie?\n Typische Pneumonie: Akuter Beginn, Schüttelfrost, eitrig-rostbrauner Auswurf,\nLobärpneumonie; häufigster Erreger: Streptococcus pneumoniae\n Atypische Pneumonie: Schleichender Beginn, trockener Husten, interstitielles\nMuster im Röntgenbild; Erreger: Mycoplasma pneumoniae, Chlamydophila\npneumoniae, Legionella pneumophila\n Aspirationspneumonie: Durch Aspiration von Mageninhalt oder Fremdkörpern;\nhäufig im rechten Unterlappen\n Nosokomiale Pneumonie (HAP): Auftreten ≥ 48 h nach Krankenhausaufnahme;\nErreger: oft gramnegative Bakterien, Staphylococcus aureus (inkl. MRSA)\n Pneumocystis-Pneumonie (PCP): Bei Immunsupprimierten (HIV,\nChemotherapie); Erreger: Pneumocystis jirovecii\n Viruspneumonie: z. B. Influenza, SARS-CoV-2\nOffene Zusatzfrage am Ende der Prüfung\nFall: Ein Mann mit kolikartigen Oberbauchschmerzen erhält ein CT mit Kontrastmittel.\nZwei Tage später entwickelt er stark erhöhten Blutdruck und Schockzeichen.\nFrage: Was ist die Diagnose?\nAntwort: Thyreotoxische Krise\nErklärung: Jodhaltiges Kontrastmittel kann bei Patienten mit vorbestehender\nHyperthyreose (z. B. Morbus Basedow, autonomes Adenom, Jodmangelstruma) eine\nthyreotoxische Krise auslösen. Das überschüssige Jod stimuliert die Schilddrüse\nmassiv zur Hormonproduktion.\nTypische Symptome:\n Hochgradige Hyperthyreose: Tachykardie (>150/min), Hypertonie, Hyperthermie\n(>40 °C)\n Schockzeichen (kardiovaskuläres Versagen)\n Agitiertheit, Verwirrtheit, Koma\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\n Erbrechen, Diarrhö\nZeitlicher Verzug: Das Auftreten 2 Tage nach Kontrastmittelgabe ist typisch für diese\nKomplikation (Latenz durch Hormonausschüttung).\nTherapie (intensivmedizinisch):\n Thionamide (Thiamazol, Propylthiouracil) → Hemmung der Hormonsynthese\n Jodid (Lugolsche Lösung, erst nach Thionamid!) → Hemmung der\nHormonfreisetzung (Wolff-Chaikoff-Effekt)\n Betablocker (Propranolol) → Symptomkontrolle, Hemmung peripherer T4→T3-\nKonversion\n Kortikosteroide → Hemmung der peripheren T4→T3-Konversion\n Intensivmonitoring, Kühlungsmaßnahmen\nErklärung & Wichtige Anmerkungen\nZur Prüfung allgemein\nDie Prüfung umfasste drei Runden mit wechselnden Themen: Pharmakologie\n(Antikoagulation), Onkologie (Tumordiagnostik und -therapie), Kardiologie (EKG) und\nPneumologie (Pneumonie, Röntgen). Eine offene klinische Zusatzfrage wurde am Ende\ngestellt.\nWichtige inhaltliche Ergänzungen\nZu DOAKs: Der entscheidende Vorteil gegenüber VKA liegt neben der fehlenden INR-\nKontrolle auch im günstigeren Wechselwirkungsprofil, der oralen Einnahme mit fester\nDosierung und dem geringeren Risiko intrakranieller Blutungen. Für alle DOAKs (außer\nDabigatran) gibt es mittlerweile Antidots: Andexanet alfa (für Xa-Inhibitoren),\nIdarucizumab (für Dabigatran).\nZum Bridging: Moderne Leitlinien empfehlen für die meisten Patienten mit\nVorhofflimmern kein Bridging, da das Blutungsrisiko den Nutzen überwiegt. Bridging ist\nnur noch bei sehr hohem thromboembolischem Risiko (z. B. mechanische Herzklappen,\nkürzliche TVT < 3 Monate) indiziert.\nZum kolorektalen Karzinom: Der wichtigste Früherkennungstest ist die Koloskopie (ab\n50 Jahren, in Deutschland ab 55 Jahren als GKV-Leistung). Tumormarker (CEA, CA 19-\n9) sind nicht für die Diagnostik, sondern für die Verlaufskontrolle unter Therapie relevant.\nZum AV-Block III°: Ein AV-Block III° ist ein Notfall bei hämodynamischer Instabilität.\nUrsachen sind u. a. Myokardinfarkt (v. a. inferior → AV-Knoten), Digitalisintoxikation,\nElektrolytstörungen, Myokarditis, degenerativ. Die definitive Therapie ist ein\npermanenter Herzschrittmacher.\nZur Legionellen-Pneumonie: Legionellen sind gramnegative Stäbchen und wachsen in\nWasserleitungen (Klimaanlagen, Whirlpools, Krankenhäuser). Die Diagnose erfolgt\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\ndurch den Urin-Antigentest. Therapie: Fluorchinolone oder Makrolide (keine\nBetalaktame, da keine Zellwand bei intrazellulären Erregern).\nZur thyreotoxischen Krise: Vor jeder jodhaltigen Kontrastmittelgabe sollte bei\nRisikopatienten (bekannte Hyperthyreose, vergrößerte Schilddrüse, Jodmangel) eine\nSchilddrüsendiagnostik (TSH, fT3, fT4, Szintigraphie) erfolgen. Bei Bedarf ist eine\nprophylaktische Perchlorat-Gabe möglich.\nLernquellen & Lernmethode\nVerwendete Lernquellen\n 444 (Hauptlernbuch, alle Fälle)\n AMBOSS (nur die Hauptfälle)\n Rojhat (dreimal durchgelesen)\n ChatGPT (Pathophysiologie erklären lassen, nach Herold / Last Minute Pharma)\n YouTube-Kanal von Abood Al-Salahi (auf Arabisch, für visuelle Lernphasen)\n Kenntniskurs bei Fadi Jarbouh\n Prüfungsprotokolle (seit Juli, alle neuen Fragen analysiert und auf 444\neingetragen)\n Simulationen der Hauptfälle (je zweimal)\nLernmethode\n Ca. 1 Jahr Lernzeit, zunächst mit einer Lernpartnerin (444 + Rojhat 3×), danach\nalleine mit zwei weiteren Wiederholungen.\n Letzte 2 Monate: Zwei Wiederholungsdurchläufe (einmal in einem Monat, einmal\nin zwei Wochen).\n Letzte 5 Tage: Gezielte Fachwiederholung (Kardiologie, Gastroenterologie,\nNeurologie in 4 Tagen; Pneumologie, Endokrinologie, Urologie, Infektiologie,\nWunden/Medikamente/Verbrennungen/ASA am letzten Tag).\n Prüfungsmorgen: Schnelle Übung von Anamnese und körperlicher\nUntersuchung mit dem Ehemann.\nPersönliche Einschätzung der Kandidatin\n„Glaubt nicht allen Kollegen, wenn sie schreiben: ‚Ich habe nur zwei Monate\ngelernt.’ Solche Aussagen sind oft nicht realistisch. Wenn ihr wirklich bestehen\nwollt, nehmt die Prüfung ernst. Man muss viele Informationen auswendig\nlernen, regelmäßig trainieren und in der Prüfung zeigen, dass man bewusst,\nstrukturiert und sicher handelt.“\nDank an alle unterstützenden Personen und an Ruslan. Viel Erfolg für alle!\nNeue Fälle finden Sie auf dem Kanal: https://t.me/KP_Niedersachsen_Gekocht\nFall 50\nPrüfungsprotokoll – Kenntnisprüfung\nDatum der Nachricht: 08. Mai 2026 Datum der Prüfung: Dienstag, 05. Mai 2026,\n14:00 Uhr Ergebnis: Bestanden ✅\nErfahrungsbericht einer Kollegin, weitergeteilt zur Unterstützung anderer\nKandidaten.\nPrüfungsfall: Herzinsuffizienz (HI)\nAnamnese und körperliche Untersuchung: Verlief gut. Die Prüferin hat lediglich\nbeobachtet und darauf hingewiesen, dass eine vollständige körperliche\nUntersuchung durchzuführen ist. Hilfsmittel im Raum: Eine Uhr war im\nPrüfungszimmer vorhanden.", "clinical_case": "**Hauptsymptom:** Fall 42\n\n**Status:** Keine Fragen verfügbar."}, "Fall_43": {"case_info": "Fall 43\nEntzündungsmarker – Zeitlicher Anstieg und\nklinische Bedeutung\nDatum der Nachricht: 04. Mai 2026, 07:42 Uhr\nPrüfungsdatum: – (nicht angegeben)\n\n1. Zeitlicher Anstieg der Entzündungsmarker nach\ninflammatorischem Stimulus\nAls Modell dient die bakterielle Sepsis als klassischer inflammatorischer Stimulus. Die\nMarker steigen in folgender zeitlicher Reihenfolge an:\nMarker\nIL-6\n\nBeginn des Anstiegs\n~1–2 Stunden\n\nPCT\n\n~2–4 Stunden\n\nPlateau /\nMaximum\nRasch, kurze\nHWZ (<1 h)\n12–48 Stunden\n\nCRP\n\n~6–12 Stunden\n\n24–72 Stunden\n\nLeukozyten Minuten (Stress) bis\nStunden (Infektion)\n\nKein verlässliches\nMuster\n\nBesonderheit\nFrühester und sensibelster\nMarker\nSpezifisch für bakterielle\nInfektionen\nAbhängig von hepatischer\nIL-6-Stimulation\nUnspezifisch, stark\nvariabel\n\nInterleukin-6 (IL-6)\n\n\n\n\nFrühester Marker; messbar bereits 1–2 Stunden nach dem Stimulus\nKurze Halbwertszeit von unter einer Stunde → reflektiert das aktuelle\nEntzündungsgeschehen sehr zeitnah\nWirkt als unmittelbares „Alarm-Zytokin“ direkt nach Makrophagenstimulation\n\nProcalcitonin (PCT)\n\n\n\n\n\nAnstieg beginnt 2–4 Stunden nach Induktion\nPlateau erst nach 12–48 Stunden durch de-novo-Synthese in extrathyreoidalen\nGeweben\nReagiert zeitversetzt zu IL-6, aber deutlich schneller als CRP\nHohe Spezifität für bakterielle Infektionen\n\nC-reaktives Protein (CRP)\n\n\nFolgt dem IL-6-Anstieg mit einer Latenz von 6–12 Stunden\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nUrsache: CRP wird erst nach hepatischer Stimulation durch IL-6 in Hepatozyten\nsynthetisiert (Translationsphase erforderlich)\nZuverlässiger Verlaufsparameter mit enger Korrelation zum\nSchweregradgeschehen\n\nLeukozyten\n\n\n\n\n\nKein klassisches Akute-Phase-Protein, daher kein fester kinetischer Zeitplan\nZwei Mechanismen:\no Demargination (Minuten): Ablösen von Leukozyten vom Gefäßendothel\ndurch Adrenalin/Stress – rein hämodynamisch, nicht infektionsspezifisch\no Knochenmarkmobilisierung (Stunden): Durch G-CSF, IL-1, TNF-α bei\nbakterieller Infektion; beginnt nach mehreren Stunden, jedoch hochgradig\nvariabel\nLeukopenie möglich bei Erschöpfung der Knochenmarkreserven (z. B. schwere\nSepsis)\n\n2. Physiologische Mechanismen der Entzündungskaskade\n1. Erkennung von PAMPs (pathogenassoziierte molekulare Muster) durch Tolllike-Rezeptoren auf Makrophagen und Monozyten → Aktivierung der\nEntzündungskaskade\n2. IL-6-Ausschüttung: Makrophagen sezernieren IL-6 nahezu unmittelbar nach\nStimulation → IL-6 messbar nach ~1–2 h\n3. PCT-Produktion: Durch proinflammatorische Zytokine (IL-6, IL-1β, TNF-α) wird\nPCT in fast allen Geweben (extrathyreoidale Expression) de novo synthetisiert →\nAnstieg nach 2–4 h, Plateau nach 12–48 h\n4. CRP-Synthese (hepatische Phase): IL-6 stimuliert Hepatozyten zur Produktion\nvon Akute-Phase-Proteinen (darunter CRP) → Anstieg erst nach 6–12 h Latenz\ndurch erforderliche Translationsphase\n5. Leukozytenmobilisierung (zelluläre Reaktion): Durch Zytokine, Endotoxine\nund Stresshormone (Cortisol, Adrenalin) → kein lineares kinetisches Muster,\nabhängig von Knochenmarkreserve\n\n3. Warum Leukozyten ein unzuverlässiger Marker sind\n\n\n\n\n\nKeine lineare Korrelation mit dem Ausmaß der Infektion\nSchneller (nicht infektionsspezifischer) Anstieg durch Demargination bei Stress,\nTrauma oder Adrenalinausschüttung (innerhalb von Minuten)\nFalsch-positive Befunde durch Steroide: Glukokortikoide provozieren eine\nNeutrophilie durch Demargination, ohne dass eine Infektion vorliegen muss\nFalsch-negative Befunde: Leukopenie bei schwerer Sepsis möglich\n(Erschöpfung der Knochenmarkreserven)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nMaskierung durch laufende Kortikosteroidtherapie\nHohe interindividuelle Schwankungsbreite → keine validen Schwellenwerte (Cutoff-Werte) definierbar\n\nFazit zur Leukozytenzahl:\nDie Leukozytenzahl eignet sich nicht zur zeitlichen Einordnung eines Infekts\nund sollte ausschließlich in der Gesamtschau (zusammen mit anderen\nParametern) bewertet werden.\n\n4. CRP vs. Leukozyten – klinischer Vergleich\nKriterium\nArt der Antwort\nKinetik\nSpezifität\nKorrelation zum\nSchweregrad\nCut-off-Werte\nmöglich?\nStörfaktoren\nKlinischer Einsatz\n\nCRP\nHepatisches Akute-PhaseProtein\nVerzögert, aber verlässlich\n(6–12 h)\nHoch (für systemische\nEntzündung)\nEng, quantitativ\nJa (z. B. bei Appendizitis,\nCholezystitis)\nGering\nVerlaufsparameter,\nSchweregrad\n\nLeukozyten\nZelluläre Mobilisierung\n(Knochenmark + Demargination)\nSofort bis Stunden, kein festes\nMuster\nNiedrig (beeinflusst durch Stress,\nSteroide, Körperbelastung)\nSchwach, interindividuell sehr\nvariabel\nKaum (zu hohe Streubreite)\nStark (Stress, Steroide,\nAnstrengung)\nNur in Zusammenschau mit\nanderen Markern\n\n5. Klinische Zusammenfassung\n\n\n\n\n\nIL-6: Sensitivster Frühindikator einer systemischen Entzündung (Anstieg nach\n~1–2 h); aufgrund kurzer Halbwertszeit ideal für die Verlaufskontrolle in der\nFrühphase\nPCT: Bester Marker für bakterielle Infektionen (Anstieg nach ~2–4 h, Plateau\nnach 12–48 h); etabliert zur Steuerung der Antibiotikatherapie und zur\nVerlaufsbeurteilung\nCRP: Zuverlässiger Verlaufsparameter für systemische Entzündung; quantitativ\ngut korreliert mit dem Schweregrad; definierte Schwellenwerte für verschiedene\nErkrankungen vorhanden\nLeukozyten: Unspezifisch, variabel, stark störanfällig → nicht zur isolierten\nzeitlichen Einordnung einer Infektion geeignet; sollten stets im klinischen\nGesamtkontext bewertet werden\nMerksatz: IL-6 → PCT → CRP (zeitliche Reihenfolge des Anstiegs).\nLeukozyten folgen keinem verlässlichen Muster.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n6. Erklärung und wichtige Hinweise\nPathophysiologisches Grundprinzip\nDie zeitlich versetzte Kinetik der Marker ergibt sich direkt aus ihrer Position in der\nSignalkaskade:\n\n\n\n\n\nIL-6 ist ein primäres Zytokin – es wird direkt von aktivierten Makrophagen\nsezerniert und benötigt keine weitere Synthesestufe\nPCT erfordert eine zytokinvermittelte Stimulation verschiedener Gewebe zur denovo-Synthese → zeitlich verzögert\nCRP erfordert zusätzlich die hepatische Proteinsynthese (Translationsphase) →\nweitere Verzögerung\nLeukozyten unterliegen einer physiologischen Regulationsebene (Speicherpools,\nKnochenmarkreserve), die von keiner einfachen biochemischen Kaskade\ngesteuert wird\n\nWichtige klinische Fallstricke\n1. Steroidtherapie kann eine Leukozytose imitieren (Demargination) und sowohl\nCRP als auch PCT supprimieren → Interpretation im klinischen Kontext zwingend\nnotwendig\n2. Immunsupprimierte Patienten (z. B. Chemotherapie, HIV) können trotz\nschwerer Sepsis eine Leukopenie zeigen → Leukozytenzahl als Infektmarker in\ndieser Population besonders unzuverlässig\n3. Virale Infektionen: PCT bleibt häufig niedrig, IL-6 und CRP können erhöht sein\n→ PCT hilft bei der Differenzierung bakteriell vs. viral\n4. Diskordante Befunde (z. B. CRP normal + Leukozyten erhöht): Spricht für sehr\nfrühen Infektzeitpunkt oder rein stressbedingte Reaktion; umgekehrt (CRP erhöht\n+ Leukozyten normal) häufig bei immunsupprimierten Patienten\n5. IL-6 ist im Routinelabor vieler Häuser nicht sofort verfügbar → PCT als\npraktischer Frühmarker oft bevorzugt\n\nMerkhilfe – Zeitliche Abfolge\nStimulus\n│\n├──► 1–2 h:\nIL-6 ↑ (Alarm-Zytokin)\n│\n├──► 2–4 h:\nPCT ↑\n(bakterielle Antwort, de-novo-Synthese)\n│\n├──► 6–12 h:\nCRP ↑\n(hepatische Synthese)\n│\n└──► variabel: Leukozyten ↑/↓ (kein verlässliches Muster)\n\nBearbeitet: 29. Mai 2026\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 43\n\n**Status:** Keine Fragen verfügbar."}, "Fall_44": {"case_info": "Fall 44\nPrüfungsprotokoll – Medizinische Kenntnisprüfung\nPrüfungsdatum: Donnerstag, 30. April 2026, 09:45 Uhr Datum der Nachricht: 04. Mai\n2026 Ergebnis: Bestanden (2/3)\n\nPrüfungsfälle\n\n\n\n\nFall 1 (eigener Fall): pAVK\nFall 2: Herzinfarkt (HI)\nFall 3: Divertikulitis\n\nFall 1: pAVK\nAnamnese\nPatientin: Frau Sobik, 76 Jahre alt Vorstellungsgrund: Seit 2 Tagen stechende, in\nRuhe aufgetretene Schmerzen im gesamten rechten Bein in der zentralen Notaufnahme\n(ZNA).\nAktuelle Beschwerden:\n\n\n\n\n\nStechende Ruheschmerzen im gesamten rechten Bein seit 2 Tagen\nÄhnliche Beschwerden seit ca. 3 Jahren bekannt, jedoch bislang geringere\nIntensität\nKältegefühl im betroffenen Bein\nParästhesien und Hypästhesie im betroffenen Bein\n\nVerneint: Rückenschmerzen, Trauma, Dyspnoe, Thoraxschmerzen, Fieber\nVegetative Anamnese: Unauffällig, außer schmerzbedingter Insomnie\n\nVorerkrankungen (VE)\n\n\n\nArterielle Hypertonie (aHT) – seit 6 Monaten\nDiabetes mellitus Typ 2 (DM2) – seit 6 Monaten\n\nVoroperationen (VOPs)\n\n\n\nAppendektomie vor 50 Jahren (Narbe bei der körperlichen Untersuchung\nbestätigt)\nHemithyreoidektomie\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nSalpingektomie (Eileiterentfernung) (Narbe bei der körperlichen Untersuchung\nbestätigt)\nOperation im Hüftbereich (Narbe bei der körperlichen Untersuchung festgestellt;\nPatientin/Schauspielerin hatte diese OP während der Anamnese nicht erwähnt;\nGrund der OP unbekannt)\n\nMedikamente\n\n\n\n\nRamipril 5 mg\nMetformin (Dosis unbekannt)\nL-Thyroxin (Dosis unbekannt)\n\nAllergien\nKeine bekannt\n\nNoxen\n\n\n\nNikotin: Ehemalige Raucherin; aufgehört vor 2 Jahren. Zuvor 1 Packung täglich\nseit dem 17. Lebensjahr → Packyears: ca. 57 py (ca. 57 Jahre Rauchdauer × 1\nPackung/Tag)\nAlkohol: Gelegentlich, 2× wöchentlich\n\nFamilienanamnese\n\n\n\nVater: Verstorben an Schlaganfall\nMutter: Diabetes mellitus, arterielle Hypertonie\n\nSozialanamnese\n\n\n\nVerheiratet\nRentnerin; früher Bankkauffrau\n\nKörperliche Untersuchung (KU)\nVorgehen:\n1. Händedesinfektion\n2. Vitalparameter: Herzfrequenz, Blutdruck beidseits, Atemfrequenz\n3. Inspektion beider Beine von proximal nach distal\n4. Pulsstatus: A. temporalis superficialis → A. dorsalis pedis (beidseits)\n5. Palpation: Eindrückbares Ödem am linken Unterschenkel (echtes Befund)\n6. Untersuchung von Herz, Lunge und Abdomen\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n7. Neurologische Untersuchung: Zeitlich nicht mehr möglich (vom Prüfer akzeptiert\n– eine vollständige Untersuchung ist nicht zwingend erforderlich)\nHinweis: Die Untersuchung wurde ohne Handschuhe durchgeführt. Der Prüfer\nbeobachtete ohne Unterbrechung.\n\nArztbrief\nDie Zeit für Anamnese, körperliche Untersuchung und Arztbrief war mehr als\nausreichend.\n\nPrüfungsgespräch – Erste Runde\nVerdachtsdiagnose und Differentialdiagnosen\nVerdachtsdiagnose: pAVK (periphere arterielle Verschlusskrankheit)\nDifferentialdiagnosen:\n\n\n\n\n\nTiefe Venenthrombose (TVT)\nAkuter Extremitätenverschluss\nDiskusprolaps\nErysipel\n\nThemenblock: Erysipel\nWas ist ein Erysipel? Eine akute, nicht-eitrige Infektion der oberflächlichen Dermis und\nder kutanen Lymphgefäße, verursacht durch bakterielle Erreger. Es handelt sich um\neine flächenhafte, scharf begrenzte, livide Rötung mit überwärmter Haut, begleitet von\nAllgemeinsymptomen wie Fieber und Schüttelfrost.\nWelche Erreger verursachen ein Erysipel? Haupterreger: β-hämolysierende\nStreptokokken der Gruppe A (Streptococcus pyogenes). Selten auch Staphylokokken\noder Gruppe-C/G-Streptokokken.\nWas spricht gegen Erysipel bei unserer Patientin?\n\n\n\n\n\n\nKeine Rötung oder Überwärmung der Haut beschrieben\nKein Fieber\nSchmerzen betreffen das gesamte Bein (Erysipel ist meist umschrieben)\nLangjährige Vorgeschichte ähnlicher Beschwerden (eher vaskuläre Genese)\nKältegefühl und Parästhesien sprechen für arterielle Ischämie, nicht für Infektion\n\nTherapie des Erysipels?\n\n\nMittel der Wahl: Penicillin G i.v. (stationär) oder Penicillin V p.o. (ambulant, bei\nleichtem Verlauf)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nAlternative: Amoxicillin, Cefalexin\nBei Penicillin-Allergie: Clindamycin oder Makrolide (z. B. Erythromycin)\nLokal: Kühlung, Hochlagerung, Bettruhe\n\nWirkmechanismus von Penicillin? Penicillin hemmt die bakterielle Zellwandsynthese\ndurch irreversible Bindung an Penicillin-bindende Proteine (PBPs), welche\nTranspeptidasen sind. Dadurch wird die Quervernetzung der Peptidoglykanketten\ngestört → osmotische Lyse der Bakterien. Penicillin wirkt nur auf wachsende Bakterien\n(bakterizid).\nWirkmechanismus von Clindamycin? Clindamycin ist ein Lincosamid-Antibiotikum. Es\nbindet reversibel an die 50S-Untereinheit des bakteriellen Ribosoms und hemmt die\nProteinbiosynthese (bakteriostatisch). Es wirkt gegen grampositive Erreger und\nAnaerobier.\nWelche Antibiotikagruppen wirken auf die bakterielle Zellwand?\n\n\n\n\nBeta-Laktam-Antibiotika: Penicilline, Cephalosporine, Carbapeneme,\nMonobaktame\nGlykopeptide: Vancomycin, Teicoplanin (hemmen Quervernetzung von außen)\nFosfomycin (hemmt frühen Schritt der Zellwandsynthese)\n\nWie viele Generationen haben Cephalosporine, und was ist der Unterschied? Es\ngibt 5 Generationen:\n\n\n\n\n\n\n1. Generation (z. B. Cefalexin, Cefazolin): Hauptsächlich wirksam gegen\ngrampositive Erreger (z. B. Staphylokokken, Streptokokken); geringe Aktivität\ngegen gramnegative Bakterien.\n2. Generation (z. B. Cefuroxim, Cefaclor): Erweiterte Aktivität gegen\ngramnegative Erreger (z. B. H. influenzae, E. coli), grampositive Aktivität leicht\nreduziert.\n3. Generation (z. B. Cefotaxim, Ceftriaxon, Ceftazidim): Breites Spektrum gegen\ngramnegative Erreger; Ceftazidim auch gegen Pseudomonas aeruginosa;\ngeringere Aktivität gegen grampositive Erreger.\n4. Generation (z. B. Cefepim): Breites Spektrum gegen grampositive und\ngramnegative Erreger einschließlich Pseudomonas; Stabilität gegenüber BetaLaktamasen.\n5. Generation (z. B. Ceftarolin): Auch wirksam gegen MRSA\n(methicillinresistente Staphylococcus aureus).\nMerke: Zunehmende Generation → zunehmende gramnegative Wirkung,\nabnehmende grampositive Wirkung (außer 4./5. Gen.).\n\nMuss ein Erysipel stationär behandelt werden? Nicht zwingend. Leichte Fälle können\nambulant mit oralen Antibiotika (Penicillin V) behandelt werden. Eine stationäre\nBehandlung ist indiziert bei:\n\n\n\nSchwerem Verlauf oder ausgeprägten Allgemeinsymptomen\nKomplikationen (z. B. bullöses Erysipel, Abszessbildung)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nImmunsuppression oder schwerer Komorbidität\nFehlendem Ansprechen auf orale Therapie\n\nWelche Komplikationen kann ein Erysipel haben?\n\n\n\n\n\nLokale Komplikationen: Bullöses Erysipel, Phlegmone, Abszessbildung,\nNekrotisierende Fasziitis\nSystemische Komplikationen: Sepsis, septischer Schock\nLymphatische Komplikationen: Chronisches Lymphödem, rezidivierendes\nErysipel (Rezidivrisiko ~20–30 %)\nSelten: Streptokokken-Toxic-Shock-Syndrom\n\nThemenblock: Tiefe Venenthrombose (TVT)\nWie entsteht ein Thrombus bei TVT (Pathomechanismus)? Laut Virchow-Trias\nentstehen Thromben durch das Zusammenwirken von drei Faktoren:\n1. Veränderungen der Gefäßwand (Endothelschäden): z. B. durch Trauma,\nEntzündung, Katheter\n2. Veränderungen der Blutströmung (Stase): z. B. durch Immobilisation,\nHerzinsuffizienz\n3. Veränderungen der Blutzusammensetzung (Hyperkoagulabilität): z. B.\nThrombophilie, Malignome, Kontrazeptiva\nDer Prüfer wollte insbesondere die Aktivierung der Gerinnungskaskade\nansprechen, nicht eine zu detaillierte Erklärung.\nTherapie der TVT?\n\n\n\n\nSoforttherapie: Antikoagulation mit Heparin (unfraktioniert oder niedermolekular)\noder direkte orale Antikoagulanzien (DOAK; z. B. Rivaroxaban, Apixaban – initial\nin therapeutischer Dosierung)\nLangzeittherapie: Orale Antikoagulation für mindestens 3 Monate (bei\nidiopathischer TVT ggf. länger), mit DOAK oder Vitamin-K-Antagonisten (VKA)\nUnterstützend: Kompressionsstrümpfe Klasse II, Mobilisierung, Hochlagerung\n\nWirkmechanismus von Heparin? Heparin bindet an Antithrombin III (AT III) und\nverstärkt dessen Hemmwirkung auf Thrombin (Faktor IIa) und Faktor Xa (sowie IXa, XIa,\nXIIa) um den Faktor 1000. Dadurch wird die Gerinnungskaskade gebremst.\nNiedermolekulares Heparin (NMH) hemmt vorwiegend Faktor Xa.\nWirkmechanismus der DOAK?\n\n\n\nFaktor-Xa-Inhibitoren (z. B. Rivaroxaban, Apixaban, Edoxaban): Direkte,\nreversible Hemmung von Faktor Xa → Unterbrechung der gemeinsamen\nEndstrecke der Gerinnungskaskade.\nThrombininhibitoren (z. B. Dabigatran): Direkte, reversible Hemmung von\nThrombin (Faktor IIa) → keine Umwandlung von Fibrinogen zu Fibrin.\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nWirkmechanismus der Vitamin-K-abhängigen Antikoagulanzien (VKA, z. B.\nPhenprocoumon/Warfarin)? VKA hemmen das Enzym Vitamin-K-Epoxid-Reduktase in\nder Leber. Dadurch fehlt reduziertes (aktives) Vitamin K für die Carboxylierung der\nGerinnungsfaktoren II, VII, IX und X sowie der Proteine C und S → Diese Faktoren sind\nfunktionell inaktiv → verzögerte Antikoagulation (Wirkungseintritt nach 2–3 Tagen).\n\nThemenblock: pAVK\nFontaine-Stadien der pAVK:\nStadium\nI\nIIa\nIIb\nIII\nIV\n\nBeschreibung\nAsymptomatisch; Stenose ohne Beschwerden\nBelastungsschmerz (Claudicatio intermittens) bei Gehstrecke > 200 m\nBelastungsschmerz bei Gehstrecke < 200 m\nRuheschmerz (v. a. nachts, Besserung durch Herabhängen des Beins)\nTrophische Störungen: Nekrosen, Ulzera, Gangrän\n\nUnsere Patientin: Stadium III (Ruheschmerzen seit 2 Tagen;\nBelastungsschmerzen seit 3 Jahren → vorher wahrscheinlich Stadium II)\nTherapie der pAVK:\nKonservativ (alle Stadien):\n\n\n\nRisikofaktormodifikation: Nikotinverzicht (wichtigste Maßnahme!), optimale\nEinstellung von Diabetes und Hypertonie, Statine,\nThrombozytenaggregationshemmer (ASS 100 mg oder Clopidogrel)\nGehtraining (strukturiertes Laufbandtraining, besonders wirksam im Stadium II)\n\nInterventionell/operativ (ab Stadium IIb–IV):\n\n\n\n\nPerkutane transluminale Angioplastie (PTA) ± Stent\nBypass-Operation (z. B. femoro-poplitealer Bypass)\nThrombendarteriektomie (TEA)\n\nBei kritischer Ischämie (Stadium III–IV):\n\n\n\n\nStationäre Aufnahme, Analgesie (z. B. Prostaglandine i.v.: Alprostadil)\nRevaskularisierung anstreben (interventionell oder operativ)\nBei nicht rekonstruierbarem Gefäßstatus: Amputation\n\nPrüfungsgespräch – Zweite Runde\nEKG 1: Vorderwandinfarkt\nBefund: ST-Hebungen in V1, V2, V3, V4, V5\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nDiagnose: Akuter ST-Hebungsmyokardinfarkt (STEMI) der Vorderwand\n(anterobasaler/anteroaptikaler Infarkt)\nWelche Koronararterie ist betroffen? Der Ramus interventricularis anterior (RIVA),\nauch Left Anterior Descending Artery (LAD) genannt – ein Ast der linken Koronararterie\n(LCA). Der RIVA versorgt die anteriore Wand des linken Ventrikels, den Apex, das\nanteriore Interventrikularseptum sowie den vorderen Teil des rechten Ventrikels. Bei\nVerschluss in proximalen Segmenten: Beteiligung auch von V1–V2 (Septum).\nVorgehen beim Myokardinfarkt (STEMI-Management):\n1. Sofortmaßnahmen: Sauerstoff (nur bei SpO₂ < 90 %), i.v.-Zugang, Monitoring\n(EKG, Blutdruck, Pulsoxymetrie), 12-Kanal-EKG-Bestätigung\n2. Medikamentös: Aspirin 300 mg p.o. (Loading dose) + P2Y₁ ₂ -Inhibitor\n(Ticagrelor 180 mg oder Prasugrel 60 mg, ggf. Clopidogrel 600 mg),\nAntikoagulation (Heparin i.v. oder Fondaparinux)\n3. Reperfusionstherapie (Ziel: Door-to-balloon < 90 min):\no Primäre perkutane Koronarintervention (PCI) – Methode der Wahl\no Alternativ: Thrombolyse (falls PCI nicht innerhalb von 120 min möglich)\n4. Begleitend: Betablocker (falls keine Kontraindikation), ACE-Hemmer, Statin\n(hochdosiert)\n5. Monitoring und Nachsorge: Intensivstation/Chest Pain Unit, Echokardiographie\n\nEKG 2: AV-Block Grad II, Typ Mobitz II\nBefund: Plötzlicher Ausfall einer P-Welle ohne vorherige Verlängerung des PQIntervalls; PQ-Intervall konstant\nDiagnose: AV-Block Grad II, Typ Mobitz II (im Gegensatz zu Typ Wenckebach, bei dem\ndas PQ-Intervall sich progressiv verlängert bis zum Ausfall)\nWas sind die Ursachen des AV-Blocks?\n\n\n\n\n\n\nKardiologisch: Koronare Herzkrankheit (v. a. Hinterwandinfarkt), Myokarditis,\nKardiomyopathie, Herzchirurgie/Ablation, Kalkifizierung des Reizleitungssystems\n(Lenègre-Syndrom, Lev-Syndrom)\nMetabolisch/toxisch: Hyperkaliämie, Hyperkalzämie, Azidose, Digoxin-Toxizität,\nBetablocker, Kalziumkanalblocker, Antiarrhythmika (z. B. Amiodaron)\nInfektiös/entzündlich: Borreliose (Lyme-Karditis), Sarkoidose, Endokarditis\nAngeboren: Kongenitaler AV-Block (z. B. bei maternalen Anti-Ro/La-Antikörpern)\nIatrogen: Nach Herzchirurgie, Katheterablation\n\nTherapie des AV-Blocks:\n\n\n\nGrad I und II Typ Wenckebach: Meist keine Therapie notwendig, ggf.\nauslösende Ursache behandeln (z. B. Medikamente absetzen)\nGrad II Typ Mobitz II: Hohes Progressionsrisiko zum totalen AV-Block →\nHerzschrittmacher-Implantation indiziert\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nGrad III (totaler AV-Block): Herzschrittmacher zwingend erforderlich\nAkut (hämodynamisch instabil): Atropin i.v. (0,5–1 mg), ggf. transthorakale\nStimulation, temporärer transvenöser Schrittmacher\n\nBlutgasanalyse: Metabolische Azidose\nBefund: pH erniedrigt, HCO₃ ⁻ erniedrigt, pCO₂ erniedrigt\nDiagnose: Metabolische Azidose mit respiratorischer Kompensation\nWarum ist pCO₂ erniedrigt? Bei metabolischer Azidose sinkt der pH-Wert →\nStimulation des Atemzentrums (periphere und zentrale Chemorezeptoren) →\nkompensatorische Hyperventilation → vermehrte CO₂ -Abatmung → Abfall des pCO₂\n→ Verschiebung des Gleichgewichts CO₂ + H₂ O ⇌ H₂ CO₃ ⇌ H⁺ + HCO₃ ⁻ nach\nlinks → leichter Anstieg des pH. Diese Kompensation ist jedoch nie vollständig.\nFormel zur Erwartung der Kompensation (Winter-Formel): Erwartetes pCO₂ = 1,5 ×\nHCO₃ ⁻ + 8 ± 2 mmHg\n\nRöntgenbild: Pneumothorax\nDiagnose: Pneumothorax\nTypische Röntgenbefunde:\n\n\n\n\n\nFehlende Gefäßzeichnung im betroffenen Lungenabschnitt (avascular zone)\nSichtbare Pleuragrenze (viszerale Pleura als zarte Linie)\nMediastinalverlagerung zur Gegenseite bei Spannungspneumothorax\nTiefstehendes Zwerchfell ipsilateral bei großem Pneumothorax\n(Nur Diagnose wurde verlangt)\n\nTNM-Staging: pT3N1M0\nWas bedeutet dieses Staging?\n\n\n\n\n\np = pathologisch bestätigt (histologisch, nicht klinisch)\nT3 = Tumor hat eine bestimmte Größe oder Ausdehnung überschritten bzw.\nbenachbarte Strukturen infiltriert (genaue Definition ist organspezifisch)\nN1 = Metastasen in regionären Lymphknoten (eine Lymphknotengruppe/1–3\nLymphknoten befallen, je nach Organ)\nM0 = Keine Fernmetastasen nachgewiesen\n\nWas bedeutet Mx? Mx = Fernmetastasen können nicht beurteilt werden (keine\nausreichende Diagnostik durchgeführt). In modernen TNM-Klassifikationen wird Mx\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nkaum noch verwendet; bevorzugt wird M0 (keine Fernmetastasen) oder M1\n(Fernmetastasen vorhanden).\n\nAnaphylaktischer Schock nach Kontrastmittelgabe\nFallbeschreibung: Patient nach CT mit Kontrastmittel entwickelt Tachykardie,\nHypotonie, Dyspnoe.\nVerdachtsdiagnose: Anaphylaktischer Schock (Kontrastmittelallergie)\nTherapie des anaphylaktischen Schocks (Sofortmaßnahmen):\n1. Auslöser sofort stoppen (Kontrastmittelinfusion abklemmen)\n2. Adrenalin (Epinephrin) 0,5 mg i.m. in den Oberschenkel (Vastus lateralis) – bei\nErwachsenen; Wiederholung nach 5 min möglich\n3. Volumenersatz: NaCl 0,9 % oder Ringer-Lösung i.v. (500–1000 ml rasch)\n4. Sauerstoffgabe: 10–15 l/min über Maske; ggf. At Schmerz), Fieber, Übelkeit, Erbrechen, Murphy-Zeichen positiv\nLabor: Leukozytose, erhöhtes CRP, ggf. erhöhte Leberenzyme bei Stauung\nSonographie: Verdickte Gallenblasenwand (> 4 mm), perikolezystische\nFlüssigkeit, Gallensteine/Sludge, positives sonographisches Murphy-Zeichen\nGgf. CT-Abdomen bei unklarem Befund\n\nTherapie:\n\n\n\n\nKonservativ (leichte Fälle): Nahrungskarenz, i.v.-Flüssigkeit, Analgesie (z. B.\nMetamizol, Diclofenac), Antibiotika (z. B. Ampicillin/Sulbactam oder\nCephalosporin + Metronidazol)\nOperativ: Laparoskopische Cholezystektomie – Methode der Wahl; idealerweise\ninnerhalb von 24–72 h nach Symptombeginn (frühe Cholezystektomie ist der\nverzögerten überlegen)\nProphylaktische Cholezystektomie bei asymptomatischer Cholezystolithiasis nur\nin Ausnahmefällen (z. B. bei Porzellangallenblase, großen Steinen > 3 cm,\nImmunsuppression)\n\nKann ein Gallenblasenstein Ikterus verursachen?\nNein – ein Gallenblasenstein allein verursacht keinen Ikterus, da er den Gallenfluss aus\nder Leber nicht blockiert. Die Gallenblase ist ein Reservoir, kein obligater Abflussweg.\nWann kann eine Cholezystolithiasis Ikterus verursachen?\n\n\nCholedocholithiasis: Wenn ein Stein aus der Gallenblase in den Ductus\ncholedochus migriert und diesen blockiert → Cholestase, Ikterus\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nMirizzi-Syndrom: Ein großer Gallenblasenstein im Collum vesicae oder im\nDuctus cysticus drückt von außen auf den Ductus hepaticus communis →\nmechanischer Ikterus durch extrinsische Kompression (kein intraluminaler Stein\nim Hauptgallengang!)\n\nMurphy-Zeichen\nDefinition: Klinisches Zeichen bei Cholezystitis.\nDurchführung:\n1. Der Untersucher legt die Finger unter den rechten Rippenbogen in der\nMedioklavikularlinie (Projektion der Gallenblase).\n2. Der Patient wird aufgefordert, tief einzuatmen.\n3. Beim tiefen Einatmen senkt sich das Zwerchfell → die entzündete Gallenblase\nbewegt sich nach kaudal un aVF); meist mit fester AV-Blockierung überltet (z. B. 2:1\n→ HF ~150/min; 3:1 → HF ~100/min)\nBeschreibung\n„Absolute Arrhythmie“ – völlig unregelmäßige RR-Abstände,\nkeine sichtbaren P-Wellen, unruhige Basislinie\nUnregelmäßig; mindestens 3 verschiedene P-WellenMorphologien in einer Ableitung; häufig bei COPD oder\nElektrolytentgleisungen\n\n2. Breitkomplex-Tachykardien (QRS ≥ 0,12 Sekunden)\nDiese Rhythmen entstehen entweder direkt in den Herzkammern (ventrikulär) oder\nsupraventrikulär mit aberranter (gestörter) Überleitung, z. B. bei einem vorbestehenden\nSchenkelblock oder bei akzessorischen Leitungsbahnen.\nRegelmäßig (Rhythmisch)\nRhythmus\nMonomorphe Ventrikuläre\nTachykardie (VT)\n\nSupraventrikuläre\nTachykardie mit Aberranz\n(SVT mit Schenkelblock)\n\nIrregulär (Arrhythmisch)\nRhythmus\nPolymorphe\nVentrikuläre\nTachykardie / Torsade\nde pointes\nVorhofflimmern bei\nPräexzitation (z. B.\nWPW-Syndrom)\n\nBeschreibung\nAlle breiten QRS-Komplexe haben dieselbe Morphologie;\nHerzfrequenz meist 100–250/min; AV-Dissoziation,\nFusionsschläge und Capture-Beats sind beweisend für\nventrikulären Ursprung\nEigentlich supraventrikulärer Rhythmus, der aufgrund\neines (funktionellen oder vorbestehenden)\nSchenkelblocks breit erscheint; Unterscheidung zur VT\nklinisch und elektrokardiographisch oft schwierig (→\nAlgorithmen: Brugada, Vereckei)\n\nBeschreibung\nBreite QRS-Komplexe mit wechselnder Achse und\nAmplitude, die sich wellenartig um die Basislinie dreht\n(Spindel- oder Drehspitzenform); oft durch QT-Verlängerung\nausgelöst (z. B. Medikamente, Elektrolytstörungen)\nExtrem schnelles, unregelmäßiges EKG-Bild mit\nwechselnden breiten und schmalen Komplexen; Merkhilfe:\nFBI – Fast, Broad, Irregular; Cave: AV-Knotenblockierende Medikamente (Adenosin, Verapamil, Digoxin)\nsind kontraindiziert!\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\n⚠️ Erklärungen und wichtige Hinweise\nWarum ist die QRS-Breite diagnostisch entscheidend?\nDer QRS-Komplex spiegelt die ventrikuläre Depolarisation wider. Verläuft diese über\ndas normale His-Purkinje-System, ist sie schnell und koordiniert → schmal (< 0,12 s).\nEntsteht der Impuls im Myokard selbst oder wird er über einen blockierten Schenkel\nverlangsamt geleitet, dauert die Depolarisation länger → breit (≥ 0,12 s).\n\nWichtige Differenzialdiagnose: VT vs. SVT mit Aberranz\nDiese Unterscheidung ist klinisch bedeutsam, da beide Rhythmen unterschiedlich\nbehandelt werden. Faustregel: Im Zweifel immer wie eine VT behandeln – das ist\nsicherer.\nHinweise auf VT:\n\n\n\n\n\nAV-Dissoziation (P-Wellen unabhängig von QRS)\nFusionsschläge oder Capture-Beats\nKonkordanz aller Brustwandableitungen (alle positiv oder alle negativ)\nSehr breite Komplexe (> 0,14 s bei RBBB-Morphologie, > 0,16 s bei LBBBMorphologie)\n\nTorsade de pointes – Besonderheiten\n\n\n\n\nEntsteht fast immer auf dem Boden einer QT-Verlängerung (angeboren oder\nerworben)\nHäufige Auslöser: Antiarrhythmika (Klasse IA und III), Antibiotika (Makrolide,\nFluorchinolone), Antiemetika, Hypokaliämie, Hypomagnesiämie\nTherapie: Magnesiumsulfat i.v., Frequenzanhebung (Atropin oder temporärer\nSchrittmacher), QT-verlängernde Medikamente absetzen\n\nWPW-Syndrom und VHF – eine gefährliche Kombination\nBeim WPW-Syndrom besteht eine akzessorische Leitungsbahn (Kent-Bündel), die keine\ndekrementale Leitung besitzt. Bei VHF kann dies zur unkontrollierten Überleitung mit\nHerzfrequenzen > 300/min führen und in Kammerflimmern degenerieren.\nKontraindiziert sind alle Medikamente, die die AV-Überleitung blockieren (Adenosin,\nVerapamil, Diltiazem, Digoxin, Beta-Blocker), da sie die Leitung über die akzessorische\nBahn begünstigen. Therapie der Wahl: Elektrische Kardioversion oder Ajmalin i.v.\n\nMerkhilfen\n\n\n\n\nFBI (Fast, Broad, Irregular) → VHF bei Präexzitation (WPW)\n4 H’s (Hypoxie, Hypovolämie, Hypo-/Hyperkaliämie, Hypothermie) und HITS\n(Herztamponade, Intoxikation, Thrombembolie, Spannungspneumothorax) →\nreversible Ursachen bei PEA/Asystolie\nSchmalkomplex + unregelmäßig → meistens VHF\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nBreitkomplex + regelmäßig → VT bis zum Beweis des Gegenteils\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 45\n\n**Status:** Keine Fragen verfügbar."}, "Fall_46": {"case_info": "Fall 46\nAbdominaler Ultraschall – Kompartimente\nDatum der Nachricht: 05. Mai 2026 Prüfungsdatum: nicht angegeben\n\nFrage: Welche Kompartimente kennt man im Ultraschall\n(Abdomen)?\n1. Intraperitoneales Kompartiment\n\n\n\n\n\nLage: innerhalb der Peritonealhöhle\nEnthält:\no Leber\no Milz\no Magen (teilweise)\no Dünn- und Dickdarm\nKlinisch relevant: Freie Flüssigkeit (Aszites) sammelt sich hier an\n\n2. Retroperitoneales Kompartiment\n\n\n\n\n\nLage: dorsal (hinter) dem Peritoneum\nEnthält:\no Nieren und Nebennieren\no Pankreas\no Aorta abdominalis und V. cava inferior\no Ureteren\nKlinisch relevant bei:\no Retroperitonealen Blutungen (z. B. bei Trauma, rupturiertem\nAortenaneurysma)\no Pankreatitis\n\n3. Subphrenischer Raum\n\n\n\n\n\nLage: zwischen Zwerchfell und Leber bzw. Milz\nUnterteilung:\no Rechts subphrenisch (zwischen Zwerchfell und Leberoberfläche)\no Links subphrenisch (zwischen Zwerchfell und Milz/Magen)\nTypischer Ort für:\no Freie Flüssigkeit (z. B. bei FAST-Sonographie nach Trauma)\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\no Abszesse (z. B. postoperativ)\n\n4. Beckenkompartiment (Douglas-Raum)\n\n\n\n\n\nLage:\no Beim Mann: Excavatio rectovesicalis (zwischen Rektum und Harnblase)\no Bei der Frau: Excavatio rectouterina (Douglas-Raum, zwischen Rektum\nund Uterus)\nTiefster Punkt des Abdomens im Liegen → Flüssigkeit sammelt sich hier\nzuerst\nKlinisch relevant bei:\no Intraabdominellen Blutungen\no Peritonitis\no Extrauteringravidität (Frau)\n\nFAST-Ultraschall (Focused Assessment with Sonography in\nTrauma)\nBeim FAST-Ultraschall (Trauma) werden gezielt folgende Regionen auf freie Flüssigkeit\nuntersucht:\nRegion\nMorison-Pouch\nSplenorenalfenster\nDouglas-Raum\nPerikard\nPleura\n\nLokalisation\nZwischen Leber und rechter Niere (hepatorenaler Raum)\nZwischen Milz und linker Niere\nTiefste Region des kleinen Beckens\nBeim eFAST: Erguss um das Herz\nBeim eFAST: Pneumothorax/Hämothorax\n\nHinweis: Der erweiterte FAST (eFAST) schließt zusätzlich die Beurteilung von\nPleuraräumen und Perikard ein.\n\nMerkschema\n„Intra – Retro – Subphrenisch – Becken“\n\nKurzantwort (M3-tauglich)\n„Im abdominellen Ultraschall unterscheidet man das intraperitoneale und das\nretroperitoneale Kompartiment sowie die typischen Flüssigkeitsräume: den\nsubphrenischen Raum (beidseits) und den Douglas-Raum im kleinen Becken. Diese\nRäume sind insbesondere beim FAST-Ultraschall nach Trauma klinisch relevant, da\nsich freie Flüssigkeit (Blut, Aszites) bevorzugt dort ansammelt.“\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nErklärung und wichtige Hinweise\nPhysiologische Grundlagen\nFreie Flüssigkeit im Abdomen folgt der Schwerkraft und sammelt sich an den tiefsten\nPunkten. Im Liegen ist dies der Douglas-Raum, im Sitzen der Morison-Pouch (rechts)\nbzw. das splenorenalfenster (links).\n\nKlinische Bedeutung der einzelnen Kompartimente\n\n\n\n\n\nIntraperitoneale Blutung: Häufig nach stumpfem Bauchtrauma (Milz- oder\nLeberruptur); gut sonographisch nachweisbar\nRetroperitoneale Blutung: Sonographisch schwieriger zu erkennen (schlechte\nSchallbedingungen); CT bevorzugt\nSubphrenischer Abszess: Typische postoperative Komplikation; Fieber +\nSchulterschmerz (Zwerchfellreizung)\nDouglas-Flüssigkeit: Bei Frauen im gebärfähigen Alter immer an\nExtrauteringravidität (EUG) denken!\n\nFAST-Ultraschall – Prüfungsrelevantes\n\n\n\n\n\nSensitivität für freie Flüssigkeit: >250 ml können zuverlässig detektiert werden\nNegativer FAST schließt Verletzungen nicht aus (insbesondere\nretroperitoneale Blutungen!)\nStandardprotokoll: 4 Fenster (perikardial, perihepatisch, perilienal, pelvin)\neFAST (extended FAST): zusätzlich beidseits Pleura → PneumothoraxAusschluss\n\nHäufige Prüfungsfragen\n\n\n\n\nWo sammelt sich Flüssigkeit im Liegen zuerst? → Douglas-Raum (tiefster Punkt)\nWas ist der Morison-Pouch? → Hepatorenaler Raum zwischen Leber und rechter\nNiere; wichtigstes FAST-Fenster\nWelche Organe liegen retroperitoneal? → Merkhilfe „SAD PUCKER“: Suprarenal\nglands, Aorta/IVC, Duodenum (D2–D4), Pancreas, Ureters, Colon (Colon\nascendens/descendens), Kidneys, Esophagus (unterer Teil), Rectum\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 46\n\n**Status:** Keine Fragen verfügbar."}, "Fall_47": {"case_info": "Fall 47\nErfahrungsbericht: Kenntnisprüfung\nDatum der Nachricht: 05. Mai 2026 Datum der Prüfung: 05. Mai 2026, 12:30 Uhr\nErgebnis: Bestanden (1. Versuch) Prüfungskommission: Drei männliche Prüfer –\nzwei Internisten, ein Viszeralchirurg", "runde_1": [], "runde_2": [], "runde_3": [], "clinical_case": "**Hauptsymptom:** Fall 47\n\n**Status:** Keine Fragen verfügbar."}, "Fall_48": {"case_info": "Fall 48\nPrüfungsbericht – Approbationsprüfung\n(Kenntnisprüfung)\nPrüfungsdatum: 06. Mai 2026 Nachrichtendatum: 07. Mai 2026 Ergebnis: Bestanden\n– 3/3 Fälle bestanden Prüfungsthemen: Herzinsuffizienz · Ulcus\nventriculi · Divertikulitis\n\nZusammensetzung der Prüfungskommission\n\n\n\n\nChefarzt der Kardiologie\nVorsitzender der Kommission\nGastroenterologe / Onkologe\n\nAtmosphäre: Ruhig und angenehm. Die Fragen waren logisch aufgebaut und\nmedizinisch sinnvoll. Die Prüfer waren respektvoll und ohne erkennbare Absicht,\nKandidaten zu verunsichern.\n\nFall 1 – Herzinsuffizienz\nPatient\nHerr Heinrich K., 70 Jahre, 180 cm, 93 kg\n\nBeschwerden\n\n\n\n\n\n\nSeit ca. 6 Monaten progrediente, belastungsabhängige Dyspnoe\nMüdigkeit\nOrthopnoe (schläft auf zwei Kissen)\nNykturie\nBeidseitige Beinödeme\n\nAnamnese\n\n\n\n\n\n\n\nArterielle Hypertonie\nHerzrhythmusstörungen / Palpitationen\nMedikation: Apixaban (Eliquis®) 5 mg, Candesartan\nTonsillektomie im Kindesalter\nAllergie: Penicillin\nVollständiger Impfstatus\n\n\fNeue Fälle finden Sie auf dem Kanal:\n\nhttps://t.me/KP_Niedersachsen_Gekocht\n\nKörperliche Untersuchung (durchgeführt vom Kandidaten)\n\n\n\nVollständige körperliche Untersuchung\nBeurteilung des hepatojugulären Refluxes: Oberkörper zunächst flach gelagert,\ndann angehoben → Venenstauung festgestellt (positiver hepatojugulärer Reflux\n→ Hinweis auf erhöhten venösen Rückstau bei Rechtsherzinsuffizienz)\n\nPrüfungsfragen und Antworten\nHerzinsuffizienz – Allgemein\nFrage: Welche Formen der Herzinsuffizienz gibt es? Antwort:\n\n\n\n\n\nNach Lokalisation: Linksherzinsuffizienz, Rechtsherzinsuffizienz, globale\nHerzinsuffizienz\nNach Verlauf: akut vs. chronisch\nNach Ejektionsfraktion: HFrEF (EF < 40 %), HFmrEF (EF 40–49 %), HFpEF\n(EF ≥ 50 %)\nNach Auswurfrichtung: systolisch (Pumpschwäche) vs. diastolisch\n(Füllungsstörung)\n\nFrage: Wie unterscheiden sich Rechts- und Linksherzinsuffizienz klinisch?\nAntwort:\n\n\n\nLinksherzinsuffizienz: Rückstau in den Lungenkreislauf → Dyspnoe, Orthopnoe,\nLungenödem, Nykturie\nRechtsherzinsuffizienz: Rückstau in den Körperkreislauf → periphere Ödeme,\nHalsvenenstauung, Hepatomegalie, Aszites, positiver hepatojugulärer Reflux\n\nFrage: Ursachen von Ödemen – Pathogenese, Mechanismus und DD (Lymphödem,\nVarikosis)? Antwort:\nÖdemform\nKardiales\nÖdem\n\nMechanismus\n↑ hydrostatischer Druck durch\nvenösen Rückstau\n\nLymphödem\n\nAbflussbehinderung der\nLymphe\n\nVarikosis\n\nVenenklappeninsuffizienz →\nvenöse Hypertension\n\nAllgemeine Mechanismen der Ödembildung:\n\nMerkmale\nBeidseitig, abhängig\n(Knöchel/Unterschenkel),
